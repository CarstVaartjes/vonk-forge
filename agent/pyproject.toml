[project]
name = "vonk-forge-agent"
version = "0.1.0"
description = "Vonk Forge outbound agent runtime scaffold"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.0", "vonk-agent-protocol==2.1.0", "vonk-cluster-profiles==0.1.0", "tuf==7.0.0", "securesystemslib[crypto]==1.4.0"]

[project.scripts]
vonk-forge-agent = "vonk_agent.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_agent"]

[dependency-groups]
dev = ["pyinstaller==6.15.0", "pytest==8.4.2"]

[tool.uv.sources]
vonk-agent-protocol = { path = "../agent_protocol" }
vonk-cluster-profiles = { path = ".." }
