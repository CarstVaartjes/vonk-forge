[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vonk-cluster-profiles"
version = "0.1.1"
description = "Vonk Forge cluster workload-profile contracts"
requires-python = ">=3.14"
dependencies = [
  "argon2-cffi>=25.1.0",
  "attrs>=26.1.0",
  "httpx2>=2.13.1",
  "jsonschema>=4.23",
  "pillow>=12.3.0",
  "securesystemslib[crypto]>=1.5.1",
  "tuf>=7.0.1",
]

[project.scripts]
vonkctl = "cluster_profiles.cli:main"
vonk-fleet-qualify-campaign = "cluster_profiles.fleet_qualification_campaign_cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_profiles"]
# The hook includes these explicitly, including builds without .gitignore.
exclude = ["src/cluster_profiles/generated_control", "src/cluster_profiles/schemas/control-openapi.json"]

[tool.hatch.build.hooks.custom]
path = "tools/hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"schemas/install-release-manifest.schema.json" = "cluster_profiles/schemas/install-release-manifest.schema.json"
"install/installer-release-public.pem" = "cluster_profiles/installer-release-public.pem"
"src/cluster_profiles/schemas/qualification-manifest-v2.schema.json" = "cluster_profiles/schemas/qualification-manifest-v2.schema.json"
"src/cluster_profiles/schemas/qualification-authority-v5.schema.json" = "cluster_profiles/schemas/qualification-authority-v5.schema.json"
"src/cluster_profiles/schemas/qualification-campaign-manifest-v2.schema.json" = "cluster_profiles/schemas/qualification-campaign-manifest-v2.schema.json"
"src/cluster_profiles/schemas/cli-update-contract.schema.json" = "cluster_profiles/schemas/cli-update-contract.schema.json"
"src/cluster_profiles/schemas/cli-release-projection.schema.json" = "cluster_profiles/schemas/cli-release-projection.schema.json"

[tool.ruff]
required-version = "==0.16.9"
target-version = "py312"
extend-exclude = [
    "src/cluster_profiles/generated_control",
]

[tool.pyright]
# One checker for the whole repository. scripts/check-python-types runs it from
# the control environment, which carries the union of both projects'
# dependencies, so import resolution is complete.
pythonVersion = "3.14"
typeCheckingMode = "basic"
# Mirror the import roots the test suites add to sys.path, so static analysis
# resolves the same modules the runtime does.
extraPaths = ["src", "scripts", "agent_protocol/src", "control/src", "tests/scripts"]
include = ["control/src", "src", "tests", "control/tests"]
exclude = [
    "**/generated_control/**",
    "**/node_modules/**",
    "**/.venv/**",
    "**/__pycache__/**",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Hang guard only. Report-only per-test timing (10 s, or @pytest.mark.slow up
# to 60 s) lives in tools/pytest_budget.py; overruns never fail tests or the run.
timeout = 120
timeout_method = "thread"
# Markers: tools/pytest_prereqs.py (prerequisites) and tools/pytest_budget.py (slow).
