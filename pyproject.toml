[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "vonk-cluster-profiles"
version = "0.1.1"
description = "Vonk Forge cluster workload-profile contracts"
requires-python = ">=3.14"
dependencies = [
  "argon2-cffi==25.1.0",
  "attrs==26.1.0",
  "httpx==0.28.1",
  "jsonschema>=4.23",
  "pillow==12.3.0",
  "python-dateutil==2.9.0.post0",
  "securesystemslib[crypto]==1.4.0",
  "tuf==7.0.0",
]

[project.scripts]
vonkctl = "cluster_profiles.cli:main"
vonk-fleet-qualify-campaign = "cluster_profiles.fleet_qualification_campaign_cli:main"

[dependency-groups]
dev = ["hatchling==1.31.0", "pytest==9.1.1", "pyyaml==6.0.3", "ruff==0.16.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_profiles"]

[tool.hatch.build.hooks.custom]
path = "tools/hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"schemas/install-release-manifest.schema.json" = "cluster_profiles/schemas/install-release-manifest.schema.json"
"src/cluster_profiles/schemas/model-definition-evidence.schema.json" = "cluster_profiles/schemas/model-definition-evidence.schema.json"
"src/cluster_profiles/schemas/cluster-profile-v2.schema.json" = "cluster_profiles/schemas/cluster-profile-v2.schema.json"
"src/cluster_profiles/schemas/workload-v2.schema.json" = "cluster_profiles/schemas/workload-v2.schema.json"
"src/cluster_profiles/schemas/qualification-manifest-v2.schema.json" = "cluster_profiles/schemas/qualification-manifest-v2.schema.json"
"src/cluster_profiles/schemas/qualification-authority-v4.schema.json" = "cluster_profiles/schemas/qualification-authority-v4.schema.json"
"src/cluster_profiles/schemas/qualification-campaign-manifest-v2.schema.json" = "cluster_profiles/schemas/qualification-campaign-manifest-v2.schema.json"
"src/cluster_profiles/schemas/recovery-coverage-receipt-v1.schema.json" = "cluster_profiles/schemas/recovery-coverage-receipt-v1.schema.json"
"src/cluster_profiles/schemas/recovery-coverage-use-v1.schema.json" = "cluster_profiles/schemas/recovery-coverage-use-v1.schema.json"
"src/cluster_profiles/schemas/recovery-coverage-consumption-v1.schema.json" = "cluster_profiles/schemas/recovery-coverage-consumption-v1.schema.json"
"src/cluster_profiles/schemas/control-openapi.json" = "cluster_profiles/schemas/control-openapi.json"

[tool.ruff]
required-version = "==0.16.1"
target-version = "py312"
extend-exclude = [
    "src/cluster_profiles/generated_control",
]

[tool.pyright]
# One checker for the whole repository. The control virtualenv carries the
# union of both projects' dependencies, so import resolution is complete.
pythonVersion = "3.14"
venvPath = "control"
venv = ".venv"
typeCheckingMode = "basic"
# Mirror the import roots the test suites add to sys.path, so static analysis
# resolves the same modules the runtime does.
extraPaths = ["src", "scripts", "agent_protocol/src", "control/src", "tests/scripts"]
include = ["control/src", "src", "tests", "control/tests"]
exclude = [
    "**/generated_control/**",
    "**/node_modules/**",
    "**/.venv/**",
    "**/__pycache__/**",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "lane: requires Docker, PostgreSQL, cargo or a Linux host tool; excluded from the fast tier",
    "linux_only: requires Linux host semantics or Linux system tools",
    "needs_systemd: requires systemd tooling for installed unit verification",
    "needs_recipe_library: requires VONK_RECIPE_LIBRARY_ROOT to name a recipe checkout",
    "needs_rust_probe: requires REPAIR_PROBE_BINARY to name the built repair probe",
    "needs_installer_release_probe: requires the installer-release Rust contract probe",
    "needs_dpkg_deb: requires the Debian package tools used by package tests",
    "needs_dpkg: requires the Debian version comparison tool",
    "needs_docker: requires a working Docker daemon for container tests",
    "needs_cargo: requires the Rust toolchain to build an integration probe",
    "needs_aptly: requires aptly for package repository integration tests",
    "needs_backup_container: requires the opt-in PostgreSQL backup container lane",
    "postgres: requires the explicit PostgreSQL test service configured by the test",
]
