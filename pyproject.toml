[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "vonk-cluster-profiles"
version = "0.1.0"
description = "Vonk Forge cluster workload-profile contracts"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi==25.1.0",
  "attrs==26.1.0",
  "httpx==0.28.1",
  "jsonschema>=4.23",
  "python-dateutil==2.9.0.post0",
  "securesystemslib[crypto]==1.4.0",
  "tuf==7.0.0",
]

[project.scripts]
vonkctl = "cluster_profiles.cli:main"

[dependency-groups]
dev = ["hatchling==1.31.0", "pytest==9.1.1", "pyyaml==6.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_profiles"]

[tool.hatch.build.targets.wheel.force-include]
"src/cluster_profiles/schemas/workload.schema.json" = "cluster_profiles/schemas/workload.schema.json"
"src/cluster_profiles/schemas/cluster-profile.schema.json" = "cluster_profiles/schemas/cluster-profile.schema.json"
"src/cluster_profiles/schemas/model-definition-evidence.schema.json" = "cluster_profiles/schemas/model-definition-evidence.schema.json"
"src/cluster_profiles/schemas/cluster-profile-v2.schema.json" = "cluster_profiles/schemas/cluster-profile-v2.schema.json"
"src/cluster_profiles/schemas/workload-v2.schema.json" = "cluster_profiles/schemas/workload-v2.schema.json"

[tool.ruff]
required-version = "==0.16.1"
target-version = "py312"
extend-exclude = [
    "src/cluster_profiles/generated_control",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
