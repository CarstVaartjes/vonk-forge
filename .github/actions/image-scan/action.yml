name: Scan a built image for fixable vulnerabilities
description: >-
  Gate an image on fixable HIGH/CRITICAL findings this repository controls: OS
  packages and language libraries, excluding upstream release binaries copied
  in unchanged (the owner's policy: use upstream releases, never rebuild them
  to silence a scan). The findings table is in the job log. The vulnerability
  database is cached between runs.
inputs:
  image:
    description: Image reference to scan
    required: true
  skip-dirs:
    description: Comma-separated directories holding upstream release binaries, excluded from the gate only
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Gate ${{ inputs.image }} on fixable findings we control
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image }}
        vuln-type: os,library
        skip-dirs: ${{ inputs.skip-dirs }}
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        format: table
        cache: true
