name: ARM64-native agent package build and acceptance
description: Build, sign, attest, and upload AMD64 and ARM64 packages with native ARM64 lifecycle acceptance

inputs:
  channel:
    description: Package channel, dev or stable
    required: true
  publication_sequence:
    description: Monotonic development publication sequence or zero for stable
    required: true
  version:
    description: Exact Debian package version
    required: true
  next_version:
    description: Next version used by lifecycle upgrade checks
    required: true
  baseline_version:
    description: Lower immutable acceptance-only package version
    required: true
  arm64_package:
    description: Exact ARM64 Debian package filename
    required: true
  amd64_package:
    description: Exact AMD64 Debian package filename
    required: true
  arm64_baseline_package:
    description: Exact acceptance-only ARM64 Debian package filename
    required: true
  amd64_baseline_package:
    description: Exact acceptance-only AMD64 Debian package filename
    required: true
  artifact_name:
    description: Immutable GitHub Actions artifact name
    required: true
  baseline_artifact_name:
    description: Immutable acceptance-only baseline artifact name
    required: true
  environment:
    description: Literal protected environment selected by the caller job
    required: true
  source_sha:
    description: Exact accepted source commit
    required: true
  tag_name:
    description: Production tag name or empty for development
    required: true
  tag_oid:
    description: Verified production tag object or empty for development
    required: true
  expected_fingerprint:
    description: SHA-256 fingerprint of the trusted Ed25519 public key
    required: true
  release_private_key:
    description: Environment-scoped Ed25519 package signing private key
    required: true

outputs:
  version:
    description: Accepted Debian package version
    value: ${{ steps.accepted.outputs.version }}
  arm64_package:
    description: Accepted ARM64 Debian package filename
    value: ${{ steps.accepted.outputs.arm64_package }}
  amd64_package:
    description: Accepted AMD64 Debian package filename
    value: ${{ steps.accepted.outputs.amd64_package }}
  artifact_name:
    description: Immutable Actions artifact name
    value: ${{ steps.accepted.outputs.artifact_name }}
  baseline_version:
    description: Lower acceptance-only Debian package version
    value: ${{ steps.accepted.outputs.baseline_version }}
  arm64_baseline_package:
    description: Acceptance-only ARM64 package filename
    value: ${{ steps.accepted.outputs.arm64_baseline_package }}
  amd64_baseline_package:
    description: Acceptance-only AMD64 package filename
    value: ${{ steps.accepted.outputs.amd64_baseline_package }}
  baseline_artifact_name:
    description: Acceptance-only baseline artifact name
    value: ${{ steps.accepted.outputs.baseline_artifact_name }}
  amd64_lifecycle_package:
    description: Short-lived next-version AMD64 package filename for native lifecycle acceptance
    value: ${{ steps.accepted.outputs.amd64_lifecycle_package }}
  amd64_lifecycle_artifact_name:
    description: Short-lived AMD64 lifecycle Actions artifact name
    value: ${{ steps.accepted.outputs.amd64_lifecycle_artifact_name }}

runs:
  using: composite
  steps:

    - name: Install uv and Python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.1"
        python-version: "3.12"
        enable-cache: true

    - name: Validate package metadata and environment
      id: accepted
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        CHANNEL: ${{ inputs.channel }}
        ARM64_PACKAGE: ${{ inputs.arm64_package }}
        AMD64_PACKAGE: ${{ inputs.amd64_package }}
        ARM64_BASELINE_PACKAGE: ${{ inputs.arm64_baseline_package }}
        AMD64_BASELINE_PACKAGE: ${{ inputs.amd64_baseline_package }}
        BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}
        BASELINE_VERSION: ${{ inputs.baseline_version }}
        PACKAGE_ENVIRONMENT: ${{ inputs.environment }}
        PUBLICATION_SEQUENCE: ${{ inputs.publication_sequence }}
        NEXT_VERSION: ${{ inputs.next_version }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${CHANNEL}:${PACKAGE_ENVIRONMENT}" in
          dev:agent-development)
            test "$PUBLICATION_SEQUENCE" = "$GITHUB_RUN_NUMBER"
            release=development
            ;;
          stable:agent-release)
            test "$PUBLICATION_SEQUENCE" = 0
            release=production
            ;;
          *)
            echo "agent package channel and environment do not match" >&2
            exit 64
            ;;
        esac
        expected=$(
          scripts/agent-package-metadata \
            "$release" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" "$PUBLICATION_SEQUENCE"
        )
        actual=$(printf '%s\n' \
          "version=$VERSION" \
          "next_version=$NEXT_VERSION" \
          "baseline_version=$BASELINE_VERSION" \
          "arm64_package=$ARM64_PACKAGE" \
          "amd64_package=$AMD64_PACKAGE" \
          "arm64_baseline_package=$ARM64_BASELINE_PACKAGE" \
          "amd64_baseline_package=$AMD64_BASELINE_PACKAGE" \
          "artifact_name=$ARTIFACT_NAME" \
          "baseline_artifact_name=$BASELINE_ARTIFACT_NAME" \
          "channel=$CHANNEL" \
          "snapshot=$CHANNEL-$VERSION")
        test "$actual" = "$expected"
        amd64_lifecycle_package="vonk-forge-agent_${NEXT_VERSION}_amd64.deb"
        amd64_lifecycle_artifact_name="${ARTIFACT_NAME}-amd64-lifecycle"
        printf '%s\n' \
          "version=$VERSION" \
          "arm64_package=$ARM64_PACKAGE" \
          "amd64_package=$AMD64_PACKAGE" \
          "artifact_name=$ARTIFACT_NAME" \
          "baseline_version=$BASELINE_VERSION" \
          "arm64_baseline_package=$ARM64_BASELINE_PACKAGE" \
          "amd64_baseline_package=$AMD64_BASELINE_PACKAGE" \
          "baseline_artifact_name=$BASELINE_ARTIFACT_NAME" \
          "amd64_lifecycle_package=$amd64_lifecycle_package" \
          "amd64_lifecycle_artifact_name=$amd64_lifecycle_artifact_name" \
          >> "$GITHUB_OUTPUT"

    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -m)" = aarch64
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          binutils-x86-64-linux-gnu gcc-x86-64-linux-gnu \
          libc6-dev-amd64-cross
        rustup set profile minimal
        rustup toolchain install 1.97.1 --component clippy,rustfmt
        rustup default 1.97.1
        rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu

    - name: Revalidate protected package source authority
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        TAG_NAME: ${{ inputs.tag_name }}
        TAG_OID: ${{ inputs.tag_oid }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        case "$CHANNEL" in
          dev)
            test -z "$TAG_NAME" && test -z "$TAG_OID"
            test "$GITHUB_REF" = refs/heads/main
            git fetch --force --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            test "$SOURCE_SHA" = \
              "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
            ;;
          stable)
            scripts/verify-release-tag-authority \
              "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"
            ;;
          *)
            exit 64
            ;;
        esac

    - name: Materialize and verify protected agent key
      shell: bash
      env:
        EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        RELEASE_PRIVATE_KEY: ${{ inputs.release_private_key }}
      run: |
        set -euo pipefail
        test -n "$RELEASE_PRIVATE_KEY"
        [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
        key_path="$RUNNER_TEMP/vonk-agent-release.pem"
        install -m 0600 /dev/null "$key_path"
        printf '%s' "$RELEASE_PRIVATE_KEY" > "$key_path"
        public_der="$RUNNER_TEMP/vonk-agent-release-public.der"
        trap 'rm -f "$public_der"' EXIT
        install -m 0600 /dev/null "$public_der"
        openssl pkey -in "$key_path" -pubout -outform DER \
          > "$public_der" 2>/dev/null
        test "$(stat -c %s "$public_der")" = 44
        prefix=$(head -c 12 "$public_der" | od -An -v -tx1 | tr -d ' \n')
        test "$prefix" = 302a300506032b6570032100
        fingerprint=$(
          tail -c 32 "$public_der" \
            | sha256sum \
            | cut -d' ' -f1
        )
        test "$fingerprint" = "$EXPECTED_FINGERPRINT"
        rm -f "$public_der"
        trap - EXIT

    - name: Build package twice reproducibly
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VONK_SOURCE_REVISION: ${{ github.sha }}
        VONK_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      run: |
        set -euo pipefail
        epoch=$(git show -s --format=%ct "$GITHUB_SHA")
        lock_digest=$(sha256sum Cargo.lock | cut -d' ' -f1)
        arm64_build_digest="sha256:$(
          printf 'vonk-agent-build-v2\0%s\0%s\0%s' \
            "$GITHUB_SHA" linux-arm64 "$lock_digest" | sha256sum | cut -d' ' -f1
        )"
        amd64_build_digest="sha256:$(
          printf 'vonk-agent-build-v2\0%s\0%s\0%s' \
            "$GITHUB_SHA" linux-amd64 "$lock_digest" | sha256sum | cut -d' ' -f1
        )"
        scripts/build-agent-deb \
          --version "$VERSION" \
          --architecture linux-arm64 \
          --build-digest "$arm64_build_digest" \
          --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
          --source-date-epoch "$epoch" \
          --output-dir dist
        scripts/build-agent-deb \
          --version "$VERSION" \
          --architecture linux-arm64 \
          --build-digest "$arm64_build_digest" \
          --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
          --binaries-dir target/aarch64-unknown-linux-gnu/release \
          --source-date-epoch "$epoch" \
          --output-dir reproducible
        scripts/build-agent-deb \
          --version "$VERSION" \
          --architecture linux-amd64 \
          --build-digest "$amd64_build_digest" \
          --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
          --source-date-epoch "$epoch" \
          --output-dir dist
        scripts/build-agent-deb \
          --version "$VERSION" \
          --architecture linux-amd64 \
          --build-digest "$amd64_build_digest" \
          --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
          --binaries-dir target/x86_64-unknown-linux-gnu/release \
          --source-date-epoch "$epoch" \
          --output-dir reproducible
        cmp --silent \
          "dist/vonk-forge-agent_${VERSION}_arm64.deb" \
          "reproducible/vonk-forge-agent_${VERSION}_arm64.deb"
        cmp --silent \
          "dist/vonk-forge-agent_${VERSION}_amd64.deb" \
          "reproducible/vonk-forge-agent_${VERSION}_amd64.deb"
        for architecture in arm64 amd64; do
          scripts/verify-agent-deb --json \
            "dist/vonk-forge-agent_${VERSION}_${architecture}.deb"
        done

    - name: Run Rust and packaging security gates
      shell: bash
      run: |
        set -euo pipefail
        cargo fmt --all --check
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked
        uvx --from pytest==9.1.1 pytest -q \
          tests/scripts/test_agent_deb.py \
          tests/acceptance/test_rust_agent_parity.py
        scripts/verify-agent-systemd --json \
          | tee dist/vonk-forge-systemd-security.json

    - name: Test fresh, offline, upgrade, downgrade, remove lifecycle
      shell: bash
      env:
        BASELINE_VERSION: ${{ inputs.baseline_version }}
        NEXT_VERSION: ${{ inputs.next_version }}
        VERSION: ${{ inputs.version }}
        VONK_SOURCE_REVISION: ${{ github.sha }}
        VONK_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
      run: |
        set -euo pipefail
        trap 'echo "lifecycle check failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          fuse-overlayfs iproute2 iptables podman shellcheck slirp4netns uidmap
        shellcheck \
          packaging/bin/vonk-forge-docker-firewall \
          scripts/test-agent-package-native-lifecycle \
          tests/scripts/test_docker_firewall.sh \
          tests/nodes/test_agent_package_native_lifecycle.sh
        sudo tests/scripts/test_docker_firewall.sh
        tests/nodes/test_agent_package_native_lifecycle.sh

        epoch=$(git show -s --format=%ct "$GITHUB_SHA")
        lock_digest=$(sha256sum Cargo.lock | cut -d' ' -f1)
        arm64_build_digest="sha256:$(
          printf 'vonk-agent-build-v2\0%s\0%s\0%s' \
            "$GITHUB_SHA" linux-arm64 "$lock_digest" | sha256sum | cut -d' ' -f1
        )"
        amd64_build_digest="sha256:$(
          printf 'vonk-agent-build-v2\0%s\0%s\0%s' \
            "$GITHUB_SHA" linux-amd64 "$lock_digest" | sha256sum | cut -d' ' -f1
        )"
        scripts/build-agent-deb \
          --version "$NEXT_VERSION" \
          --architecture linux-arm64 \
          --build-digest "$arm64_build_digest" \
          --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
          --binaries-dir target/aarch64-unknown-linux-gnu/release \
          --source-date-epoch "$epoch" \
          --output-dir lifecycle
        scripts/build-agent-deb \
          --version "$NEXT_VERSION" \
          --architecture linux-amd64 \
          --build-digest "$amd64_build_digest" \
          --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
          --binaries-dir target/x86_64-unknown-linux-gnu/release \
          --source-date-epoch "$epoch" \
          --output-dir lifecycle
        scripts/verify-agent-deb --json \
          "lifecycle/vonk-forge-agent_${NEXT_VERSION}_arm64.deb"
        scripts/verify-agent-deb --json \
          "lifecycle/vonk-forge-agent_${NEXT_VERSION}_amd64.deb"
        for architecture in arm64 amd64; do
          platform="linux-$architecture"
          baseline_build_digest="sha256:$(
            printf 'vonk-agent-acceptance-baseline-v1\0%s\0%s\0%s\0%s' \
              "$GITHUB_SHA" "$platform" "$lock_digest" "$BASELINE_VERSION" \
              | sha256sum | cut -d' ' -f1
          )"
          scripts/build-agent-deb \
            --acceptance-baseline \
            --version "$BASELINE_VERSION" \
            --architecture "$platform" \
            --build-digest "$baseline_build_digest" \
            --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
            --source-date-epoch "$epoch" \
            --output-dir baseline
          scripts/verify-agent-deb --json \
            "baseline/vonk-forge-agent_${BASELINE_VERSION}_${architecture}.deb"
        done
        rm -f "$RUNNER_TEMP/vonk-agent-release.pem"
        test ! -e "$RUNNER_TEMP/vonk-agent-release.pem"
        sudo scripts/test-agent-package-native-lifecycle \
          linux-arm64 \
          "$(realpath "baseline/vonk-forge-agent_${BASELINE_VERSION}_arm64.deb")" \
          "$(realpath "dist/vonk-forge-agent_${VERSION}_arm64.deb")" \
          "$BASELINE_VERSION" "$VERSION"

    - name: Remove protected agent key
      if: ${{ always() }}
      shell: bash
      run: rm -f "$RUNNER_TEMP/vonk-agent-release.pem"

    - name: Upload short-lived AMD64 lifecycle package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.accepted.outputs.amd64_lifecycle_artifact_name }}
        if-no-files-found: error
        overwrite: false
        retention-days: 1
        path: |
          lifecycle/vonk-forge-agent_${{ inputs.next_version }}_amd64.deb
          lifecycle/vonk-forge-agent_${{ inputs.next_version }}_amd64.deb.sha256

    - name: Upload immutable acceptance baseline packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.baseline_artifact_name }}
        if-no-files-found: error
        overwrite: false
        retention-days: 7
        path: |
          baseline/vonk-forge-agent_${{ inputs.baseline_version }}_arm64.deb
          baseline/vonk-forge-agent_${{ inputs.baseline_version }}_arm64.deb.sha256
          baseline/vonk-forge-agent_${{ inputs.baseline_version }}_amd64.deb
          baseline/vonk-forge-agent_${{ inputs.baseline_version }}_amd64.deb.sha256

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Revalidate source before Sigstore publication
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        TAG_NAME: ${{ inputs.tag_name }}
        TAG_OID: ${{ inputs.tag_oid }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        case "$CHANNEL" in
          dev)
            test -z "$TAG_NAME" && test -z "$TAG_OID"
            test "$GITHUB_REF" = refs/heads/main
            git fetch --force --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            test "$SOURCE_SHA" = \
              "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
            ;;
          stable)
            scripts/verify-release-tag-authority \
              "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"
            ;;
          *)
            exit 64
            ;;
        esac

    - name: Create and verify keyless package signature
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$CHANNEL" in
          dev)
            identity="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/agent-release\.yml@refs/heads/main$"
            ;;
          stable)
            identity="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/tags/v${VERSION//./\\.}$"
            ;;
        esac
        for architecture in arm64 amd64; do
          package="vonk-forge-agent_${VERSION}_${architecture}.deb"
          cosign sign-blob --yes --bundle \
            "dist/${package}.sigstore.json" "dist/$package"
          cosign verify-blob \
            --bundle "dist/${package}.sigstore.json" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "dist/$package"
        done

    - name: Revalidate source before provenance attestation
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        TAG_NAME: ${{ inputs.tag_name }}
        TAG_OID: ${{ inputs.tag_oid }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        case "$CHANNEL" in
          dev)
            test -z "$TAG_NAME" && test -z "$TAG_OID"
            test "$GITHUB_REF" = refs/heads/main
            git fetch --force --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            test "$SOURCE_SHA" = \
              "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
            ;;
          stable)
            scripts/verify-release-tag-authority \
              "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"
            ;;
          *)
            exit 64
            ;;
        esac

    - name: Attest package provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: dist/vonk-forge-agent_${{ inputs.version }}_arm64.deb

    - name: Attest amd64 package provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: dist/vonk-forge-agent_${{ inputs.version }}_amd64.deb

    - name: Revalidate source before SBOM attestation
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        TAG_NAME: ${{ inputs.tag_name }}
        TAG_OID: ${{ inputs.tag_oid }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        case "$CHANNEL" in
          dev)
            test -z "$TAG_NAME" && test -z "$TAG_OID"
            test "$GITHUB_REF" = refs/heads/main
            git fetch --force --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            test "$SOURCE_SHA" = \
              "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
            ;;
          stable)
            scripts/verify-release-tag-authority \
              "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"
            ;;
          *)
            exit 64
            ;;
        esac

    - name: Attest package SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: dist/vonk-forge-agent_${{ inputs.version }}_arm64.deb
        sbom-path: dist/vonk-forge-agent_${{ inputs.version }}_arm64.sbom.spdx.json

    - name: Attest amd64 package SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: dist/vonk-forge-agent_${{ inputs.version }}_amd64.deb
        sbom-path: dist/vonk-forge-agent_${{ inputs.version }}_amd64.sbom.spdx.json

    - name: Revalidate source before artifact publication
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        TAG_NAME: ${{ inputs.tag_name }}
        TAG_OID: ${{ inputs.tag_oid }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$SOURCE_SHA" = "$GITHUB_SHA"
        case "$CHANNEL" in
          dev)
            test -z "$TAG_NAME" && test -z "$TAG_OID"
            test "$GITHUB_REF" = refs/heads/main
            git fetch --force --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            test "$SOURCE_SHA" = \
              "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
            ;;
          stable)
            scripts/verify-release-tag-authority \
              "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"
            ;;
          *)
            exit 64
            ;;
        esac

    - name: Upload exact package release set
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact_name }}
        if-no-files-found: error
        overwrite: false
        retention-days: 30
        path: dist/*
