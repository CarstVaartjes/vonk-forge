name: Seal accepted pull request agent packages
description: >-
  Unseal the agent packages the pull request that tested this exact Git tree
  built and accepted, seal them with the release key, and sign, attest and
  upload them exactly like a built package set.

inputs:
  reuse_run_id:
    description: Successful pull request CI run that tested this exact source tree
    required: true
  artifact_name:
    description: Immutable package artifact name for this source
    required: true
  baseline_artifact_name:
    description: Immutable acceptance-only baseline artifact name
    required: true
  expected_fingerprint:
    description: SHA-256 of the release Ed25519 public key
    required: true
  release_private_key:
    description: Release Ed25519 private key
    required: true
  artifact_token:
    description: Token that reads the pull request run's artifacts
    required: true

outputs:
  version:
    description: Exact accepted development package version
    value: ${{ steps.packages.outputs.version }}
  arm64_package:
    description: Exact accepted ARM64 Debian package filename
    value: ${{ steps.packages.outputs.arm64_package }}
  baseline_version:
    description: Lower immutable acceptance-only package version
    value: ${{ steps.packages.outputs.baseline_version }}
  arm64_baseline_package:
    description: Exact acceptance-only ARM64 Debian package filename
    value: ${{ steps.packages.outputs.arm64_baseline_package }}

runs:
  using: composite
  steps:
    - name: Download the pull request's accepted agent packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: acceptance-agent-package
        path: pr/package
        run-id: ${{ inputs.reuse_run_id }}
        github-token: ${{ inputs.artifact_token }}
    - name: Download the pull request's acceptance baseline packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: acceptance-agent-baseline
        path: pr/baseline
        run-id: ${{ inputs.reuse_run_id }}
        github-token: ${{ inputs.artifact_token }}
    - name: Unseal the accepted packages
      id: packages
      shell: bash
      run: |
        set -euo pipefail
        scripts/reuse-agent-packages pr unsealed >> "$GITHUB_OUTPUT"
    - name: Materialize and verify protected agent key
      shell: bash
      env:
        EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        RELEASE_PRIVATE_KEY: ${{ inputs.release_private_key }}
      run: |
        set -euo pipefail
        test -n "$RELEASE_PRIVATE_KEY"
        [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
        key_path="$RUNNER_TEMP/vonk-agent-release.pem"
        install -m 0600 /dev/null "$key_path"
        printf '%s' "$RELEASE_PRIVATE_KEY" > "$key_path"
        public_der="$RUNNER_TEMP/vonk-agent-release-public.der"
        trap 'rm -f "$public_der"' EXIT
        openssl pkey -in "$key_path" -pubout -outform DER > "$public_der" 2>/dev/null
        test "$(stat -c %s "$public_der")" = 44
        test "$(head -c 12 "$public_der" | od -An -v -tx1 | tr -d ' \n')" = \
          302a300506032b6570032100
        test "$(tail -c 32 "$public_der" | sha256sum | cut -d' ' -f1)" = \
          "$EXPECTED_FINGERPRINT"
    - name: Seal the packages with the release key
      shell: bash
      env:
        ARM64_PACKAGE: ${{ steps.packages.outputs.arm64_package }}
        ARM64_BASELINE_PACKAGE: ${{ steps.packages.outputs.arm64_baseline_package }}
      run: |
        set -euo pipefail
        key="$RUNNER_TEMP/vonk-agent-release.pem"
        trap 'rm -f -- "$key"' EXIT
        for set in dist:"$ARM64_PACKAGE" baseline:"$ARM64_BASELINE_PACKAGE"; do
          output=${set%%:*}
          package=${set#*:}
          scripts/seal-agent-deb \
            --unsealed "unsealed/${package%.deb}.unsealed.deb" \
            --release-private-key "$key" --output-dir "$output"
          # The evidence documents bind the binaries, not the key.
          source=pr/package
          if [[ "$output" == baseline ]]; then source=pr/baseline; fi
          find "$source" -maxdepth 1 -type f -name '*.json' \
            ! -name '*.sigstore.json' -exec cp -t "$output" {} +
          scripts/verify-agent-deb --json "$output/$package"
        done
    - name: Remove protected agent key
      if: always()
      shell: bash
      run: rm -f -- "$RUNNER_TEMP/vonk-agent-release.pem"
    - name: Record package systemd security evidence
      shell: bash
      run: |
        set -euo pipefail
        scripts/verify-agent-systemd --json \
          | tee dist/vonk-forge-systemd-security.json
    - name: Upload immutable acceptance baseline packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.baseline_artifact_name }}
        if-no-files-found: error
        overwrite: false
        retention-days: 90
        path: |
          baseline/${{ steps.packages.outputs.arm64_baseline_package }}
          baseline/${{ steps.packages.outputs.arm64_baseline_package }}.sha256
          baseline/${{ steps.packages.outputs.arm64_baseline_package }}.host.sig
          baseline/vonk-forge-agent_${{ steps.packages.outputs.baseline_version }}_arm64.provenance.json
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Create and verify keyless package signature
      shell: bash
      env:
        ARM64_PACKAGE: ${{ steps.packages.outputs.arm64_package }}
      run: |
        set -euo pipefail
        identity="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/agent-release\.yml@refs/heads/main$"
        cosign sign-blob --yes --bundle "dist/${ARM64_PACKAGE}.sigstore.json" \
          "dist/$ARM64_PACKAGE"
        cosign verify-blob --bundle "dist/${ARM64_PACKAGE}.sigstore.json" \
          --certificate-identity-regexp "$identity" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "dist/$ARM64_PACKAGE"
    - name: Attest package provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: dist/${{ steps.packages.outputs.arm64_package }}
    - name: Attest package SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: dist/${{ steps.packages.outputs.arm64_package }}
        sbom-path: dist/vonk-forge-agent_${{ steps.packages.outputs.version }}_arm64.sbom.spdx.json
    - name: Revalidate source before artifact publication
      shell: bash
      run: |
        set -euo pipefail
        git fetch --force --no-tags origin \
          +refs/heads/main:refs/remotes/origin/main
        git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
    - name: Upload exact package release set
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact_name }}
        if-no-files-found: error
        overwrite: false
        retention-days: 90
        path: dist/*
    - name: Record the package set versions
      shell: bash
      env:
        VERSION: ${{ steps.packages.outputs.version }}
        BASELINE_VERSION: ${{ steps.packages.outputs.baseline_version }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/versions"
        scripts/agent-package-versions write "$VERSION" "$BASELINE_VERSION" \
          "$RUNNER_TEMP/versions/versions.txt"
    - name: Upload the package set versions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact_name }}-versions
        if-no-files-found: error
        overwrite: false
        retention-days: 90
        path: ${{ runner.temp }}/versions/versions.txt
