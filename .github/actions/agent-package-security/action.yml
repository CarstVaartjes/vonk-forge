name: Agent package security gates
description: Run the Rust workspace and package contract gates required before publication

runs:
  using: composite
  steps:
    - name: Prepare Pydantic contracts for Cargo builds
      uses: ./.github/actions/python-env
      with:
        contracts: none
        cli-dependencies: "false"
    - name: Run Rust and packaging security gates
      shell: bash
      run: |
        set -euo pipefail
        cargo fmt --all --check
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked
        cargo build --locked -p vonk-agent --bin vonk-agent
        # These packaging tests consume the binary, not generated clients.
        VONK_AGENT_BINARY="${CARGO_TARGET_DIR:-target}/debug/vonk-agent" \
          VONK_CI_PREREQUISITES=needs_agent_binary \
          uv run --frozen --only-group dev pytest -q --confcutdir=tests/scripts \
          tests/scripts/test_agent_deb.py
