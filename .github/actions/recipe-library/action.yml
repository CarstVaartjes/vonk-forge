name: Canonical recipe library
description: >-
  Provide the recipe library at the reviewed revision in .recipe-library. With
  `build: "true"` its catalog index and packages are built too (needs uv, so
  run python-env first). The built tree is cached under the build's identity,
  the reviewed revision plus scripts/build-recipe-library and .tool-versions (the
  uv release that runs it), so a job that finds
  it skips the build and waits on no other job. Main saves the caches.
inputs:
  build:
    description: Also build the catalog index and packages (cached by revision and build script)
    default: "false"
outputs:
  revision:
    description: The reviewed recipe library commit
    value: ${{ steps.source.outputs.revision }}
runs:
  using: composite
  steps:
    - name: Resolve the reviewed recipe library revision
      id: source
      shell: bash
      run: |
        set -euo pipefail
        revision=$(cat tests/acceptance/recipe-library-revision.txt)
        [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
        test "$(awk 'END { print NR }' tests/acceptance/recipe-library-revision.txt)" = 1
        printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
    - name: Restore the built recipe library for this revision and build script
      id: built
      if: inputs.build == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .recipe-library
        key: recipe-library-built-v1-${{ steps.source.outputs.revision }}-${{ hashFiles('scripts/build-recipe-library', '.tool-versions') }}
    - name: Restore the recipe library for this revision
      id: cache
      if: steps.built.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .recipe-library
        key: recipe-library-v1-${{ steps.source.outputs.revision }}
    - name: Check out the reviewed recipe library
      if: steps.built.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: CarstVaartjes/vonk-forge-recipes
        ref: ${{ steps.source.outputs.revision }}
        path: .recipe-library
        persist-credentials: false
    - name: Save the recipe library for later runs
      if: steps.built.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .recipe-library
        key: recipe-library-v1-${{ steps.source.outputs.revision }}
    - name: Record the recipe library source
      if: steps.built.outputs.cache-hit != 'true'
      shell: bash
      env:
        EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
      run: |
        set -euo pipefail
        resolved=$(git -C .recipe-library rev-parse --verify 'HEAD^{commit}')
        test "$resolved" = "$EXPECTED_REVISION"
        test -z "$(git -C .recipe-library status --porcelain)"
        printf 'Canonical recipe library source: CarstVaartjes/vonk-forge-recipes@%s\n' "$resolved"
    - name: Build the recipe library index and packages
      if: inputs.build == 'true' && steps.built.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/build-recipe-library .recipe-library
    - name: Save the built recipe library for later runs
      if: inputs.build == 'true' && steps.built.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .recipe-library
        key: recipe-library-built-v1-${{ steps.source.outputs.revision }}-${{ hashFiles('scripts/build-recipe-library', '.tool-versions') }}
