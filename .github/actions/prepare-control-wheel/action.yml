name: Prepare Controller protocol wheel
description: Build the local agent protocol wheel the Controller image and release carry
inputs:
  repository-root:
    description: Repository checkout that owns the protocol project
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Build the protocol wheel
      shell: bash
      working-directory: ${{ inputs.repository-root }}
      run: scripts/build-control-wheel
