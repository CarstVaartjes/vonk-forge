name: Locked Python environment
description: >-
  Install uv and sync the workspace environment (the root .venv, the control
  member with its dev group) once. Every Python suite, lint and type check then
  runs in it with `uv run --project control --frozen`, which fetches nothing.
  Jobs that build the Controller image or release the protocol wheel build it
  themselves with scripts/build-control-wheel.
inputs:
  contracts:
    description: >-
      Which generated contract consumers to prepare: "full" (clients, web
      types and wire schema, stamped so pytest and the web hooks skip
      regeneration), "python" (CLI resources and the Python client only), or
      "none" for jobs that generate what they need themselves.
    required: false
    default: full
  cli-dependencies:
    description: >-
      Sync the CLI's own locked dependencies for the installed-CLI tests
      ("true" or "false").
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install uv and Python with a lockfile-keyed cache
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version-file: .tool-versions
        python-version: "3.15"
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          uv.lock
        # Pull requests restore the cache main last saved; only main writes it.
        save-cache: ${{ github.ref == 'refs/heads/main' }}
    - name: Sync the locked workspace environment
      shell: bash
      run: scripts/retry-dependency-fetch uv sync --project control --frozen
    - name: Record the prepared workspace environment
      # Generators and Cargo build scripts call scripts/check_environment.py,
      # which resyncs unless its stamps match. Leave them here so a later
      # caller under another environment (for example SOURCE_DATE_EPOCH during
      # a package build, or the offline signed-update lane) never syncs.
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        import sys
        from pathlib import Path

        sys.path.insert(0, "scripts")
        from check_environment import DEFAULT_ENVIRONMENT, ensure_control, ensure_protocol

        root = Path.cwd().resolve()
        environment = Path(os.environ.get("UV_PROJECT_ENVIRONMENT", DEFAULT_ENVIRONMENT))
        environment = environment if environment.is_absolute() else root / environment
        ensure_control(root, environment)
        ensure_protocol(root, environment)
        PY
    - name: Generate and stamp every contract consumer
      if: inputs.contracts == 'full'
      shell: bash
      run: scripts/prepare-generated-contracts
    - name: Generate Python client and publication contract resources
      if: inputs.contracts == 'python'
      shell: bash
      run: scripts/generate-control-clients --python-only
    - name: Sync the CLI's own dependencies for the installed-CLI tests
      if: inputs.cli-dependencies == 'true'
      shell: bash
      run: scripts/sync-cli-dependencies
