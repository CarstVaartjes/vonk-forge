name: Web quality
description: >-
  Biome (lint and format check, the whole tree) and the web typecheck. They are
  the commands the commit hook runs on the staged files. Needs the checkout,
  Node, the Python environment and `npm ci --prefix control/web` first.
runs:
  using: composite
  steps:
    - name: Check TypeScript lint, formatting and types
      shell: bash
      run: |
        set -euo pipefail
        cd control/web
        npm run lint
        npm run typecheck
