name: Install Cosign
description: >-
  Install the pinned Cosign release. The download goes through
  scripts/ci/retry-dependency-fetch (a refused connection to github.com is
  retried) and is checked against the SHA-256 pinned here before it runs.
runs:
  using: composite
  steps:
    - name: Download, verify and install Cosign
      shell: bash
      env:
        COSIGN_VERSION: v3.1.4
        COSIGN_AMD64_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        COSIGN_ARM64_SHA256: ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64; sha256="$COSIGN_AMD64_SHA256" ;;
          aarch64 | arm64) arch=arm64; sha256="$COSIGN_ARM64_SHA256" ;;
          *) echo "No pinned Cosign for $(uname -m)" >&2; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/cosign-bin"
        mkdir -p "$dir"
        scripts/ci/retry-dependency-fetch curl --fail --location --silent --show-error \
          --proto '=https' --proto-redir '=https' --tlsv1.2 \
          "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-$arch" \
          --output "$dir/cosign"
        printf '%s  %s\n' "$sha256" "$dir/cosign" | sha256sum --check --status
        chmod 0755 "$dir/cosign"
        echo "$dir" >> "$GITHUB_PATH"
