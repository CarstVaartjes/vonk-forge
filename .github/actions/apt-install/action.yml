name: Install Ubuntu packages
description: Install packages with bounded retries and Ubuntu mirror recovery
inputs:
  packages:
    description: Space-separated package names
    required: true
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.packages }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        read -r -a packages <<< "$PACKAGES"
        scripts/ci-apt-install "${packages[@]}"
