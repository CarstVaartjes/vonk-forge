name: Built recipe library
description: >-
  Provide the recipe library with its catalog index and packages already built,
  from the ci.yml `shared-inputs` job (built once per run). Restores it into
  .recipe-library; tar keeps the modes and the checkout's git state.
runs:
  using: composite
  steps:
    - name: Download the built recipe library
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: recipe-library-built
        path: ${{ runner.temp }}/recipe-library-built
    - name: Restore the built recipe library
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf "$RUNNER_TEMP/recipe-library-built/recipe-library.tar.gz"
        rm -r "$RUNNER_TEMP/recipe-library-built"
        test -f .recipe-library/tools/build-catalog-index
