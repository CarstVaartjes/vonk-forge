version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/control"
      - "/deploy/compose/hermes-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    labels: ["dependencies", "containers"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directories:
      - "/deploy/compose"
      - "/deploy/compose/tailscale"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    labels: ["dependencies", "containers"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Amsterdam"
    labels: ["dependencies", "rust"]
    open-pull-requests-limit: 5
    ignore:
      # typify (all releases through 0.10.0-alpha.3) consumes schemars 0.8 schema
      # objects in vonk-wire-codegen; schemars 1.x needs a typify release first.
      - dependency-name: "schemars"
        update-types: ["version-update:semver-major"]
