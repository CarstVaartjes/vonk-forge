name: Model cache unknown cancellation recovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/model-cache-unknown-expiry-proof.yml
      - control/src/vonk_control/model_cache.py
      - control/src/vonk_control/lifecycle/model_cache.py
      - control/src/vonk_control/model_cache_contract.py
      - control/src/vonk_control/model_cache_api.py
      - control/web/src/components/model-cache-cancellation-consumer.test.tsx
      - control/tests/test_model_cache_unknown_expiry_recovery.py
      - control/tests/test_model_manifest_composition.py
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: model-cache-unknown-expiry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancellation:
    name: Unknown cancellation expiry through fresh exact artifact claim
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_CACHE_CANCEL_RESPONSE_OUTPUT: ${{ github.workspace }}/model-cache-cancellation-responses.json
      PYTHONPATH: src:control/src:agent_protocol/src
    steps:
      - name: Check out exact current producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Provide canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python dependencies
        uses: ./.github/actions/python-env
      - name: Build canonical recipe library index
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Authenticate CI image mirror reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull pinned disposable PostgreSQL
        run: scripts/pull-test-images postgres
      - name: Prove shared manifest identity and unknown expiry through fresh admission
        run: >-
          uv run --project control --frozen pytest -q -n 0
          control/tests/test_model_cache_unknown_expiry_recovery.py
          control/tests/test_model_manifest_composition.py
          --tb=short --junitxml=${{ runner.temp }}/model-cache-cancellation.xml
      - name: Require named SQL and manifest outcomes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'model-cache-cancellation.xml').findall('.//testcase')
          assert cases, "no cancellation cases executed"
          expected = {
              'test_unknown_cancel_expiry_restart_admits_fresh_exact_artifact_and_fences_old_owner',
              'test_shared_catalog_files_resume_the_same_parent_after_producer_repair',
          }
          assert expected <= {case.get('name').partition('[')[0] for case in cases}
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - name: Prepare pinned browser consumer toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Generate consumers from the current cancellation owner
        run: |
          scripts/retry-dependency-fetch npm ci --prefix tools/openapi-client
          scripts/generate-control-clients
          scripts/retry-dependency-fetch npm ci --prefix control/web
      - name: Consume actual PostgreSQL/API cancellation observations in browser
        run: |
          npm exec -- vitest run src/components/model-cache-cancellation-consumer.test.tsx --reporter=junit --outputFile="$RUNNER_TEMP/model-cache-browser.xml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'model-cache-browser.xml').findall('.//testcase')
          assert cases, "no browser cancellation cases executed"
          assert {'actual model cancellation responses preserve unknown and confirmed evidence in the browser'} <= {case.get('name') for case in cases}
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
        working-directory: control/web
