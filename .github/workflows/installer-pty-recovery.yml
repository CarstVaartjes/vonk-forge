name: Installer terminal recovery proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/installer-pty-recovery.yml
      - .github/workflows/installer-setups.yml
      - Cargo.lock
      - Cargo.toml
      - rust/crates/vonk-spark-setup/**
      - scripts/tests/run_installer_pty_recovery.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vonk-installer-pty-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-arm64-pty:
    name: Exercise uncached sudo recovery on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Restore read-only ARM64 Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64
          add-job-id-key: "false"
          save-if: "false"
      - name: Run real PTY and uncached sudo recovery test
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(
            cargo test --locked -p vonk-spark-setup \
              --test process_boundary --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "process_boundary") | .executable // empty' |
              tail -n 1
          )"
          scripts/tests/run_installer_pty_recovery.sh "$test_binary"
