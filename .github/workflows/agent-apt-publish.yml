name: Reusable isolated agent apt publication

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      version:
        required: true
        type: string
      package:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      environment:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish verified package to isolated apt channel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: vonk-forge-agent-apt-${{ inputs.channel }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out apt publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download accepted package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: Verify exact downloaded package
        id: package
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          PACKAGE: ${{ inputs.package }}
          PACKAGE_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${CHANNEL}:${PACKAGE_ENVIRONMENT}" in
            dev:apt-development|stable:apt-release)
              ;;
            *)
              echo "agent apt channel and environment do not match" >&2
              exit 64
              ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          expected_package="vonk-forge-agent_${VERSION}_arm64.deb"
          test "$PACKAGE" = "$expected_package"
          test -f "dist/$PACKAGE" && test ! -L "dist/$PACKAGE"
          test -f "dist/${PACKAGE}.sha256" && test ! -L "dist/${PACKAGE}.sha256"
          metadata=$(scripts/agent-apt-metadata "$CHANNEL" "$VERSION")
          while IFS='=' read -r name value; do
            case "$name" in
              repository|distribution|public_prefix|keyring|snapshot|state_prefix)
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "unexpected apt metadata" >&2
                exit 64
                ;;
            esac
          done <<< "$metadata"
          verification=$(scripts/verify-agent-deb --json "dist/$PACKAGE")
          jq -e \
            --arg version "$VERSION" \
            '.ok == true and .version == $version and
             .package == "vonk-forge-agent" and .architecture == "arm64"' \
            <<< "$verification" >/dev/null
          test "$(dpkg-deb --field "dist/$PACKAGE" Version)" = "$VERSION"
          evidence_dir="$RUNNER_TEMP/agent-package-evidence"
          install -d -m 0700 "$evidence_dir"
          dpkg-deb --extract "dist/$PACKAGE" "$evidence_dir"
          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            '.predicate.buildDefinition.resolvedDependencies | length == 1 and
             .[0].digest.gitCommit == $source_sha' \
            "$evidence_dir/usr/share/doc/vonk-forge-agent/provenance.json" \
            >/dev/null
          package_sha256=$(sha256sum "dist/$PACKAGE" | cut -d' ' -f1)
          test "$package_sha256" = "$(jq -r .sha256 <<< "$verification")"
          printf 'package_sha256=%s\n' "$package_sha256" >> "$GITHUB_OUTPUT"

      - name: Install apt repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y aptly gnupg rclone

      - name: Restore checksum-protected private state
        id: state
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          DISTRIBUTION: ${{ steps.package.outputs.distribution }}
          PACKAGE: ${{ inputs.package }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_APT_STATE_BUCKET: ${{ vars.R2_APT_STATE_BUCKET }}
          SNAPSHOT: ${{ steps.package.outputs.snapshot }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STATE_PREFIX: ${{ steps.package.outputs.state_prefix }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$R2_APT_STATE_BUCKET"
          state_root="$RUNNER_TEMP/apt-state"
          install -d -m 0700 "$state_root"
          expected_listing=$'aptly-state.tar.gz\naptly-state.tar.gz.sha256'

          validate_listing() {
            local listing=$1
            local prefix=$2
            if [[ "$listing" != "$expected_listing" ]]; then
              echo "private apt state is incomplete at $prefix" >&2
              exit 1
            fi
          }

          fetch_state() {
            local prefix=$1
            local destination=$2
            install -d -m 0700 "$destination"
            rclone copyto \
              "r2:${R2_APT_STATE_BUCKET}/${prefix}/aptly-state.tar.gz" \
              "$destination/aptly-state.tar.gz"
            rclone copyto \
              "r2:${R2_APT_STATE_BUCKET}/${prefix}/aptly-state.tar.gz.sha256" \
              "$destination/aptly-state.tar.gz.sha256"
            test "$(wc -l < "$destination/aptly-state.tar.gz.sha256")" = 1
            read -r checksum_hash checksum_name checksum_extra \
              < "$destination/aptly-state.tar.gz.sha256"
            [[ "$checksum_hash" =~ ^[0-9a-f]{64}$ ]]
            test "$checksum_name" = aptly-state.tar.gz
            test -z "${checksum_extra:-}"
            (cd "$destination" && sha256sum -c aptly-state.tar.gz.sha256)
            duplicate_member=$(
              tar -tzf "$destination/aptly-state.tar.gz" | sort | uniq -d
            )
            if [[ -n "$duplicate_member" ]]; then
              echo "aptly state archive contains a duplicate archive member" >&2
              exit 1
            fi
            if tar -tzf "$destination/aptly-state.tar.gz" | awk '
              $0 ~ /^\// || $0 ~ /(^|\/)\.\.(\/|$)/ || $0 ~ /\\/ ||
              $0 !~ /^(aptly(\/|$)|publication-receipt\.json)$/ { bad=1 }
              END { exit !bad }
            '; then
              echo "aptly state archive contains an unsafe path" >&2
              exit 1
            fi
            if tar -tvzf "$destination/aptly-state.tar.gz" | awk '
              substr($1, 1, 1) != "-" && substr($1, 1, 1) != "d" { bad=1 }
              END { exit !bad }
            '; then
              echo "aptly state archive contains links or special files" >&2
              exit 1
            fi
            test "$(tar -tzf "$destination/aptly-state.tar.gz" | grep -Fxc publication-receipt.json)" = 1
            tar -xzf "$destination/aptly-state.tar.gz" -C "$destination"
            test -d "$destination/aptly" && test ! -L "$destination/aptly"
            test -f "$destination/publication-receipt.json"
            test ! -L "$destination/publication-receipt.json"
            test "$(wc -l < "$destination/publication-receipt.json")" = 1
            canonical=$(jq -cS . "$destination/publication-receipt.json")
            test "$(cat "$destination/publication-receipt.json")" = "$canonical"
            jq -e \
              --arg channel "$CHANNEL" \
              --arg distribution "$DISTRIBUTION" \
              'keys == ["channel", "distribution", "package", "package_sha256",
                        "snapshot", "source_sha", "version"] and
               .channel == $channel and .distribution == $distribution and
               (.package_sha256 | test("^[0-9a-f]{64}$")) and
               (.source_sha | test("^[0-9a-f]{40}$")) and
               .snapshot == (.channel + "-" + .version) and
               .package == ("vonk-forge-agent_" + .version + "_arm64.deb")' \
              "$destination/publication-receipt.json" >/dev/null
            receipt_version=$(jq -r .version \
              "$destination/publication-receipt.json")
            scripts/agent-apt-metadata "$CHANNEL" "$receipt_version" >/dev/null
          }

          require_exact_receipt() {
            local receipt=$1
            jq -e \
              --arg channel "$CHANNEL" \
              --arg distribution "$DISTRIBUTION" \
              --arg package "$PACKAGE" \
              --arg package_sha256 "$PACKAGE_SHA256" \
              --arg snapshot "$SNAPSHOT" \
              --arg source_sha "$SOURCE_SHA" \
              --arg version "$VERSION" \
              '.channel == $channel and .distribution == $distribution and
               .package == $package and .package_sha256 == $package_sha256 and
               .snapshot == $snapshot and .source_sha == $source_sha and
               .version == $version' "$receipt" >/dev/null
          }

          latest_listing=$(rclone lsf \
            "r2:${R2_APT_STATE_BUCKET}/latest" --files-only --order-by name)
          latest_exists=false
          if [[ -n "$latest_listing" ]]; then
            validate_listing "$latest_listing" latest
            fetch_state latest "$state_root/latest"
            latest_exists=true
            latest_version=$(jq -r .version "$state_root/latest/publication-receipt.json")
            if dpkg --compare-versions "$VERSION" "lt" "$latest_version"; then
              echo "refusing to roll back apt channel" >&2
              exit 1
            fi
          fi

          immutable_prefix="$STATE_PREFIX"
          immutable_listing=$(rclone lsf \
            "r2:${R2_APT_STATE_BUCKET}/${immutable_prefix}" \
            --files-only --order-by name)
          immutable_exists=false
          if [[ -n "$immutable_listing" ]]; then
            validate_listing "$immutable_listing" "$immutable_prefix"
            fetch_state "$immutable_prefix" "$state_root/immutable"
            require_exact_receipt "$state_root/immutable/publication-receipt.json"
            immutable_exists=true
          fi

          restored=false
          reuse_snapshot=false
          selected=
          if [[ "$latest_exists" == true ]] && \
             dpkg --compare-versions "$VERSION" "eq" "$latest_version"; then
            require_exact_receipt "$state_root/latest/publication-receipt.json"
            test "$immutable_exists" = true
            cmp --silent \
              "$state_root/latest/aptly-state.tar.gz" \
              "$state_root/immutable/aptly-state.tar.gz"
            cmp --silent \
              "$state_root/latest/aptly-state.tar.gz.sha256" \
              "$state_root/immutable/aptly-state.tar.gz.sha256"
            selected="$state_root/immutable"
            restored=true
            reuse_snapshot=true
          elif [[ "$immutable_exists" == true ]]; then
            selected="$state_root/immutable"
            restored=true
            reuse_snapshot=true
          elif [[ "$latest_exists" == true ]]; then
            selected="$state_root/latest"
            restored=true
          fi

          if [[ "$restored" == true ]]; then
            cp -a "$selected/aptly" "$RUNNER_TEMP/aptly"
            if [[ "$reuse_snapshot" == true ]]; then
              cp "$selected/publication-receipt.json" \
                "$RUNNER_TEMP/publication-receipt.json"
              cp "$selected/aptly-state.tar.gz" "$RUNNER_TEMP/aptly-state.tar.gz"
              cp "$selected/aptly-state.tar.gz.sha256" \
                "$RUNNER_TEMP/aptly-state.tar.gz.sha256"
            fi
          else
            install -d -m 0700 "$RUNNER_TEMP/aptly"
          fi
          install -d -m 0700 "$RUNNER_TEMP/apt-public"
          printf 'restored=%s\n' "$restored" >> "$GITHUB_OUTPUT"
          printf 'reuse_snapshot=%s\n' "$reuse_snapshot" >> "$GITHUB_OUTPUT"

      - name: Materialize and verify apt signing key
        id: signing
        shell: bash
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_REPOSITORY_GPG_FINGERPRINT: ${{ vars.APT_REPOSITORY_GPG_FINGERPRINT }}
          APT_REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.APT_REPOSITORY_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_REPOSITORY_GPG_PRIVATE_KEY"
          test -n "$APT_GPG_PASSPHRASE"
          [[ "$APT_REPOSITORY_GPG_FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]
          key_path="$RUNNER_TEMP/apt-repository-key.asc"
          passphrase_path="$RUNNER_TEMP/apt-repository-passphrase"
          install -m 0600 /dev/null "$key_path"
          install -m 0600 /dev/null "$passphrase_path"
          printf '%s' "$APT_REPOSITORY_GPG_PRIVATE_KEY" > "$key_path"
          printf '%s' "$APT_GPG_PASSPHRASE" > "$passphrase_path"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import "$key_path"
          secret_listing=$(gpg --batch --with-colons --list-secret-keys)
          sec_count=$(awk -F: '$1 == "sec" { count++ } END { print count+0 }' \
            <<< "$secret_listing")
          test "$sec_count" = 1
          fingerprint=$(awk -F: '
            $1 == "sec" { primary=1; next }
            primary && $1 == "fpr" { print $10; exit }
          ' <<< "$secret_listing")
          test "$fingerprint" = "$APT_REPOSITORY_GPG_FINGERPRINT"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Publish and verify signed apt index locally
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          DISTRIBUTION: ${{ steps.package.outputs.distribution }}
          FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          KEYRING: ${{ steps.package.outputs.keyring }}
          PACKAGE: ${{ inputs.package }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
          REPOSITORY: ${{ steps.package.outputs.repository }}
          RESTORED: ${{ steps.state.outputs.restored }}
          REUSE_SNAPSHOT: ${{ steps.state.outputs.reuse_snapshot }}
          SNAPSHOT: ${{ steps.package.outputs.snapshot }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          config="$RUNNER_TEMP/aptly.conf"
          jq -n \
            --arg root "$RUNNER_TEMP/aptly" \
            --arg publish "$RUNNER_TEMP/apt-public" \
            '{rootDir:$root, architectures:["arm64"],
              dependencyFollowSuggests:false, dependencyFollowRecommends:false,
              FileSystemPublishEndpoints:{r2:{rootDir:$publish,linkMethod:"copy"}}}' \
            > "$config"
          if [[ "$REUSE_SNAPSHOT" != true ]]; then
            if [[ "$RESTORED" != true ]]; then
              aptly -config="$config" repo create \
                -distribution="$DISTRIBUTION" -component=main "$REPOSITORY"
            fi
            aptly -config="$config" repo add "$REPOSITORY" "dist/$PACKAGE"
            aptly -config="$config" snapshot create "$SNAPSHOT" \
              from repo "$REPOSITORY"
          fi
          common=(
            -batch
            -passphrase-file="$RUNNER_TEMP/apt-repository-passphrase"
            -gpg-key="$FINGERPRINT"
          )
          if [[ "$RESTORED" == true ]]; then
            aptly -config="$config" publish switch "${common[@]}" \
              "$DISTRIBUTION" filesystem:r2: "$SNAPSHOT"
          else
            aptly -config="$config" publish snapshot "${common[@]}" \
              -architectures=arm64 -distribution="$DISTRIBUTION" -component=main \
              "$SNAPSHOT" filesystem:r2:
          fi
          inrelease="$RUNNER_TEMP/apt-public/dists/${DISTRIBUTION}/InRelease"
          test -s "$inrelease"
          keyring_path="$RUNNER_TEMP/apt-public/$KEYRING"
          gpg --batch --export "$FINGERPRINT" > "$keyring_path"
          test -s "$keyring_path"
          chmod 0644 "$keyring_path"
          gpgv --keyring "$keyring_path" "$inrelease"
          if [[ "$REUSE_SNAPSHOT" != true ]]; then
            jq -cS -n \
              --arg channel "$CHANNEL" \
              --arg distribution "$DISTRIBUTION" \
              --arg package "$PACKAGE" \
              --arg package_sha256 "$PACKAGE_SHA256" \
              --arg snapshot "$SNAPSHOT" \
              --arg source_sha "$SOURCE_SHA" \
              --arg version "$VERSION" \
              '{channel:$channel, distribution:$distribution, package:$package,
                package_sha256:$package_sha256, snapshot:$snapshot,
                source_sha:$source_sha, version:$version}' \
              > "$RUNNER_TEMP/publication-receipt.json"
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -czf "$RUNNER_TEMP/aptly-state.tar.gz" \
              -C "$RUNNER_TEMP" aptly publication-receipt.json
            (cd "$RUNNER_TEMP" && \
              sha256sum aptly-state.tar.gz > aptly-state.tar.gz.sha256)
          fi

      - name: Publish immutable state, public files, then latest state
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_APT_PUBLIC_BUCKET: ${{ vars.R2_APT_PUBLIC_BUCKET }}
          R2_APT_STATE_BUCKET: ${{ vars.R2_APT_STATE_BUCKET }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STATE_PREFIX: ${{ steps.package.outputs.state_prefix }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$R2_APT_PUBLIC_BUCKET" && test -n "$R2_APT_STATE_BUCKET"
          immutable="$STATE_PREFIX"
          rclone copyto --immutable \
            "$RUNNER_TEMP/aptly-state.tar.gz" \
            "r2:${R2_APT_STATE_BUCKET}/${immutable}/aptly-state.tar.gz"
          rclone copyto --immutable \
            "$RUNNER_TEMP/aptly-state.tar.gz.sha256" \
            "r2:${R2_APT_STATE_BUCKET}/${immutable}/aptly-state.tar.gz.sha256"
          rclone copy "$RUNNER_TEMP/apt-public/" \
            "r2:${R2_APT_PUBLIC_BUCKET}/"
          rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz" \
            "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz"
          rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz.sha256" \
            "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz.sha256"
          printf 'Published %s version %s from %s to https://packages.vonkforge.ai/\n' \
            "$CHANNEL" "$VERSION" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove apt credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/apt-repository-key.asc" \
            "$RUNNER_TEMP/apt-repository-passphrase"
