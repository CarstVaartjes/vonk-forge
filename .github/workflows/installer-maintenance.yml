name: Installer maintenance

# Keeps the published installer channels valid between releases. Releases
# themselves are published by installer-publication.yml.
on:
  schedule:
    # Refresh only re-signs the already published immutable generation.
    - cron: '17 3 * * *'
  workflow_dispatch:
    # A dispatch deletes stale disposable CI tailnets and publishes nothing.
    inputs:
      child_id:
        description: >-
          Optional exact stale child id to clean; empty cleans every stale child
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  refresh:
    name: Refresh signed ${{ matrix.channel }} installer manifest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: dev
          - channel: stable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: installer-promotion-${{ matrix.channel }}
    concurrency:
      group: vonk-forge-installer-r2-${{ matrix.channel }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: Check out current publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install canonical publication model runtime
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .tool-versions
          python-version: "3.15"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install R2 publication client
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/ci-apt-install rclone

      - name: Detect published channel
        id: availability
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          pointer=$(rclone lsf \
            --files-only \
            --include current.manifest \
            --max-depth 1 \
            "r2:$R2_INSTALLER_PUBLIC_BUCKET/artifacts/$CHANNEL")
          case "$pointer" in
            current.manifest)
              printf 'published=true\n' >> "$GITHUB_OUTPUT"
              ;;
            '')
              if [ "$CHANNEL" != stable ]; then
                echo "published $CHANNEL channel manifest is missing" >&2
                exit 1
              fi
              remote_tags=$(git ls-remote --tags origin)
              if printf '%s\n' "$remote_tags" \
                | grep -E '^.+[[:space:]]+refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
              then
                echo "stable channel manifest is missing despite a stable release tag" >&2
                exit 1
              fi
              printf 'published=false\n' >> "$GITHUB_OUTPUT"
              echo "::notice::Stable installer channel is not published yet; skipping refresh"
              ;;
            *)
              echo "channel pointer listing is inconsistent" >&2
              exit 1
              ;;
          esac

      - name: Verify immutable generation and refresh signed pointer
        if: steps.availability.outputs.published == 'true'
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
          VONK_INSTALLER_RELEASE_KEY_FINGERPRINT: ${{ vars.VONK_INSTALLER_RELEASE_KEY_FINGERPRINT }}
          VONK_INSTALLER_RELEASE_PRIVATE_KEY: ${{ secrets.VONK_INSTALLER_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$VONK_INSTALLER_RELEASE_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          signing_key=$RUNNER_TEMP/installer-release-private.pem
          public_key=$RUNNER_TEMP/installer-release-public.pem
          public_der=$RUNNER_TEMP/installer-release-public.der
          trap 'rm -f "$signing_key" "$public_key" "$public_der"' EXIT
          install -m 0600 /dev/null "$signing_key"
          printf '%s' "$VONK_INSTALLER_RELEASE_PRIVATE_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$public_key"
          openssl pkey -in "$signing_key" -pubout -outform DER -out "$public_der"
          test "$(sha256sum "$public_der" | cut -d' ' -f1)" = \
            "$VONK_INSTALLER_RELEASE_KEY_FINGERPRINT"
          openssl pkey -pubin -in "$public_key" -text -noout \
            | grep -Eq '^Public-Key: \((3072|4096) bit\)$'
          scripts/build-control-wheel
          uv run --project control --frozen python scripts/release/install-release-publication refresh \
            --channel "$CHANNEL" \
            --expires-at "$(($(date +%s) + 604800))" \
            --signing-key "$signing_key" \
            --signing-public-key "$public_key" \
            --rclone-remote "r2:$R2_INSTALLER_PUBLIC_BUCKET"

  # GitHub disables scheduled workflows of a public repository after 60 days
  # without repository activity. Re-enabling this workflow every run resets
  # that timer, so the refresh above cannot silently stop.
  keepalive:
    name: Keep this schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable the installer maintenance workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PUT \
            "repos/$GITHUB_REPOSITORY/actions/workflows/installer-maintenance.yml/enable"

  # A refresh that keeps failing lets the signed manifests expire after 7
  # days, and then every new install and `vonkctl update` fails. One open issue
  # makes that visible; it gets a comment per failed run and closes once the
  # next scheduled run succeeds.
  report:
    name: Report refresh failures
    needs: [refresh, keepalive]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Installer maintenance is failing
        run: |
          set -euo pipefail
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")
          if [[ " $RESULTS " == *" failure "* ]]; then
            body="Scheduled run failed: $RUN_URL. The signed installer manifests expire 7 days after their last refresh; see docs/operations/agent-package-release.md, section Installer manifest expiry."
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          elif [[ -n "$issue" && "$RESULTS" == "success success" ]]; then
            # Only a run where both jobs succeeded proves the refresh works
            # again; cancelled or skipped runs leave the issue open.
            gh issue close "$issue" --comment "Scheduled run succeeded: $RUN_URL"
          fi

  tailnet-cleanup:
    name: Delete stale disposable CI tailnets
    # A manual dispatch is the only event that may delete a child; the
    # scheduled refresh must never delete.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The canary environment owns the factory OAuth credential, and that
    # credential is environment-scoped, so this job -- not a developer machine
    # -- is the only place stale cleanup can run.  The cleanup never needs the
    # release or acceptance signing keys that live in the other environments.
    environment: installer-canary-dev
    permissions:
      contents: read
    steps:
      - name: Check out exact cleanup tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require current main cleanup authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})"

      - name: Delete stale disposable Tailscale CI children
        timeout-minutes: 10
        shell: bash
        env:
          CHILD_ID: ${{ inputs.child_id }}
          VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_ID: ${{ secrets.VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_ID }}
          VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_SECRET: ${{ secrets.VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_SECRET }}
          VONK_ACCEPTANCE_TAILNET_CLEANUP_OAUTH_CLIENT_ID: ${{ secrets.VONK_ACCEPTANCE_TAILNET_CLEANUP_OAUTH_CLIENT_ID }}
          VONK_ACCEPTANCE_TAILNET_CLEANUP_OAUTH_CLIENT_SECRET: ${{ secrets.VONK_ACCEPTANCE_TAILNET_CLEANUP_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "$CHILD_ID" ]]; then
            python scripts/ci/tailscale-acceptance-tailnet cleanup --id "$CHILD_ID"
          else
            python scripts/ci/tailscale-acceptance-tailnet cleanup
          fi
