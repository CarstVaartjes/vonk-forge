name: Temporary ARM64 Podman diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/arm64-podman-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Install the Spark rootless build stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            busybox-static crun fuse-overlayfs podman uidmap
      - name: Compare direct and transient-user-service builds
        shell: bash
        run: |
          set -euo pipefail
          if ! getent passwd vonk-agent >/dev/null; then
            sudo useradd --system --home-dir /var/lib/vonk-forge-agent \
              --shell /usr/sbin/nologin vonk-agent
          fi
          if ! grep -q '^vonk-agent:' /etc/subuid; then
            sudo usermod --add-subuids 200000-265535 vonk-agent
          fi
          if ! grep -q '^vonk-agent:' /etc/subgid; then
            sudo usermod --add-subgids 200000-265535 vonk-agent
          fi
          uid=$(id -u vonk-agent)
          sudo loginctl enable-linger vonk-agent
          for attempt in $(seq 1 30); do
            if sudo test -S "/run/user/$uid/bus"; then
              break
            fi
            sleep 1
          done
          sudo test -S "/run/user/$uid/bus"
          sudo install -d -o vonk-agent -g vonk-agent -m 0700 \
            /var/lib/vonk-forge-agent/diagnostic/context \
            /var/lib/vonk-forge-agent/diagnostic/graph \
            /var/lib/vonk-forge-agent/diagnostic/tmp \
            "/run/user/$uid/diagnostic"
          sudo install -d -o root -g vonk-agent -m 0750 \
            /etc/vonk-forge-agent
          printf '%s\n' \
            '[storage]' \
            'driver = "overlay"' \
            'runroot = "/run/user/0/unused"' \
            'graphroot = "/var/lib/vonk-forge-agent/unused"' \
            '' \
            '[storage.options.overlay]' \
            'mount_program = "/usr/bin/fuse-overlayfs"' | \
            sudo tee /etc/vonk-forge-agent/containers-storage.conf >/dev/null
          sudo chown root:vonk-agent \
            /etc/vonk-forge-agent/containers-storage.conf
          sudo chmod 0640 /etc/vonk-forge-agent/containers-storage.conf
          sudo install -o vonk-agent -g vonk-agent -m 0755 \
            /bin/busybox \
            /var/lib/vonk-forge-agent/diagnostic/context/busybox
          printf '%s\n' \
            'FROM scratch' \
            'COPY busybox /bin/busybox' \
            'RUN ["/bin/busybox", "true"]' | \
            sudo tee /var/lib/vonk-forge-agent/diagnostic/context/Containerfile \
              >/dev/null
          sudo chown vonk-agent:vonk-agent \
            /var/lib/vonk-forge-agent/diagnostic/context/Containerfile
          common=(
            --cgroup-manager=cgroupfs
            --root /var/lib/vonk-forge-agent/diagnostic/graph
            --runroot "/run/user/$uid/diagnostic"
            --storage-opt overlay.ignore_chown_errors=true
            --storage-opt overlay.mount_program=/usr/bin/fuse-overlayfs
            --storage-opt overlay.force_mask=shared
            --runtime=/usr/bin/crun
            build --no-cache --pull=never --cap-drop=all
            --security-opt=no-new-privileges
            --network=none
            --tag localhost/vonk/arm64-diagnostic:latest
            /var/lib/vonk-forge-agent/diagnostic/context
          )
          echo '=== host boundary ==='
          uname -a
          ls -l /dev/fuse || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          echo '=== direct build ==='
          sudo -u vonk-agent env \
            HOME=/var/lib/vonk-forge-agent \
            XDG_CONFIG_HOME=/var/lib/vonk-forge-agent/.config \
            XDG_DATA_HOME=/var/lib/vonk-forge-agent \
            XDG_RUNTIME_DIR="/run/user/$uid" \
            TMPDIR=/var/lib/vonk-forge-agent/diagnostic/tmp \
            CONTAINERS_STORAGE_CONF=/etc/vonk-forge-agent/containers-storage.conf \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            podman "${common[@]}" || direct_status=$?
          echo "direct_status=${direct_status:-0}"
          echo '=== transient user service build ==='
          sudo -u vonk-agent env \
            HOME=/var/lib/vonk-forge-agent \
            XDG_CONFIG_HOME=/var/lib/vonk-forge-agent/.config \
            XDG_DATA_HOME=/var/lib/vonk-forge-agent \
            XDG_RUNTIME_DIR="/run/user/$uid" \
            CONTAINERS_STORAGE_CONF=/etc/vonk-forge-agent/containers-storage.conf \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
            systemd-run --user --wait --pipe --collect --quiet \
              --service-type=exec --unit=vonk-arm64-podman-diagnostic \
              --setenv=HOME=/var/lib/vonk-forge-agent \
              --setenv=XDG_CONFIG_HOME=/var/lib/vonk-forge-agent/.config \
              --setenv=XDG_DATA_HOME=/var/lib/vonk-forge-agent \
              --setenv="XDG_RUNTIME_DIR=/run/user/$uid" \
              --setenv=TMPDIR=/var/lib/vonk-forge-agent/diagnostic/tmp \
              --setenv=CONTAINERS_STORAGE_CONF=/etc/vonk-forge-agent/containers-storage.conf \
              /usr/bin/podman "${common[@]}" || service_status=$?
          echo "service_status=${service_status:-0}"
          test "${direct_status:-0}" -eq 0
          test "${service_status:-0}" -eq 0
