name: Workload artifact build

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Reviewed workload build request below release/workloads
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize-request:
    name: Authorize reviewed workload request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      request_path: ${{ steps.request.outputs.request_path }}
      request_digest: ${{ steps.request.outputs.request_digest }}
      source_commit: ${{ steps.request.outputs.source_commit }}
      context_digest: ${{ steps.request.outputs.context_digest }}
      context: ${{ steps.request.outputs.context }}
      dockerfile: ${{ steps.request.outputs.dockerfile }}
      target: ${{ steps.request.outputs.target }}
      architecture: ${{ steps.request.outputs.architecture }}
      output_repository: ${{ steps.request.outputs.output_repository }}
      base_images: ${{ steps.request.outputs.base_images }}
    steps:
      - name: Check out reviewed request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Validate bounded build request
        id: request
        shell: bash
        env:
          DISPATCH_REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          request_path=$DISPATCH_REQUEST_PATH
          if [[ ! "$request_path" =~ ^release/workloads/[a-z0-9][a-z0-9_.-]{0,127}\.json$ ]]; then
            echo "request must be a canonical release/workloads JSON path" >&2
            exit 2
          fi
          test ! -L "$request_path"
          case "$request_path" in
            release/workloads/*.json) ;;
            *) echo "request must be below release/workloads" >&2; exit 2 ;;
          esac
          test -f "$request_path"
          validated_request=$RUNNER_TEMP/workload-artifact-request.json
          uv run --frozen scripts/workload-artifact-metadata request "$request_path" \
            > "$validated_request"
          request_digest=$(jq -er '.build_request_digest' "$validated_request")
          source_commit=$(jq -er '.request.source_commit' "$validated_request")
          output_repository=$(jq -er '.request.output_repository' "$validated_request")
          repository_owner=${GITHUB_REPOSITORY_OWNER,,}
          repository_name=${GITHUB_REPOSITORY#*/}
          expected_output_repository="ghcr.io/$repository_owner/${repository_name,,}-workloads"
          test "$output_repository" = "$expected_output_repository" || {
            echo "output repository must be owned by this GitHub organization and match its workload package" >&2
            exit 2
          }

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main

          {
            printf 'request_path=%s\n' "$request_path"
            printf 'request_digest=%s\n' "$request_digest"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'context_digest=%s\n' "$(jq -er '.request.context_digest' "$validated_request")"
            printf 'context=%s\n' "$(jq -er '.request.context' "$validated_request")"
            printf 'dockerfile=%s\n' "$(jq -er '.request.dockerfile' "$validated_request")"
            printf 'target=%s\n' "$(jq -er '.request.target' "$validated_request")"
            printf 'architecture=%s\n' "$(jq -er '.request.architecture' "$validated_request")"
            printf 'output_repository=%s\n' "$output_repository"
            printf 'base_images=%s\n' \
              "$(jq -cer '.request.base_images' "$validated_request")"
          } >> "$GITHUB_OUTPUT"

  read-only-ci-gate:
    name: Require successful CI for exact source commit
    needs: authorize-request
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify exact commit passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.authorize-request.outputs.source_commit }}
        run: |
          set -euo pipefail
          completed_runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$SOURCE_COMMIT" \
            --status completed \
            --limit 20 \
            --json conclusion,headSha)
          jq -e --arg source_commit "$SOURCE_COMMIT" \
            'any(.[]; .headSha == $source_commit and .conclusion == "success")' \
            <<< "$completed_runs" >/dev/null

  publish-workload-artifact:
    name: Publish digest-only workload artifact
    needs: [authorize-request, read-only-ci-gate]
    runs-on: ubuntu-latest
    concurrency:
      group: vonk-forge-workload-artifact-publication
      cancel-in-progress: false
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out reviewed request definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: request-definition
          persist-credentials: false
      - name: Check out exact workload source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize-request.outputs.source_commit }}
          path: workload-source
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Verify exact source context
        id: source
        shell: bash
        env:
          EXPECTED_CONTEXT_DIGEST: ${{ needs.authorize-request.outputs.context_digest }}
          CONTEXT: ${{ needs.authorize-request.outputs.context }}
          DOCKERFILE: ${{ needs.authorize-request.outputs.dockerfile }}
          DECLARED_BASE_IMAGES: ${{ needs.authorize-request.outputs.base_images }}
          SOURCE_COMMIT: ${{ needs.authorize-request.outputs.source_commit }}
        run: |
          set -euo pipefail
          checkout_root=$(realpath workload-source)
          checkout_context=$(realpath "workload-source/$CONTEXT")
          checkout_dockerfile=$(realpath "workload-source/$DOCKERFILE")
          case "$checkout_context" in
            "$checkout_root"/adapters/*) ;;
            *) echo "context resolved outside reviewed adapters" >&2; exit 2 ;;
          esac
          case "$checkout_dockerfile" in
            "$checkout_context"/*) ;;
            *) echo "Dockerfile resolved outside build context" >&2; exit 2 ;;
          esac
          test -d "$checkout_context"
          test -f "$checkout_dockerfile"
          source_date_epoch=$(git -C workload-source show -s --format=%ct "$SOURCE_COMMIT")
          case "$source_date_epoch" in
            ''|*[!0-9]*)
              echo "source commit timestamp is invalid" >&2
              exit 2
              ;;
          esac
          context_archive=$RUNNER_TEMP/workload-context.tar
          git -C workload-source archive --format=tar --output="$context_archive" \
            "$SOURCE_COMMIT" "$CONTEXT"
          actual_context_digest="sha256:$(sha256sum "$context_archive" | cut -d ' ' -f 1)"
          test "$actual_context_digest" = "$EXPECTED_CONTEXT_DIGEST" || {
            echo "checked-out context does not match context_digest" >&2
            exit 2
          }
          verified_root=$RUNNER_TEMP/verified-workload-source
          install -d -m 0700 "$verified_root"
          tar -xf "$context_archive" -C "$verified_root"
          context_path=$(realpath "$verified_root/$CONTEXT")
          dockerfile_path=$(realpath "$verified_root/$DOCKERFILE")
          case "$context_path" in
            "$verified_root"/adapters/*) ;;
            *) echo "verified context escaped extraction root" >&2; exit 2 ;;
          esac
          case "$dockerfile_path" in
            "$context_path"/*) ;;
            *) echo "verified Dockerfile escaped build context" >&2; exit 2 ;;
          esac
          scripts/validate-workload-dockerfile "$dockerfile_path" "$DECLARED_BASE_IMAGES"
          chmod -R a-w "$verified_root"
          {
            printf 'verified_context=%s\n' "$context_path"
            printf 'verified_dockerfile=%s\n' "$dockerfile_path"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build digest-only OCI artifact
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source_date_epoch }}
        with:
          context: ${{ steps.source.outputs.verified_context }}
          file: ${{ steps.source.outputs.verified_dockerfile }}
          target: ${{ needs.authorize-request.outputs.target }}
          platforms: ${{ needs.authorize-request.outputs.architecture }}
          network: none
          outputs: >-
            type=image,
            name=${{ needs.authorize-request.outputs.output_repository }},
            push-by-digest=true,
            name-canonical=true,
            rewrite-timestamp=true,
            push=true
          sbom: true
          provenance: mode=max
      - name: Collect workload artifact evidence
        id: evidence
        shell: bash
        env:
          ARCHITECTURE: ${{ needs.authorize-request.outputs.architecture }}
          BASE_IMAGES: ${{ needs.authorize-request.outputs.base_images }}
          BUILD_REQUEST_DIGEST: ${{ needs.authorize-request.outputs.request_digest }}
          CONTEXT_DIGEST: ${{ needs.authorize-request.outputs.context_digest }}
          OCI_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          OUTPUT_REPOSITORY: ${{ needs.authorize-request.outputs.output_repository }}
          SOURCE_COMMIT: ${{ needs.authorize-request.outputs.source_commit }}
          TARGET: ${{ needs.authorize-request.outputs.target }}
        run: |
          set -euo pipefail
          case "$OCI_INDEX_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "build did not return a sha256 index digest" >&2; exit 2 ;;
          esac
          install -d -m 0700 workload-artifact-output
          index_reference="${OUTPUT_REPOSITORY}@${OCI_INDEX_DIGEST}"
          docker buildx imagetools inspect "$index_reference" --raw \
            > workload-artifact-output/oci-index.json
          runtime_digest=$(scripts/select-workload-runtime-manifest \
            workload-artifact-output/oci-index.json "$ARCHITECTURE" "$OCI_INDEX_DIGEST")
          runtime_reference="${OUTPUT_REPOSITORY}@${runtime_digest}"
          docker buildx imagetools inspect "$runtime_reference" --raw \
            > workload-artifact-output/oci-manifest.json
          export RUNTIME_MANIFEST_DIGEST="$runtime_digest"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path("workload-artifact-output/oci-manifest.json")
          raw = path.read_bytes()
          expected = os.environ["RUNTIME_MANIFEST_DIGEST"].removeprefix("sha256:")
          candidates = (raw, raw[:-1]) if raw.endswith(b"\n") else (raw,)
          for candidate in candidates:
              if hashlib.sha256(candidate).hexdigest() == expected:
                  path.write_bytes(candidate)
                  break
          else:
              raise SystemExit("runtime manifest does not match selected digest")
          PY
          printf 'runtime_digest=%s\n' "$runtime_digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$index_reference" --format '{{ json .SBOM.SPDX }}' \
            | jq -e -S -c 'select(type == "object" and (.spdxVersion | type == "string") and (.SPDXID | type == "string"))' \
            > workload-artifact-output/sbom.json
          docker buildx imagetools inspect "$index_reference" --format '{{ json .Provenance.SLSA }}' \
            | jq -e -S -c 'select(type == "object" and length > 0)' \
            > workload-artifact-output/provenance.json
          jq -e 'if type == "object" or type == "array" then length > 0 else false end' \
            workload-artifact-output/sbom.json >/dev/null || { echo 'SBOM evidence is empty' >&2; exit 2; }
          jq -e 'if type == "object" or type == "array" then length > 0 else false end' \
            workload-artifact-output/provenance.json >/dev/null || { echo 'provenance evidence is empty' >&2; exit 2; }
          buildkit_provenance_digest="sha256:$(sha256sum workload-artifact-output/provenance.json | cut -d ' ' -f 1)"
          jq -n \
            --arg architecture "$ARCHITECTURE" \
            --argjson base_images "$BASE_IMAGES" \
            --arg build_request_digest "$BUILD_REQUEST_DIGEST" \
            --arg buildkit_provenance_digest "$buildkit_provenance_digest" \
            --arg context_digest "$CONTEXT_DIGEST" \
            --arg oci_index_digest "$OCI_INDEX_DIGEST" \
            --arg runtime_manifest_digest "$runtime_digest" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg target "$TARGET" \
            '{
              schema_version: 1,
              kind: "workload-artifact-build-provenance",
              build_request_digest: $build_request_digest,
              source_commit: $source_commit,
              context_digest: $context_digest,
              target: $target,
              architecture: $architecture,
              base_images: $base_images,
              oci_index_digest: $oci_index_digest,
              runtime_manifest_digest: $runtime_manifest_digest,
              buildkit_provenance_digest: $buildkit_provenance_digest
            }' > workload-artifact-output/provenance-predicate.json
      - name: Sign workload provenance
        id: provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.authorize-request.outputs.output_repository }}
          subject-digest: ${{ steps.evidence.outputs.runtime_digest }}
          predicate-type: https://vonk-forge.dev/attestations/workload-artifact-build/v1
          predicate-path: workload-artifact-output/provenance-predicate.json
          push-to-registry: true
      - name: Sign workload SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.authorize-request.outputs.output_repository }}
          subject-digest: ${{ steps.evidence.outputs.runtime_digest }}
          sbom-path: workload-artifact-output/sbom.json
          push-to-registry: true
      - name: Create workload artifact result
        shell: bash
        env:
          BUILD_REQUEST_DIGEST: ${{ needs.authorize-request.outputs.request_digest }}
          OCI_MANIFEST_DIGEST: ${{ steps.evidence.outputs.runtime_digest }}
          OUTPUT_REPOSITORY: ${{ needs.authorize-request.outputs.output_repository }}
          PROVENANCE_BUNDLE: ${{ steps.provenance-attestation.outputs.bundle-path }}
          PROVENANCE_ATTESTATION_ID: ${{ steps.provenance-attestation.outputs.attestation-id }}
          PROVENANCE_ATTESTATION_URL: ${{ steps.provenance-attestation.outputs.attestation-url }}
          REQUEST_PATH: ${{ needs.authorize-request.outputs.request_path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
          SBOM_ATTESTATION_ID: ${{ steps.sbom-attestation.outputs.attestation-id }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
          SOURCE_COMMIT: ${{ needs.authorize-request.outputs.source_commit }}
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          cp "$PROVENANCE_BUNDLE" \
            workload-artifact-output/signed-provenance.bundle.json
          cp "$SBOM_BUNDLE" \
            workload-artifact-output/signed-sbom.bundle.json
          provenance_digest="sha256:$(sha256sum "$PROVENANCE_BUNDLE" | cut -d ' ' -f 1)"
          sbom_digest="sha256:$(sha256sum "$SBOM_BUNDLE" | cut -d ' ' -f 1)"
          jq -n \
            --arg build_request_digest "$BUILD_REQUEST_DIGEST" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg oci_manifest_digest "$OCI_MANIFEST_DIGEST" \
            --arg sbom_digest "$sbom_digest" \
            --arg provenance_digest "$provenance_digest" \
            '{
              schema_version: 1,
              kind: "workload-artifact-build-result",
              build_request_digest: $build_request_digest,
              source_commit: $source_commit,
              oci_manifest_digest: $oci_manifest_digest,
              sbom_digest: $sbom_digest,
              provenance_digest: $provenance_digest
            }' > workload-artifact-output/result.json
          request-definition/scripts/workload-artifact-metadata result \
            workload-artifact-output/result.json \
            --request "request-definition/$REQUEST_PATH" \
            > workload-artifact-output/validated-result.json
          jq -n \
            --arg provenance_id "$PROVENANCE_ATTESTATION_ID" \
            --arg provenance_url "$PROVENANCE_ATTESTATION_URL" \
            --arg sbom_id "$SBOM_ATTESTATION_ID" \
            --arg sbom_url "$SBOM_ATTESTATION_URL" \
            '{
              provenance: {id: $provenance_id, url: $provenance_url},
              sbom: {id: $sbom_id, url: $sbom_url}
            }' > workload-artifact-output/signed-attestations.json
          printf '%s@%s\n' "$OUTPUT_REPOSITORY" "$OCI_MANIFEST_DIGEST" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload workload artifact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-artifact-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            workload-artifact-output/oci-index.json
            workload-artifact-output/oci-manifest.json
            workload-artifact-output/provenance.json
            workload-artifact-output/provenance-predicate.json
            workload-artifact-output/sbom.json
            workload-artifact-output/signed-attestations.json
            workload-artifact-output/signed-provenance.bundle.json
            workload-artifact-output/signed-sbom.bundle.json
            workload-artifact-output/validated-result.json
