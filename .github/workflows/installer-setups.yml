name: Installer setup programs

# Called by the release workflow (installer-publication.yml), which owns the
# trigger, concurrency and the decision whether this producer must run.
on:
  workflow_call:
    inputs:
      test_trust:
        type: boolean
        default: false
      source_ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-nas-wheel:
    name: Build and verify portable Python NAS setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: ./.github/actions/python-env
      - name: Build the portable NAS setup wheel
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/setup/nas"
          mkdir -p "$output"
          uv build --project nas_setup --wheel --out-dir "$output"
          shopt -s nullglob
          wheels=("$output/"vonk_nas_setup-*-py3-none-any.whl)
          test "${#wheels[@]}" -eq 1
          uv run --project control --frozen python scripts/verify-nas-setup-wheel "${wheels[0]}"
          (cd "$output" && sha256sum -- *.whl > SHA256SUMS)
      - name: Upload accepted portable NAS setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-setup-${{ inputs.source_ref || github.sha }}-nas
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/setup

  build-and-test:
    name: Build and test native Spark setup (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            binaries: vonk-spark-setup
            # Extracted binary from the reviewed Mozilla v0.18.0 release archive.
            sccache_sha256: 0fd82ece4469b791e30fffdd43d58d2e6cae303950c0d6c8faad932d93e35cf4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Prepare Pydantic contracts for Cargo builds
        uses: ./.github/actions/python-env
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.98.1
          rustup default 1.98.1

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.platform }}
          add-job-id-key: "false"

      - name: Run Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Verify pinned Rust compiler cache binary
        shell: bash
        env:
          EXPECTED_SCCACHE_SHA256: ${{ matrix.sccache_sha256 }}
        run: |
          set -euo pipefail
          test -n "${SCCACHE_PATH:-}"
          test -x "$SCCACHE_PATH"
          case "$(uname -s)" in
            Linux) actual="$(sha256sum "$SCCACHE_PATH")" ;;
            Darwin) actual="$(shasum -a 256 "$SCCACHE_PATH")" ;;
            *) echo "unsupported sccache verification platform" >&2; exit 1 ;;
          esac
          actual="${actual%% *}"
          if [[ "$actual" != "$EXPECTED_SCCACHE_SHA256" ]]; then
            echo "sccache binary checksum mismatch" >&2
            exit 1
          fi

      - name: Download this run's test-only installer trust root
        if: inputs.test_trust
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ephemeral-installer-public
          path: ${{ runner.temp }}/ephemeral-public

      - name: Test and build exact native setup programs
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
          PLATFORM: ${{ matrix.platform }}
          TEST_TRUST: ${{ inputs.test_trust }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -euo pipefail
          case "$PLATFORM:$(uname -s):$(uname -m)" in
            linux-arm64:Linux:aarch64) ;;
            *) echo "installer setup runner architecture does not match" >&2; exit 1 ;;
          esac
          output="$RUNNER_TEMP/setup/$PLATFORM"
          install -d -m 0755 "$output"
          read -r -a binaries <<< "$BINARIES"
          test "${#binaries[@]}" -ge 1
          package_args=()
          for binary in "${binaries[@]}"; do
            package_args+=(--package "$binary")
          done
          cargo test --locked --release "${package_args[@]}"
          for binary in "${binaries[@]}"; do
            if [[ "$binary" == vonk-spark-setup && "$TEST_TRUST" == true ]]; then
              # include_bytes! embeds this root only in the PR artifact. Tests
              # above still exercise the production root; shipped source stays intact.
              cp install/installer-release-public.pem "$RUNNER_TEMP/production-public.pem"
              trap 'cp "$RUNNER_TEMP/production-public.pem" install/installer-release-public.pem' EXIT
              cp "$RUNNER_TEMP/ephemeral-public/key.pem" install/installer-release-public.pem
            fi
            cargo build --locked --release --package "$binary" --bin "$binary"
            if [[ "$binary" == vonk-spark-setup && "$TEST_TRUST" == true ]]; then
              cp "$RUNNER_TEMP/production-public.pem" install/installer-release-public.pem
              trap - EXIT
            fi
            install -m 0555 "target/release/$binary" "$output/$binary"
          done
          (
            cd "$output"
            # Hash only the accepted binaries, after changing to the artifact
            # directory. This keeps paths portable and prevents the redirected
            # SHA256SUMS file from hashing itself while it is still empty.
            sha256sum -- "${binaries[@]}" | LC_ALL=C sort > SHA256SUMS
          )

      - name: Exercise uncached sudo recovery in a disposable ARM64 terminal
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test_binary="$(
            cargo test --locked --release -p vonk-spark-setup \
              --test process_boundary --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "process_boundary") | .executable // empty' |
              tail -n 1
          )"
          test -x "$test_binary"
          scripts/tests/run_installer_pty_recovery.sh "$test_binary"

      - name: Upload accepted native setup programs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-setup-${{ inputs.source_ref || github.sha }}-${{ matrix.platform }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/setup
