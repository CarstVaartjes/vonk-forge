name: Installer setup programs

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/installer-setups.yml
      - Cargo.lock
      - Cargo.toml
      - rust/crates/vonk-nas-setup/**
      - rust/crates/vonk-spark-setup/**

permissions:
  contents: read

concurrency:
  group: vonk-forge-installer-setups-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test native setup (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Binary hashes are for the extracted `sccache` executable in Mozilla's
          # v0.16.0 release archives. Each archive was independently matched to
          # the SHA-256 digest in GitHub's release asset metadata before extraction:
          # https://github.com/mozilla/sccache/releases/tag/v0.16.0
          - platform: linux-amd64
            runner: ubuntu-24.04
            binaries: vonk-nas-setup vonk-spark-setup
            # Archive: aec995a83ad3dff3d14b6314e08858b7b73d35ca85a5bcf3d3a9ec07dee35588
            sccache_sha256: 91544c5e9e3440aa0b75e0299cd3e880ac0be91ac537333adee69b507b3495c6
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            binaries: vonk-nas-setup vonk-spark-setup
            # Archive: f73a5c39f96bb6ebb89cc7915cf182260d4cbf30765322c5e793d0fe8bd80784
            sccache_sha256: 42998f3f9740df2a53d824cc1008f93337a85002a8801d4f4dc1d739b18aa787
          - platform: darwin-amd64
            runner: macos-15-intel
            binaries: vonk-nas-setup
            # Archive: f7dbd055db75a938ab1539f5316c5d08e73a1b94c40ab170ddcc617f5bf18343
            sccache_sha256: b3a564635eddda9119eeaffe3ada7400188e205907e6b68838c7400ec6f9103b
          - platform: darwin-arm64
            runner: macos-15
            binaries: vonk-nas-setup
            # Archive: ded590cae2c72042c61178632906bef62d635fa20d45f8b22110a2241f430960
            sccache_sha256: 1e1da56216f82f4968a705ee19991ad1bcf474ab994cc440fd5cdfd045f7c4e8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.platform }}
          add-job-id-key: "false"

      - name: Run Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Verify pinned Rust compiler cache binary
        shell: bash
        env:
          EXPECTED_SCCACHE_SHA256: ${{ matrix.sccache_sha256 }}
        run: |
          set -euo pipefail
          test -n "${SCCACHE_PATH:-}"
          test -x "$SCCACHE_PATH"
          case "$(uname -s)" in
            Linux) actual="$(sha256sum "$SCCACHE_PATH")" ;;
            Darwin) actual="$(shasum -a 256 "$SCCACHE_PATH")" ;;
            *) echo "unsupported sccache verification platform" >&2; exit 1 ;;
          esac
          actual="${actual%% *}"
          if [[ "$actual" != "$EXPECTED_SCCACHE_SHA256" ]]; then
            echo "sccache binary checksum mismatch" >&2
            exit 1
          fi

      - name: Test and build exact native setup programs
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
          PLATFORM: ${{ matrix.platform }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -euo pipefail
          case "$PLATFORM:$(uname -s):$(uname -m)" in
            linux-amd64:Linux:x86_64|linux-arm64:Linux:aarch64|darwin-amd64:Darwin:x86_64|darwin-arm64:Darwin:arm64) ;;
            *) echo "installer setup runner architecture does not match" >&2; exit 1 ;;
          esac
          output="$RUNNER_TEMP/setup/$PLATFORM"
          install -d -m 0755 "$output"
          read -r -a binaries <<< "$BINARIES"
          test "${#binaries[@]}" -ge 1
          package_args=()
          for binary in "${binaries[@]}"; do
            package_args+=(--package "$binary")
          done
          cargo test --locked --release "${package_args[@]}"
          for binary in "${binaries[@]}"; do
            cargo build --locked --release --package "$binary" --bin "$binary"
            install -m 0555 "target/release/$binary" "$output/$binary"
          done
          (
            cd "$output"
            # Hash only the accepted binaries, after changing to the artifact
            # directory. This keeps paths portable and prevents the redirected
            # SHA256SUMS file from hashing itself while it is still empty.
            sha256sum -- $BINARIES | LC_ALL=C sort > SHA256SUMS
          )

      - name: Upload accepted native setup programs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-setup-${{ github.sha }}-${{ matrix.platform }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/setup
