name: Spark upgrade-carry acceptance

# Shared by release and PR candidate acceptance. The candidate is always the
# caller's exact signed generation; the current promoted release is its baseline.
# Dispatch can also compare two immutable published generations. With no prior
# promotion the harness records the absent baseline explicitly.
on:
  workflow_call:
    inputs:
      premerge:
        type: boolean
        default: false
      channel:
        type: string
        required: true
      candidate_generation:
        description: "Candidate generation (default: the current promoted release)"
        type: string
        required: false
        default: ""
      source_ref:
        type: string
        required: true
      # upgrade-carry: the promoted release's serving workload survives the
      # upgrade to the candidate. recipe-refresh: on a Spark installed with the
      # candidate, an editorial successor and two sibling Recipes load and serve.
      scenario:
        type: string
        default: upgrade-carry
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [dev, stable]
        default: dev
      candidate_generation:
        description: "Candidate generation (default: the current promoted release)"
        type: string
        default: ""
      baseline_generation:
        description: "Baseline generation (default: the release promoted before the candidate)"
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: vonk-forge-spark-upgrade-carry-${{ github.event.pull_request.number || github.ref }}-${{ inputs.candidate_generation || 'current' }}-${{ inputs.scenario || 'upgrade-carry' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  carry:
    name: ${{ inputs.scenario == 'recipe-refresh' && 'Refresh recipes on the candidate (linux-arm64)' || 'Carry a serving workload across the upgrade (linux-arm64)' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    environment: ${{ inputs.premerge && format('ephemeral-acceptance-{0}-{1}', github.run_id, github.run_attempt) || format('installer-canary-{0}', inputs.channel || 'dev') }}
    env:
      CHANNEL: ${{ inputs.channel || 'dev' }}
      SCENARIO: ${{ inputs.scenario || 'upgrade-carry' }}
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_SYNTHETIC_CANARY_INDEX: tests/fixtures/canonical-synthetic-canary/index.json
    steps:
      - name: Check out exact acceptance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Authenticate candidate image reads
        if: inputs.premerge
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Serve run-local signed candidate
        if: inputs.premerge
        uses: ./.github/actions/ephemeral-publication
        with:
          channel: ${{ inputs.channel }}
          generation: ${{ inputs.candidate_generation }}

      - name: Resolve the candidate and the previously promoted baseline
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PUBLIC_ORIGIN: ${{ inputs.premerge && 'https://localhost:9443' || vars.INSTALLER_PUBLIC_ORIGIN }}
          CANDIDATE_INPUT: ${{ inputs.candidate_generation }}
          BASELINE_INPUT: ${{ inputs.baseline_generation }}
        run: |
          set -euo pipefail
          [[ "$CHANNEL" =~ ^(dev|stable)$ ]]
          if [[ "${{ inputs.premerge }}" == true || "$SCENARIO" == recipe-refresh ]]; then
            printf 'candidate=%s\nbaseline=%s\n' "$CANDIDATE_INPUT" "$CANDIDATE_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The channel pointer names the promoted release; a release run's
          # candidate is not promoted yet, so the pointer is its baseline.
          pointer=$(curl -fsS --retry 5 --retry-delay 2 --retry-max-time 60 \
            --retry-all-errors --connect-timeout 10 --max-time 15 "$INSTALLER_PUBLIC_ORIGIN/artifacts/$CHANNEL/current.manifest" \
            | sed -n 's/^generation=\([0-9a-f]\{64\}\)$/\1/p' || true)
          candidate=${CANDIDATE_INPUT:-$pointer}
          [[ "$candidate" =~ ^[0-9a-f]{64}$ ]] || { echo "candidate generation is unknown" >&2; exit 1; }
          baseline=$BASELINE_INPUT
          if [[ -z "$baseline" && -n "$pointer" && "$pointer" != "$candidate" ]]; then
            baseline=$pointer
          fi
          if [[ -z "$baseline" ]]; then
            # Promotion receipts name every promoted generation, newest first.
            baseline=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name | startswith(\"installer-promotion-$CHANNEL-\")) | .name" \
              | sed "s/^installer-promotion-$CHANNEL-//" \
              | grep -v -x "$candidate" | head -n 1 || true)
          fi
          [[ -z "$baseline" || "$baseline" =~ ^[0-9a-f]{64}$ ]]
          printf 'candidate=%s\nbaseline=%s\n' "$candidate" "$baseline" >> "$GITHUB_OUTPUT"
          printf 'Candidate %s; baseline %s\n' "$candidate" "${baseline:-none}"

      - name: Resolve exact canonical recipe library source
        id: recipe-library-source
        shell: bash
        run: |
          set -euo pipefail
          revision=$(cat tests/acceptance/recipe-library-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Check out exact canonical recipe library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CarstVaartjes/vonk-forge-recipes
          ref: ${{ steps.recipe-library-source.outputs.revision }}
          path: .recipe-library
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true

      - name: Build recipe library index and packages
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"

      - name: Build and verify the Controller protocol wheel
        uses: ./.github/actions/prepare-control-wheel

      - name: Generate Python consumers for the standalone upgrade harness
        run: scripts/generate-control-clients --python-only

      - name: Enable Docker CDI for synthetic Spark device discovery
        shell: bash
        run: |
          set -euo pipefail
          daemon_config=/etc/docker/daemon.json
          updated_config=$(mktemp)
          trap 'rm -f -- "$updated_config"' EXIT
          if sudo test -e "$daemon_config"; then
            # The runner owns this tempfile; sudo only reads root config.
            # shellcheck disable=SC2024
            sudo jq \
              '.features = ((if ((.features // {}) | type) == "object" then (.features // {}) else {} end) + {"cdi": true})' \
              "$daemon_config" > "$updated_config"
          else
            jq -n '{"features":{"cdi":true}}' > "$updated_config"
          fi
          sudo dockerd --validate --config-file "$updated_config"
          sudo install -D -o root -g root -m 0644 \
            "$updated_config" "$daemon_config"
          sudo systemctl restart docker.service
          docker info --format '{{json .CDISpecDirs}}' | \
            jq -e 'index("/etc/cdi") != null and index("/var/run/cdi") != null' \
              >/dev/null

      - name: Carry the canary from the baseline to the candidate
        shell: bash
        env:
          INSTALLER_PUBLIC_ORIGIN: ${{ inputs.premerge && 'https://localhost:9443' || vars.INSTALLER_PUBLIC_ORIGIN }}
          VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY: ${{ inputs.premerge && 'ephemeral-synthetic-upstream' || secrets.VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY }}
          VONK_ACCEPTANCE_SPARK_CONTROLLER_BOUNDARY: loopback
          VONK_ACCEPTANCE_WORKSPACE: ${{ github.workspace }}
          CANDIDATE: ${{ steps.releases.outputs.candidate }}
          BASELINE: ${{ steps.releases.outputs.baseline }}
        run: |
          set -euo pipefail
          test "$INSTALLER_PUBLIC_ORIGIN" = "${{ inputs.premerge && 'https://localhost:9443' || 'https://install.vonkforge.ai' }}"
          mkdir -p "$RUNNER_TEMP/upgrade-carry"
          uv run --project control --frozen \
            python tests/acceptance/spark_upgrade_carry.py \
            --scenario "$SCENARIO" \
            --channel "$CHANNEL" \
            --candidate-generation "$CANDIDATE" \
            --baseline-generation "$BASELINE" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/upgrade-carry/report.json"

      - name: Upload upgrade-carry report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spark-${{ inputs.scenario || 'upgrade-carry' }}-${{ steps.releases.outputs.candidate || 'unresolved' }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/upgrade-carry/report.json

      - name: Stop run-local object server
        if: always() && inputs.premerge
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ephemeral-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/ephemeral-server.pid")" 2>/dev/null || true
          fi
          rm -f -- "$RUNNER_TEMP/ephemeral-tls/key.pem"
