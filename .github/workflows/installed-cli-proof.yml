name: Installed CLI signed update and Controller transition proofs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/installed-cli-proof.yml'
      - 'tests/cluster_profiles/test_cli_update.py'
      - 'src/cluster_profiles/cli_update.py'
      - 'src/cluster_profiles/build_identity.py'
      - 'src/cluster_profiles/runtime_identity.py'
      - 'control/src/vonk_control/cli_update_contract.py'
      - 'control/src/vonk_control/platform_observation.py'
      - 'control/src/vonk_control/api.py'
      - 'src/cluster_profiles/schemas/cli-update-contract.schema.json'
      - 'src/cluster_profiles/schemas/cli-release-projection.schema.json'
      - 'schemas/install-release-manifest.schema.json'
      - 'agent_protocol/**'
      - 'nas_setup/**'
      - 'control/pyproject.toml'
      - 'control/uv.lock'
      - 'scripts/check_environment.py'
      - 'scripts/build-control-wheel'
      - 'scripts/generate-control-clients'
      - 'scripts/export-agent-wire-schema'
      - 'tools/hatch_build.py'
      - 'install/channel'
      - 'scripts/install-release-publication'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: vonk-forge-installed-cli-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-update:
    name: Actual signed wheel update and old CLI to NDJSON Controller bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_PRIOR_STABLE_SOURCE_SHA: aeefc93a96fd2bf9c209bbe8d2f3e1bded1b87f8
      VONK_PRIOR_STABLE_CLI_ROOT: ${{ github.workspace }}/.prior-stable-cli
      VONK_TRANSITION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out the frozen prior stable CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aeefc93a96fd2bf9c209bbe8d2f3e1bded1b87f8
          path: .prior-stable-cli
          persist-credentials: false
      - name: Verify exact proof checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VONK_TRANSITION_SOURCE_SHA"
          test "$(git -C .prior-stable-cli rev-parse HEAD)" = "$VONK_PRIOR_STABLE_SOURCE_SHA"
          git diff --exit-code HEAD --
          git -C .prior-stable-cli diff --exit-code HEAD --
      - name: Provide canonical recipe dependency
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python tooling
        uses: ./.github/actions/python-env
      - name: Prepare isolated locked CLI resolver cache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ensure-project-venv "$RUNNER_TEMP/signed-update-dependencies"
          UV_CACHE_DIR="$RUNNER_TEMP/signed-update-cache" \
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/signed-update-dependencies" \
            scripts/retry-dependency-fetch uv sync --project . --frozen --no-dev --no-install-project
          uv export --project . --frozen --no-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/signed-update-requirements.txt"
          UV_CACHE_DIR="$RUNNER_TEMP/signed-update-cache" \
            scripts/retry-dependency-fetch uv pip install \
              --python "$RUNNER_TEMP/signed-update-dependencies/bin/python" \
              --reinstall --require-hashes -r "$RUNNER_TEMP/signed-update-requirements.txt"
          test -d "$RUNNER_TEMP/signed-update-cache"
      - name: Prove the signed updater, manifest refusal, signed bootstrap and installed NDJSON command
        shell: bash
        env:
          VONK_SIGNED_UPDATE_LANE_ENABLED: '1'
          VONK_SIGNED_UPDATE_CACHE: ${{ runner.temp }}/signed-update-cache
        run: |
          set -euo pipefail
          uv run --project control --frozen pytest -q -n 0 \
            tests/cluster_profiles/test_cli_update.py::test_installed_cli_signed_update_replaces_actual_uv_tool \
            tests/cluster_profiles/test_cli_update.py::test_installed_stable_cli_updates_after_actual_controller_ndjson_transition \
            --junitxml="$RUNNER_TEMP/installed-cli-junit.xml"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          cases = ET.parse(root / 'installed-cli-junit.xml').findall('.//testcase')
          assert cases, "no proof cases executed"
          expected = {
              'test_installed_cli_signed_update_replaces_actual_uv_tool',
              'test_installed_stable_cli_updates_after_actual_controller_ndjson_transition',
          }
          assert expected <= {case.attrib['name'].partition('[')[0] for case in cases}, 'missing required installed CLI case'
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - name: Retain scoped signed updater evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-cli-proof-${{ github.sha }}
          path: ${{ runner.temp }}/installed-cli-junit.xml
          if-no-files-found: ignore
          retention-days: 7
