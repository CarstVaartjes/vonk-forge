name: Pre-merge release acceptance

# PR acceptance has no release credentials or protected environments.
# Signing authority is ephemeral; candidates remain scoped to this run.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      upgrade_carry:
        description: Carry a serving workload across the upgrade to this candidate
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Exact PR commit or branch to build and accept
        required: true
        type: string
      upgrade_carry:
        description: Carry a serving workload across the upgrade to this candidate
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: vonk-premerge-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.workflow == 'CI' ||
        contains(github.event.pull_request.labels.*.name, 'release-acceptance')))
    name: Bind candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
      version: ${{ steps.source.outputs.version }}
      baseline_version: ${{ steps.source.outputs.baseline_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve the immutable source and isolated package versions
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          export SOURCE_SHA="$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          # Images also name their source tree, so main can reuse an identical build.
          printf 'tree=%s\n' "$(git rev-parse --verify 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # This version is never published to apt or promoted. Epoch seconds
          # order it above the previous dev release for real upgrade acceptance.
          python3 - <<'PY'
          import os
          import time
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          major, minor, patch = (int(part) for part in version.split("."))
          if patch:
              patch -= 1
          elif minor:
              minor -= 1
          elif major:
              major -= 1
          sha = os.environ["SOURCE_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}~dev.{int(time.time())}+g{sha[:12]}\n")
              output.write(f"baseline_version={major}.{minor}.{patch}~acceptance.1+g{sha[:12]}\n")
          PY


      - name: Generate this run's installer signing authority
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ephemeral-private" "$RUNNER_TEMP/ephemeral-public"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/ephemeral-private/key.pem"
          openssl pkey -in "$RUNNER_TEMP/ephemeral-private/key.pem" -pubout \
            -out "$RUNNER_TEMP/ephemeral-public/key.pem"
      # Run artifacts convey the disposable authority between isolated jobs.
      # It signs no production objects and expires with this run's artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ephemeral-installer-private
          path: ${{ runner.temp }}/ephemeral-private/key.pem
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ephemeral-installer-public
          path: ${{ runner.temp }}/ephemeral-public/key.pem
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Remove the local private key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ephemeral-private/key.pem"

  build:
    # Each architecture builds on its own native runner; QEMU emulation of
    # the arm64 half took longer than everything else on the candidate path.
    # Every build pushes by digest only; the index job below binds the two
    # leaves into the run-scoped candidate tag.
    name: Candidate ${{ matrix.role == 'api' && 'api + worker' || matrix.role }} (${{ matrix.platform }})
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        role: [api, hermes, litellm]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
          # API and worker share every expensive Dockerfile stage. Keep them on
          # one builder so the worker reuses this exact candidate's build graph.
          - {role: api, context: '.', file: control/Dockerfile, target: api, cache: 'type=registry,ref=ghcr.io/carstvaartjes/vonk-forge-api:buildcache'}
          - {role: hermes, context: deploy/compose/hermes-agent, file: deploy/compose/hermes-agent/Dockerfile, target: managed, cache: 'type=gha,scope=vonk-forge-hermes'}
          - {role: litellm, context: '.', file: deploy/compose/litellm/Dockerfile, target: '', cache: 'type=gha,scope=vonk-forge-litellm'}
    env:
      # Pull requests keep their own Controller build cache so a later push
      # reuses the layers of the previous one; main's cache stays read-only
      # here. CI base image mirrors prunes the caches of closed pull requests.
      PR_CACHE: ghcr.io/carstvaartjes/vonk-forge-api:buildcache-pr-${{ github.event.pull_request.number || 'dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare digest-pinned CI dependency mirrors
        run: scripts/pull-test-images --dockerfile ${{ matrix.file }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Name the dependency layer day
        id: day
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build the native candidate leaf
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/carstvaartjes/vonk-forge-${{ matrix.role }},push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            ai.vonkforge.source.tree=${{ needs.source.outputs.tree }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.day.outputs.value }}
            VONK_BUILD_SOURCE_SHA=${{ needs.source.outputs.sha }}
          # Read the caches populated by main's multi-platform publisher and
          # this pull request's own previous build. Candidate jobs never write
          # the shared production cache scopes.
          cache-from: |
            ${{ matrix.cache }}
            ${{ matrix.role == 'api' && format('type=registry,ref={0}', env.PR_CACHE) || '' }}
          cache-to: ${{ matrix.role == 'api' && format('type=registry,ref={0},mode=max', env.PR_CACHE) || '' }}
      - name: Build the native candidate worker leaf on the shared Controller builder
        if: matrix.role == 'api'
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: worker
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/carstvaartjes/vonk-forge-worker,push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            ai.vonkforge.source.tree=${{ needs.source.outputs.tree }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.day.outputs.value }}
            VONK_BUILD_SOURCE_SHA=${{ needs.source.outputs.sha }}
          cache-from: |
            ${{ matrix.cache }}
            type=registry,ref=${{ env.PR_CACHE }}
      - name: Record the leaf digests
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          ROLE: ${{ matrix.role }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests/$ROLE"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ROLE/$PLATFORM"
          if [[ "$ROLE" == api ]]; then
            [[ "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            mkdir -p "$RUNNER_TEMP/digests/worker"
            printf '%s\n' "$WORKER_DIGEST" > "$RUNNER_TEMP/digests/worker/$PLATFORM"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-leaf-${{ matrix.role }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  images:
    name: Candidate image (${{ matrix.role == 'api' && 'api + worker' || matrix.role }})
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        role: [api, hermes, litellm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-leaf-${{ matrix.role }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: ./.github/actions/apt-install
        with:
          packages: skopeo
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Bind both native leaves into the immutable candidate index
        id: build
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
          SOURCE: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          roles=("$ROLE")
          if [[ "$ROLE" == api ]]; then roles+=(worker); fi
          for role in "${roles[@]}"; do
            repository="ghcr.io/carstvaartjes/vonk-forge-$role"
            tag="$repository:acceptance-$SOURCE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            amd64=$(cat "$RUNNER_TEMP/digests/$role/amd64")
            arm64=$(cat "$RUNNER_TEMP/digests/$role/arm64")
            [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools create --tag "$tag" \
              "$repository@$amd64" "$repository@$arm64"
            digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            # The merged index must carry both platforms and the provenance
            # and SBOM attestation of each leaf, exactly like a published image.
            scripts/verify-published-image "$role" "$repository" "$digest" - "$SOURCE"
            if [[ "$role" == worker ]]; then
              printf 'worker_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            else
              printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Record content identity
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build.outputs.worker_digest }}
          ROLE: ${{ matrix.role }}
          SOURCE: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          printf 'ghcr.io/carstvaartjes/vonk-forge-%s:acceptance-%s-%s-%s@%s\n' \
            "$ROLE" "$SOURCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$DIGEST" \
            > "$RUNNER_TEMP/image/$ROLE"
          if [[ "$ROLE" == api ]]; then
            : "${WORKER_DIGEST:?worker build did not return a digest}"
            printf 'ghcr.io/carstvaartjes/vonk-forge-worker:acceptance-%s-%s-%s@%s\n' \
              "$SOURCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$WORKER_DIGEST" \
              > "$RUNNER_TEMP/image/worker"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-image-${{ matrix.role }}
          path: ${{ runner.temp }}/image
          if-no-files-found: error

  package:
    name: Candidate ARM64 agent packages
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      arm64_package: ${{ steps.package.outputs.arm64_package }}
      arm64_baseline_package: ${{ steps.package.outputs.arm64_baseline_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Install pinned native Rust toolchain
        run: scripts/retry-dependency-fetch rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64-candidate
          add-job-id-key: 'false'
          save-if: 'false'
      - name: Build signed candidate and lower lifecycle baseline
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
          BASELINE_VERSION: ${{ needs.source.outputs.baseline_version }}
          SOURCE: ${{ needs.source.outputs.sha }}
          VONK_SOURCE_REVISION: ${{ needs.source.outputs.sha }}
          VONK_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          rustup default 1.98.1
          scripts/materialize-agent-tools --output-root target
          key="$RUNNER_TEMP/agent-key.pem"
          trap 'rm -f -- "$key"' EXIT
          install -m 0600 /dev/null "$key"
          openssl genpkey -algorithm ED25519 -out "$key"
          epoch=$(git show -s --format=%ct "$SOURCE")
          lock=$(sha256sum Cargo.lock | cut -d' ' -f1)
          for kind in candidate baseline; do
            flags=()
            version=$VERSION
            domain=vonk-agent-build-v2
            out=packages
            if [[ "$kind" == baseline ]]; then
              flags=(--acceptance-baseline)
              version=$BASELINE_VERSION
              domain=vonk-agent-acceptance-baseline-v1
              out=baseline-packages
            fi
            digest="sha256:$(printf '%s\0%s\0%s\0%s\0%s' \
              "$domain" "$SOURCE" linux-arm64 "$lock" "$version" | sha256sum | cut -d' ' -f1)"
            scripts/build-agent-deb "${flags[@]}" --version "$version" \
              --architecture linux-arm64 --build-digest "$digest" \
              --release-private-key "$key" --source-date-epoch "$epoch" \
              --output-dir "$RUNNER_TEMP/$out"
            scripts/verify-agent-deb --json "$RUNNER_TEMP/$out/vonk-forge-agent_${version}_arm64.deb"
          done
          printf 'arm64_package=vonk-forge-agent_%s_arm64.deb\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'arm64_baseline_package=vonk-forge-agent_%s_arm64.deb\n' "$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-agent-package
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-agent-baseline
          path: ${{ runner.temp }}/baseline-packages
          if-no-files-found: error

  setups:
    needs: source
    uses: ./.github/workflows/installer-setups.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      test_trust: true

  compose:
    name: Exact candidate Compose graph
    needs: [source, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Bind the built images by digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compose"
          scripts/render-dev-compose --channel pinned \
            --output "$RUNNER_TEMP/compose/docker-compose.pinned.yml" \
            --api-image "$(cat "$RUNNER_TEMP/images/api")" \
            --worker-image "$(cat "$RUNNER_TEMP/images/worker")" \
            --hermes-image "$(cat "$RUNNER_TEMP/images/hermes")" \
            --litellm-image "$(cat "$RUNNER_TEMP/images/litellm")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-compose
          path: ${{ runner.temp }}/compose
          if-no-files-found: error

  candidate:
    needs: [source, package, setups, compose]
    uses: ./.github/workflows/installer-candidate.yml
    permissions:
      actions: write
      contents: read
    with:
      premerge: true
      channel: dev
      source_sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
      authority_ref: ''
      tag_oid: ''
      setup_source_sha: ${{ needs.source.outputs.sha }}
      setup_run_id: ${{ github.run_id }}
      package_artifact: acceptance-agent-package
      package_run_id: ${{ github.run_id }}
      baseline_artifact: acceptance-agent-baseline
      compose_artifact: acceptance-compose
      compose_run_id: ${{ github.run_id }}
      compose_source_sha: ${{ needs.source.outputs.sha }}
      arm64_package: ${{ needs.package.outputs.arm64_package }}
      arm64_baseline_package: ${{ needs.package.outputs.arm64_baseline_package }}

  acceptance:
    name: Release acceptance
    needs: [source, candidate]
    uses: ./.github/workflows/release-acceptance-core.yml
    permissions:
      actions: write
      contents: read
      packages: read
    with:
      premerge: true
      channel: dev
      source_sha: ${{ needs.source.outputs.sha }}
      version: ${{ needs.source.outputs.version }}
      generation: ${{ needs.candidate.outputs.generation }}
      upgrade_carry: ${{ inputs.upgrade_carry }}
