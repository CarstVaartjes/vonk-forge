name: Rust Vonk Forge agent development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vonk-forge-agent-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-metadata:
    name: Derive development package metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      next_version: ${{ steps.metadata.outputs.next_version }}
      package: ${{ steps.metadata.outputs.package }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current main tip
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main
          main_sha=$(git rev-parse --verify refs/remotes/origin/main^{commit})
          test "$GITHUB_SHA" = "$main_sha"
      - name: Derive immutable development package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          scripts/agent-package-metadata \
            development "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" "$epoch" \
            >> "$GITHUB_OUTPUT"

  build-test-sign:
    name: Build, lifecycle-test, and sign ARM64 package
    if: needs.package-metadata.result == 'success'
    needs: [package-metadata]
    uses: ./.github/workflows/agent-package-build.yml
    with:
      channel: ${{ needs.package-metadata.outputs.channel }}
      version: ${{ needs.package-metadata.outputs.version }}
      next_version: ${{ needs.package-metadata.outputs.next_version }}
      package: ${{ needs.package-metadata.outputs.package }}
      artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
      environment: agent-development
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

  publish-apt:
    name: Publish accepted development package to apt dev
    needs: [package-metadata, build-test-sign]
    uses: ./.github/workflows/agent-apt-publish.yml
    with:
      channel: ${{ needs.package-metadata.outputs.channel }}
      version: ${{ needs.build-test-sign.outputs.version }}
      package: ${{ needs.build-test-sign.outputs.package }}
      artifact_name: ${{ needs.build-test-sign.outputs.artifact_name }}
      environment: apt-development
      source_sha: ${{ github.sha }}
    permissions:
      contents: read
