name: Rust Vonk Forge agent development

# Called by the release workflow (installer-publication.yml), which owns the
# trigger, concurrency and the decision whether this producer must run. The
# development package version ends in ~dev.<seconds>+g<sha>: the source
# commit's committer time (scripts/dev-publication-sequence).
on:
  workflow_call:
    inputs:
      # The successful pull request CI run that tested this exact source tree
      # (scripts/resolve-tested-ci), or empty. When it accepted agent packages,
      # they are unsealed and sealed for main instead of compiled again.
      reuse_run_id:
        type: string
        default: ""
    outputs:
      version:
        description: Exact accepted development package version
        value: ${{ jobs.build-test-sign.outputs.version || jobs.seal-pr-packages.outputs.version }}
      arm64_package:
        description: Exact accepted ARM64 Debian package filename
        value: ${{ jobs.build-test-sign.outputs.arm64_package || jobs.seal-pr-packages.outputs.arm64_package }}
      artifact_name:
        description: Immutable accepted package artifact name
        value: ${{ jobs.build-test-sign.outputs.artifact_name || jobs.seal-pr-packages.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  package-metadata:
    name: Derive development package metadata
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      next_version: ${{ steps.metadata.outputs.next_version }}
      baseline_version: ${{ steps.metadata.outputs.baseline_version }}
      arm64_package: ${{ steps.metadata.outputs.arm64_package }}
      arm64_baseline_package: ${{ steps.metadata.outputs.arm64_baseline_package }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      baseline_artifact_name: ${{ steps.metadata.outputs.baseline_artifact_name }}
      channel: ${{ steps.metadata.outputs.channel }}
      sequence: ${{ steps.metadata.outputs.sequence }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the commit is on main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Derive immutable development package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          sequence=$(scripts/dev-publication-sequence "$GITHUB_SHA")
          printf 'sequence=%s\n' "$sequence" >> "$GITHUB_OUTPUT"
          scripts/agent-package-metadata \
            development "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" "$sequence" \
            >> "$GITHUB_OUTPUT"
      - name: Find the agent packages the identical pull request accepted
        id: reuse
        if: inputs.reuse_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          # Absent or unreadable evidence builds the packages here, as before.
          names=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name' || true)
          if grep -qx acceptance-agent-package <<< "$names" \
            && grep -qx acceptance-agent-baseline <<< "$names"; then
            printf 'run_id=%s\n' "$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Agent packages are sealed from pull request run $RUN_ID for the identical Git tree" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Agent packages are built: pull request run $RUN_ID has no accepted packages" >> "$GITHUB_STEP_SUMMARY"
          fi

  compile-arm64-candidate:
    name: Compile ARM64 candidate package binaries
    if: >-
      needs.package-metadata.result == 'success' &&
      needs.package-metadata.outputs.reuse_run_id == ''
    needs: [package-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact ARM64 candidate compilation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile exact ARM64 candidate binaries
        uses: ./.github/actions/agent-package-compile
        with:
          architecture: linux-arm64
          binary_set: candidate
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ needs.package-metadata.outputs.sequence }}
          version: ${{ needs.package-metadata.outputs.version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          source_sha: ${{ github.sha }}

  compile-arm64-baseline:
    name: Compile ARM64 baseline package binaries
    if: >-
      needs.package-metadata.result == 'success' &&
      needs.package-metadata.outputs.reuse_run_id == ''
    needs: [package-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact ARM64 baseline compilation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile exact ARM64 baseline binaries
        uses: ./.github/actions/agent-package-compile
        with:
          architecture: linux-arm64
          binary_set: baseline
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ needs.package-metadata.outputs.sequence }}
          version: ${{ needs.package-metadata.outputs.version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          source_sha: ${{ github.sha }}

  build-test-sign:
    name: Build, sign, and lifecycle-test ARM64 Spark agent
    if: >-
      needs.package-metadata.result == 'success' &&
      needs.package-metadata.outputs.reuse_run_id == '' &&
      needs.compile-arm64-candidate.result == 'success' &&
      needs.compile-arm64-baseline.result == 'success'
    needs:
      - package-metadata
      - compile-arm64-candidate
      - compile-arm64-baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: agent-development
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      arm64_package: ${{ steps.package.outputs.arm64_package }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      baseline_version: ${{ steps.package.outputs.baseline_version }}
      arm64_baseline_package: ${{ steps.package.outputs.arm64_baseline_package }}
      baseline_artifact_name: ${{ steps.package.outputs.baseline_artifact_name }}
    steps:
      - name: Check out exact package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact ARM64 compiled binary sets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.package-metadata.outputs.artifact_name }}-compiled-arm64-*
          path: prebuilt/arm64
          merge-multiple: true
      - name: Build, lifecycle-test, and attest ARM64 package
        id: package
        uses: ./.github/actions/agent-package-build
        with:
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ needs.package-metadata.outputs.sequence }}
          version: ${{ needs.package-metadata.outputs.version }}
          next_version: ${{ needs.package-metadata.outputs.next_version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          arm64_package: ${{ needs.package-metadata.outputs.arm64_package }}
          arm64_baseline_package: ${{ needs.package-metadata.outputs.arm64_baseline_package }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          baseline_artifact_name: ${{ needs.package-metadata.outputs.baseline_artifact_name }}
          environment: agent-development
          source_sha: ${{ github.sha }}
          tag_name: ''
          tag_oid: ''
          expected_fingerprint: ${{ vars.VONK_AGENT_RELEASE_KEY_FINGERPRINT }}
          release_private_key: ${{ secrets.VONK_AGENT_RELEASE_PRIVATE_KEY }}
          security_gate_mode: external
          binary_source_mode: prebuilt
          lifecycle_gate_mode: external
      - name: Record the package set versions
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
          BASELINE_VERSION: ${{ steps.package.outputs.baseline_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/versions"
          scripts/agent-package-versions write "$VERSION" "$BASELINE_VERSION" \
            "$RUNNER_TEMP/versions/versions.txt"
      - name: Upload the package set versions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.package-metadata.outputs.artifact_name }}-versions
          if-no-files-found: error
          overwrite: false
          retention-days: 90
          path: ${{ runner.temp }}/versions/versions.txt

  security-gates:
    name: Run Rust and package security gates
    if: >-
      needs.package-metadata.result == 'success' &&
      needs.package-metadata.outputs.reuse_run_id == ''
    needs: [package-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact security source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate main security source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy,rustfmt
          rustup default 1.98.1
      - name: Restore read-only Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64
          add-job-id-key: "false"
          save-if: "false"
      - name: Run unchanged agent package security gates
        uses: ./.github/actions/agent-package-security

  native-arm64-lifecycle:
    name: Lifecycle-test accepted ARM64 package on ARM64
    # The built or the sealed pull request package set, whichever exists.
    if: >-
      !cancelled() &&
      (needs.build-test-sign.result == 'success' ||
       needs.seal-pr-packages.result == 'success')
    needs: [package-metadata, build-test-sign, seal-pr-packages]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact ARM64 package acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Pydantic contracts for Cargo builds
        uses: ./.github/actions/python-env
      - name: Revalidate main ARM64 acceptance source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install pinned Rust toolchain for the historical helper fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.98.1
          rustup default 1.98.1
      - name: Download accepted ARM64 package set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-test-sign.outputs.artifact_name || needs.seal-pr-packages.outputs.artifact_name }}
          path: accepted
      - name: Download immutable acceptance baseline packages for ARM64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-test-sign.outputs.baseline_artifact_name || needs.seal-pr-packages.outputs.baseline_artifact_name }}
          path: baseline
      - name: Exercise accepted ARM64 package and recovery gates natively
        shell: bash
        env:
          ARM64_PACKAGE: ${{ needs.build-test-sign.outputs.arm64_package || needs.seal-pr-packages.outputs.arm64_package }}
          ARM64_BASELINE_PACKAGE: ${{ needs.build-test-sign.outputs.arm64_baseline_package || needs.seal-pr-packages.outputs.arm64_baseline_package }}
          BASELINE_VERSION: ${{ needs.build-test-sign.outputs.baseline_version || needs.seal-pr-packages.outputs.baseline_version }}
          VERSION: ${{ needs.build-test-sign.outputs.version || needs.seal-pr-packages.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          scripts/verify-agent-deb --json "accepted/$ARM64_PACKAGE"
          scripts/verify-agent-deb --json "baseline/$ARM64_BASELINE_PACKAGE"
          scripts/ci-apt-install \
            crun fuse-overlayfs iproute2 iptables podman shellcheck slirp4netns uidmap
          shellcheck \
            packaging/bin/vonk-forge-docker-firewall \
            scripts/test-agent-package-native-lifecycle \
            tests/scripts/test_docker_firewall.sh \
            tests/nodes/test_agent_package_native_lifecycle.sh \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo tests/scripts/test_docker_firewall.sh
          tests/nodes/test_agent_package_native_lifecycle.sh
          RUSTFLAGS='-C target-feature=+crt-static' \
            cargo build --locked --release --package vonk-build-egress
          build_egress=$(realpath target/release/vonk-build-egress)
          build_egress_staged="$build_egress.root-owned"
          sudo install -o root -g root -m 0755 \
            "$build_egress" "$build_egress_staged"
          sudo mv -f "$build_egress_staged" "$build_egress"
          test "$(stat -c %u:%g:%a:%h "$build_egress")" = 0:0:755:1
          compatibility_cargo_dir=$(dirname "$(command -v cargo)")
          compatibility_cargo_home=$(dirname "$compatibility_cargo_dir")
          compatibility_rustup_home=$(rustup show home)
          sudo env \
            PATH="$compatibility_cargo_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            CARGO_HOME="$compatibility_cargo_home" \
            RUSTUP_HOME="$compatibility_rustup_home" \
            BUILD_EGRESS_BINARY="$build_egress" \
            VERSION="$VERSION" \
            CRASH_MODE=full-cgroup \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo env BUILD_EGRESS_BINARY="$build_egress" \
            VERSION="$VERSION" \
            CRASH_MODE=dpkg-only \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo env BUILD_EGRESS_BINARY="$build_egress" \
            VERSION="$VERSION" \
            CRASH_MODE=post-remove \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo scripts/test-agent-package-native-lifecycle \
            linux-arm64 \
            "$(realpath "baseline/$ARM64_BASELINE_PACKAGE")" \
            "$(realpath "accepted/$ARM64_PACKAGE")" \
            "$BASELINE_VERSION" "$VERSION"

  seal-pr-packages:
    name: Seal the agent packages the identical pull request accepted
    # The pull request built and accepted these exact packages from this Git
    # tree with its disposable key. Unsealing recovers exactly the unsealed
    # packages it built (scripts/seal-agent-deb); sealing them with the
    # release key adds only the trust material. Signing, attestation and the
    # native lifecycle test below run on the sealed result as for a build.
    if: >-
      needs.package-metadata.result == 'success' &&
      needs.package-metadata.outputs.reuse_run_id != ''
    needs: [package-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: agent-development
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.seal.outputs.version }}
      arm64_package: ${{ steps.seal.outputs.arm64_package }}
      artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
      baseline_version: ${{ steps.seal.outputs.baseline_version }}
      arm64_baseline_package: ${{ steps.seal.outputs.arm64_baseline_package }}
      baseline_artifact_name: ${{ needs.package-metadata.outputs.baseline_artifact_name }}
    steps:
      - name: Check out exact package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit is on main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Seal, sign, attest and upload the accepted packages
        id: seal
        uses: ./.github/actions/agent-package-seal
        with:
          reuse_run_id: ${{ needs.package-metadata.outputs.reuse_run_id }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          baseline_artifact_name: ${{ needs.package-metadata.outputs.baseline_artifact_name }}
          expected_fingerprint: ${{ vars.VONK_AGENT_RELEASE_KEY_FINGERPRINT }}
          release_private_key: ${{ secrets.VONK_AGENT_RELEASE_PRIVATE_KEY }}
          artifact_token: ${{ github.token }}
