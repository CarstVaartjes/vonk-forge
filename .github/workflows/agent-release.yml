name: Rust Vonk Forge agent development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-metadata:
    name: Derive development package metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      next_version: ${{ steps.metadata.outputs.next_version }}
      baseline_version: ${{ steps.metadata.outputs.baseline_version }}
      arm64_package: ${{ steps.metadata.outputs.arm64_package }}
      amd64_package: ${{ steps.metadata.outputs.amd64_package }}
      arm64_baseline_package: ${{ steps.metadata.outputs.arm64_baseline_package }}
      amd64_baseline_package: ${{ steps.metadata.outputs.amd64_baseline_package }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      baseline_artifact_name: ${{ steps.metadata.outputs.baseline_artifact_name }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact current main tip
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main
          main_sha=$(git rev-parse --verify refs/remotes/origin/main^{commit})
          test "$GITHUB_SHA" = "$main_sha"
      - name: Derive immutable development package metadata
        id: metadata
        shell: bash
        env:
          PUBLICATION_SEQUENCE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test "$PUBLICATION_SEQUENCE" = "$GITHUB_RUN_NUMBER"
          scripts/agent-package-metadata \
            development "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" "$PUBLICATION_SEQUENCE" \
            >> "$GITHUB_OUTPUT"

  compile-arm64-candidate:
    name: Compile ARM64 candidate package binaries
    if: needs.package-metadata.result == 'success'
    needs: [package-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    concurrency:
      group: vonk-forge-agent-development-compile-arm64-candidate
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out exact ARM64 candidate compilation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile exact ARM64 candidate binaries
        uses: ./.github/actions/agent-package-compile
        with:
          architecture: linux-arm64
          binary_set: candidate
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ github.run_number }}
          version: ${{ needs.package-metadata.outputs.version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          source_sha: ${{ github.sha }}

  compile-arm64-baseline:
    name: Compile ARM64 baseline package binaries
    if: needs.package-metadata.result == 'success'
    needs: [package-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    concurrency:
      group: vonk-forge-agent-development-compile-arm64-baseline
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out exact ARM64 baseline compilation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile exact ARM64 baseline binaries
        uses: ./.github/actions/agent-package-compile
        with:
          architecture: linux-arm64
          binary_set: baseline
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ github.run_number }}
          version: ${{ needs.package-metadata.outputs.version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          source_sha: ${{ github.sha }}

  compile-amd64-candidate:
    name: Compile AMD64 candidate package binaries
    if: needs.package-metadata.result == 'success'
    needs: [package-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: vonk-forge-agent-development-compile-amd64-candidate
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out exact AMD64 candidate compilation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile exact AMD64 candidate binaries
        uses: ./.github/actions/agent-package-compile
        with:
          architecture: linux-amd64
          binary_set: candidate
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ github.run_number }}
          version: ${{ needs.package-metadata.outputs.version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          source_sha: ${{ github.sha }}

  compile-amd64-baseline:
    name: Compile AMD64 baseline package binaries
    if: needs.package-metadata.result == 'success'
    needs: [package-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: vonk-forge-agent-development-compile-amd64-baseline
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out exact AMD64 baseline compilation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile exact AMD64 baseline binaries
        uses: ./.github/actions/agent-package-compile
        with:
          architecture: linux-amd64
          binary_set: baseline
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ github.run_number }}
          version: ${{ needs.package-metadata.outputs.version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          source_sha: ${{ github.sha }}

  build-test-sign:
    name: Build and sign AMD64 and ARM64; lifecycle-test ARM64
    if: >-
      needs.package-metadata.result == 'success' &&
      needs.compile-arm64-candidate.result == 'success' &&
      needs.compile-arm64-baseline.result == 'success' &&
      needs.compile-amd64-candidate.result == 'success' &&
      needs.compile-amd64-baseline.result == 'success'
    needs:
      - package-metadata
      - compile-arm64-candidate
      - compile-arm64-baseline
      - compile-amd64-candidate
      - compile-amd64-baseline
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: agent-development
    concurrency:
      group: vonk-forge-agent-development-package
      cancel-in-progress: true
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      arm64_package: ${{ steps.package.outputs.arm64_package }}
      amd64_package: ${{ steps.package.outputs.amd64_package }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      baseline_version: ${{ steps.package.outputs.baseline_version }}
      arm64_baseline_package: ${{ steps.package.outputs.arm64_baseline_package }}
      amd64_baseline_package: ${{ steps.package.outputs.amd64_baseline_package }}
      baseline_artifact_name: ${{ steps.package.outputs.baseline_artifact_name }}
    steps:
      - name: Check out exact package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact ARM64 compiled binary sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.package-metadata.outputs.artifact_name }}-compiled-arm64-*
          path: prebuilt/arm64
          merge-multiple: true
      - name: Download exact AMD64 compiled binary sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.package-metadata.outputs.artifact_name }}-compiled-amd64-*
          path: prebuilt/amd64
          merge-multiple: true
      - name: Build, lifecycle-test, and attest AMD64 and ARM64 packages
        id: package
        uses: ./.github/actions/agent-package-build
        with:
          channel: ${{ needs.package-metadata.outputs.channel }}
          publication_sequence: ${{ github.run_number }}
          version: ${{ needs.package-metadata.outputs.version }}
          next_version: ${{ needs.package-metadata.outputs.next_version }}
          baseline_version: ${{ needs.package-metadata.outputs.baseline_version }}
          arm64_package: ${{ needs.package-metadata.outputs.arm64_package }}
          amd64_package: ${{ needs.package-metadata.outputs.amd64_package }}
          arm64_baseline_package: ${{ needs.package-metadata.outputs.arm64_baseline_package }}
          amd64_baseline_package: ${{ needs.package-metadata.outputs.amd64_baseline_package }}
          artifact_name: ${{ needs.package-metadata.outputs.artifact_name }}
          baseline_artifact_name: ${{ needs.package-metadata.outputs.baseline_artifact_name }}
          environment: agent-development
          source_sha: ${{ github.sha }}
          tag_name: ''
          tag_oid: ''
          expected_fingerprint: ${{ vars.VONK_AGENT_RELEASE_KEY_FINGERPRINT }}
          release_private_key: ${{ secrets.VONK_AGENT_RELEASE_PRIVATE_KEY }}
          security_gate_mode: external
          binary_source_mode: prebuilt
          lifecycle_gate_mode: external

  security-gates:
    name: Run Rust and package security gates
    if: needs.package-metadata.result == 'success'
    needs: [package-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    concurrency:
      group: vonk-forge-agent-development-security
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out exact security source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate exact current main security source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy,rustfmt
          rustup default 1.97.1
      - name: Restore read-only Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64
          add-job-id-key: "false"
          save-if: "false"
      - name: Run unchanged agent package security gates
        uses: ./.github/actions/agent-package-security

  native-arm64-lifecycle:
    name: Lifecycle-test accepted ARM64 package on ARM64
    needs: [package-metadata, build-test-sign]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact ARM64 package acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate exact current main ARM64 acceptance source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
      - name: Install pinned Rust toolchain for the historical helper fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Download accepted dual-architecture package set for ARM64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-test-sign.outputs.artifact_name }}
          path: accepted
      - name: Download immutable acceptance baseline packages for ARM64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-test-sign.outputs.baseline_artifact_name }}
          path: baseline
      - name: Exercise accepted ARM64 package and recovery gates natively
        shell: bash
        env:
          ARM64_PACKAGE: ${{ needs.build-test-sign.outputs.arm64_package }}
          ARM64_BASELINE_PACKAGE: ${{ needs.build-test-sign.outputs.arm64_baseline_package }}
          BASELINE_VERSION: ${{ needs.build-test-sign.outputs.baseline_version }}
          VERSION: ${{ needs.build-test-sign.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          scripts/verify-agent-deb --json "accepted/$ARM64_PACKAGE"
          scripts/verify-agent-deb --json "baseline/$ARM64_BASELINE_PACKAGE"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fuse-overlayfs iproute2 iptables podman shellcheck slirp4netns uidmap
          shellcheck \
            packaging/bin/vonk-forge-docker-firewall \
            scripts/test-agent-package-native-lifecycle \
            tests/scripts/test_docker_firewall.sh \
            tests/nodes/test_agent_package_native_lifecycle.sh \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo tests/scripts/test_docker_firewall.sh
          tests/nodes/test_agent_package_native_lifecycle.sh
          RUSTFLAGS='-C target-feature=+crt-static' \
            cargo build --locked --release --package vonk-build-egress
          build_egress=$(realpath target/release/vonk-build-egress)
          build_egress_staged="$build_egress.root-owned"
          sudo install -o root -g root -m 0755 \
            "$build_egress" "$build_egress_staged"
          sudo mv -f "$build_egress_staged" "$build_egress"
          test "$(stat -c %u:%g:%a:%h "$build_egress")" = 0:0:755:1
          compatibility_cargo_dir=$(dirname "$(command -v cargo)")
          compatibility_cargo_home=$(dirname "$compatibility_cargo_dir")
          compatibility_rustup_home=$(rustup show home)
          sudo env \
            PATH="$compatibility_cargo_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            CARGO_HOME="$compatibility_cargo_home" \
            RUSTUP_HOME="$compatibility_rustup_home" \
            BUILD_EGRESS_BINARY="$build_egress" \
            VERSION="$VERSION" \
            CRASH_MODE=full-cgroup \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo env BUILD_EGRESS_BINARY="$build_egress" \
            VERSION="$VERSION" \
            CRASH_MODE=dpkg-only \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo env BUILD_EGRESS_BINARY="$build_egress" \
            VERSION="$VERSION" \
            CRASH_MODE=post-remove \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo scripts/test-agent-package-native-lifecycle \
            linux-arm64 \
            "$(realpath "baseline/$ARM64_BASELINE_PACKAGE")" \
            "$(realpath "accepted/$ARM64_PACKAGE")" \
            "$BASELINE_VERSION" "$VERSION"

  native-amd64-lifecycle:
    name: Lifecycle-test accepted AMD64 package on AMD64
    needs: [package-metadata, build-test-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact package acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download accepted dual-architecture package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-test-sign.outputs.artifact_name }}
          path: accepted
      - name: Exercise accepted AMD64 package natively
        shell: bash
        env:
          AMD64_PACKAGE: ${{ needs.build-test-sign.outputs.amd64_package }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            acl iproute2 iptables podman shellcheck slirp4netns uidmap
          package="accepted/$AMD64_PACKAGE"
          scripts/verify-agent-deb --json "$package"
          sudo env SYSTEMD_OFFLINE=1 dpkg -i "$package"
          test "$(/usr/lib/vonk-forge/vonk-agent --version)" = \
            "vonk-agent $(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          sudo env SYSTEMD_OFFLINE=1 dpkg --remove vonk-forge-agent
