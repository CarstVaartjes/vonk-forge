name: Installer publication source

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Bind changed publication and acceptance source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact current main source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
