name: CI

# Pushes to main and release tags run this suite through the release workflow
# (installer-publication.yml), which calls it and gates publication on it.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Dependency fetches retry transient network failures inside the tool; the
# pre-sync steps below additionally run under scripts/retry-dependency-fetch.
env:
  UV_HTTP_TIMEOUT: "60"
  UV_HTTP_RETRIES: "5"
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_TIMEOUT: "60"
  npm_config_fetch_retries: "5"
  # Exhaustive sweeps run a fixed share on pull-request and merge-queue runs;
  # main's release run and every other caller sweep the full corpus.
  VONK_TEST_TIER: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'pr' || 'full' }}

# A new commit supersedes an older PR check. Every other run, including a
# release workflow call, has its own group: the caller owns its cancellation.
concurrency:
  group: vonk-forge-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  changes:
    name: Select CI integration dependencies
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      repository: ${{ steps.areas.outputs.repository }}
      control: ${{ steps.areas.outputs.control }}
      web: ${{ steps.areas.outputs.web }}
      compose: ${{ steps.areas.outputs.compose }}
      generated: ${{ steps.areas.outputs.generated }}
      nas_install: ${{ steps.areas.outputs.nas_install }}
      agent_package: ${{ steps.areas.outputs.agent_package }}
      lane: ${{ steps.areas.outputs.lane }}
      upgrade_carry: ${{ steps.areas.outputs.upgrade_carry }}
      repository_timings: ${{ steps.timings.outputs.repository }}
      control_timings: ${{ steps.timings.outputs.control }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select transitive integration dependencies
        id: areas
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A merge-queue run has no pull request diff: compare the queued
          # commit with the queue's base commit instead.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            BASE_SHA="$MERGE_GROUP_BASE_SHA"
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            # The tested commit is a merge onto the base: comparing the two
            # trees needs those two commits, not the repository history.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" |
              scripts/select-ci-areas --event "$GITHUB_EVENT_NAME" --github-output \
                >> "$GITHUB_OUTPUT"
          else
            scripts/select-ci-areas --event "$GITHUB_EVENT_NAME" \
              --github-output </dev/null >> "$GITHUB_OUTPUT"
          fi

      - name: Restore measured pytest durations
        id: timings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_SELECTED: ${{ steps.areas.outputs.repository }}
          CONTROL_SELECTED: ${{ steps.areas.outputs.control }}
        run: |
          set -euo pipefail
          for suite in repository control; do
            selected_name="${suite^^}_SELECTED"
            timing_file="$RUNNER_TEMP/$suite-durations.json"
            if [[ "${!selected_name}" == true ]]; then
              scripts/restore-pytest-file-durations \
                --repo "$GITHUB_REPOSITORY" --suite "$suite" \
                --current-run-id "$GITHUB_RUN_ID" --output "$timing_file"
            else
              printf '{}\n' > "$timing_file"
            fi
            compact=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' "$timing_file")
            printf '%s=%s\n' "$suite" "$compact" >> "$GITHUB_OUTPUT"
          done

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: python
          cli-dependencies: "false"
      - name: Reject new principle violations on added lines
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The tested commit merges the change onto the base, so the base is
          # the merge base: the two trees are enough, no history is read.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c core.quotePath=false diff --no-ext-diff --unified=0 "$BASE_SHA" -- \
            control agent_protocol src scripts rust deploy packaging |
            scripts/check-added-lines

      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run --project control --frozen ruff check .
          uv run --project control --frozen ruff format --check .
      - name: Check Python types
        shell: bash
        run: scripts/check-python-types

  supply-chain:
    name: Supply-chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build generated release inputs from locked dependencies; no generated
      # inventory files are checked into the source tree.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: agent_protocol/pyproject.toml
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Build protocol wheel and verify Controller lock hash
        run: scripts/build-control-wheel
      - name: Include protocol wheel with generated release evidence
        run: |
          mkdir -p "$RUNNER_TEMP/supply-chain"
          cp inventory/wheels/vonk_agent_protocol-4.1.0-py3-none-any.whl "$RUNNER_TEMP/supply-chain/"
      - name: Verify supply-chain evidence
        run: scripts/verify-supply-chain --output-dir "$RUNNER_TEMP/supply-chain" --json
      - name: Preserve verified SBOMs and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/supply-chain
          if-no-files-found: error
          retention-days: 30

  rust-quality:
    name: Rust workspace lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Pydantic contracts for Cargo builds
        uses: ./.github/actions/python-env
        with:
          contracts: none
          cli-dependencies: "false"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          scripts/retry-dependency-fetch rustup toolchain install 1.98.1 --component clippy,rustfmt
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Verify Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust workspace tests
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Pydantic contracts for Cargo builds
        uses: ./.github/actions/python-env
        with:
          contracts: none
          cli-dependencies: "false"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          # rustfmt formats generated wire types during build.
          scripts/retry-dependency-fetch rustup toolchain install 1.98.1 --component rustfmt
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Check deterministic wire generation
        run: scripts/check-generated-determinism --wire
      - name: Test complete Rust shard
        shell: bash
        env:
          # Concurrent subprocess fixtures can inherit another test's flock
          # until exec, making an immediately fresh cache attempt spuriously busy.
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --locked

  controller-spark-wire:
    name: Controller and Spark wire contract
    needs: changes
    if: needs.changes.outputs.control == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provide the canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Build recipe library index and packages
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Install pinned Rust toolchain
        run: scripts/retry-dependency-fetch rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Generate the Rust wire peers for the installed protocol tests
        run: scripts/generate-agent-wire
      - name: Exercise the installed protocol wheel on adapter Python
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/protocol-consumer"
          uv venv --python 3.12 "$consumer"
          uv pip install --python "$consumer/bin/python" \
            inventory/wheels/vonk_agent_protocol-4.1.0-py3-none-any.whl \
            'pytest==9.1.1'
          "$consumer/bin/python" -c 'import pathlib, sys, vonk_agent_protocol; assert pathlib.Path(vonk_agent_protocol.__file__).is_relative_to(sys.prefix)'
          # Disable the producer's source pythonpath: these checks must consume
          # the installed wheel. Rust peers run in the connected lane below.
          "$consumer/bin/python" -m pytest -q -c /dev/null -p no:cacheprovider agent_protocol/tests \
            --ignore=agent_protocol/tests/test_schema2_recipe_wire.py \
            --ignore=agent_protocol/tests/test_schema2_recipe_rust_compat.py
      # Keep runner steps serial: even run-only parallel groups can race on
      # GITHUB_EVENT_PATH with later @actions/github consumers. The workflow
      # event-context guard also covers composite actions and artifact uploads.
      - name: Build Rust wire probes
        run: >-
          uv run --project control --frozen
          python scripts/tests/run_agent_wire_contracts.py --build-only
      # The response witness validates every 2xx body these API tests
      # produce against its declared schema; the tests themselves also
      # run in the control suite.
      - name: Witness Controller API responses against their contracts
        run: |
          set -euo pipefail
          uv run --project control --frozen pytest -q \
            control/tests/test_api_response_witness.py \
            control/tests/test_artifact_job_api.py \
            control/tests/test_fleet_profile_api.py::test_profile_operator_routes_are_singular_and_unversioned \
            control/tests/test_fleet_profile_api.py::test_profile_mutation_role_is_declared_for_final_route \
            control/tests/test_production_app_recipe_image_api.py::test_production_app_recipe_download_auth_and_status \
            --api-response-witness="$RUNNER_TEMP/api-response-witnesses.json"
      - name: Attribute catalog wire validation cost with the actual compiled probe
        env:
          VONK_WIRE_PROBE_TIMINGS: "1"
        run: |
          set -euo pipefail
          export VONK_INSTALL_START_WIRE_PROBE="${CARGO_TARGET_DIR:-$PWD/target}/debug/examples/install_start_wire_probe"
          uv run --project control --frozen pytest -s -q -n 0 \
            agent_protocol/tests/test_schema2_recipe_rust_compat.py::test_catalog_launch_payloads_are_accepted_by_python_and_rust
      - name: Exercise Controller requests and Spark results together
        run: >-
          uv run --project control --frozen
          python scripts/tests/run_agent_wire_contracts.py -- -q -n 4 --dist loadfile

  rust-platform:
    name: Rust platform integration
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          scripts/retry-dependency-fetch rustup toolchain install 1.98.1
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Install Spark-compatible rootless Podman
        uses: ./.github/actions/apt-install
        with:
          packages: aptly aardvark-dns crun dbus-user-session fuse-overlayfs netavark podman slirp4netns uidmap
      # Runner-managed parallel steps share GITHUB_EVENT_PATH with later
      # artifact uploads; keep these serial (test_workflow_event_context.py).
      - name: Test bounded aptly state compaction
        env:
          VONK_CI_PREREQUISITES: needs_aptly
        run: >-
          uv run --project control --frozen
          pytest -q tests/scripts/test_agent_apt_compaction_integration.py
      - name: Test Spark rootless Podman OCI import
        run: >-
          cargo test --locked -p vonk-agent --test recipe_builder
          faithful_untagged_oci_layout_loads_with_spark_podman -- --exact
      - name: Verify controller host-helper authority
        run: >-
          uv run --project control --frozen pytest -q
          control/tests/test_host_helper_authority.py
      - name: Record GPU node service exposure
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 artifacts
          scripts/verify-agent-systemd --json \
            | tee artifacts/vonk-forge-systemd-security.json
      - name: Exercise build egress from the hardened agent service
        shell: bash
        run: |
          set -euo pipefail
          # The helper has no dependencies: compile its real source statically
          # without rebuilding the agent dependency graph for a second target.
          rustc --edition=2024 -C target-feature=+crt-static \
            rust/crates/vonk-build-egress/src/main.rs \
            -o "$RUNNER_TEMP/vonk-build-egress"
          rustc --edition=2024 -C target-feature=+crt-static \
            rust/crates/vonk-agent/tests/fixtures/build_network_probe.rs \
            -o "$RUNNER_TEMP/build-network-probe"
          cargo test --locked -p vonk-agent --lib --no-run --message-format=json \
            > "$RUNNER_TEMP/egress-test-build.jsonl"
          test_binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "vonk_agent" and .profile.test) | .executable // empty' \
            "$RUNNER_TEMP/egress-test-build.jsonl")
          test -x "$test_binary"
          sudo useradd --create-home --home-dir /var/lib/vonk-forge-agent vonk-agent
          sudo install -d -o vonk-agent -g vonk-agent /run/vonk-forge-agent
          sudo install -D -m 0644 packaging/config/containers-storage.conf \
            /etc/vonk-forge-agent/containers-storage.conf
          sudo install -d -o vonk-agent -g vonk-agent /var/lib/vonk-forge-agent/.config/containers
          printf '[network]\nnetwork_backend = "netavark"\n' \
            | sudo tee /var/lib/vonk-forge-agent/.config/containers/containers.conf >/dev/null
          sudo install -D -m 0755 "$RUNNER_TEMP/vonk-build-egress" \
            /usr/lib/vonk-forge/vonk-build-egress
          sudo install -D -m 0755 "$RUNNER_TEMP/build-network-probe" \
            /usr/lib/vonk-forge/build-network-probe
          sudo install -D -m 0755 "$test_binary" /usr/lib/vonk-forge/egress-tests
          sudo loginctl enable-linger vonk-agent
          sudo systemctl start "user@$(id -u vonk-agent).service"
          sudo systemd-run --wait --pipe --collect --unit=vonk-egress-regression \
            --property=User=vonk-agent --property=ProtectSystem=strict \
            --property=ProtectHome=no --property='InaccessiblePaths=/home /root' \
            --property=PrivateTmp=yes \
            --property=ProtectKernelTunables=yes --property=ProtectKernelLogs=yes \
            --property='ReadWritePaths=/var/lib/vonk-forge-agent /run/vonk-forge-agent' \
            --property=NoNewPrivileges=no --property=RestrictNamespaces=no \
            /usr/lib/vonk-forge/egress-tests \
            recipe_builder::tests::real_egress_boundary_survives_hardened_agent_and_cleans_up \
            --exact --ignored --nocapture
      - name: Upload GPU node service exposure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vonk-agent-systemd-security-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/vonk-forge-systemd-security.json

  generated-clients:
    name: Generated control clients
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: none
          cli-dependencies: "false"
      - name: Install pinned Node.js with generator dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tools/openapi-client/package-lock.json
      - name: Check deterministic control client generation
        run: scripts/check-generated-determinism

  compose-integration:
    name: Compose integration
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: none
          cli-dependencies: "false"
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the pinned test images once
        run: scripts/pull-test-images postgres caddy tailscale
      - name: Run the complete Compose suite
        run: scripts/test compose

  nas-install:
    # Problems that only release acceptance used to catch (installer output,
    # bundle layout, secret modes and owners, first Controller start, upgrade)
    # fail the pull request instead. It builds the images and the installer
    # from this source and runs the same acceptance code as the release lanes,
    # with no GHCR, R2, signatures or tailnet.
    name: Clean NAS install from source
    needs: changes
    if: needs.changes.outputs.nas_install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_PREFIX: ghcr.io/carstvaartjes/vonk-forge
      IMAGE_TAG: ci-local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: python
          cli-dependencies: "false"
      - name: Build the portable NAS setup wheel from this source
        shell: bash
        run: |
          set -euo pipefail
          uv build --project nas_setup --wheel --out-dir "$RUNNER_TEMP/nas-wheel"
          shopt -s nullglob
          wheels=("$RUNNER_TEMP/nas-wheel/"vonk_nas_setup-*-py3-none-any.whl)
          test "${#wheels[@]}" -eq 1
          printf 'VONK_ACCEPTANCE_LOCAL_SETUP_WHEEL=%s\n' "${wheels[0]}" >> "$GITHUB_ENV"
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare digest-pinned CI dependency mirrors
        run: scripts/pull-test-images --dockerfile control/Dockerfile --dockerfile deploy/compose/hermes-agent/Dockerfile --dockerfile deploy/compose/litellm/Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Name the dependency layer day
        id: dependency_day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build the Controller API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: api
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ env.IMAGE_TAG }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-api
      - name: Build the Controller worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: worker
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ env.IMAGE_TAG }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-worker
      - name: Build the LiteLLM image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/litellm/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-litellm:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=vonk-forge-litellm
      - name: Build the Hermes image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/compose/hermes-agent
          target: managed
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-hermes:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=vonk-forge-hermes
      - name: Render the installer payload and the local image overlay
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nas-local"
          install -d -m 0700 "$out"
          scripts/render-dev-compose --channel pinned \
            --output "$out/docker-compose.pinned.yml" \
            --api-image "$IMAGE_PREFIX-api:$IMAGE_TAG" \
            --worker-image "$IMAGE_PREFIX-worker:$IMAGE_TAG" \
            --hermes-image "$IMAGE_PREFIX-hermes:$IMAGE_TAG" \
            --litellm-image "$IMAGE_PREFIX-litellm:$IMAGE_TAG"
          uv run --project control --frozen python scripts/build-nas-compose-bundle \
            --compose "$out/docker-compose.pinned.yml" --channel dev \
            --output "$out/payload.json"
          # The payload follows the :dev channel and pulls its Vonk images.
          # Point those services at the images just built, never at GHCR.
          {
            echo services:
            for pair in control-api:api control-worker:worker hermes-agent:hermes \
              litellm:litellm hermes-litellm-key-provisioner:litellm; do
              printf '  %s:\n    image: %s-%s:%s\n    pull_policy: never\n' \
                "${pair%%:*}" "$IMAGE_PREFIX" "${pair##*:}" "$IMAGE_TAG"
            done
          } > "$out/overlay.yml"
      - name: Download verified Compose parser fixtures
        shell: bash
        env:
          COMPOSE_LOWER_SHA256: eca30ae32dc451f9e6d6c8ddce078a76f23b355c3ca0ab391d58f59e87c0d310
          COMPOSE_UGREEN_SHA256: a0298760c9772d2c06888fc8703a487c94c3c3b0134adeef830742a2fc7647b4
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/compose-fixtures"
          mkdir -p "$fixture_dir"
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v5.1.3/docker-compose-linux-x86_64 \
            --output "$fixture_dir/docker-compose-v5.1.3"
          printf '%s  %s\n' "$COMPOSE_UGREEN_SHA256" \
            "$fixture_dir/docker-compose-v5.1.3" | sha256sum --check --status
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64 \
            --output "$fixture_dir/docker-compose-v2.24.6"
          printf '%s  %s\n' "$COMPOSE_LOWER_SHA256" \
            "$fixture_dir/docker-compose-v2.24.6" | sha256sum --check --status
          chmod 0755 "$fixture_dir/docker-compose-v5.1.3" \
            "$fixture_dir/docker-compose-v2.24.6"
      - name: Install, start, restart and upgrade a clean NAS bundle
        shell: bash
        env:
          VONK_ACCEPTANCE_COMPOSE_LOWER: ${{ runner.temp }}/compose-fixtures/docker-compose-v2.24.6
          VONK_ACCEPTANCE_COMPOSE_UGREEN: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_REFERENCE_COMPOSE: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_COMPOSE_OVERLAY: ${{ runner.temp }}/nas-local/overlay.yml
          VONK_ACCEPTANCE_SOURCE_SHA: ${{ github.sha }}
          VONK_ACCEPTANCE_LOCAL_PAYLOAD: ${{ runner.temp }}/nas-local/payload.json
          # Not a real key: it only has to be accepted by the installer.
          VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY: sk-pull-request-placeholder
          VONK_ACCEPTANCE_NAS_BIND_IP: 127.0.0.1
          VONK_ACCEPTANCE_NAS_IP: 127.0.0.1
          VONK_ACCEPTANCE_TAILNET_DNS_SUFFIX: acceptance.invalid
          VONK_ACCEPTANCE_TAILSCALE_CONTROL_SERVICE: svc:vonk-forge
          VONK_ACCEPTANCE_TAILSCALE_HERMES_API_SERVICE: svc:hermes-api
          VONK_ACCEPTANCE_TAILSCALE_HERMES_DASHBOARD_SERVICE: svc:hermes-dashboard
          VONK_ACCEPTANCE_TAILSCALE_MODE: disabled
          VONK_ACCEPTANCE_WORKSPACE: ${{ github.workspace }}
        run: scripts/run-with-nas-secret-group uv run --project control --frozen python tests/acceptance/test_fresh_nas_install.py

  agent-package:
    # The package lifecycle script only ran after merge, on push to main.
    # It reads what the agent and the packaging ship, so a change to either
    # can break it. This builds the two packages from this source, signed
    # with a throwaway key, and runs the same script on a native ARM64 runner.
    name: Native ARM64 agent package lifecycle
    needs: changes
    if: needs.changes.outputs.agent_package == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Pydantic contracts for Cargo builds
        uses: ./.github/actions/python-env
        with:
          contracts: none
          cli-dependencies: "false"
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-unknown-linux-gnu
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install lifecycle test dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: crun fuse-overlayfs iproute2 iptables podman shellcheck slirp4netns uidmap
      - name: Materialize pinned package tools
        run: scripts/materialize-agent-tools --output-root target
      - name: Build the baseline and candidate packages
        run: |
          set -euo pipefail
          while IFS='=' read -r name value; do
            declare "$name=$value"
          done < <(scripts/agent-package-metadata development branch main \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER")
          key="$RUNNER_TEMP/throwaway-agent-key.pem"
          openssl genpkey -algorithm ed25519 -out "$key"
          # These packages are never published, so their bytes need not be
          # reproducible: any fixed epoch will do.
          epoch=1700000000
          lock_digest=$(sha256sum Cargo.lock | cut -d' ' -f1)
          digest() {
            printf '%s\0%s\0%s\0%s\0%s' "$1" "$GITHUB_SHA" linux-arm64 "$lock_digest" "$2" \
              | sha256sum | cut -d' ' -f1
          }
          export VONK_SOURCE_REVISION="$GITHUB_SHA"
          export VONK_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          scripts/build-agent-deb --version "$version" --architecture linux-arm64 \
            --build-digest "sha256:$(digest vonk-agent-build-v2 "$version")" \
            --release-private-key "$key" --source-date-epoch "$epoch" \
            --output-dir dist
          scripts/build-agent-deb --acceptance-baseline \
            --version "$baseline_version" --architecture linux-arm64 \
            --build-digest "sha256:$(digest vonk-agent-acceptance-baseline-v1 "$baseline_version")" \
            --release-private-key "$key" --source-date-epoch "$epoch" \
            --output-dir baseline
          rm -f "$key"
          {
            echo "VERSION=$version"
            echo "BASELINE_VERSION=$baseline_version"
          } >> "$GITHUB_ENV"
      - name: Run the systemd upgrade-recovery fixtures
        # Runs before the lifecycle script, which leaves host state the
        # fixtures refuse to start over. The release gate runs these too; without them here a fixture race or
        # regression only surfaces on main.
        run: |
          set -euo pipefail
          RUSTFLAGS='-C target-feature=+crt-static' \
            cargo build --locked --release --package vonk-build-egress
          build_egress=$(realpath target/release/vonk-build-egress)
          sudo install -o root -g root -m 0755 "$build_egress" "$build_egress.root-owned"
          sudo mv -f "$build_egress.root-owned" "$build_egress"
          cargo_dir=$(dirname "$(command -v cargo)")
          cargo_home=$(dirname "$cargo_dir")
          for mode in full-cgroup dpkg-only post-remove; do
            sudo env \
              PATH="$cargo_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              CARGO_HOME="$cargo_home" RUSTUP_HOME="$(rustup show home)" \
              BUILD_EGRESS_BINARY="$build_egress" VERSION="$VERSION" \
              CRASH_MODE="$mode" tests/nodes/test_agent_upgrade_recovery_systemd.sh
          done
      - name: Prove source-bound package activation and rollback
        run: |
          set -euo pipefail
          cargo build --locked --package vonk-agent-helper \
            --bin vonk-agent-helper --example package_rollback_probe
          sudo python3 tests/nodes/test_agent_package_rollback_systemd.py \
            --disposable-systemd \
            --helper "$(realpath target/debug/vonk-agent-helper)" \
            --probe "$(realpath target/debug/examples/package_rollback_probe)" \
            | tee package-rollback-acceptance.json
      - name: Prove agent boot recovery after transient host readiness failures
        run: |
          set -euo pipefail
          sudo python3 tests/nodes/test_agent_boot_restart_systemd.py \
            --disposable-systemd \
            | tee agent-boot-recovery-acceptance.json
      - name: Run the native package lifecycle
        run: |
          set -euo pipefail
          sudo scripts/test-agent-package-native-lifecycle linux-arm64 \
            "$(realpath "baseline/vonk-forge-agent_${BASELINE_VERSION}_arm64.deb")" \
            "$(realpath "dist/vonk-forge-agent_${VERSION}_arm64.deb")" \
            "$BASELINE_VERSION" "$VERSION"

  repository-guards:
    name: Repository guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          cli-dependencies: "false"
      - name: Install shell guard prerequisite
        uses: ./.github/actions/apt-install
        with:
          packages: shellcheck
      - name: Run reviewed repository guards
        shell: bash
        run: |
          set -euo pipefail
          guard_list="$RUNNER_TEMP/repository-guards.txt"
          python3 scripts/repository-guards > "$guard_list"
          mapfile -t guards < "$guard_list"
          uv run --project control --frozen python -m pytest -q -p no:cacheprovider -n 0 "${guards[@]}"

  repository-suite:
    name: Complete repository suite (${{ matrix.shard.label }})
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: 1-of-2}
          - {index: 1, label: 2-of-2}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provide the canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Build recipe library index and packages
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Install supported completion shells
        uses: ./.github/actions/apt-install
        with:
          packages: zsh
      - name: List the tests this change adds or touches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c core.quotePath=false diff --no-ext-diff --unified=0 "$BASE_SHA" -- \
            tests control/tests deploy/compose/tests |
            uv run --project control --frozen scripts/changed-tests > "$RUNNER_TEMP/changed-tests.txt"
      - name: Run complete repository suite
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard.index }}
          SHARD_TOTAL: 2
          TIMING_DATA: ${{ needs.changes.outputs.repository_timings }}
          VONK_SYNTHETIC_CANARY_INDEX: tests/fixtures/canonical-synthetic-canary/index.json
        run: |
          set -euo pipefail
          timing_file="$RUNNER_TEMP/pytest-durations.json"
          printf '%s\n' "$TIMING_DATA" > "$timing_file"
          enforce=()
          if [[ -f "$RUNNER_TEMP/changed-tests.txt" ]]; then
            enforce=(--test-budget-enforce "$RUNNER_TEMP/changed-tests.txt")
          fi
          scripts/test repository --shard "$((SHARD_INDEX + 1))/$SHARD_TOTAL" \
            --durations "$timing_file" -- "${enforce[@]}" \
            -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/repository-junit.xml"

      - name: Collect measured file durations
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/repository-junit.xml" ]]; then
            scripts/collect-pytest-file-durations "$RUNNER_TEMP/repository-junit.xml" \
              --root . --output "$RUNNER_TEMP/repository-durations.json"
          fi
      - name: Upload measured file durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-file-durations-repository-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/repository-durations.json
          retention-days: 30
          if-no-files-found: ignore

  consumer-probe:
    # Builds the native parser, HTTP client and state probe from this exact
    # source and runs the consumer corpus boundaries against it here, so the
    # control shards start without waiting for a Cargo build.
    name: Build actual native consumer probe
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out exact suite source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provide the canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python environment
        uses: ./.github/actions/python-env
      - name: Build recipe library index and packages
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Install pinned Rust toolchain
        run: scripts/retry-dependency-fetch rustup toolchain install 1.98.1 --profile minimal
      - name: Restore read-only Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
          save-if: "false"
      - name: Build actual canonical parser, HTTP client and state probe
        shell: bash
        run: |
          set -euo pipefail
          scripts/retry-dependency-fetch cargo fetch --locked
          uv run --project control --frozen python scripts/generate-agent-wire
          cargo build --locked --package vonk-agent --example consumer_corpus_probe
      - name: Run the consumer corpus boundaries against the actual probe
        env:
          VONK_CONSUMER_CORPUS_PROBE: ${{ github.workspace }}/target/debug/examples/consumer_corpus_probe
        run: scripts/test corpus

  control-suite:
    name: Complete control suite (${{ matrix.shard.label }})
    needs: changes
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: 1-of-3}
          - {index: 1, label: 2-of-3}
          - {index: 2, label: 3-of-3}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provide the canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Build recipe library index and packages
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Provide the Controller image ingress tool
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the pinned test images once
        run: scripts/pull-test-images postgres python
      - name: List the tests this change adds or touches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c core.quotePath=false diff --no-ext-diff --unified=0 "$BASE_SHA" -- \
            tests control/tests deploy/compose/tests |
            uv run --project control --frozen scripts/changed-tests > "$RUNNER_TEMP/changed-tests.txt"
      - name: Run complete control suite
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard.index }}
          SHARD_TOTAL: 3
          TIMING_DATA: ${{ needs.changes.outputs.control_timings }}
          VONK_CI_PREREQUISITES: needs_skopeo
        run: |
          set -euo pipefail
          timing_file="$RUNNER_TEMP/pytest-durations.json"
          printf '%s\n' "$TIMING_DATA" > "$timing_file"
          enforce=()
          if [[ -f "$RUNNER_TEMP/changed-tests.txt" ]]; then
            enforce=(--test-budget-enforce "$RUNNER_TEMP/changed-tests.txt")
          fi
          scripts/test control --shard "$((SHARD_INDEX + 1))/$SHARD_TOTAL" \
            --durations "$timing_file" -- -n 4 "${enforce[@]}" \
            -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/control-junit.xml"

      - name: Collect measured file durations
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/control-junit.xml" ]]; then
            scripts/collect-pytest-file-durations "$RUNNER_TEMP/control-junit.xml" \
              --root control --output "$RUNNER_TEMP/control-durations.json"
          fi
      - name: Upload measured file durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-file-durations-control-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/control-durations.json
          retention-days: 30
          if-no-files-found: ignore

  control-image-build:
    # Builds the Controller (api) and worker images once, with the buildx GHA
    # cache, then runs the fast built_image checks against them. Those tests
    # are deselected from the control shards and never build an image.
    name: Controller image build tests
    needs: changes
    if: needs.changes.outputs.control == 'true' && needs.changes.outputs.nas_install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    env:
      VONK_TEST_CONTROLLER_IMAGE: vonk-control:ci-test
      VONK_TEST_WORKER_IMAGE: vonk-control-worker:ci-test
      # Collecting control/tests imports the recipe-library modules too.
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provide the canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Build recipe library index and packages
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare digest-pinned CI dependency mirrors
        run: scripts/pull-test-images --dockerfile control/Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Name the dependency layer day
        id: dependency_day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build the Controller image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: api
          load: true
          tags: ${{ env.VONK_TEST_CONTROLLER_IMAGE }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-api
          # Only main writes the shared cache; pull requests read it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ci-test-vonk-forge-api' || '' }}
      - name: Build the worker image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: worker
          load: true
          tags: ${{ env.VONK_TEST_WORKER_IMAGE }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-worker
          # Only main writes the shared cache; pull requests read it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ci-test-vonk-forge-worker' || '' }}
      - name: Check the built images
        run: scripts/test images
      - name: Scan the Controller image for fixable vulnerabilities
        if: always()
        uses: ./.github/actions/image-scan
        with:
          image: ${{ env.VONK_TEST_CONTROLLER_IMAGE }}
          category: controller-api
          # skopeo and its runtime libraries are copied unchanged from the
          # upstream quay.io/skopeo release image.
          skip-dirs: /usr/local/lib/skopeo
      - name: Scan the worker image for fixable vulnerabilities
        if: always()
        uses: ./.github/actions/image-scan
        with:
          image: ${{ env.VONK_TEST_WORKER_IMAGE }}
          category: controller-worker
          # skopeo and its runtime libraries are copied unchanged from the
          # upstream quay.io/skopeo release image.
          skip-dirs: /usr/local/lib/skopeo

  web-suite:
    name: Admin web behavior
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Match control/web/package-lock.json; browsers and system libraries are baked in.
    # https://playwright.dev/docs/ci#via-containers
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node.js with admin web dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            control/web/package-lock.json
            tools/openapi-client/package-lock.json
      - name: Install Python for the dependency fetch helper
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Prepare the contract consumers for the web build and the corpus
        # The corpus emission imports the generated Python client, and the
        # web hooks read the generated TypeScript types; one stamped
        # generation here serves both, so the hooks regenerate nothing.
        uses: ./.github/actions/python-env
        with:
          cli-dependencies: "false"
      - name: Install locked admin web dependencies
        run: scripts/retry-dependency-fetch npm ci --prefix control/web
      - name: Emit the actual producer corpus and observation transfers
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/src:agent_protocol/src:src \
            uv run --project control --frozen python control/tests/cross_language_consumer_corpus.py --output artifacts/consumer-corpus
          PYTHONPATH=control:control/src:agent_protocol/src:src \
            uv run --project control --frozen python control/tests/export_artifact_workspace_fixture.py --output artifacts/consumer-corpus/artifact-workspace.json
          PYTHONPATH=control:control/src:agent_protocol/src:src \
            uv run --project control --frozen python control/tests/export_observation_transfer_fixtures.py --output artifacts/observation-transfers
      - name: Check out pinned official JSON Schema semantics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: json-schema-org/JSON-Schema-Test-Suite
          ref: 5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8
          path: artifacts/json-schema-suite
          persist-credentials: false
      - name: Install the locked schema compiler dependencies
        run: scripts/retry-dependency-fetch npm ci --prefix tools/openapi-client
      - name: Compile pinned official schemas with the production compiler
        run: python3 scripts/tests/prepare_official_schema_consumers.py --suite artifacts/json-schema-suite
      - name: Check TypeScript lint, formatting and types
        shell: bash
        env:
          WEB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cd control/web
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The container runs as root over a checkout the runner user owns,
            # and the checkout action's safe.directory entry does not outlive
            # its step. Without this, git refuses the repository; keep the
            # listing outside a process substitution so that refusal fails the
            # step instead of silently linting nothing.
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git fetch --no-tags --depth=1 origin "${WEB_BASE_SHA:?missing base SHA}"
            git diff --name-only -z --diff-filter=ACMR "$WEB_BASE_SHA" "$GITHUB_SHA" -- '*.ts' '*.tsx' > "$RUNNER_TEMP/changed-web"
            mapfile -d '' -t changed_web < "$RUNNER_TEMP/changed-web"
            if ((${#changed_web[@]})); then
              node_modules/.bin/biome check --no-errors-on-unmatched "${changed_web[@]/#/$GITHUB_WORKSPACE/}"
            fi
          else
            npm run lint
          fi
          npm run typecheck
      - name: Run complete admin web suite against the actual corpus
        env:
          VONK_CONSUMER_CORPUS: ${{ github.workspace }}/artifacts/consumer-corpus/corpus.json
          VONK_OBSERVATION_TRANSFERS: ${{ github.workspace }}/artifacts/observation-transfers/observation-transfers.json
          VONK_CONSUMER_OUTPUT: ${{ github.workspace }}/artifacts/consumer-corpus/browser-exports.json
        run: npm test --prefix control/web -- --run
      - name: Verify browser exports through their actual canonical Python owners
        env:
          PYTHONPATH: control/src:agent_protocol/src:src
        run: uv run --project control --frozen python control/tests/verify_browser_consumer_exports.py --corpus artifacts/consumer-corpus/corpus.json --exports artifacts/consumer-corpus/browser-exports.json
      - name: Build admin web application
        run: npm run build --prefix control/web
      - name: Run fixture-backed Admin browser acceptance
        run: >-
          npm run test:e2e --prefix control/web --
          e2e/admin.spec.ts e2e/feedback.spec.ts e2e/operation-progress.spec.ts
          --project=chromium
      - name: Exercise native browser numeric-source capability and HTTP consumers
        env:
          VONK_OBSERVATION_TRANSFERS: ${{ github.workspace }}/artifacts/observation-transfers/observation-transfers.json
          VONK_CONSUMER_CORPUS: ${{ github.workspace }}/artifacts/consumer-corpus/corpus.json
        run: npm run test:e2e --prefix control/web -- --config playwright.contracts.config.ts
      - name: Validate the native component request with the canonical Python owner
        env:
          PYTHONPATH: control:control/src:agent_protocol/src:src
        run: uv run --project control --frozen python control/tests/export_artifact_workspace_fixture.py --verify-request artifacts/consumer-corpus/artifact-workspace-request.json
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-web-browser-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            control/web/playwright-report
            control/web/test-results

  lane-proof:
    name: Exact PR candidate acceptance
    # The candidate costs about 70 runner-minutes; a push that fails lint or a
    # guard, or is superseded within minutes, should not start it.
    needs: [changes, lint, repository-guards]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.lane == 'true' || contains(github.event.pull_request.labels.*.name, 'release-acceptance'))
    permissions:
      actions: write
      contents: read
      packages: write
    uses: ./.github/workflows/release-acceptance.yml
    with:
      ref: ${{ github.sha }}
      # The upgrade carry runs on a pull request when it changes what the
      # upgrade is made of, or when the label asks for complete acceptance;
      # main's release carries every merge regardless.
      upgrade_carry: ${{ needs.changes.outputs.upgrade_carry == 'true' || contains(github.event.pull_request.labels.*.name, 'release-acceptance') }}

  ci-gate:
    name: CI gate
    needs: [changes, lint, supply-chain, rust-quality, rust-tests, rust-platform, controller-spark-wire, generated-clients, compose-integration, repository-guards, repository-suite, control-suite, control-image-build, web-suite, nas-install, agent-package, lane-proof]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Summarize where this run spent its time
        if: always()
        # The timeline is a summary for people, not evidence the gate decides on:
        # a GitHub API error here must not fail the gate (it did twice on 2026-10-13).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-timeline "$GITHUB_RUN_ID" --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Require selector and selected jobs
        shell: bash
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
          SELECTED_RUST: ${{ needs.changes.outputs.rust }}
          SELECTED_REPOSITORY: ${{ needs.changes.outputs.repository }}
          SELECTED_CONTROL: ${{ needs.changes.outputs.control }}
          SELECTED_WEB: ${{ needs.changes.outputs.web }}
          SELECTED_GENERATED: ${{ needs.changes.outputs.generated }}
          SELECTED_COMPOSE: ${{ needs.changes.outputs.compose }}
          SELECTED_NAS_INSTALL: ${{ needs.changes.outputs.nas_install }}
          SELECTED_AGENT_PACKAGE: ${{ needs.changes.outputs.agent_package }}
          SELECTED_LANE: ${{ (needs.changes.outputs.lane == 'true' || contains(github.event.pull_request.labels.*.name, 'release-acceptance')) && 'true' || 'false' }}
          LINT_RESULT: ${{ needs.lint.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          RUST_PLATFORM_RESULT: ${{ needs.rust-platform.result }}
          WIRE_RESULT: ${{ needs.controller-spark-wire.result }}
          REPOSITORY_GUARDS_RESULT: ${{ needs.repository-guards.result }}
          REPOSITORY_RESULT: ${{ needs.repository-suite.result }}
          CONTROL_RESULT: ${{ needs.control-suite.result }}
          CONTROL_IMAGE_BUILD_RESULT: ${{ needs.control-image-build.result }}
          WEB_RESULT: ${{ needs.web-suite.result }}
          GENERATED_RESULT: ${{ needs.generated-clients.result }}
          COMPOSE_RESULT: ${{ needs.compose-integration.result }}
          NAS_INSTALL_RESULT: ${{ needs.nas-install.result }}
          AGENT_PACKAGE_RESULT: ${{ needs.agent-package.result }}
          LANE_PROOF_RESULT: ${{ needs.lane-proof.result }}
        run: |
          set -euo pipefail
          scripts/verify-ci-gate \
            --selector-result "$SELECTOR_RESULT" \
            --selected "rust=$SELECTED_RUST" \
            --selected "repository=$SELECTED_REPOSITORY" \
            --selected "control=$SELECTED_CONTROL" \
            --selected "web=$SELECTED_WEB" \
            --selected "generated=$SELECTED_GENERATED" \
            --selected "compose=$SELECTED_COMPOSE" \
            --selected "nas-install=$SELECTED_NAS_INSTALL" \
            --selected "agent-package=$SELECTED_AGENT_PACKAGE" \
            --selected "lane=$SELECTED_LANE" \
            --result "lint=$LINT_RESULT" \
            --result "supply-chain=$SUPPLY_CHAIN_RESULT" \
            --result "rust-quality=$RUST_QUALITY_RESULT" \
            --result "rust-tests=$RUST_TESTS_RESULT" \
            --result "rust-platform=$RUST_PLATFORM_RESULT" \
            --result "controller-spark-wire=$WIRE_RESULT" \
            --result "repository-guards=$REPOSITORY_GUARDS_RESULT" \
            --result "repository=$REPOSITORY_RESULT" \
            --result "control=$CONTROL_RESULT" \
            --result "control-image-build=$CONTROL_IMAGE_BUILD_RESULT" \
            --result "web=$WEB_RESULT" \
            --result "generated=$GENERATED_RESULT" \
            --result "compose=$COMPOSE_RESULT" \
            --result "nas-install=$NAS_INSTALL_RESULT" \
            --result "agent-package=$AGENT_PACKAGE_RESULT" \
            --result "lane-proof=$LANE_PROOF_RESULT"

      - name: Record the exact source and successful check selection
        # A merge-queue run tests the commit main will carry; its receipt lets
        # the release reuse these checks without running them again.
        if: >-
          github.event_name == 'merge_group' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SELECTED_AREAS: ${{ toJSON(needs.changes.outputs) }}
        run: scripts/resolve-tested-ci write-receipt --output "$RUNNER_TEMP/ci-tested-source/receipt.json"
      - name: Upload successful source check evidence
        if: >-
          github.event_name == 'merge_group' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tested-source-v3
          path: ${{ runner.temp }}/ci-tested-source/receipt.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  main-ci-summary:
    name: Main branch CI status summary
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-gate, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report main branch CI result
        env:
          GATE_RESULT: ${{ needs.ci-gate.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Main branch CI"
            echo
            echo "- Result: **$GATE_RESULT**"
            echo "- Supply-chain evidence: **$SUPPLY_CHAIN_RESULT**"
            printf -- '- Commit: %s\n' "$SOURCE_SHA"
            echo "- Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  release-metadata:
    name: Validate container release tag
    if: >-
      needs.ci-gate.result == 'success' &&
      vars.VONK_CONTAINER_RELEASES_ENABLED == 'true' &&
      vars.VONK_PLATFORM_RELEASES_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      next_version: ${{ steps.release.outputs.next_version }}
      baseline_version: ${{ steps.release.outputs.baseline_version }}
      arm64_package: ${{ steps.release.outputs.arm64_package }}
      arm64_baseline_package: ${{ steps.release.outputs.arm64_baseline_package }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      baseline_artifact_name: ${{ steps.release.outputs.baseline_artifact_name }}
      channel: ${{ steps.release.outputs.channel }}
      image_version_tag: ${{ steps.release.outputs.image_version_tag }}
      commit_tag: ${{ steps.release.outputs.commit_tag }}
      dev_tag: ${{ steps.release.outputs.dev_tag }}
      latest_alias: ${{ steps.release.outputs.latest_alias }}
      api_image: ${{ steps.release.outputs.api_image }}
      worker_image: ${{ steps.release.outputs.worker_image }}
      api_dev_source: ${{ steps.release.outputs.api_dev_source }}
      worker_dev_source: ${{ steps.release.outputs.worker_dev_source }}
      hermes_image: ${{ steps.release.outputs.hermes_image }}
      litellm_image: ${{ steps.release.outputs.litellm_image }}
      litellm_dev_source: ${{ steps.release.outputs.litellm_dev_source }}
      tag_oid: ${{ steps.authority.outputs.tag_oid }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed accepted release tag
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          [[ $(git cat-file -t "$tag_ref") == tag ]]
          allowed_signers="$RUNNER_TEMP/release-allowed-signers"
          git show refs/remotes/origin/main:.github/release-allowed-signers \
            > "$allowed_signers"
          test -s "$allowed_signers"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$allowed_signers" \
            verify-tag "$tag_ref"
          [[ $(git rev-list -n 1 "$tag_ref") == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          tag_oid=$(git rev-parse --verify "$tag_ref")
          scripts/verify-release-tag-authority \
            "$GITHUB_REF_NAME" "$tag_oid" "$GITHUB_SHA"
          printf 'tag_oid=%s\n' "$tag_oid" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          scripts/container-release-metadata \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"
          scripts/agent-package-metadata \
            production "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" 0 \
            >> "$GITHUB_OUTPUT"

  build-agent-package:
    name: Build, attest, and lifecycle-test ARM64 Spark agent
    if: needs.release-metadata.result == 'success'
    needs: [release-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: agent-release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      arm64_package: ${{ steps.package.outputs.arm64_package }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      baseline_version: ${{ steps.package.outputs.baseline_version }}
      arm64_baseline_package: ${{ steps.package.outputs.arm64_baseline_package }}
      baseline_artifact_name: ${{ steps.package.outputs.baseline_artifact_name }}
    steps:
      - name: Check out exact package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and attest ARM64 release agent package
        id: package
        uses: ./.github/actions/agent-package-build
        with:
          channel: stable
          publication_sequence: '0'
          version: ${{ needs.release-metadata.outputs.version }}
          next_version: ${{ needs.release-metadata.outputs.next_version }}
          baseline_version: ${{ needs.release-metadata.outputs.baseline_version }}
          arm64_package: ${{ needs.release-metadata.outputs.arm64_package }}
          arm64_baseline_package: ${{ needs.release-metadata.outputs.arm64_baseline_package }}
          artifact_name: ${{ needs.release-metadata.outputs.artifact_name }}
          baseline_artifact_name: ${{ needs.release-metadata.outputs.baseline_artifact_name }}
          environment: agent-release
          source_sha: ${{ github.sha }}
          tag_name: ${{ github.ref_name }}
          tag_oid: ${{ needs.release-metadata.outputs.tag_oid }}
          expected_fingerprint: ${{ vars.VONK_AGENT_RELEASE_KEY_FINGERPRINT }}
          release_private_key: ${{ secrets.VONK_AGENT_RELEASE_PRIVATE_KEY }}
          security_gate_mode: inline
          binary_source_mode: compile
          lifecycle_gate_mode: inline

  validate-release-images:
    name: Validate accepted release images
    needs: [lint, generated-clients, compose-integration, supply-chain, release-metadata, build-agent-package]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      litellm_digest: ${{ steps.litellm.outputs.digest }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified supply-chain evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          path: release-output/supply-chain
      - name: Restore verified protocol wheel for image build context
        run: install -D -m 0644 release-output/supply-chain/vonk_agent_protocol-4.1.0-py3-none-any.whl inventory/wheels/vonk_agent_protocol-4.1.0-py3-none-any.whl
      - name: Verify public image inputs
        run: scripts/verify-public-image-inputs
      - name: Rebuild and compare release supply-chain evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supply-chain"
          cp inventory/wheels/vonk_agent_protocol-4.1.0-py3-none-any.whl "$RUNNER_TEMP/supply-chain/"
          scripts/verify-supply-chain --output-dir "$RUNNER_TEMP/supply-chain" --json
          diff -ru "$RUNNER_TEMP/supply-chain" release-output/supply-chain
      - name: Require the preinstalled Docker Buildx plugin
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Skopeo from Ubuntu
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo
      - name: Validate accepted API image
        id: api
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          DEV_SOURCE: ${{ needs.release-metadata.outputs.api_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$API_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/api-attestation.json"
          scripts/verify-published-image api "$API_IMAGE" "$digest" - "$GITHUB_SHA"
          inspect_error="$RUNNER_TEMP/api-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable API release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "API release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Validate accepted worker image
        id: worker
        shell: bash
        env:
          DEV_SOURCE: ${{ needs.release-metadata.outputs.worker_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$WORKER_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/worker-attestation.json"
          scripts/verify-published-image worker "$WORKER_IMAGE" "$digest" - "$GITHUB_SHA"
          inspect_error="$RUNNER_TEMP/worker-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable worker release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "worker release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Validate accepted LiteLLM image
        id: litellm
        shell: bash
        env:
          DEV_SOURCE: ${{ needs.release-metadata.outputs.litellm_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$LITELLM_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/litellm-attestation.json"
          scripts/verify-published-image litellm "$LITELLM_IMAGE" "$digest" - "$GITHUB_SHA"
          inspect_error="$RUNNER_TEMP/litellm-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$LITELLM_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable LiteLLM release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "LiteLLM release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
  publish-images:
    name: Publish public container images
    needs: [validate-release-images, release-metadata]
    runs-on: ubuntu-latest
    environment: platform-release
    concurrency:
      group: vonk-forge-container-publication-${{ needs.release-metadata.outputs.version }}
      cancel-in-progress: false
      queue: max
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      hermes_digest: ${{ steps.hermes.outputs.digest }}
      litellm_digest: ${{ steps.litellm.outputs.digest }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare digest-pinned CI dependency mirrors
        run: scripts/pull-test-images --dockerfile deploy/compose/hermes-agent/Dockerfile --image docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.CI_IMAGE_400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 }}
          platforms: arm64
      - name: Require the preinstalled Docker Buildx plugin
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Skopeo from Ubuntu
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo
      - name: Revalidate release authority before registry authentication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate release authority before API publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Promote accepted API image
        id: api
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          DIGEST: ${{ needs.validate-release-images.outputs.api_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/api-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable API release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$API_IMAGE:$IMAGE_VERSION_TAG" "$API_IMAGE@$DIGEST"
          else
            echo "API release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Revalidate release authority before worker publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Promote accepted worker image
        id: worker
        shell: bash
        env:
          DIGEST: ${{ needs.validate-release-images.outputs.worker_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/worker-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable worker release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$WORKER_IMAGE:$IMAGE_VERSION_TAG" "$WORKER_IMAGE@$DIGEST"
          else
            echo "worker release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Revalidate release authority before LiteLLM publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Promote accepted LiteLLM image
        id: litellm
        shell: bash
        env:
          DIGEST: ${{ needs.validate-release-images.outputs.litellm_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/litellm-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$LITELLM_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable LiteLLM release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$LITELLM_IMAGE:$IMAGE_VERSION_TAG" "$LITELLM_IMAGE@$DIGEST"
          else
            echo "LiteLLM release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$LITELLM_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Reconcile existing Hermes release image
        id: existing-hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
        run: |
          scripts/reconcile-hermes-release-image \
            "$HERMES_AGENT_IMAGE" "$RELEASE_VERSION" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" \
            "refs/tags/$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Revalidate release authority before Hermes publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Build and push Hermes image
        id: hermes-build
        if: steps.existing-hermes.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/compose/hermes-agent
          file: deploy/compose/hermes-agent/Dockerfile
          target: managed
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}
            ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.commit_tag }}
          labels: |
            org.opencontainers.image.title=vonk-forge-hermes
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
      - name: Scan the Hermes release image for fixable vulnerabilities
        if: steps.existing-hermes.outputs.exists != 'true'
        uses: ./.github/actions/image-scan
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image: ${{ needs.release-metadata.outputs.hermes_image }}@${{ steps.hermes-build.outputs.digest }}
          category: release-hermes
          # An upstream application release with a thin layer of ours.
          gate: "false"
      - name: Attest Hermes release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.release-metadata.outputs.hermes_image }}
          subject-digest: ${{ steps.existing-hermes.outputs.digest || steps.hermes-build.outputs.digest }}
          push-to-registry: true
      - name: Verify and record Hermes release image
        id: hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
        run: |
          scripts/reconcile-hermes-release-image \
            "$HERMES_AGENT_IMAGE" "$RELEASE_VERSION" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" \
            "refs/tags/$GITHUB_REF_NAME" --require-attestation --repair-tags \
            >> "$GITHUB_OUTPUT"
      - name: Write digest-pinned image summary
        shell: bash
        run: |
          {
            echo '```dotenv'
            printf '%s\n' \
              "CONTROL_API_IMAGE=${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.api.outputs.digest }}" \
              "CONTROL_WORKER_IMAGE=${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.worker.outputs.digest }}" \
              "HERMES_AGENT_IMAGE=${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}@${{ steps.hermes.outputs.digest }}" \
              "LITELLM_IMAGE=${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.litellm.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render canonical production Compose
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 release-output
          scripts/render-production-compose \
            --output release-output/docker-compose.production.yml \
            --api-image "${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.api.outputs.digest }}" \
            --worker-image "${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.worker.outputs.digest }}" \
            --hermes-image "${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}@${{ steps.hermes.outputs.digest }}" \
            --litellm-image "${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.litellm.outputs.digest }}"
          scripts/render-production-compose --channel pinned \
            --output release-output/docker-compose.pinned.yml \
            --api-image "${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.api.outputs.digest }}" \
            --worker-image "${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.worker.outputs.digest }}" \
            --hermes-image "${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}@${{ steps.hermes.outputs.digest }}" \
            --litellm-image "${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.litellm.outputs.digest }}"
      - name: Upload production Compose
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          retention-days: 90
          if-no-files-found: error
          path: |
            release-output/docker-compose.production.yml
            release-output/docker-compose.pinned.yml

  release-manifest:
    name: Publish container release manifest
    needs: [release-metadata, publish-images, build-agent-package, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download platform publication evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          path: release-output
      - name: Download verified source supply-chain evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          path: release-output/supply-chain
      - name: Download verified agent package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-agent-package.outputs.artifact_name }}
          path: release-output/agent-package
      - name: Create digest-pinned image environment
        env:
          CONTROL_API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          CONTROL_WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          CONTROL_API_DIGEST: ${{ needs.publish-images.outputs.api_digest }}
          CONTROL_WORKER_DIGEST: ${{ needs.publish-images.outputs.worker_digest }}
          HERMES_AGENT_DIGEST: ${{ needs.publish-images.outputs.hermes_digest }}
          LITELLM_DIGEST: ${{ needs.publish-images.outputs.litellm_digest }}
        run: |
          scripts/validate-container-release-digests
          printf '%s\n' \
            "CONTROL_API_IMAGE=$CONTROL_API_IMAGE@$CONTROL_API_DIGEST" \
            "CONTROL_WORKER_IMAGE=$CONTROL_WORKER_IMAGE@$CONTROL_WORKER_DIGEST" \
            "HERMES_AGENT_IMAGE=$HERMES_AGENT_IMAGE@$HERMES_AGENT_DIGEST" \
            "LITELLM_IMAGE=$LITELLM_IMAGE@$LITELLM_DIGEST" \
            > vonk-forge-images.env
          sha256sum vonk-forge-images.env > vonk-forge-images.env.sha256
      - name: Revalidate release authority before GitHub Release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Create public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM64_PACKAGE: ${{ needs.build-agent-package.outputs.arm64_package }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-agent-package.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$ARM64_PACKAGE" == "vonk-forge-agent_${VERSION}_arm64.deb" ]]
          release_assets=(
            "release-output/supply-chain/manifest.json"
            "release-output/supply-chain/agent-protocol.spdx.json"
            "release-output/supply-chain/agent-rust.spdx.json"
            "release-output/supply-chain/control-python.spdx.json"
            "release-output/supply-chain/control-web.spdx.json"
            "release-output/supply-chain/vonk_agent_protocol-4.1.0-py3-none-any.whl"
            "release-output/agent-package/$ARM64_PACKAGE"
            "release-output/agent-package/vonk-forge-systemd-security.json"
          )
          # One ARM64 package is intentionally represented as one list item.
          # shellcheck disable=SC2066
          for package in "$ARM64_PACKAGE"; do
            architecture=${package%.deb}
            architecture=${architecture##*_}
            release_assets+=(
              "release-output/agent-package/${package}.sha256"
              "release-output/agent-package/${package}.host.sig"
              "release-output/agent-package/vonk-forge-agent_${VERSION}_${architecture}.sbom.cdx.json"
              "release-output/agent-package/vonk-forge-agent_${VERSION}_${architecture}.sbom.spdx.json"
              "release-output/agent-package/vonk-forge-agent_${VERSION}_${architecture}.provenance.json"
              "release-output/agent-package/${package}.sigstore.json"
            )
          done
          for asset in "${release_assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" ]]
          done
          scripts/reconcile-github-release \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$SOURCE_SHA" \
            "Vonk Forge $VERSION" \
            vonk-forge-images.env vonk-forge-images.env.sha256 \
            release-output/docker-compose.production.yml \
            release-output/docker-compose.pinned.yml \
            "${release_assets[@]}"

  publish-apt:
    name: Publish verified ARM64 Spark agent package to apt
    needs: [release-metadata, build-agent-package, release-manifest]
    if: needs.release-manifest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: apt-release
    concurrency:
      group: vonk-forge-agent-apt-stable
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: Check out apt publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish verified ARM64 Spark agent package
        uses: ./.github/actions/agent-apt-publish
        with:
          channel: stable
          version: ${{ needs.build-agent-package.outputs.version }}
          arm64_package: ${{ needs.build-agent-package.outputs.arm64_package }}
          artifact_name: ${{ needs.build-agent-package.outputs.artifact_name }}
          environment: apt-release
          source_sha: ${{ github.sha }}
          tag_name: ${{ github.ref_name }}
          tag_oid: ${{ needs.release-metadata.outputs.tag_oid }}
          apt_gpg_passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}
          apt_repository_gpg_fingerprint: ${{ vars.APT_REPOSITORY_GPG_FINGERPRINT }}
          apt_repository_gpg_private_key: ${{ secrets.APT_REPOSITORY_GPG_PRIVATE_KEY }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_apt_public_bucket: ${{ vars.R2_APT_PUBLIC_BUCKET }}
          r2_apt_state_bucket: ${{ vars.R2_APT_STATE_BUCKET }}
