name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A new commit supersedes an older PR check. Tag releases use separate groups,
# so one valid version can never evict another version from GitHub's pending
# concurrency slot.
concurrency:
  group: vonk-forge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          # Ruff is executed through uvx and has no project dependency cache.
          # Enabling setup-uv's cache here can fail post-job when no cache path
          # is created; dependency-using jobs below keep caching enabled.
          enable-cache: false
      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed_python < <(
              git diff --name-only --diff-filter=ACMR "$GITHUB_BASE_SHA" "$GITHUB_SHA" -- '*.py'
            )
            if ((${#changed_python[@]} == 0)); then
              echo "No changed Python files; skipping Ruff"
            else
              uvx --from ruff==0.16.1 ruff check --force-exclude "${changed_python[@]}"
            fi
          else
            uvx --from ruff==0.16.1 ruff check .
          fi

  rust:
    name: Rust agent contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy,rustfmt
      - name: Verify Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Verify Python protocol parity
        run: >-
          uv run --project agent_protocol --frozen pytest -q
          agent_protocol/tests/test_rust_fixtures.py
          agent_protocol/tests/test_package_helper_authority.py
      - name: Verify controller host-helper authority
        run: >-
          uv run --project control --frozen pytest -q
          control/tests/test_host_helper_authority.py
      - name: Verify Python supervisor migration fixtures
        run: >-
          uv run --project agent --frozen pytest -q
          agent/tests/test_slot_artifact.py
          agent/tests/test_supervisor.py
          -k 'rust_slot_manifest or rust_supervisor'
      - name: Record GPU node service exposure
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 artifacts
          scripts/verify-agent-systemd --json \
            | tee artifacts/vonk-forge-systemd-security.json
      - name: Upload GPU node service exposure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vonk-agent-systemd-security-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/vonk-forge-systemd-security.json

  generated-clients:
    name: Generated control clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install pinned TypeScript generator
        run: npm ci --prefix tools/openapi-client
      - name: Verify generated OpenAPI and clients
        run: uv run --project control --frozen --with-editable . pytest tests/control/test_openapi_clients.py -v
      - name: Reject generated drift
        run: git diff --exit-code -- control/openapi.json src/cluster_profiles/generated_control control/web/src/api/generated.d.ts

  test:
    name: PR contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked admin web dependencies
        run: npm ci --prefix control/web
      - name: Run focused repository contracts
        run: >-
          uv run --python 3.12 --frozen --with pytest==9.1.1 pytest -q
          tests/runbooks/test_development_nas_installation.py
          tests/runbooks/test_workload_packages.py
          tests/test_ci_platform_boundaries.py
          tests/test_container_release_workflow.py
          tests/e2e/test_unknown_workload_package.py
          tests/e2e/test_workload_package_failure_matrix.py
      - name: Run focused control package contracts
        run: >-
          uv run --project control --frozen --with-editable . pytest -q
          control/tests/test_package_api.py
          control/tests/test_package_services.py
          control/tests/test_package_action_plans.py
          control/tests/test_package_validation.py
          control/tests/test_package_validation_runner.py
          control/tests/test_package_rollout_worker.py
          control/tests/test_production_worker.py
          control/tests/test_agent_jobs.py -k package_validation
      - name: Run focused web package workflow
        run: npm test --prefix control/web -- --run src/pages/packages.test.tsx

  catalog-runtime:
    name: Catalog and service suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked admin web dependencies
        run: npm ci --prefix control/web
      - name: Run complete control suite
        run: uv run --project control --frozen --with-editable . pytest control/tests -q
      - name: Run complete Python agent suite
        run: uv run --project agent --frozen pytest agent/tests -q
      - name: Run complete admin web suite
        run: npm test --prefix control/web -- --run
      - name: Build admin web application
        run: npm run build --prefix control/web

  workload-package-evidence:
    name: Workload package acceptance evidence
    needs: [lint, rust, generated-clients, test, catalog-runtime]
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag')) &&
      always() &&
      needs.lint.result == 'success' &&
      needs.rust.result == 'success' &&
      needs.generated-clients.result == 'success' &&
      needs.test.result == 'success' &&
      needs.catalog-runtime.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Run simulated unknown-package acceptance
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 inventory/reports
          if [[ ! -x scripts/accept-workload-packages ]]; then
            echo "::notice::W18 acceptance helper is not present on this ref; no workload evidence was generated"
            exit 0
          fi
          scripts/accept-workload-packages --mode simulated --json
      - name: Run workload failure matrix evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x scripts/accept-workload-package-failures ]]; then
            echo "::notice::W19 failure-matrix helper is not present on this ref; no failure evidence was generated"
            exit 0
          fi
          scripts/accept-workload-package-failures \
            --output inventory/reports/workload-package-failure-matrix.json --json \
            > workload-package-failure-matrix.stdout.json
      - name: Upload workload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-package-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            inventory/reports/workload-package-acceptance.json
            inventory/reports/workload-package-failure-matrix.json
            workload-package-failure-matrix.stdout.json

  release-metadata:
    name: Validate container release tag
    if: >-
      needs.workload-package-evidence.result == 'success' &&
      vars.VONK_CONTAINER_RELEASES_ENABLED == 'true' &&
      vars.VONK_PLATFORM_RELEASES_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [workload-package-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      image_version_tag: ${{ steps.release.outputs.image_version_tag }}
      commit_tag: ${{ steps.release.outputs.commit_tag }}
      dev_tag: ${{ steps.release.outputs.dev_tag }}
      latest_alias: ${{ steps.release.outputs.latest_alias }}
      api_image: ${{ steps.release.outputs.api_image }}
      worker_image: ${{ steps.release.outputs.worker_image }}
      api_dev_source: ${{ steps.release.outputs.api_dev_source }}
      worker_dev_source: ${{ steps.release.outputs.worker_dev_source }}
      hermes_image: ${{ steps.release.outputs.hermes_image }}
      deployment_bundle_repository: ${{ steps.release.outputs.deployment_bundle_repository }}
      platform_channel: ${{ steps.release.outputs.platform_channel }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed accepted release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          [[ $(git cat-file -t "$tag_ref") == tag ]]
          allowed_signers="$RUNNER_TEMP/release-allowed-signers"
          git show refs/remotes/origin/main:.github/release-allowed-signers \
            > "$allowed_signers"
          test -s "$allowed_signers"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$allowed_signers" \
            verify-tag "$tag_ref"
          [[ $(git rev-list -n 1 "$tag_ref") == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Validate release metadata
        id: release
        run: >-
          scripts/container-release-metadata
          "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA"
          >> "$GITHUB_OUTPUT"

  build-agent-package:
    name: Build and attest the release agent package
    if: needs.release-metadata.result == 'success'
    needs: [release-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: agent-release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      package: ${{ steps.metadata.outputs.package }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Validate immutable package metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package="vonk-forge-agent_${VERSION}_arm64.deb"
          printf 'version=%s\npackage=%s\n' "$VERSION" "$package" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy,rustfmt
          rustup default 1.97.1
      - name: Materialize protected release key
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.VONK_AGENT_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/vonk-agent-release.pem"
          printf '%s' "$RELEASE_PRIVATE_KEY" > "$RUNNER_TEMP/vonk-agent-release.pem"
      - name: Build package twice reproducibly
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VONK_SOURCE_REVISION: ${{ github.sha }}
          VONK_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          scripts/build-agent-deb --version "$VERSION" \
            --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
            --source-date-epoch "$epoch" --output-dir dist
          scripts/build-agent-deb --version "$VERSION" \
            --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
            --binaries-dir target/aarch64-unknown-linux-gnu/release \
            --source-date-epoch "$epoch" --output-dir reproducible
          cmp --silent "dist/vonk-forge-agent_${VERSION}_arm64.deb" \
            "reproducible/vonk-forge-agent_${VERSION}_arm64.deb"
          scripts/verify-agent-deb --json "dist/vonk-forge-agent_${VERSION}_arm64.deb"
      - name: Run package security gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          uvx --from pytest==9.1.1 pytest -q \
            tests/scripts/test_agent_deb.py tests/acceptance/test_rust_agent_parity.py
          scripts/verify-agent-systemd --json | tee dist/vonk-forge-systemd-security.json
      - name: Test fresh, offline, upgrade, downgrade, remove lifecycle
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VONK_SOURCE_REVISION: ${{ github.sha }}
          VONK_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "lifecycle check failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fuse-overlayfs podman slirp4netns
          package="dist/vonk-forge-agent_${VERSION}_arm64.deb"
          sudo env SYSTEMD_OFFLINE=1 dpkg -i "$package"
          getent passwd vonk-agent >/dev/null
          test "$(stat -c %a /var/lib/vonk-forge-agent)" = 700
          current_target=$(sudo readlink /var/lib/vonk-forge/supervisor/current)
          test "$(basename "$current_target")" = a
          sudo install -d -o vonk-agent -g vonk-agent -m 0700 /run/vonk-forge-agent
          sudo install -d -o vonk-agent -g vonk-agent -m 0700 /var/lib/vonk-forge-agent/.config
          sudo -H -u vonk-agent env -u SUDO_USER -u SUDO_UID -u SUDO_GID \
            HOME=/var/lib/vonk-forge-agent XDG_DATA_HOME=/var/lib/vonk-forge-agent \
            XDG_CONFIG_HOME=/var/lib/vonk-forge-agent/.config XDG_RUNTIME_DIR=/run/vonk-forge-agent \
            CONTAINERS_STORAGE_CONF=/etc/vonk-forge-agent/containers-storage.conf \
            sh -c 'cd / && exec podman info --format "{{.Host.Security.Rootless}}"' | grep -Fx true >/dev/null
          printf '\n# lifecycle-preserved\n' | sudo tee -a /etc/vonk-forge-agent/agent.toml >/dev/null
          sudo install -o vonk-agent -g vonk-agent -m 0600 /dev/null /var/lib/vonk-forge-agent/lifecycle-preserved
          IFS=. read -r major minor patch <<< "$VERSION"
          next_version="${major}.${minor}.$((patch + 1))"
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          scripts/build-agent-deb --version "$next_version" \
            --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
            --binaries-dir target/aarch64-unknown-linux-gnu/release \
            --source-date-epoch "$epoch" --output-dir lifecycle
          sudo env SYSTEMD_OFFLINE=1 dpkg -i "lifecycle/vonk-forge-agent_${next_version}_arm64.deb"
          grep -Fx '# lifecycle-preserved' /etc/vonk-forge-agent/agent.toml >/dev/null
          test -x /var/lib/vonk-forge/slots/b/vonk-agent
          test "$(basename "$(sudo readlink /var/lib/vonk-forge/supervisor/current)")" = a
          downgrade_log=$RUNNER_TEMP/downgrade.log
          if sudo env SYSTEMD_OFFLINE=1 dpkg -i "$package" >"$downgrade_log" 2>&1; then
            echo "downgrade unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F 'refusing downgrade' "$downgrade_log" >/dev/null
          sudo env SYSTEMD_OFFLINE=1 dpkg --remove vonk-forge-agent
          test -f /etc/vonk-forge-agent/agent.toml
          sudo test -f /var/lib/vonk-forge-agent/lifecycle-preserved
          sudo env SYSTEMD_OFFLINE=1 dpkg -i "lifecycle/vonk-forge-agent_${next_version}_arm64.deb"
          grep -Fx '# lifecycle-preserved' /etc/vonk-forge-agent/agent.toml >/dev/null
          sudo env SYSTEMD_OFFLINE=1 dpkg --remove vonk-forge-agent
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create and verify keyless package signature
        shell: bash
        env:
          PACKAGE: ${{ steps.metadata.outputs.package }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "dist/${PACKAGE}.sigstore.json" "dist/$PACKAGE"
          cosign verify-blob --bundle "dist/${PACKAGE}.sigstore.json" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "dist/$PACKAGE"
          rm -f "$RUNNER_TEMP/vonk-agent-release.pem"
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.metadata.outputs.package }}
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.metadata.outputs.package }}
          sbom-path: dist/vonk-forge-agent_${{ steps.metadata.outputs.version }}_arm64.sbom.spdx.json
      - name: Upload exact package release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-agent-release-${{ steps.metadata.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: dist/*

  validate-release-images:
    name: Validate accepted release images
    needs: [lint, generated-clients, test, release-metadata, build-agent-package]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public image inputs
        run: scripts/verify-public-image-inputs
      - name: Verify supply-chain evidence
        run: scripts/verify-supply-chain --json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Refuse an existing release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
        run: |
          scripts/refuse-existing-image-version \
            "$RELEASE_VERSION" "$HERMES_AGENT_IMAGE"
      - name: Validate accepted API image
        id: api
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          DEV_SOURCE: ${{ needs.release-metadata.outputs.api_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$API_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/api-attestation.json"
          skopeo inspect --config "docker://$API_IMAGE@$digest" \
            | jq -e --arg revision "$GITHUB_SHA" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              '(.config.Labels["org.opencontainers.image.revision"] == $revision)
               and (.config.Labels["org.opencontainers.image.source"] == $source)' \
              >/dev/null
          docker buildx imagetools inspect "$API_IMAGE@$digest" \
            --format '{{ json .Provenance }}' \
            | jq -e --arg revision "$GITHUB_SHA" \
              '([.. | objects | select(
                  ((.predicateType? // "") | startswith("https://slsa.dev/provenance/"))
                  or (((.SLSA?.buildType? // "") | length) > 0)
                  or (((.buildDefinition?.buildType? // "") | length) > 0)
                )] | length > 0)
               and ([.. | strings | select(. == $revision)] | length > 0)' \
              >/dev/null
          docker buildx imagetools inspect "$API_IMAGE@$digest" \
            --format '{{ json .SBOM }}' \
            | jq -e '[.. | objects | select(
                .SPDXID? == "SPDXRef-DOCUMENT"
                and ((.spdxVersion? // "") | startswith("SPDX-"))
              )] | length > 0' >/dev/null
          inspect_error="$RUNNER_TEMP/api-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable API release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "API release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Validate accepted worker image
        id: worker
        shell: bash
        env:
          DEV_SOURCE: ${{ needs.release-metadata.outputs.worker_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$WORKER_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/worker-attestation.json"
          skopeo inspect --config "docker://$WORKER_IMAGE@$digest" \
            | jq -e --arg revision "$GITHUB_SHA" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              '(.config.Labels["org.opencontainers.image.revision"] == $revision)
               and (.config.Labels["org.opencontainers.image.source"] == $source)' \
              >/dev/null
          docker buildx imagetools inspect "$WORKER_IMAGE@$digest" \
            --format '{{ json .Provenance }}' \
            | jq -e --arg revision "$GITHUB_SHA" \
              '([.. | objects | select(
                  ((.predicateType? // "") | startswith("https://slsa.dev/provenance/"))
                  or (((.SLSA?.buildType? // "") | length) > 0)
                  or (((.buildDefinition?.buildType? // "") | length) > 0)
                )] | length > 0)
               and ([.. | strings | select(. == $revision)] | length > 0)' \
              >/dev/null
          docker buildx imagetools inspect "$WORKER_IMAGE@$digest" \
            --format '{{ json .SBOM }}' \
            | jq -e '[.. | objects | select(
                .SPDXID? == "SPDXRef-DOCUMENT"
                and ((.spdxVersion? // "") | startswith("SPDX-"))
              )] | length > 0' >/dev/null
          inspect_error="$RUNNER_TEMP/worker-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable worker release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "worker release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Publish public container images
    needs: [validate-release-images, release-metadata, build-agent-package]
    runs-on: ubuntu-latest
    environment: platform-release
    concurrency:
      group: vonk-forge-container-publication-${{ needs.release-metadata.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      hermes_digest: ${{ steps.hermes.outputs.digest }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote accepted API image
        id: api
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          DIGEST: ${{ needs.validate-release-images.outputs.api_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/api-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable API release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$API_IMAGE:$IMAGE_VERSION_TAG" "$API_IMAGE@$DIGEST"
          else
            echo "API release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Promote accepted worker image
        id: worker
        shell: bash
        env:
          DIGEST: ${{ needs.validate-release-images.outputs.worker_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/worker-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable worker release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$WORKER_IMAGE:$IMAGE_VERSION_TAG" "$WORKER_IMAGE@$DIGEST"
          else
            echo "worker release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Recheck the immutable Hermes version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
        run: |
          scripts/refuse-existing-image-version \
            "$RELEASE_VERSION" "$HERMES_AGENT_IMAGE"
      - name: Build and push Hermes image
        id: hermes
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/compose/hermes-agent
          file: deploy/compose/hermes-agent/Dockerfile
          target: managed
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}
            ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.commit_tag }}
          labels: |
            org.opencontainers.image.title=vonk-forge-hermes
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
      - name: Write digest-pinned image summary
        shell: bash
        run: |
          {
            echo '```dotenv'
            printf '%s\n' \
              "CONTROL_API_IMAGE=${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.api.outputs.digest }}" \
              "CONTROL_WORKER_IMAGE=${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.worker.outputs.digest }}" \
              "HERMES_AGENT_IMAGE=${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}@${{ steps.hermes.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.2
      - name: Download verified agent package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-agent-release-${{ needs.release-metadata.outputs.version }}
          path: release-output/agent-package
      - name: Build canonical platform release
        shell: bash
        env:
          DEPLOYMENT_BUNDLE_REPOSITORY: ${{ needs.release-metadata.outputs.deployment_bundle_repository }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          install -d -m 0700 release-output
          scripts/render-production-compose \
            --output release-output/docker-compose.production.yml \
            --api-image "${{ needs.release-metadata.outputs.api_image }}:latest@${{ steps.api.outputs.digest }}" \
            --worker-image "${{ needs.release-metadata.outputs.worker_image }}:latest@${{ steps.worker.outputs.digest }}"
          release_input="release/platform/${RELEASE_VERSION}.input.json"
          test -f "$release_input"
          uv run --frozen scripts/build-control-deployment-bundle \
            --source-root deploy/compose \
            --output release-output/control-deployment.tar
          uv run --frozen scripts/publish-platform-target describe-bundle \
            --bundle release-output/control-deployment.tar \
            --repository "$DEPLOYMENT_BUNDLE_REPOSITORY" \
            > release-output/control-deployment-descriptor.json
          for artifact in api worker hermes; do
            case "$artifact" in
              api)
                repository="${{ needs.release-metadata.outputs.api_image }}"
                digest="${{ steps.api.outputs.digest }}"
                image_tag="${{ needs.release-metadata.outputs.image_version_tag }}"
                locator=control.images.api
                ;;
              worker)
                repository="${{ needs.release-metadata.outputs.worker_image }}"
                digest="${{ steps.worker.outputs.digest }}"
                image_tag="${{ needs.release-metadata.outputs.image_version_tag }}"
                locator=control.images.worker
                ;;
              hermes)
                repository="${{ needs.release-metadata.outputs.hermes_image }}"
                digest="${{ steps.hermes.outputs.digest }}"
                image_tag="$RELEASE_VERSION"
                locator=control.assets.hermes
                ;;
            esac
            image="${repository}:${image_tag}@${digest}"
            release_reference="${repository}@${digest}"
            docker buildx imagetools inspect "$image" --raw \
              > "release-output/${artifact}-manifest.json"
            docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}' \
              | jq -S -c . > "release-output/${artifact}-sbom.json"
            docker buildx imagetools inspect "$image" --format '{{ json .Provenance }}' \
              | jq -S -c . > "release-output/${artifact}-provenance.json"
            uv run --frozen scripts/collect-platform-artifact-evidence \
              --locator "$locator" \
              --name "$artifact" \
              --reference "$release_reference" \
              --manifest "release-output/${artifact}-manifest.json" \
              --sbom "release-output/${artifact}-sbom.json" \
              --provenance "release-output/${artifact}-provenance.json" \
              --output "release-output/${artifact}-evidence.json"
          done
          install -d -m 0700 release-output/wheels
          uv build --offline --wheel --project . --out-dir release-output/wheels
          uv build --offline --wheel --project control --out-dir release-output/wheels
          uv run --frozen scripts/build-host-updater-artifact \
            --control-wheel release-output/wheels/vonk_control-0.1.0-py3-none-any.whl \
            --platform-wheel release-output/wheels/vonk_cluster_profiles-0.1.0-py3-none-any.whl \
            --protocol-wheel inventory/wheels/vonk_agent_protocol-2.1.0-py3-none-any.whl \
            --output release-output/vonk-forge-host-updater.tar
          sha256sum release-output/vonk-forge-host-updater.tar \
            > release-output/vonk-forge-host-updater.tar.sha256
          package="release-output/agent-package/vonk-forge-agent_${RELEASE_VERSION}_arm64.deb"
          uv run --frozen scripts/build-agent-package-evidence \
            --package "$package" \
            --sbom "${package%.deb}.sbom.spdx.json" \
            --provenance "${package%.deb}.provenance.json" \
            --sigstore-bundle "${package}.sigstore.json" \
            --version "$RELEASE_VERSION" \
            --architecture linux-arm64 \
            --output release-output/agent-package-evidence.json
          uv run --frozen scripts/build-platform-manifest \
            --input "$release_input" \
            --bundle-descriptor release-output/control-deployment-descriptor.json \
            --artifact-evidence release-output/api-evidence.json \
            --artifact-evidence release-output/worker-evidence.json \
            --artifact-evidence release-output/hermes-evidence.json \
            --agent-package-evidence release-output/agent-package-evidence.json \
            --version "$RELEASE_VERSION" \
            --output release-output/platform-release.json
          oras_path=$(command -v oras)
          test -x "$oras_path"
          printf 'VONK_PLATFORM_ORAS_BIN=%s\n' "$oras_path" >> "$GITHUB_ENV"
      - name: Publish immutable deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen scripts/publish-platform-target publish-bundle \
            --manifest release-output/platform-release.json \
            --bundle release-output/control-deployment.tar \
            > release-output/bundle-publication.json
      - name: Upload platform build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            release-output/*-evidence.json
            release-output/*-manifest.json
            release-output/*-provenance.json
            release-output/*-sbom.json
            release-output/bundle-publication.json
            release-output/control-deployment-descriptor.json
            release-output/control-deployment.tar
            release-output/docker-compose.production.yml
            release-output/vonk-forge-host-updater.tar
            release-output/vonk-forge-host-updater.tar.sha256
            release-output/platform-release.json
            release-output/agent-package-evidence.json

  attest-host-updater:
    name: Attest the installable host updater
    needs: [publish-images, release-metadata]
    runs-on: ubuntu-latest
    environment: platform-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download immutable host updater build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          path: release-output
      - name: Attest host updater provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-output/vonk-forge-host-updater.tar

  publish-platform-target:
    name: Publish immutable platform authority state
    needs: [publish-images, release-metadata]
    runs-on: ubuntu-latest
    environment: platform-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged publication client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Download immutable platform build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          path: release-output
      - name: Publish immutable platform target
        shell: bash
        env:
          VONK_PLATFORM_AUTHORITY_URL: ${{ vars.VONK_PLATFORM_AUTHORITY_URL }}
          VONK_PLATFORM_AUTHORITY_AUDIENCE: ${{ vars.VONK_PLATFORM_AUTHORITY_AUDIENCE }}
          VONK_PLATFORM_TUF_PUBLISHER_BIN: ${{ github.workspace }}/scripts/platform-release-authority
          VONK_PLATFORM_CHANNEL_PUBLISHER_BIN: ${{ github.workspace }}/scripts/platform-release-authority
          PLATFORM_CHANNEL: ${{ needs.release-metadata.outputs.platform_channel }}
        run: |
          set -euo pipefail
          uv run --frozen scripts/publish-platform-target publish-authority \
            --manifest release-output/platform-release.json \
            --bundle release-output/control-deployment.tar \
            --channel "$PLATFORM_CHANNEL" \
            > release-output/platform-publication.json
      - name: Upload platform authority evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-authority-${{ needs.release-metadata.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: release-output/platform-publication.json

  release-manifest:
    name: Publish container release manifest
    needs: [release-metadata, publish-images, build-agent-package, attest-host-updater, publish-platform-target]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download platform publication evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          path: release-output
      - name: Download platform authority evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-authority-${{ needs.release-metadata.outputs.version }}
          path: release-output
      - name: Download verified agent package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-agent-release-${{ needs.release-metadata.outputs.version }}
          path: release-output/agent-package
      - name: Create digest-pinned image environment
        env:
          CONTROL_API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          CONTROL_WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}
          CONTROL_API_DIGEST: ${{ needs.publish-images.outputs.api_digest }}
          CONTROL_WORKER_DIGEST: ${{ needs.publish-images.outputs.worker_digest }}
          HERMES_AGENT_DIGEST: ${{ needs.publish-images.outputs.hermes_digest }}
        run: |
          scripts/validate-container-release-digests
          printf '%s\n' \
            "CONTROL_API_IMAGE=$CONTROL_API_IMAGE@$CONTROL_API_DIGEST" \
            "CONTROL_WORKER_IMAGE=$CONTROL_WORKER_IMAGE@$CONTROL_WORKER_DIGEST" \
            "HERMES_AGENT_IMAGE=$HERMES_AGENT_IMAGE@$HERMES_AGENT_DIGEST" \
            > vonk-forge-images.env
          sha256sum vonk-forge-images.env > vonk-forge-images.env.sha256
      - name: Create public GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          vonk-forge-images.env vonk-forge-images.env.sha256
          release-output/control-deployment-descriptor.json
          release-output/docker-compose.production.yml
          release-output/vonk-forge-host-updater.tar
          release-output/vonk-forge-host-updater.tar.sha256
          release-output/platform-release.json
          release-output/platform-publication.json
          release-output/agent-package/vonk-forge-agent_${{ needs.release-metadata.outputs.version }}_arm64.deb
          release-output/agent-package/vonk-forge-agent_${{ needs.release-metadata.outputs.version }}_arm64.deb.sha256
          release-output/agent-package/vonk-forge-agent_${{ needs.release-metadata.outputs.version }}_arm64.sbom.spdx.json
          release-output/agent-package/vonk-forge-agent_${{ needs.release-metadata.outputs.version }}_arm64.provenance.json
          release-output/agent-package/vonk-forge-agent_${{ needs.release-metadata.outputs.version }}_arm64.deb.sigstore.json
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Vonk Forge ${{ needs.release-metadata.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  advance-production-aliases:
    name: Advance accepted production image aliases
    needs: [release-metadata, release-manifest]
    if: needs.release-manifest.result == 'success'
    runs-on: ubuntu-latest
    environment: platform-release
    # Every queued run reconciles the globally newest completed release. A
    # replacement pending run therefore preserves convergence while this
    # shared group prevents concurrent rollback races between release refs.
    concurrency:
      group: vonk-forge-production-alias-reconciliation
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out accepted alias tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile the newest completed production release
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          GH_TOKEN: ${{ github.token }}
          HERMES_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
          LATEST_ALIAS: ${{ needs.release-metadata.outputs.latest_alias }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          select_newest_completed_release() {
            local candidate releases_json
            local -a release_tags
            releases_json=$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease)
            mapfile -t release_tags < <(
              jq -r '.[] | select(
                (.isDraft | not) and (.isPrerelease | not)
              ) | .tagName' <<<"$releases_json" \
                | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                | sort -Vr
            )
            for candidate in "${release_tags[@]}"; do
              if git rev-parse --verify "refs/tags/$candidate^{commit}" \
                >/dev/null 2>&1; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }
          verify_release_tag() {
            local target_tag=$1 target_commit
            local allowed_signers="$RUNNER_TEMP/release-allowed-signers"
            [[ $(git cat-file -t "refs/tags/$target_tag") == tag ]]
            git show refs/remotes/origin/main:.github/release-allowed-signers \
              > "$allowed_signers"
            test -s "$allowed_signers"
            git -c gpg.format=ssh \
              -c gpg.ssh.allowedSignersFile="$allowed_signers" \
              verify-tag "refs/tags/$target_tag"
            target_commit=$(git rev-list -n 1 "refs/tags/$target_tag")
            git merge-base --is-ancestor \
              "$target_commit" refs/remotes/origin/main
          }
          load_release_digests() {
            local target_tag=$1 target_version=${1#v}
            local evidence_dir checksum_line expected_hash expected_name
            local actual_hash key value
            local -a checksum_lines
            declare -A release_images=()
            evidence_dir=$(mktemp -d \
              "$RUNNER_TEMP/vonk-production-alias.XXXXXXXXXX")
            gh release download "$target_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$evidence_dir" \
              --pattern vonk-forge-images.env \
              --pattern vonk-forge-images.env.sha256
            mapfile -t checksum_lines \
              < "$evidence_dir/vonk-forge-images.env.sha256"
            [[ "${#checksum_lines[@]}" -eq 1 ]]
            checksum_line=${checksum_lines[0]}
            read -r expected_hash expected_name \
              <<<"$checksum_line"
            [[ "$expected_hash" =~ ^[0-9a-f]{64}$ ]]
            [[ "$expected_name" == vonk-forge-images.env ]]
            actual_hash=$(sha256sum "$evidence_dir/vonk-forge-images.env")
            [[ "${actual_hash%% *}" == "$expected_hash" ]]
            while IFS='=' read -r key value; do
              [[ -n "$key" && -n "$value" ]]
              [[ -z "${release_images[$key]+present}" ]]
              case "$key" in
                CONTROL_API_IMAGE|CONTROL_WORKER_IMAGE|HERMES_AGENT_IMAGE)
                  release_images["$key"]=$value
                  ;;
                *)
                  echo "unexpected release image key: $key" >&2
                  return 1
                  ;;
              esac
            done < "$evidence_dir/vonk-forge-images.env"
            [[ "${#release_images[@]}" -eq 3 ]]
            api_reference=${release_images[CONTROL_API_IMAGE]}
            worker_reference=${release_images[CONTROL_WORKER_IMAGE]}
            hermes_reference=${release_images[HERMES_AGENT_IMAGE]}
            [[ "$api_reference" == "$API_IMAGE:$target_tag@"sha256:* ]]
            [[ "$worker_reference" == "$WORKER_IMAGE:$target_tag@"sha256:* ]]
            [[ "$hermes_reference" == "$HERMES_IMAGE:$target_version@"sha256:* ]]
            api_digest=${api_reference##*@}
            worker_digest=${worker_reference##*@}
            hermes_digest=${hermes_reference##*@}
            [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$worker_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$hermes_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            rm -rf -- "$evidence_dir"
          }
          for attempt in 1 2 3; do
            git fetch --force --no-tags origin \
              +refs/heads/main:refs/remotes/origin/main
            git fetch --force --tags origin
            target_tag=$(select_newest_completed_release)
            verify_release_tag "$target_tag"
            target_version=${target_tag#v}
            load_release_digests "$target_tag"
            [[ $(skopeo inspect --format '{{.Digest}}' \
              "docker://$API_IMAGE:$target_tag") == "$api_digest" ]]
            [[ $(skopeo inspect --format '{{.Digest}}' \
              "docker://$WORKER_IMAGE:$target_tag") == "$worker_digest" ]]
            [[ $(skopeo inspect --format '{{.Digest}}' \
              "docker://$HERMES_IMAGE:$target_version") == "$hermes_digest" ]]
            scripts/promote-image-aliases \
              "$API_IMAGE" "$api_digest" \
              "$WORKER_IMAGE" "$worker_digest" "$LATEST_ALIAS" \
              "$HERMES_IMAGE" "$hermes_digest"
            git fetch --force --tags origin
            observed_tag=$(select_newest_completed_release)
            [[ "$observed_tag" == "$target_tag" ]] && exit 0
          done
          echo "production release tags did not stabilize" >&2
          exit 1

  publish-apt:
    name: Publish the verified agent package to apt
    needs: [release-metadata, build-agent-package, release-manifest]
    if: needs.release-manifest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: apt-release
    concurrency:
      group: vonk-forge-apt-publication
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-agent-release-${{ needs.release-metadata.outputs.version }}
          path: dist
      - name: Install repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y aptly gnupg rclone
      - name: Restore private aptly state
        id: state
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_APT_STATE_BUCKET: ${{ vars.R2_APT_STATE_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aptly" "$RUNNER_TEMP/apt-public"
          restored=false
          if rclone copyto "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz" "$RUNNER_TEMP/aptly-state.tar.gz"; then
            rclone copyto "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz.sha256" "$RUNNER_TEMP/aptly-state.tar.gz.sha256"
            (cd "$RUNNER_TEMP" && sha256sum -c aptly-state.tar.gz.sha256)
            if tar -tzf "$RUNNER_TEMP/aptly-state.tar.gz" | awk '$0 !~ /^aptly(\/|$)/ || $0 ~ /(^|\/)\.\.(\/|$)/ || $0 ~ /^\// { bad=1 } END { exit !bad }'; then
              echo "aptly state archive contains an unsafe path" >&2
              exit 1
            fi
            if tar -tvzf "$RUNNER_TEMP/aptly-state.tar.gz" | awk '$1 ~ /^[lh]/ { found=1 } END { exit !found }'; then
              echo "aptly state archive contains links" >&2
              exit 1
            fi
            tar -xzf "$RUNNER_TEMP/aptly-state.tar.gz" -C "$RUNNER_TEMP"
            restored=true
          fi
          printf 'restored=%s\n' "$restored" >> "$GITHUB_OUTPUT"
      - name: Publish signed apt index locally
        shell: bash
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.APT_REPOSITORY_GPG_PRIVATE_KEY }}
          APT_REPOSITORY_GPG_FINGERPRINT: ${{ vars.APT_REPOSITORY_GPG_FINGERPRINT }}
          PACKAGE: vonk-forge-agent_${{ needs.release-metadata.outputs.version }}_arm64.deb
          RESTORED: ${{ steps.state.outputs.restored }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          scripts/verify-agent-deb --json "dist/$PACKAGE"
          install -m 0600 /dev/null "$RUNNER_TEMP/apt-repository-key.asc"
          install -m 0600 /dev/null "$RUNNER_TEMP/apt-repository-passphrase"
          printf '%s' "$APT_REPOSITORY_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/apt-repository-key.asc"
          printf '%s' "$APT_GPG_PASSPHRASE" > "$RUNNER_TEMP/apt-repository-passphrase"
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import "$RUNNER_TEMP/apt-repository-key.asc"
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint" && test "$fingerprint" = "$APT_REPOSITORY_GPG_FINGERPRINT"
          config=$RUNNER_TEMP/aptly.conf
          jq -n --arg root "$RUNNER_TEMP/aptly" --arg publish "$RUNNER_TEMP/apt-public" \
            '{rootDir:$root,architectures:["arm64"],dependencyFollowSuggests:false,dependencyFollowRecommends:false,FileSystemPublishEndpoints:{r2:{rootDir:$publish,linkMethod:"copy"}}}' > "$config"
          if [[ "$RESTORED" != true ]]; then
            aptly -config="$config" repo create -distribution=stable -component=main vonk-forge
          fi
          aptly -config="$config" repo add vonk-forge "dist/$PACKAGE"
          aptly -config="$config" snapshot create "v$VERSION" from repo vonk-forge
          common=(-batch -passphrase-file="$RUNNER_TEMP/apt-repository-passphrase" -gpg-key="$fingerprint")
          if [[ "$RESTORED" == true ]]; then
            aptly -config="$config" publish switch "${common[@]}" stable filesystem:r2: "v$VERSION"
          else
            aptly -config="$config" publish snapshot "${common[@]}" -architectures=arm64 -distribution=stable -component=main "v$VERSION" filesystem:r2:
          fi
          test -s "$RUNNER_TEMP/apt-public/dists/stable/InRelease"
          gpg --batch --verify "$RUNNER_TEMP/apt-public/dists/stable/InRelease"
          gpg --batch --export "$fingerprint" > "$RUNNER_TEMP/apt-public/vonk-forge-archive-keyring.gpg"
          gpg --batch --armor --export "$fingerprint" > "$RUNNER_TEMP/apt-public/vonk-forge-archive-keyring.asc"
      - name: Publish public repository then durable state
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_APT_PUBLIC_BUCKET: ${{ vars.R2_APT_PUBLIC_BUCKET }}
          R2_APT_STATE_BUCKET: ${{ vars.R2_APT_STATE_BUCKET }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$R2_APT_PUBLIC_BUCKET" && test -n "$R2_APT_STATE_BUCKET"
          rclone copy "$RUNNER_TEMP/apt-public/" "r2:${R2_APT_PUBLIC_BUCKET}/"
          tar -czf "$RUNNER_TEMP/aptly-state.tar.gz" -C "$RUNNER_TEMP" aptly
          (cd "$RUNNER_TEMP" && sha256sum aptly-state.tar.gz > aptly-state.tar.gz.sha256)
          for path in "versions/${VERSION}" latest; do
            rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz" "r2:${R2_APT_STATE_BUCKET}/${path}/aptly-state.tar.gz"
            rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz.sha256" "r2:${R2_APT_STATE_BUCKET}/${path}/aptly-state.tar.gz.sha256"
          done
          printf 'Published v%s to https://packages.vonkforge.ai/\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
