name: CI

# Pushes to main and release tags run this suite through the release workflow
# (installer-publication.yml), which calls it and gates publication on it.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Dependency fetches retry transient network failures inside the tool; the
# pre-sync steps below additionally run under scripts/retry-dependency-fetch.
# Cargo's own settings live in .cargo/config.toml: rust-cache hashes CARGO* env.
env:
  UV_HTTP_TIMEOUT: "60"
  UV_HTTP_RETRIES: "5"
  npm_config_fetch_retries: "5"
  # Exhaustive sweeps run a fixed share on pull-request and merge-queue runs;
  # main's release run and every other caller sweep the full corpus.
  VONK_TEST_TIER: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'pr' || 'full' }}

# A new commit supersedes an older PR check. Every other run, including a
# release workflow call, has its own group: the caller owns its cancellation.
# Only the `release-acceptance` label starts a new run; any other label runs in
# its own group so it never cancels the run in progress, and every job below
# skips it. Only ci-gate is renamed ("CI gate (label ignored)"): it always runs,
# so its name expression is evaluated, and no run of this kind reports "CI gate".
# A job skipped by its own `if` keeps the raw `${{ ... }}` as its name (run
# 40906603157, job 123574403196), so every other job keeps its literal name: a
# renamed job that is skipped would report a raw expression and never satisfy
# its required check on pull requests that legitimately skip it.
# A member pull request's gate is renamed too ("CI gate (member PR)"): only a
# full run reports the required "CI gate", so every change lands through an
# integration pull request (scripts/select-ci-areas, `full`).
# A Dependabot pull request runs nothing, not even the selector or the gate:
# its update lands through an integration pull request, which runs CI once.
# Its skipped gate keeps the raw name, so it never reports "CI gate".
concurrency:
  group: vonk-forge-ci-${{ (github.event.action == 'labeled' && github.event.label.name != 'release-acceptance') && format('ignored-label-{0}', github.run_id) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  changes:
    name: Select CI integration dependencies
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'release-acceptance') && github.event.pull_request.user.login != 'dependabot[bot]' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      repository: ${{ steps.areas.outputs.repository }}
      control: ${{ steps.areas.outputs.control }}
      web: ${{ steps.areas.outputs.web }}
      compose: ${{ steps.areas.outputs.compose }}
      generated: ${{ steps.areas.outputs.generated }}
      nas_install: ${{ steps.areas.outputs.nas_install }}
      agent_package: ${{ steps.areas.outputs.agent_package }}
      # The one owner of the member/integration rule (scripts/select-ci-areas):
      # a member pull request runs only the quick tier (lint, web check, Rust
      # fmt/clippy when Rust changed) and the gate;
      # every other run, including an integration pull request, runs every
      # suite and proof.
      full: ${{ steps.areas.outputs.full }}
      lane: ${{ steps.areas.outputs.lane }}
      upgrade_carry: ${{ steps.areas.outputs.upgrade_carry }}
      rust_changed: ${{ steps.areas.outputs.rust_changed }}
      repository_timings: ${{ steps.timings.outputs.repository }}
      control_timings: ${{ steps.timings.outputs.control }}
      # The one listing of the tests this change adds or touches, for every shard.
      changed_tests: ${{ steps.changed-tests.outputs.listing }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select transitive integration dependencies
        id: areas
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A merge-queue run has no pull request diff: compare the queued
          # commit with the queue's base commit instead.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            BASE_SHA="$MERGE_GROUP_BASE_SHA"
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            # The tested commit is a merge onto the base: comparing the two
            # trees needs those two commits, not the repository history.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" \
              > "$RUNNER_TEMP/changed-paths.txt"
            scripts/select-ci-areas --event "$GITHUB_EVENT_NAME" \
              --event-payload "$GITHUB_EVENT_PATH" --github-output \
              < "$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"
          else
            scripts/select-ci-areas --event "$GITHUB_EVENT_NAME" \
              --event-payload "$GITHUB_EVENT_PATH" \
              --github-output </dev/null >> "$GITHUB_OUTPUT"
          fi

      - name: List the tests this change adds or touches
        id: changed-tests
        if: >-
          steps.areas.outputs.full == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          test_paths=(tests control/tests deploy/compose/tests)
          git -c core.quotePath=false diff --no-ext-diff --unified=0 "$BASE_SHA" -- "${test_paths[@]}" |
            python3 scripts/changed-tests > "$RUNNER_TEMP/changed-tests.txt"
          {
            echo 'listing<<VONK_CHANGED_TESTS_EOF'
            cat "$RUNNER_TEMP/changed-tests.txt"
            echo 'VONK_CHANGED_TESTS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Label integration pull requests
        # Visible marker only: acceptance is selected by the outputs above, not
        # by the label landing. Labels set with the workflow token start no run.
        # A full pull request without the label is an integration PR.
        if: >-
          github.event_name == 'pull_request' &&
          steps.areas.outputs.full == 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'release-acceptance')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --add-label release-acceptance ||
            echo "::warning::could not add the release-acceptance label; acceptance is selected by branch regardless"

      - name: Restore measured pytest durations
        id: timings
        # Only the full suites read the durations.
        if: steps.areas.outputs.full == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_SELECTED: ${{ steps.areas.outputs.repository }}
          CONTROL_SELECTED: ${{ steps.areas.outputs.control }}
        run: |
          set -euo pipefail
          for suite in repository control; do
            selected_name="${suite^^}_SELECTED"
            timing_file="$RUNNER_TEMP/$suite-durations.json"
            if [[ "${!selected_name}" == true ]]; then
              scripts/restore-pytest-file-durations \
                --repo "$GITHUB_REPOSITORY" --suite "$suite" \
                --current-run-id "$GITHUB_RUN_ID" --output "$timing_file"
            else
              printf '{}\n' > "$timing_file"
            fi
            compact=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' "$timing_file")
            printf '%s=%s\n' "$suite" "$compact" >> "$GITHUB_OUTPUT"
          done

  lint:
    # Also the member tier's Python check: ruff, format, types and the added-line
    # guards on every pull request, member or full.
    name: Ruff
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: python
          cli-dependencies: "false"
      - name: Check the workspace lock is current
        # Every other step runs --frozen, which never compares the lock with
        # the pyprojects; this one resolves, so it is the only drift check.
        run: uv lock --check --offline
      - name: Reject new principle violations on added lines
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # The tested commit merges the change onto the base, so the base is
          # the merge base: the two trees are enough, no history is read.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c core.quotePath=false diff --no-ext-diff --unified=0 "$BASE_SHA" -- \
            control agent_protocol src scripts rust deploy packaging tests .github tools nas_setup |
            scripts/check-added-lines

      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run --project control --frozen ruff check .
          uv run --project control --frozen ruff format --check .
      - name: Check Python types
        shell: bash
        run: scripts/check-python-types

  # The member tier: a few minutes on standard runners, so a member PR gets
  # feedback without the full suites (`lint` above is its Python check, and
  # runs the added-line guards). The full suites stay with the integration PR.
  member-web:
    name: Web typecheck and Biome (member PR)
    needs: changes
    if: needs.changes.outputs.full == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node.js with admin web dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            control/web/package-lock.json
            tools/openapi-client/package-lock.json
      - name: Prepare the contract consumers for the web checks
        uses: ./.github/actions/python-env
        with:
          cli-dependencies: "false"
      - name: Install locked admin web dependencies
        run: scripts/retry-dependency-fetch npm ci --prefix control/web
      - name: Check TypeScript lint, formatting and types
        uses: ./.github/actions/web-quality

  supply-chain:
    name: Supply-chain evidence
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build generated release inputs from locked dependencies; no generated
      # inventory files are checked into the source tree.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: agent_protocol/pyproject.toml
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the protocol wheel
        run: scripts/build-control-wheel
      - name: Include protocol wheel with generated release evidence
        run: |
          mkdir -p "$RUNNER_TEMP/supply-chain"
          cp "inventory/wheels/$(scripts/protocol-wheel-name)" "$RUNNER_TEMP/supply-chain/"
      - name: Verify supply-chain evidence
        run: scripts/verify-supply-chain --output-dir "$RUNNER_TEMP/supply-chain" --json
      - name: Preserve verified SBOMs and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/supply-chain
          if-no-files-found: error
          retention-days: 30

  rust-quality:
    # Also the member tier's Rust check (fmt and clippy), when the change
    # touches Rust or an input of the Rust build (rust_changed).
    name: Rust workspace lint
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.rust_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the protocol environment for Cargo builds
        uses: ./.github/actions/protocol-env
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-amd64
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Verify Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --frozen -- -D warnings

  rust-tests:
    name: Rust workspace tests
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the protocol environment for Cargo builds
        uses: ./.github/actions/protocol-env
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-amd64
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Check deterministic wire generation
        run: scripts/check-generated-determinism --wire
      # A full disk kills the runner without a log (runs 41772276715 and
      # 41784505516); these reports keep the margin visible in every run.
      - name: Report free disk before the Rust build
        run: df -h /
      - name: Test complete Rust shard
        shell: bash
        run: cargo test --workspace --locked
      - name: Report the Rust build's disk margin
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          du -sh target
          free_kib=$(df --output=avail -k / | tail -1)
          if ((free_kib < 4 * 1024 * 1024)); then
            echo "::warning title=Rust job disk margin::$((free_kib / 1024)) MiB free after the Rust test build; the runner dies when the disk fills"
          fi
      - name: Inject foreign-owned retention files across the agent and helper
        shell: bash
        run: |
          set -euo pipefail
          test_binary=$(cargo test --locked -p vonk-agent --lib --no-run --message-format=json |
            python3 -c 'import json,sys; print(next(row["executable"] for line in sys.stdin if (row := json.loads(line)).get("reason") == "compiler-artifact" and row["target"]["name"] == "vonk_agent" and row.get("executable")))')
          image=$(python3 -c 'import json; print(json.load(open("deploy/compose/images.lock.json"))["ci_tools"]["ubuntu"])')
          scripts/retry-dependency-fetch docker pull "$image"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,nosuid \
            --mount "type=bind,src=$test_binary,dst=/retention-tests,readonly" \
            --entrypoint /retention-tests "$image" \
            store_retention::tests::foreign_owned::foreign_owned_scopes_leave_through_helper_with_progress \
            --exact --ignored --nocapture

  controller-spark-wire:
    name: Controller and Spark wire contract
    needs: changes
    if: needs.changes.outputs.full == 'true' && (needs.changes.outputs.control == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-amd64
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Generate the Rust wire peers for the installed protocol tests
        run: scripts/generate-agent-wire
      - name: Build the protocol wheel the adapter consumes
        run: scripts/build-control-wheel
      - name: Exercise the installed protocol wheel on adapter Python
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/protocol-consumer"
          uv venv --python 3.12 "$consumer"
          uv pip install --python "$consumer/bin/python" \
            "inventory/wheels/$(scripts/protocol-wheel-name)" \
            'pytest==9.1.1'
          "$consumer/bin/python" -c 'import pathlib, sys, vonk_agent_protocol; assert pathlib.Path(vonk_agent_protocol.__file__).is_relative_to(sys.prefix)'
          # Disable the producer's source pythonpath: these checks must consume
          # the installed wheel. Rust peers run in the connected lane below.
          "$consumer/bin/python" -m pytest -q -c /dev/null -p no:cacheprovider agent_protocol/tests \
            --ignore=agent_protocol/tests/test_schema2_recipe_wire.py \
            --ignore=agent_protocol/tests/test_schema2_recipe_rust_compat.py
      # Keep runner steps serial: even run-only parallel groups can race on
      # GITHUB_EVENT_PATH with later @actions/github consumers. The workflow
      # event-context guard also covers composite actions and artifact uploads.
      - name: Build Rust wire probes
        run: >-
          uv run --project control --frozen
          python scripts/tests/run_agent_wire_contracts.py --build-only
      # The response witness validates every 2xx body these API tests
      # produce against its declared schema; the tests themselves also
      # run in the control suite.
      - name: Witness Controller API responses against their contracts
        run: |
          set -euo pipefail
          uv run --project control --frozen pytest -q \
            control/tests/test_api_response_witness.py \
            control/tests/test_artifact_job_api.py \
            control/tests/test_fleet_profile_api.py::test_profile_operator_routes_are_singular_and_unversioned \
            control/tests/test_fleet_profile_api.py::test_profile_mutation_role_is_declared_for_final_route \
            control/tests/test_production_app_recipe_image_api.py::test_production_app_recipe_download_auth_and_status \
            --api-response-witness="$RUNNER_TEMP/api-response-witnesses.json"
      - name: Attribute catalog wire validation cost with the actual compiled probe
        env:
          VONK_WIRE_PROBE_TIMINGS: "1"
        run: |
          set -euo pipefail
          export VONK_INSTALL_START_WIRE_PROBE="${CARGO_TARGET_DIR:-$PWD/target}/debug/examples/install_start_wire_probe"
          uv run --project control --frozen pytest -s -q -n 0 \
            agent_protocol/tests/test_schema2_recipe_rust_compat.py::test_catalog_launch_payloads_are_accepted_by_python_and_rust
      - name: Exercise Controller requests and Spark results together
        run: >-
          uv run --project control --frozen
          python scripts/tests/run_agent_wire_contracts.py -- -q -n 4 --dist loadfile

  rust-platform:
    name: Rust platform integration
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-amd64
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Install Spark-compatible rootless Podman
        uses: ./.github/actions/apt-install
        with:
          packages: aptly aardvark-dns crun dbus-user-session fuse-overlayfs netavark podman slirp4netns uidmap
      # Runner-managed parallel steps share GITHUB_EVENT_PATH with later
      # artifact uploads; keep these serial (test_workflow_event_context.py).
      - name: Test bounded aptly state compaction
        env:
          VONK_CI_PREREQUISITES: needs_aptly
        run: >-
          uv run --project control --frozen
          pytest -q tests/scripts/test_agent_apt_compaction_integration.py
      - name: Test Spark rootless Podman OCI import
        run: >-
          cargo test --locked -p vonk-agent --test recipe_builder
          faithful_untagged_oci_layout_loads_with_spark_podman -- --exact
      - name: Verify controller host-helper authority
        run: >-
          uv run --project control --frozen pytest -q
          control/tests/test_host_helper_authority.py
      - name: Record GPU node service exposure
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 artifacts
          scripts/verify-agent-systemd --json \
            | tee artifacts/vonk-forge-systemd-security.json
      - name: Exercise build egress from the hardened agent service
        shell: bash
        run: |
          set -euo pipefail
          # The helper has no dependencies: compile its real source statically
          # without rebuilding the agent dependency graph for a second target.
          # Match the release profile: abort on panic, optimised.
          rustc --edition=2024 -C panic=abort -C opt-level=3 \
            -C target-feature=+crt-static --crate-type rlib \
            --crate-name vonk_build_egress \
            rust/crates/vonk-build-egress/src/lib.rs \
            --out-dir "$RUNNER_TEMP"
          rustc --edition=2024 -C panic=abort -C opt-level=3 \
            -C target-feature=+crt-static \
            --extern vonk_build_egress="$RUNNER_TEMP/libvonk_build_egress.rlib" \
            rust/crates/vonk-build-egress/src/main.rs \
            -o "$RUNNER_TEMP/vonk-build-egress"
          rustc --edition=2024 -C target-feature=+crt-static \
            rust/crates/vonk-agent/tests/fixtures/build_network_probe.rs \
            -o "$RUNNER_TEMP/build-network-probe"
          cargo test --locked -p vonk-agent --lib --no-run --message-format=json \
            > "$RUNNER_TEMP/egress-test-build.jsonl"
          test_binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "vonk_agent" and .profile.test) | .executable // empty' \
            "$RUNNER_TEMP/egress-test-build.jsonl")
          test -x "$test_binary"
          sudo useradd --create-home --home-dir /var/lib/vonk-forge-agent vonk-agent
          sudo install -d -o vonk-agent -g vonk-agent /run/vonk-forge-agent
          sudo install -D -m 0644 packaging/config/containers-storage.conf \
            /etc/vonk-forge-agent/containers-storage.conf
          sudo install -d -o vonk-agent -g vonk-agent /var/lib/vonk-forge-agent/.config/containers
          printf '[network]\nnetwork_backend = "netavark"\n' \
            | sudo tee /var/lib/vonk-forge-agent/.config/containers/containers.conf >/dev/null
          sudo install -D -m 0755 "$RUNNER_TEMP/vonk-build-egress" \
            /usr/lib/vonk-forge/vonk-build-egress
          sudo install -D -m 0755 "$RUNNER_TEMP/build-network-probe" \
            /usr/lib/vonk-forge/build-network-probe
          sudo install -D -m 0755 "$test_binary" /usr/lib/vonk-forge/egress-tests
          sudo loginctl enable-linger vonk-agent
          sudo systemctl start "user@$(id -u vonk-agent).service"
          sudo systemd-run --wait --pipe --collect --unit=vonk-egress-regression \
            --property=User=vonk-agent --property=ProtectSystem=strict \
            --property=ProtectHome=no --property='InaccessiblePaths=/home /root' \
            --property=PrivateTmp=yes \
            --property=ProtectKernelTunables=yes --property=ProtectKernelLogs=yes \
            --property='ReadWritePaths=/var/lib/vonk-forge-agent /run/vonk-forge-agent' \
            --property=NoNewPrivileges=no --property=RestrictNamespaces=no \
            /usr/lib/vonk-forge/egress-tests \
            recipe_builder::tests::real_egress_boundary_survives_hardened_agent_and_cleans_up \
            --exact --ignored --nocapture
      - name: Upload GPU node service exposure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vonk-agent-systemd-security-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/vonk-forge-systemd-security.json

  generated-clients:
    name: Generated control clients
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: none
          cli-dependencies: "false"
      - name: Install pinned Node.js with generator dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/openapi-client/package-lock.json
      - name: Check deterministic control client generation
        run: scripts/check-generated-determinism

  compose-integration:
    name: Compose integration
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: none
          cli-dependencies: "false"
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the pinned test images once
        run: scripts/pull-test-images postgres caddy tailscale
      - name: Run the complete Compose suite
        run: scripts/test compose

  nas-install:
    # Problems that only release acceptance used to catch (installer output,
    # bundle layout, secret modes and owners, first Controller start, upgrade)
    # fail the pull request instead. It builds the images and the installer
    # from this source and runs the same acceptance code as the release lanes,
    # with no GHCR, R2, signatures or tailnet.
    name: Clean NAS install from source
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.nas_install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_PREFIX: ghcr.io/carstvaartjes/vonk-forge
      IMAGE_TAG: ci-local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          contracts: python
          cli-dependencies: "false"
      - name: Build the portable NAS setup wheel from this source
        shell: bash
        run: |
          set -euo pipefail
          uv build --project nas_setup --wheel --out-dir "$RUNNER_TEMP/nas-wheel"
          shopt -s nullglob
          wheels=("$RUNNER_TEMP/nas-wheel/"vonk_nas_setup-*-py3-none-any.whl)
          test "${#wheels[@]}" -eq 1
          printf 'VONK_ACCEPTANCE_LOCAL_SETUP_WHEEL=%s\n' "${wheels[0]}" >> "$GITHUB_ENV"
      - name: Build the protocol wheel the Controller image carries
        run: scripts/build-control-wheel
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare digest-pinned CI dependency mirrors
        run: scripts/pull-test-images postgres --dockerfile control/Dockerfile --dockerfile deploy/compose/litellm/Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Name the dependency layer day
        id: dependency_day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build the Controller API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: api
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ env.IMAGE_TAG }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-api
      - name: Build the Controller worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: worker
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-worker:${{ env.IMAGE_TAG }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-worker
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify the locked LiteLLM base signature
        run: scripts/verify-litellm-base-signature
      - name: Build the LiteLLM image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/litellm/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-litellm:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=vonk-forge-litellm
      - name: Prove route model_info through the built LiteLLM image
        run: >-
          uv run --project control --frozen python
          tests/acceptance/litellm_model_info_proof.py
          --image "$IMAGE_PREFIX-litellm:$IMAGE_TAG"
          --work "$RUNNER_TEMP/model-info-proof"
      - name: Render the installer payload and the local image overlay
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nas-local"
          install -d -m 0700 "$out"
          scripts/render-dev-compose --channel pinned \
            --output "$out/docker-compose.pinned.yml" \
            --api-image "$IMAGE_PREFIX-api:$IMAGE_TAG" \
            --worker-image "$IMAGE_PREFIX-worker:$IMAGE_TAG" \
            --litellm-image "$IMAGE_PREFIX-litellm:$IMAGE_TAG"
          uv run --project control --frozen python scripts/build-nas-compose-bundle \
            --compose "$out/docker-compose.pinned.yml" --channel dev \
            --output "$out/payload.json"
          # The payload follows the :dev channel and pulls its Vonk images.
          # Point those services at the images just built, never at GHCR.
          {
            echo services:
            for pair in runtime-init:api control-api:api control-worker:worker \
              litellm:litellm; do
              printf '  %s:\n    image: %s-%s:%s\n    pull_policy: never\n' \
                "${pair%%:*}" "$IMAGE_PREFIX" "${pair##*:}" "$IMAGE_TAG"
            done
          } > "$out/overlay.yml"
      - name: Download verified Compose parser fixtures
        shell: bash
        env:
          COMPOSE_LOWER_SHA256: eca30ae32dc451f9e6d6c8ddce078a76f23b355c3ca0ab391d58f59e87c0d310
          COMPOSE_UGREEN_SHA256: a0298760c9772d2c06888fc8703a487c94c3c3b0134adeef830742a2fc7647b4
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/compose-fixtures"
          mkdir -p "$fixture_dir"
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v5.1.3/docker-compose-linux-x86_64 \
            --output "$fixture_dir/docker-compose-v5.1.3"
          printf '%s  %s\n' "$COMPOSE_UGREEN_SHA256" \
            "$fixture_dir/docker-compose-v5.1.3" | sha256sum --check --status
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64 \
            --output "$fixture_dir/docker-compose-v2.24.6"
          printf '%s  %s\n' "$COMPOSE_LOWER_SHA256" \
            "$fixture_dir/docker-compose-v2.24.6" | sha256sum --check --status
          chmod 0755 "$fixture_dir/docker-compose-v5.1.3" \
            "$fixture_dir/docker-compose-v2.24.6"
      - name: Install, start, restart and upgrade a clean NAS bundle
        shell: bash
        env:
          VONK_ACCEPTANCE_COMPOSE_LOWER: ${{ runner.temp }}/compose-fixtures/docker-compose-v2.24.6
          VONK_ACCEPTANCE_COMPOSE_UGREEN: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_REFERENCE_COMPOSE: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_COMPOSE_OVERLAY: ${{ runner.temp }}/nas-local/overlay.yml
          VONK_ACCEPTANCE_SOURCE_SHA: ${{ github.sha }}
          VONK_ACCEPTANCE_LOCAL_PAYLOAD: ${{ runner.temp }}/nas-local/payload.json
          # Not a real key: it only has to be accepted by the installer.
          VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY: sk-pull-request-placeholder
          VONK_ACCEPTANCE_NAS_BIND_IP: 127.0.0.1
          VONK_ACCEPTANCE_NAS_IP: 127.0.0.1
          VONK_ACCEPTANCE_TAILNET_DNS_SUFFIX: acceptance.invalid
          VONK_ACCEPTANCE_TAILSCALE_CONTROL_SERVICE: svc:vonk-forge
          VONK_ACCEPTANCE_TAILSCALE_MODE: disabled
          VONK_ACCEPTANCE_WORKSPACE: ${{ github.workspace }}
        run: scripts/run-with-nas-secret-group uv run --project control --frozen python tests/acceptance/test_fresh_nas_install.py

  agent-package:
    # The package lifecycle script only ran after merge, on push to main.
    # It reads what the agent and the packaging ship, so a change to either
    # can break it. This builds the two packages from this source, signed
    # with a throwaway key, and runs the same script on a native ARM64 runner.
    name: Native ARM64 agent package lifecycle
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.agent_package == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the protocol environment for Cargo builds
        uses: ./.github/actions/protocol-env
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-arm64
      - name: Add the aarch64 target
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup target add aarch64-unknown-linux-gnu
      - name: Install lifecycle test dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: crun fuse-overlayfs iproute2 iptables podman shellcheck slirp4netns uidmap
      - name: Materialize pinned package tools
        run: scripts/materialize-agent-tools --output-root target
      - name: Build the baseline and candidate packages
        run: |
          set -euo pipefail
          while IFS='=' read -r name value; do
            declare "$name=$value"
          done < <(scripts/agent-package-metadata development branch main \
            "$GITHUB_SHA" "$(scripts/dev-publication-sequence "$GITHUB_SHA")")
          key="$RUNNER_TEMP/throwaway-agent-key.pem"
          openssl genpkey -algorithm ed25519 -out "$key"
          # These packages are never published, so their bytes need not be
          # reproducible: any fixed epoch will do.
          epoch=1700000000
          lock_digest=$(sha256sum Cargo.lock | cut -d' ' -f1)
          digest() {
            printf '%s\0%s\0%s\0%s\0%s' "$1" "$GITHUB_SHA" linux-arm64 "$lock_digest" "$2" \
              | sha256sum | cut -d' ' -f1
          }
          export VONK_SOURCE_REVISION="$GITHUB_SHA"
          export VONK_SOURCE_REPOSITORY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          scripts/build-agent-deb --version "$version" --architecture linux-arm64 \
            --build-digest "sha256:$(digest vonk-agent-build-v2 "$version")" \
            --release-private-key "$key" --source-date-epoch "$epoch" \
            --output-dir dist
          scripts/build-agent-deb --acceptance-baseline \
            --version "$baseline_version" --architecture linux-arm64 \
            --build-digest "sha256:$(digest vonk-agent-acceptance-baseline-v1 "$baseline_version")" \
            --release-private-key "$key" --source-date-epoch "$epoch" \
            --output-dir baseline
          rm -f "$key"
          {
            echo "VERSION=$version"
            echo "BASELINE_VERSION=$baseline_version"
          } >> "$GITHUB_ENV"
      - name: Prove source-bound package activation and rollback
        run: |
          set -euo pipefail
          cargo build --locked --package vonk-agent-helper \
            --bin vonk-agent-helper --example package_rollback_probe
          sudo python3 tests/nodes/test_agent_package_rollback_systemd.py \
            --disposable-systemd \
            --helper "$(realpath target/debug/vonk-agent-helper)" \
            --probe "$(realpath target/debug/examples/package_rollback_probe)" \
            | tee package-rollback-acceptance.json
      - name: Prove agent boot recovery after transient host readiness failures
        run: |
          set -euo pipefail
          sudo python3 tests/nodes/test_agent_boot_restart_systemd.py \
            --disposable-systemd \
            | tee agent-boot-recovery-acceptance.json
      - name: Run the native package lifecycle
        run: |
          set -euo pipefail
          sudo scripts/test-agent-package-native-lifecycle linux-arm64 \
            "$(realpath "baseline/vonk-forge-agent_${BASELINE_VERSION}_arm64.deb")" \
            "$(realpath "dist/vonk-forge-agent_${VERSION}_arm64.deb")" \
            "$BASELINE_VERSION" "$VERSION"
      - name: Upgrade the promoted package to this candidate through its own helper
        # The lanes above build baseline and candidate from this tree. This one
        # starts from the promoted dev release package and drives its own
        # helper, sandbox and rollback watchdog over the real socket. It runs
        # last: it needs a systemd host, not a pristine one.
        run: |
          set -euo pipefail
          cargo build --locked --package vonk-agent-helper --example package_grant_probe
          promoted="$RUNNER_TEMP/promoted"
          mkdir -p "$promoted"
          fetch() {
            curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 120 -o "$2" "https://install.vonkforge.ai/$1"
          }
          fetch artifacts/dev/current.manifest "$promoted/current.manifest"
          generation=$(sed -n 's/^generation=\([0-9a-f]\{64\}\)$/\1/p' "$promoted/current.manifest")
          fetch "artifacts/dev/releases/$generation/release.json" "$promoted/release.json"
          fetch "artifacts/dev/releases/$generation/release.sig" "$promoted/release.sig"
          base64 -d "$promoted/release.sig" > "$promoted/release.sig.bin"
          openssl dgst -sha256 -verify install/installer-release-public.pem \
            -signature "$promoted/release.sig.bin" "$promoted/release.json"
          read -r path digest < <(jq -er --arg generation "$generation" \
            'select(.channel == "dev" and .generation == $generation)
              | .artifacts["agent-package-linux-arm64"] | "\(.path) \(.sha256)"' \
            "$promoted/release.json")
          fetch "$path" "$promoted/vonk-forge-agent.deb"
          echo "$digest  $promoted/vonk-forge-agent.deb" | sha256sum --check --strict -
          sudo python3 tests/nodes/test_agent_package_transition_systemd.py \
            --disposable-systemd \
            --promoted "$promoted/vonk-forge-agent.deb" \
            --candidate "$(realpath "dist/vonk-forge-agent_${VERSION}_arm64.deb")" \
            --probe "$(realpath target/debug/examples/package_grant_probe)" \
            | tee package-transition-acceptance.json

  repository-guards:
    name: Repository guards
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
        with:
          cli-dependencies: "false"
      - name: Install shell guard prerequisite
        uses: ./.github/actions/apt-install
        with:
          packages: shellcheck
      - name: Run reviewed repository guards
        shell: bash
        run: |
          set -euo pipefail
          guard_list="$RUNNER_TEMP/repository-guards.txt"
          python3 scripts/repository-guards > "$guard_list"
          mapfile -t guards < "$guard_list"
          uv run --project control --frozen python -m pytest -q -p no:cacheprovider -n auto "${guards[@]}"

  repository-suite:
    name: Complete repository suite (${{ matrix.shard }}-of-${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # Hang bound, well above a shard's runtime.
    timeout-minutes: 40
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    strategy:
      fail-fast: false
      matrix:
        # Timing-balanced shards; the job count is the only owner of the total.
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Install supported completion shells
        uses: ./.github/actions/apt-install
        with:
          packages: zsh
      - name: Receive the tests this change adds or touches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          CHANGED_TESTS: ${{ needs.changes.outputs.changed_tests }}
        run: printf '%s\n' "$CHANGED_TESTS" > "$RUNNER_TEMP/changed-tests.txt"
      - name: Run complete repository suite
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          TIMING_DATA: ${{ needs.changes.outputs.repository_timings }}
          VONK_SYNTHETIC_CANARY_INDEX: tests/fixtures/canonical-synthetic-canary/index.json
        run: |
          set -euo pipefail
          timing_file="$RUNNER_TEMP/pytest-durations.json"
          printf '%s\n' "$TIMING_DATA" > "$timing_file"
          enforce=()
          if [[ -f "$RUNNER_TEMP/changed-tests.txt" ]]; then
            enforce=(--test-budget-enforce "$RUNNER_TEMP/changed-tests.txt")
          fi
          scripts/test repository --shard "$SHARD/$SHARD_TOTAL" \
            --durations "$timing_file" -- "${enforce[@]}" \
            -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/repository-junit.xml"

      - name: Collect measured file durations
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/repository-junit.xml" ]]; then
            scripts/collect-pytest-file-durations "$RUNNER_TEMP/repository-junit.xml" \
              --root . --output "$RUNNER_TEMP/repository-durations.json"
          fi
      - name: Upload measured file durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-file-durations-repository-${{ matrix.shard }}
          path: ${{ runner.temp }}/repository-durations.json
          retention-days: 30
          if-no-files-found: ignore

  consumer-probe:
    # Builds the native parser, HTTP client and state probe from this exact
    # source and runs the consumer corpus boundaries against it here, so the
    # control shards start without waiting for a Cargo build.
    name: Build actual native consumer probe
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out exact suite source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare locked Python environment
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-amd64
      - name: Build actual canonical parser, HTTP client and state probe
        shell: bash
        run: |
          set -euo pipefail
          scripts/retry-dependency-fetch cargo fetch --locked
          uv run --project control --frozen python scripts/generate-agent-wire
          cargo build --locked --package vonk-agent --example consumer_corpus_probe
      - name: Run the consumer corpus boundaries against the actual probe
        env:
          VONK_CONSUMER_CORPUS_PROBE: ${{ github.workspace }}/target/debug/examples/consumer_corpus_probe
        run: scripts/test corpus

  control-suite:
    name: Complete control suite (${{ matrix.shard }}-of-${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-24.04
    # Hang bound, well above a shard's runtime.
    timeout-minutes: 40
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    strategy:
      fail-fast: false
      matrix:
        # Timing-balanced shards; the job count is the only owner of the total.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Provide the Controller image ingress tool
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the pinned test images once
        run: scripts/pull-test-images postgres python
      - name: Receive the tests this change adds or touches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          CHANGED_TESTS: ${{ needs.changes.outputs.changed_tests }}
        run: printf '%s\n' "$CHANGED_TESTS" > "$RUNNER_TEMP/changed-tests.txt"
      - name: Run complete control suite
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          TIMING_DATA: ${{ needs.changes.outputs.control_timings }}
          VONK_CI_PREREQUISITES: needs_skopeo
        run: |
          set -euo pipefail
          timing_file="$RUNNER_TEMP/pytest-durations.json"
          printf '%s\n' "$TIMING_DATA" > "$timing_file"
          enforce=()
          if [[ -f "$RUNNER_TEMP/changed-tests.txt" ]]; then
            enforce=(--test-budget-enforce "$RUNNER_TEMP/changed-tests.txt")
          fi
          scripts/test control --shard "$SHARD/$SHARD_TOTAL" \
            --durations "$timing_file" -- -vv -n 4 "${enforce[@]}" \
            -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/control-junit.xml"

      - name: Collect measured file durations
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/control-junit.xml" ]]; then
            scripts/collect-pytest-file-durations "$RUNNER_TEMP/control-junit.xml" \
              --root control --output "$RUNNER_TEMP/control-durations.json"
          fi
      - name: Upload measured file durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-file-durations-control-${{ matrix.shard }}
          path: ${{ runner.temp }}/control-durations.json
          retention-days: 30
          if-no-files-found: ignore

  corpus-acceptance:
    # The whole-corpus catalog import into fresh PostgreSQL takes 96-105 s beside
    # the shards' parallel workers and about 71 s alone on a runner (over its
    # 60 s budget). It runs here by itself; the lane reports the budget and does
    # not enforce it. The control shards deselect it.
    name: Corpus acceptance
    needs: changes
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the pinned test images once
        run: scripts/pull-test-images postgres python
      - name: Run the corpus acceptance tests alone
        run: scripts/test acceptance

  control-image-build:
    # Builds the Controller (api) and worker images once, with the buildx GHA
    # cache, then runs the fast built_image checks against them. Those tests
    # are deselected from the control shards and never build an image.
    name: Controller image build tests
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.control == 'true' && needs.changes.outputs.nas_install == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      VONK_TEST_CONTROLLER_IMAGE: vonk-control:ci-test
      VONK_TEST_WORKER_IMAGE: vonk-control-worker:ci-test
      # Collecting control/tests imports the recipe-library modules too.
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Build the protocol wheel the Controller image carries
        run: scripts/build-control-wheel
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare digest-pinned CI dependency mirrors
        run: scripts/pull-test-images --dockerfile control/Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Name the dependency layer day
        id: dependency_day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build the Controller image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: api
          load: true
          tags: ${{ env.VONK_TEST_CONTROLLER_IMAGE }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-api
          # Only main writes the shared cache; pull requests read it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ci-test-vonk-forge-api' || '' }}
      - name: Build the worker image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: worker
          load: true
          tags: ${{ env.VONK_TEST_WORKER_IMAGE }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=ci-test-vonk-forge-worker
          # Only main writes the shared cache; pull requests read it.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ci-test-vonk-forge-worker' || '' }}
      - name: Check the built images
        run: scripts/test images

  web-suite:
    name: Admin web behavior
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Match control/web/package-lock.json; browsers and system libraries are baked in.
    # https://playwright.dev/docs/ci#via-containers
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node.js with admin web dependency cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            control/web/package-lock.json
            tools/openapi-client/package-lock.json
      - name: Install Python for the dependency fetch helper
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Prepare the contract consumers for the web build and the corpus
        # The corpus emission imports the generated Python client, and the
        # web hooks read the generated TypeScript types; one stamped
        # generation here serves both, so the hooks regenerate nothing.
        uses: ./.github/actions/python-env
        with:
          cli-dependencies: "false"
      - name: Install locked admin web dependencies
        run: scripts/retry-dependency-fetch npm ci --prefix control/web
      - name: Emit the actual producer corpus and observation transfers
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=control/src:agent_protocol/src:src \
            uv run --project control --frozen python control/tests/cross_language_consumer_corpus.py --output artifacts/consumer-corpus
          PYTHONPATH=control:control/src:agent_protocol/src:src \
            uv run --project control --frozen python control/tests/export_artifact_workspace_fixture.py --output artifacts/consumer-corpus/artifact-workspace.json
          PYTHONPATH=control:control/src:agent_protocol/src:src \
            uv run --project control --frozen python control/tests/export_observation_transfer_fixtures.py --output artifacts/observation-transfers
      - name: Check out pinned official JSON Schema semantics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: json-schema-org/JSON-Schema-Test-Suite
          ref: 5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8
          path: artifacts/json-schema-suite
          persist-credentials: false
      - name: Install the locked schema compiler dependencies
        run: scripts/retry-dependency-fetch npm ci --prefix tools/openapi-client
      - name: Compile pinned official schemas with the production compiler
        run: python3 scripts/tests/prepare_official_schema_consumers.py --suite artifacts/json-schema-suite
      - name: Check TypeScript lint, formatting and types
        uses: ./.github/actions/web-quality
      - name: Run complete admin web suite against the actual corpus
        env:
          VONK_CONSUMER_CORPUS: ${{ github.workspace }}/artifacts/consumer-corpus/corpus.json
          VONK_OBSERVATION_TRANSFERS: ${{ github.workspace }}/artifacts/observation-transfers/observation-transfers.json
          VONK_CONSUMER_OUTPUT: ${{ github.workspace }}/artifacts/consumer-corpus/browser-exports.json
        run: npm test --prefix control/web -- --run
      - name: Verify browser exports through their actual canonical Python owners
        env:
          PYTHONPATH: control/src:agent_protocol/src:src
        run: uv run --project control --frozen python control/tests/verify_browser_consumer_exports.py --corpus artifacts/consumer-corpus/corpus.json --exports artifacts/consumer-corpus/browser-exports.json
      - name: Build admin web application
        run: npm run build --prefix control/web
      - name: Run fixture-backed Admin browser acceptance
        run: >-
          npm run test:e2e --prefix control/web --
          e2e/admin.spec.ts e2e/feedback.spec.ts e2e/operation-progress.spec.ts
          --project=chromium
      - name: Exercise native browser numeric-source capability and HTTP consumers
        env:
          VONK_OBSERVATION_TRANSFERS: ${{ github.workspace }}/artifacts/observation-transfers/observation-transfers.json
          VONK_CONSUMER_CORPUS: ${{ github.workspace }}/artifacts/consumer-corpus/corpus.json
        run: npm run test:e2e --prefix control/web -- --config playwright.contracts.config.ts
      - name: Validate the native component request with the canonical Python owner
        env:
          PYTHONPATH: control:control/src:agent_protocol/src:src
        run: uv run --project control --frozen python control/tests/export_artifact_workspace_fixture.py --verify-request artifacts/consumer-corpus/artifact-workspace-request.json
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-web-browser-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            control/web/playwright-report
            control/web/test-results

  # The standalone proof workflows run here, selected by the same areas and the
  # same tested commit (the pull request merge commit) as every other job.
  client-compatibility-report:
    # A report, never a gate: a deliberate break is legitimate. It shows, before
    # the deploy, every response shape the published vonkctl would refuse.
    name: Response shapes the published vonkctl would refuse
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare this Controller's bundled CLI contract
        uses: ./.github/actions/python-env
        with:
          contracts: python
          cli-dependencies: "false"
      - name: Report against the published dev and stable vonkctl
        shell: bash
        run: |
          set -euo pipefail
          uv run --project control --frozen python tools/client_compatibility_report.py \
            --candidate src/cluster_profiles/schemas/control-openapi.json \
            --channel dev --channel stable | tee -a "$GITHUB_STEP_SUMMARY"

  installed-cli-proof:
    name: Actual signed wheel update and old CLI to NDJSON Controller bootstrap
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_PRIOR_STABLE_SOURCE_SHA: aeefc93a96fd2bf9c209bbe8d2f3e1bded1b87f8
      VONK_PRIOR_STABLE_CLI_ROOT: ${{ github.workspace }}/.prior-stable-cli
      VONK_TRANSITION_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the frozen prior stable CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: aeefc93a96fd2bf9c209bbe8d2f3e1bded1b87f8
          path: .prior-stable-cli
          persist-credentials: false
      - name: Verify exact proof checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VONK_TRANSITION_SOURCE_SHA"
          test "$(git -C .prior-stable-cli rev-parse HEAD)" = "$VONK_PRIOR_STABLE_SOURCE_SHA"
          git diff --exit-code HEAD --
          git -C .prior-stable-cli diff --exit-code HEAD --
      - name: Provide canonical recipe dependency
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python tooling
        uses: ./.github/actions/python-env
      - name: Prepare isolated locked CLI resolver cache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ensure-project-venv "$RUNNER_TEMP/signed-update-dependencies"
          UV_CACHE_DIR="$RUNNER_TEMP/signed-update-cache" \
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/signed-update-dependencies" \
            scripts/retry-dependency-fetch uv sync --project . --frozen --no-dev --no-install-project
          uv export --project . --frozen --no-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/signed-update-requirements.txt"
          UV_CACHE_DIR="$RUNNER_TEMP/signed-update-cache" \
            scripts/retry-dependency-fetch uv pip install \
              --python "$RUNNER_TEMP/signed-update-dependencies/bin/python" \
              --reinstall --require-hashes -r "$RUNNER_TEMP/signed-update-requirements.txt"
          test -d "$RUNNER_TEMP/signed-update-cache"
      - name: Prove the signed updater, manifest refusal, signed bootstrap and installed NDJSON command
        shell: bash
        env:
          VONK_SIGNED_UPDATE_LANE_ENABLED: '1'
          VONK_SIGNED_UPDATE_CACHE: ${{ runner.temp }}/signed-update-cache
        run: |
          set -euo pipefail
          uv run --project control --frozen pytest -q -n 0 \
            tests/cluster_profiles/test_cli_update.py::test_installed_cli_signed_update_replaces_actual_uv_tool \
            tests/cluster_profiles/test_cli_update.py::test_installed_stable_cli_updates_after_actual_controller_ndjson_transition \
            --junitxml="$RUNNER_TEMP/installed-cli-junit.xml"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          cases = ET.parse(root / 'installed-cli-junit.xml').findall('.//testcase')
          assert cases, "no proof cases executed"
          expected = {
              'test_installed_cli_signed_update_replaces_actual_uv_tool',
              'test_installed_stable_cli_updates_after_actual_controller_ndjson_transition',
          }
          assert expected <= {case.attrib['name'].partition('[')[0] for case in cases}, 'missing required installed CLI case'
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - name: Retain scoped signed updater evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-cli-proof-${{ github.sha }}
          path: ${{ runner.temp }}/installed-cli-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  model-cache-unknown-expiry:
    name: Unknown cancellation expiry through fresh exact artifact claim
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_CACHE_CANCEL_RESPONSE_OUTPUT: ${{ github.workspace }}/model-cache-cancellation-responses.json
      PYTHONPATH: src:control/src:agent_protocol/src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare locked Python dependencies
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull pinned disposable PostgreSQL
        run: scripts/pull-test-images postgres
      - name: Prove shared manifest identity and unknown expiry through fresh admission
        run: >-
          uv run --project control --frozen pytest -q -n 0
          control/tests/test_model_cache_unknown_expiry_recovery.py
          control/tests/test_model_manifest_composition.py
          --tb=short --junitxml=${{ runner.temp }}/model-cache-cancellation.xml
      - name: Require named SQL and manifest outcomes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'model-cache-cancellation.xml').findall('.//testcase')
          assert cases, "no cancellation cases executed"
          expected = {
              'test_unknown_cancel_expiry_restart_admits_fresh_exact_artifact_and_fences_old_owner',
              'test_shared_catalog_files_resume_the_same_parent_after_producer_repair',
          }
          assert expected <= {case.get('name').partition('[')[0] for case in cases}
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - name: Prepare pinned browser consumer toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            control/web/package-lock.json
            tools/openapi-client/package-lock.json
      - name: Generate consumers from the current cancellation owner
        run: |
          scripts/retry-dependency-fetch npm ci --prefix tools/openapi-client
          scripts/generate-control-clients
          scripts/retry-dependency-fetch npm ci --prefix control/web
      - name: Consume actual PostgreSQL/API cancellation observations in browser
        run: |
          npm exec -- vitest run src/components/library/model-cache-cancellation-consumer.test.tsx --reporter=junit --outputFile="$RUNNER_TEMP/model-cache-browser.xml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'model-cache-browser.xml').findall('.//testcase')
          assert cases, "no browser cancellation cases executed"
          assert {'actual model cancellation responses preserve unknown and confirmed evidence in the browser'} <= {case.get('name') for case in cases}
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
        working-directory: control/web

  oci-link-fallback:
    name: Actual EXDEV, visible layout fault and no private copies
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare locked Python environment
        uses: ./.github/actions/python-env
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-amd64
      - name: Generate canonical wire and compile the exact test
        run: |
          scripts/retry-dependency-fetch cargo fetch --locked
          uv run --project control --frozen python scripts/generate-agent-wire
          cargo test --locked --package vonk-agent --lib --no-run
      - name: Mount only the owned model-store fixture and exercise the production hardlink fault
        shell: bash
        run: |
          set -euo pipefail
          data_root=$(mktemp -d "$RUNNER_TEMP/vonk-oci-exdev.XXXXXXXX")
          source_root=$(mktemp -d /dev/shm/vonk-oci-exdev.XXXXXXXX)
          target="$data_root/distribution/models"
          mounted=false
          owned=false
          cleanup() {
            status=$?
            if [ "$mounted" = true ]; then
              sudo umount "$target" || exit 1
            fi
            if [ "$owned" = true ]; then
              rm -rf -- "$data_root" "$source_root"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # Both paths were newly created for this job. Never mount or clean a
          # repository, agent cache, shared data path or pre-existing directory.
          case "$data_root" in "$RUNNER_TEMP"/vonk-oci-exdev.*) ;; *) exit 1 ;; esac
          case "$source_root" in /dev/shm/vonk-oci-exdev.*) ;; *) exit 1 ;; esac
          test -d "$data_root" && test ! -L "$data_root"
          test -d "$source_root" && test ! -L "$source_root"
          owned=true
          mkdir -p "$target"
          sudo mount --bind "$source_root" "$target"
          mounted=true
          test "$(stat -c %d "$target")" != "$(stat -c %d "$data_root")"
          export VONK_OCI_CROSS_DEVICE_ROOT="$data_root"
          cargo test --locked --package vonk-agent --lib \
            oci::materialization::tests::real_cross_device_link_failure_reports_layout_without_copy \
            -- --exact --ignored --nocapture --test-threads=1

  privileged-helper-oci-process:
    name: Exercise signed helper pull and start on ARM64
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Pydantic contracts for Cargo builds
        uses: ./.github/actions/python-env
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-arm64
      - name: Install bounded helper proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          scripts/ci-apt-install \
            acl adduser ca-certificates curl systemd-container
          docker info
      - name: Verify canonical installation access under the packaged helper filesystem policy
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 tests/nodes/test_helper_runtime_filesystem.py --disposable-systemd
      - name: Build production helper and compiled-plan probe
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package vonk-agent-helper --bin vonk-agent-helper
          cargo build --locked --release --package vonk-agent \
            --example privileged_oci_process_probe
      - name: Run signed pull and start through the real helper process
        shell: bash
        env:
          VONK_HELPER_BINARY: ${{ github.workspace }}/target/release/vonk-agent-helper
          VONK_HELPER_PROBE_BINARY: ${{ github.workspace }}/target/release/examples/privileged_oci_process_probe
          VONK_HELPER_FIXTURE: ${{ github.workspace }}/control/tests/fixtures/compiled_workload_v2.json
          VONK_HELPER_REPORT_ROOT: ${{ runner.temp }}/vonk-helper-process-proof
        run: |
          set -euo pipefail
          sudo --preserve-env=VONK_HELPER_BINARY,VONK_HELPER_PROBE_BINARY,VONK_HELPER_FIXTURE,VONK_HELPER_REPORT_ROOT \
            tests/acceptance/privileged_helper_oci_process.sh
      - name: Normalize helper proof evidence permissions
        if: always()
        shell: bash
        run: |
          sudo chmod -R a+rX "$RUNNER_TEMP/vonk-helper-process-proof" 2>/dev/null || true
      - name: Upload helper process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privileged-helper-oci-process-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/vonk-helper-process-proof
          if-no-files-found: warn

  profile-effect-consumer:
    name: Real SQL Stop through installed CLI and recipes cleanup
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reviewed recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python and CLI dependencies
        uses: ./.github/actions/python-env
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull pinned disposable PostgreSQL
        run: scripts/pull-test-images postgres
      - name: Exercise connected producer and consumer
        env:
          VONK_RECIPE_EFFECT_CONSUMER_SOURCE: ${{ github.workspace }}/.recipe-library
          VONK_EFFECT_PLATFORM_SOURCE_SHA: ${{ github.sha }}
        run: >-
          uv run --project control --frozen pytest -q -n 0
          control/tests/test_profile_effect_consumer_contract_postgres.py
          --junitxml=${{ runner.temp }}/profile-effect-consumer.xml
      - name: Require the installed CLI and recipes cleanup case
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'profile-effect-consumer.xml').findall('.//testcase')
          assert cases, "no consumer cases executed"
          assert {'test_real_pending_stop_crosses_installed_cli_and_recipes_cleanup'} <= {case.get('name') for case in cases}
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - name: Upload consumer outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-effect-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-effect-consumer.xml
          if-no-files-found: error
          retention-days: 7

  lane-proof:
    name: Exact PR candidate acceptance
    # The candidate costs about 70 runner-minutes; a push that fails lint or a
    # guard, or is superseded within minutes, should not start it.
    needs: [changes, lint, repository-guards]
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.lane == 'true'
    permissions:
      actions: write
      contents: read
      packages: write
    uses: ./.github/workflows/release-acceptance.yml
    with:
      ref: ${{ github.sha }}
      # Every full pull request (an integration PR) carries; a merge-queue
      # commit carries when it changes what the upgrade is made of; main's
      # release carries every merge regardless.
      upgrade_carry: ${{ needs.changes.outputs.upgrade_carry == 'true' }}

  ci-gate:
    name: ${{ (github.event.action == 'labeled' && github.event.label.name != 'release-acceptance') && 'CI gate (label ignored)' || needs.changes.outputs.full == 'false' && 'CI gate (member PR)' || 'CI gate' }}
    needs: [changes, lint, member-web, supply-chain, rust-quality, rust-tests, rust-platform, controller-spark-wire, generated-clients, compose-integration, repository-guards, repository-suite, consumer-probe, control-suite, corpus-acceptance, control-image-build, web-suite, nas-install, agent-package, client-compatibility-report, installed-cli-proof, model-cache-unknown-expiry, oci-link-fallback, privileged-helper-oci-process, profile-effect-consumer, lane-proof]
    if: ${{ always() && !(github.event.action == 'labeled' && github.event.label.name != 'release-acceptance') && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Summarize where this run spent its time
        if: always()
        # The timeline is a summary for people, not evidence the gate decides on:
        # a GitHub API error here must not fail the gate (it did twice on 2026-10-13).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-timeline "$GITHUB_RUN_ID" --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Require selector and selected jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/verify-ci-gate --needs-env NEEDS

      - name: Record the exact source and successful check selection
        # A merge-queue run tests the commit main will carry; its receipt lets
        # the release reuse these checks without running them again. A member
        # run runs no jobs, so it leaves no receipt to reuse.
        if: >-
          needs.changes.outputs.full == 'true' && (github.event_name == 'merge_group' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          SELECTED_AREAS: ${{ toJSON(needs.changes.outputs) }}
        run: scripts/resolve-tested-ci write-receipt --output "$RUNNER_TEMP/ci-tested-source/receipt.json"
      - name: Upload successful source check evidence
        if: >-
          needs.changes.outputs.full == 'true' && (github.event_name == 'merge_group' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tested-source-v3
          path: ${{ runner.temp }}/ci-tested-source/receipt.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  main-ci-summary:
    name: Main branch CI status summary
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-gate, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report main branch CI result
        env:
          GATE_RESULT: ${{ needs.ci-gate.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Main branch CI"
            echo
            echo "- Result: **$GATE_RESULT**"
            echo "- Supply-chain evidence: **$SUPPLY_CHAIN_RESULT**"
            printf -- '- Commit: %s\n' "$SOURCE_SHA"
            echo "- Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  stable-release:
    name: Stable release
    # Only a signed v* tag pushed through the release workflow publishes the
    # stable channel; the jobs live in stable-release.yml.
    needs: [ci-gate]
    # always(): without a status function GitHub skips this job when any
    # job upstream of ci-gate was skipped (member-web always is on full runs).
    if: >-
      always() &&
      needs.ci-gate.result == 'success' &&
      vars.VONK_CONTAINER_RELEASES_ENABLED == 'true' &&
      vars.VONK_PLATFORM_RELEASES_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    # The union of the called jobs' grants.
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/stable-release.yml
    secrets: inherit
