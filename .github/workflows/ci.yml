name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A new commit supersedes an older PR check. Tag releases use separate groups,
# so one valid version can never evict another version from GitHub's pending
# concurrency slot.
concurrency:
  group: vonk-forge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select CI ownership areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      repository: ${{ steps.areas.outputs.repository }}
      control: ${{ steps.areas.outputs.control }}
      web: ${{ steps.areas.outputs.web }}
      compose: ${{ steps.areas.outputs.compose }}
      generated: ${{ steps.areas.outputs.generated }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select coarse ownership areas
        id: areas
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$GITHUB_SHA" |
              scripts/select-ci-areas --event pull_request --github-output \
                >> "$GITHUB_OUTPUT"
          else
            scripts/select-ci-areas --event "$GITHUB_EVENT_NAME" \
              --github-output </dev/null >> "$GITHUB_OUTPUT"
          fi

  installer-setups:
    name: Build accepted installer setup programs
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/installer-setups.yml

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          # Ruff is executed through uvx and has no project dependency cache.
          # Enabling setup-uv's cache here can fail post-job when no cache path
          # is created; dependency-using jobs below keep caching enabled.
          enable-cache: false
      - name: Run Ruff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed_python < <(
              git diff --name-only --diff-filter=ACMRD "$GITHUB_BASE_SHA" "$GITHUB_SHA" -- '*.py'
            )
            if ((${#changed_python[@]} == 0)); then
              echo "No changed Python files; skipping Ruff"
            else
              uvx --from ruff==0.16.1 ruff check --force-exclude "${changed_python[@]}"
            fi
          else
            uvx --from ruff==0.16.1 ruff check .
          fi

  rust-quality:
    name: Rust workspace lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy,rustfmt
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
      - name: Verify Rust formatting
        run: cargo fmt --all --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust workspace tests (${{ matrix.shard.label }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          - id: non-nas
            label: Agent, protocol, helper, and Spark setup
          - id: nas-setup
            label: NAS setup
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.1
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
          save-if: "false"
      - name: Test complete Rust shard
        shell: bash
        env:
          RUST_TEST_SHARD: ${{ matrix.shard.id }}
        run: |
          set -euo pipefail
          case "$RUST_TEST_SHARD" in
            non-nas)
              cargo test --workspace --exclude vonk-nas-setup --locked
              ;;
            nas-setup)
              cargo test -p vonk-nas-setup --locked
              ;;
            *)
              echo "Unknown Rust test shard: $RUST_TEST_SHARD" >&2
              exit 1
              ;;
          esac

  rust-quality-gate:
    name: Rust workspace quality
    needs: [changes, rust-quality, rust-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Rust lint and every workspace test shard
        env:
          SELECTED: ${{ needs.changes.outputs.rust }}
          LINT_RESULT: ${{ needs.rust-quality.result }}
          TEST_RESULT: ${{ needs.rust-tests.result }}
        run: |
          if [[ "$SELECTED" == true ]]; then
            test "$LINT_RESULT" = success
            test "$TEST_RESULT" = success
          else
            test "$LINT_RESULT" = skipped
            test "$TEST_RESULT" = skipped
          fi

  rust-platform:
    name: Rust platform integration
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.1
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-amd64
          add-job-id-key: "false"
          save-if: "false"
      - name: Install Spark-compatible rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            aptly crun fuse-overlayfs podman uidmap
      - parallel:
          - name: Test bounded aptly state compaction
            run: >-
              uv run --python 3.12 --frozen --with pytest==9.1.1
              pytest -q tests/scripts/test_agent_apt_compaction_integration.py
          - name: Test Spark rootless Podman OCI import
            run: >-
              cargo test --locked -p vonk-agent --test recipe_builder
              faithful_untagged_oci_layout_loads_with_spark_podman -- --exact
          - name: Verify Python protocol parity
            run: >-
              uv run --project agent_protocol --frozen pytest -q
              agent_protocol/tests/test_rust_fixtures.py
          - name: Verify controller host-helper authority
            run: >-
              uv run --project control --frozen pytest -q
              control/tests/test_host_helper_authority.py
          - name: Record GPU node service exposure
            shell: bash
            run: |
              set -euo pipefail
              install -d -m 0755 artifacts
              scripts/verify-agent-systemd --json \
                | tee artifacts/vonk-forge-systemd-security.json
      - name: Upload GPU node service exposure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vonk-agent-systemd-security-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/vonk-forge-systemd-security.json

  rust:
    name: Rust agent contracts
    needs: [changes, rust-quality-gate, rust-platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Rust quality, tests, and platform integration
        env:
          SELECTED: ${{ needs.changes.outputs.rust }}
          QUALITY_RESULT: ${{ needs.rust-quality-gate.result }}
          PLATFORM_RESULT: ${{ needs.rust-platform.result }}
        run: |
          test "$QUALITY_RESULT" = success
          if [[ "$SELECTED" == true ]]; then
            test "$PLATFORM_RESULT" = success
          else
            test "$PLATFORM_RESULT" = skipped
          fi

  generated-clients:
    name: Generated control clients
    needs: changes
    if: needs.changes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Generate the OpenAPI schema without Node tooling
        id: generation
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scripts/generate-control-clients --schema-only
          run_full=false
          if ! git diff --quiet -- control/openapi.json; then
            run_full=true
          elif [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            run_full=true
          elif ! git diff --quiet "$PR_BASE_SHA" "$GITHUB_SHA" -- \
            scripts/generate-control-clients \
            control/openapi-python-client.yaml \
            tools/openapi-client \
            src/cluster_profiles/generated_control \
            control/web/src/api/generated.d.ts; then
            run_full=true
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
      - name: Install pinned Node.js with generator dependency cache
        if: steps.generation.outputs.run_full == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/openapi-client/package-lock.json
      - name: Install pinned TypeScript generator
        if: steps.generation.outputs.run_full == 'true'
        run: npm ci --prefix tools/openapi-client
      - name: Generate language clients once when their contract changed
        if: steps.generation.outputs.run_full == 'true'
        run: scripts/generate-control-clients
      - name: Verify generated client behavior
        run: uv run --project control --frozen --with-editable . pytest tests/control/test_openapi_clients.py -q
      - name: Reject generated drift
        run: git diff --exit-code -- control/openapi.json src/cluster_profiles/generated_control control/web/src/api/generated.d.ts

  compose-integration:
    name: Compose integration
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Pull exact PostgreSQL integration image
        run: >-
          docker pull
          postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
      - name: Run fresh PostgreSQL initialization contract
        env:
          CI: "true"
        run: >-
          uv run --project control --frozen --with-editable . pytest -q
          deploy/compose/tests/test_postgres_init_databases.py
      - parallel:
          - name: Run canonical runtime readiness model contracts
            run: >-
              uv run --project control --frozen --with-editable . pytest -q
              -p no:cacheprovider
              deploy/compose/tests/test_runtime_health_contract.py::test_every_default_service_has_a_service_specific_readiness_probe
              deploy/compose/tests/test_runtime_health_contract.py::test_health_dependencies_are_acyclic_and_wait_only_for_readiness
              deploy/compose/tests/test_runtime_health_contract.py::test_tailscale_browser_forwarding_crosses_only_an_internal_edge
              deploy/compose/tests/test_runtime_health_contract.py::test_default_and_hermes_graphs_are_warning_free_and_do_not_couple_configurator_to_profile
          - name: Run required Tailscale reconciliation contracts
            run: >-
              uv run --project control --frozen --with-editable . pytest -q
              -p no:cacheprovider
              deploy/compose/tests/test_tailscale.py
          - name: Run required PKI and TLS container integration
            env:
              CI: "true"
            run: >-
              uv run --project control --frozen --with-editable . pytest -q
              -p no:cacheprovider
              deploy/compose/tests/test_pki_tls_integration.py

  repository-suite:
    name: Complete repository suite (${{ matrix.shard.label }})
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: 1-of-3}
          - {index: 1, label: 2-of-3}
          - {index: 2, label: 3-of-3}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Run complete repository suite
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard.index }}
          SHARD_TOTAL: 3
        run: |
          set -euo pipefail
          collection=$(mktemp)
          trap 'rm -f "$collection"' EXIT
          uv run --python 3.12 --frozen --with pytest==9.1.1 \
            pytest --collect-only -q > "$collection"
          mapfile -t shard_files < <(
            awk '
              /^tests\/.*::/ &&
              $0 !~ /^tests\/control\/test_openapi_clients\.py::/
            ' "$collection" |
              scripts/select-pytest-shard-files \
                --index "$SHARD_INDEX" --total "$SHARD_TOTAL"
          )
          ((${#shard_files[@]} > 0))
          uv run --python 3.12 --frozen --with pytest==9.1.1 \
            pytest -q --basetemp="$RUNNER_TEMP/repository-pytest" \
            "${shard_files[@]}"

  control-suite:
    name: Complete control suite (${{ matrix.shard.label }})
    needs: changes
    if: needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {index: 0, label: 1-of-3}
          - {index: 1, label: 2-of-3}
          - {index: 2, label: 3-of-3}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Run complete control suite
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard.index }}
          SHARD_TOTAL: 3
        run: |
          set -euo pipefail
          collection=$(mktemp)
          trap 'rm -f "$collection"' EXIT
          uv run --python 3.12 --project control --frozen --with-editable . \
            pytest --collect-only -q control/tests > "$collection"
          mapfile -t shard_files < <(
            awk '/^tests\/.*::/' "$collection" |
              scripts/select-pytest-shard-files \
                --index "$SHARD_INDEX" --total "$SHARD_TOTAL" \
                --prefix control/
          )
          ((${#shard_files[@]} > 0))
          uv run --python 3.12 --project control --frozen --with-editable . \
            --with pytest-xdist==3.8.0 pytest -q -n 4 --dist loadfile \
            "${shard_files[@]}"

  web-suite:
    name: Admin web behavior
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node.js with admin web dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control/web/package-lock.json
      - name: Install locked admin web dependencies
        run: npm ci --prefix control/web
      - name: Run complete admin web suite
        run: npm test --prefix control/web -- --run
      - name: Build admin web application
        run: npm run build --prefix control/web
      - name: Install pinned Chromium browser
        run: npm exec --prefix control/web -- playwright install --with-deps chromium
      - name: Run fixture-backed browser acceptance
        run: npm run test:e2e --prefix control/web -- --project=chromium
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-web-browser-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            control/web/playwright-report
            control/web/test-results

  catalog-runtime:
    name: Catalog and service suites
    needs: [changes, repository-suite, control-suite, web-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every complete service suite
        env:
          REPOSITORY_SELECTED: ${{ needs.changes.outputs.repository }}
          CONTROL_SELECTED: ${{ needs.changes.outputs.control }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          REPOSITORY_RESULT: ${{ needs.repository-suite.result }}
          CONTROL_RESULT: ${{ needs.control-suite.result }}
          WEB_RESULT: ${{ needs.web-suite.result }}
        run: |
          require_selected_result() {
            local selected="$1"
            local result="$2"
            if [[ "$selected" == true ]]; then
              test "$result" = success
            else
              test "$result" = skipped
            fi
          }
          require_selected_result "$REPOSITORY_SELECTED" "$REPOSITORY_RESULT"
          require_selected_result "$CONTROL_SELECTED" "$CONTROL_RESULT"
          require_selected_result "$WEB_SELECTED" "$WEB_RESULT"

  ci-gate:
    name: CI gate
    needs: [changes, lint, rust, generated-clients, compose-integration, repository-suite, control-suite, web-suite, catalog-runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selector and selected jobs
        shell: bash
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
          SELECTED_RUST: ${{ needs.changes.outputs.rust }}
          SELECTED_REPOSITORY: ${{ needs.changes.outputs.repository }}
          SELECTED_CONTROL: ${{ needs.changes.outputs.control }}
          SELECTED_WEB: ${{ needs.changes.outputs.web }}
          SELECTED_GENERATED: ${{ needs.changes.outputs.generated }}
          SELECTED_COMPOSE: ${{ needs.changes.outputs.compose }}
          LINT_RESULT: ${{ needs.lint.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          REPOSITORY_RESULT: ${{ needs.repository-suite.result }}
          CONTROL_RESULT: ${{ needs.control-suite.result }}
          WEB_RESULT: ${{ needs.web-suite.result }}
          GENERATED_RESULT: ${{ needs.generated-clients.result }}
          COMPOSE_RESULT: ${{ needs.compose-integration.result }}
          CATALOG_RESULT: ${{ needs.catalog-runtime.result }}
        run: |
          set -euo pipefail
          scripts/verify-ci-gate \
            --selector-result "$SELECTOR_RESULT" \
            --selected "rust=$SELECTED_RUST" \
            --selected "repository=$SELECTED_REPOSITORY" \
            --selected "control=$SELECTED_CONTROL" \
            --selected "web=$SELECTED_WEB" \
            --selected "generated=$SELECTED_GENERATED" \
            --selected "compose=$SELECTED_COMPOSE" \
            --result "lint=$LINT_RESULT" \
            --result "rust=$RUST_RESULT" \
            --result "repository=$REPOSITORY_RESULT" \
            --result "control=$CONTROL_RESULT" \
            --result "web=$WEB_RESULT" \
            --result "generated=$GENERATED_RESULT" \
            --result "compose=$COMPOSE_RESULT" \
            --result "catalog-runtime=$CATALOG_RESULT"

  release-metadata:
    name: Validate container release tag
    if: >-
      needs.lint.result == 'success' &&
      needs.rust.result == 'success' &&
      needs.generated-clients.result == 'success' &&
      needs.compose-integration.result == 'success' &&
      needs.catalog-runtime.result == 'success' &&
      vars.VONK_CONTAINER_RELEASES_ENABLED == 'true' &&
      vars.VONK_PLATFORM_RELEASES_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [lint, rust, generated-clients, compose-integration, catalog-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      next_version: ${{ steps.release.outputs.next_version }}
      baseline_version: ${{ steps.release.outputs.baseline_version }}
      arm64_package: ${{ steps.release.outputs.arm64_package }}
      arm64_baseline_package: ${{ steps.release.outputs.arm64_baseline_package }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      baseline_artifact_name: ${{ steps.release.outputs.baseline_artifact_name }}
      channel: ${{ steps.release.outputs.channel }}
      image_version_tag: ${{ steps.release.outputs.image_version_tag }}
      commit_tag: ${{ steps.release.outputs.commit_tag }}
      dev_tag: ${{ steps.release.outputs.dev_tag }}
      latest_alias: ${{ steps.release.outputs.latest_alias }}
      api_image: ${{ steps.release.outputs.api_image }}
      worker_image: ${{ steps.release.outputs.worker_image }}
      api_dev_source: ${{ steps.release.outputs.api_dev_source }}
      worker_dev_source: ${{ steps.release.outputs.worker_dev_source }}
      hermes_image: ${{ steps.release.outputs.hermes_image }}
      litellm_image: ${{ steps.release.outputs.litellm_image }}
      litellm_dev_source: ${{ steps.release.outputs.litellm_dev_source }}
      tag_oid: ${{ steps.authority.outputs.tag_oid }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed accepted release tag
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          [[ $(git cat-file -t "$tag_ref") == tag ]]
          allowed_signers="$RUNNER_TEMP/release-allowed-signers"
          git show refs/remotes/origin/main:.github/release-allowed-signers \
            > "$allowed_signers"
          test -s "$allowed_signers"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$allowed_signers" \
            verify-tag "$tag_ref"
          [[ $(git rev-list -n 1 "$tag_ref") == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          tag_oid=$(git rev-parse --verify "$tag_ref")
          scripts/verify-release-tag-authority \
            "$GITHUB_REF_NAME" "$tag_oid" "$GITHUB_SHA"
          printf 'tag_oid=%s\n' "$tag_oid" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          scripts/container-release-metadata \
            "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"
          scripts/agent-package-metadata \
            production "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" 0 \
            >> "$GITHUB_OUTPUT"

  build-agent-package:
    name: Build, attest, and lifecycle-test ARM64 Spark agent
    if: needs.release-metadata.result == 'success'
    needs: [release-metadata]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: agent-release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      arm64_package: ${{ steps.package.outputs.arm64_package }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      baseline_version: ${{ steps.package.outputs.baseline_version }}
      arm64_baseline_package: ${{ steps.package.outputs.arm64_baseline_package }}
      baseline_artifact_name: ${{ steps.package.outputs.baseline_artifact_name }}
    steps:
      - name: Check out exact package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and attest ARM64 release agent package
        id: package
        uses: ./.github/actions/agent-package-build
        with:
          channel: stable
          publication_sequence: '0'
          version: ${{ needs.release-metadata.outputs.version }}
          next_version: ${{ needs.release-metadata.outputs.next_version }}
          baseline_version: ${{ needs.release-metadata.outputs.baseline_version }}
          arm64_package: ${{ needs.release-metadata.outputs.arm64_package }}
          arm64_baseline_package: ${{ needs.release-metadata.outputs.arm64_baseline_package }}
          artifact_name: ${{ needs.release-metadata.outputs.artifact_name }}
          baseline_artifact_name: ${{ needs.release-metadata.outputs.baseline_artifact_name }}
          environment: agent-release
          source_sha: ${{ github.sha }}
          tag_name: ${{ github.ref_name }}
          tag_oid: ${{ needs.release-metadata.outputs.tag_oid }}
          expected_fingerprint: ${{ vars.VONK_AGENT_RELEASE_KEY_FINGERPRINT }}
          release_private_key: ${{ secrets.VONK_AGENT_RELEASE_PRIVATE_KEY }}
          security_gate_mode: inline
          binary_source_mode: compile
          lifecycle_gate_mode: inline

  validate-release-images:
    name: Validate accepted release images
    needs: [lint, generated-clients, compose-integration, release-metadata, build-agent-package]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      litellm_digest: ${{ steps.litellm.outputs.digest }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public image inputs
        run: scripts/verify-public-image-inputs
      - name: Verify supply-chain evidence
        run: scripts/verify-supply-chain --json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Validate accepted API image
        id: api
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          DEV_SOURCE: ${{ needs.release-metadata.outputs.api_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$API_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/api-attestation.json"
          skopeo inspect --config "docker://$API_IMAGE@$digest" \
            | jq -e --arg revision "$GITHUB_SHA" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              '(.config.Labels["org.opencontainers.image.revision"] == $revision)
               and (.config.Labels["org.opencontainers.image.source"] == $source)' \
              >/dev/null
          docker buildx imagetools inspect "$API_IMAGE@$digest" \
            --format '{{ json .Provenance }}' \
            | jq -e --arg revision "$GITHUB_SHA" \
              '([.. | objects | select(
                  ((.predicateType? // "") | startswith("https://slsa.dev/provenance/"))
                  or (((.SLSA?.buildType? // "") | length) > 0)
                  or (((.buildDefinition?.buildType? // "") | length) > 0)
                )] | length > 0)
               and ([.. | strings | select(. == $revision)] | length > 0)' \
              >/dev/null
          docker buildx imagetools inspect "$API_IMAGE@$digest" \
            --format '{{ json .SBOM }}' \
            | jq -e '[.. | objects | select(
                .SPDXID? == "SPDXRef-DOCUMENT"
                and ((.spdxVersion? // "") | startswith("SPDX-"))
              )] | length > 0' >/dev/null
          inspect_error="$RUNNER_TEMP/api-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable API release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "API release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Validate accepted worker image
        id: worker
        shell: bash
        env:
          DEV_SOURCE: ${{ needs.release-metadata.outputs.worker_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$WORKER_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/worker-attestation.json"
          skopeo inspect --config "docker://$WORKER_IMAGE@$digest" \
            | jq -e --arg revision "$GITHUB_SHA" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              '(.config.Labels["org.opencontainers.image.revision"] == $revision)
               and (.config.Labels["org.opencontainers.image.source"] == $source)' \
              >/dev/null
          docker buildx imagetools inspect "$WORKER_IMAGE@$digest" \
            --format '{{ json .Provenance }}' \
            | jq -e --arg revision "$GITHUB_SHA" \
              '([.. | objects | select(
                  ((.predicateType? // "") | startswith("https://slsa.dev/provenance/"))
                  or (((.SLSA?.buildType? // "") | length) > 0)
                  or (((.buildDefinition?.buildType? // "") | length) > 0)
                )] | length > 0)
               and ([.. | strings | select(. == $revision)] | length > 0)' \
              >/dev/null
          docker buildx imagetools inspect "$WORKER_IMAGE@$digest" \
            --format '{{ json .SBOM }}' \
            | jq -e '[.. | objects | select(
                .SPDXID? == "SPDXRef-DOCUMENT"
                and ((.spdxVersion? // "") | startswith("SPDX-"))
              )] | length > 0' >/dev/null
          inspect_error="$RUNNER_TEMP/worker-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable worker release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "worker release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Validate accepted LiteLLM image
        id: litellm
        shell: bash
        env:
          DEV_SOURCE: ${{ needs.release-metadata.outputs.litellm_dev_source }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}
        run: |
          set -euo pipefail
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$DEV_SOURCE")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh attestation verify "oci://$LITELLM_IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/litellm-attestation.json"
          skopeo inspect --config "docker://$LITELLM_IMAGE@$digest" \
            | jq -e --arg revision "$GITHUB_SHA" \
              --arg source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              '(.config.Labels["org.opencontainers.image.revision"] == $revision)
               and (.config.Labels["org.opencontainers.image.source"] == $source)' \
              >/dev/null
          docker buildx imagetools inspect "$LITELLM_IMAGE@$digest" \
            --format '{{ json .Provenance }}' \
            | jq -e --arg revision "$GITHUB_SHA" \
              '([.. | objects | select(
                  ((.predicateType? // "") | startswith("https://slsa.dev/provenance/"))
                  or (((.SLSA?.buildType? // "") | length) > 0)
                  or (((.buildDefinition?.buildType? // "") | length) > 0)
                )] | length > 0)
               and ([.. | strings | select(. == $revision)] | length > 0)' \
              >/dev/null
          docker buildx imagetools inspect "$LITELLM_IMAGE@$digest" \
            --format '{{ json .SBOM }}' \
            | jq -e '[.. | objects | select(
                .SPDXID? == "SPDXRef-DOCUMENT"
                and ((.spdxVersion? // "") | startswith("SPDX-"))
              )] | length > 0' >/dev/null
          inspect_error="$RUNNER_TEMP/litellm-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$LITELLM_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$digest" ]] || {
              echo "refusing to overwrite immutable LiteLLM release tag" >&2
              exit 1
            }
          elif ! grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            echo "LiteLLM release tag lookup failed" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Publish public container images
    needs: [validate-release-images, release-metadata]
    runs-on: ubuntu-latest
    environment: platform-release
    concurrency:
      group: vonk-forge-container-publication-${{ needs.release-metadata.outputs.version }}
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      hermes_digest: ${{ steps.hermes.outputs.digest }}
      litellm_digest: ${{ steps.litellm.outputs.digest }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Revalidate release authority before registry authentication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate release authority before API publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Promote accepted API image
        id: api
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          DIGEST: ${{ needs.validate-release-images.outputs.api_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/api-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable API release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$API_IMAGE:$IMAGE_VERSION_TAG" "$API_IMAGE@$DIGEST"
          else
            echo "API release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Revalidate release authority before worker publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Promote accepted worker image
        id: worker
        shell: bash
        env:
          DIGEST: ${{ needs.validate-release-images.outputs.worker_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/worker-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable worker release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$WORKER_IMAGE:$IMAGE_VERSION_TAG" "$WORKER_IMAGE@$DIGEST"
          else
            echo "worker release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Revalidate release authority before LiteLLM publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Promote accepted LiteLLM image
        id: litellm
        shell: bash
        env:
          DIGEST: ${{ needs.validate-release-images.outputs.litellm_digest }}
          IMAGE_VERSION_TAG: ${{ needs.release-metadata.outputs.image_version_tag }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_error="$RUNNER_TEMP/litellm-version-inspect-error"
          if observed=$(skopeo inspect --format '{{.Digest}}' \
            "docker://$LITELLM_IMAGE:$IMAGE_VERSION_TAG" 2>"$inspect_error"); then
            [[ "$observed" == "$DIGEST" ]] || {
              echo "refusing to overwrite immutable LiteLLM release tag" >&2
              exit 1
            }
          elif grep -Eiq 'manifest unknown|name unknown|not found' \
            "$inspect_error"; then
            docker buildx imagetools create \
              --tag "$LITELLM_IMAGE:$IMAGE_VERSION_TAG" "$LITELLM_IMAGE@$DIGEST"
          else
            echo "LiteLLM release tag lookup failed" >&2
            exit 1
          fi
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$LITELLM_IMAGE:$IMAGE_VERSION_TAG") == "$DIGEST" ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Reconcile existing Hermes release image
        id: existing-hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
        run: |
          scripts/reconcile-hermes-release-image \
            "$HERMES_AGENT_IMAGE" "$RELEASE_VERSION" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" \
            "refs/tags/$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Revalidate release authority before Hermes publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Build and push Hermes image
        id: hermes-build
        if: steps.existing-hermes.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/compose/hermes-agent
          file: deploy/compose/hermes-agent/Dockerfile
          target: managed
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}
            ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.commit_tag }}
          labels: |
            org.opencontainers.image.title=vonk-forge-hermes
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
      - name: Attest Hermes release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.release-metadata.outputs.hermes_image }}
          subject-digest: ${{ steps.existing-hermes.outputs.digest || steps.hermes-build.outputs.digest }}
          push-to-registry: true
      - name: Verify and record Hermes release image
        id: hermes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
        run: |
          scripts/reconcile-hermes-release-image \
            "$HERMES_AGENT_IMAGE" "$RELEASE_VERSION" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" \
            "refs/tags/$GITHUB_REF_NAME" --require-attestation --repair-tags \
            >> "$GITHUB_OUTPUT"
      - name: Write digest-pinned image summary
        shell: bash
        run: |
          {
            echo '```dotenv'
            printf '%s\n' \
              "CONTROL_API_IMAGE=${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.api.outputs.digest }}" \
              "CONTROL_WORKER_IMAGE=${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.worker.outputs.digest }}" \
              "HERMES_AGENT_IMAGE=${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}@${{ steps.hermes.outputs.digest }}" \
              "LITELLM_IMAGE=${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.litellm.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render canonical production Compose
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 release-output
          scripts/render-production-compose \
            --output release-output/docker-compose.production.yml \
            --api-image "${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.api.outputs.digest }}" \
            --worker-image "${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.worker.outputs.digest }}" \
            --hermes-image "${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}@${{ steps.hermes.outputs.digest }}" \
            --litellm-image "${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.litellm.outputs.digest }}"
          scripts/render-production-compose --channel pinned \
            --output release-output/docker-compose.pinned.yml \
            --api-image "${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.api.outputs.digest }}" \
            --worker-image "${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.worker.outputs.digest }}" \
            --hermes-image "${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}@${{ steps.hermes.outputs.digest }}" \
            --litellm-image "${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}@${{ steps.litellm.outputs.digest }}"
      - name: Upload production Compose
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            release-output/docker-compose.production.yml
            release-output/docker-compose.pinned.yml

  release-manifest:
    name: Publish container release manifest
    needs: [release-metadata, publish-images, build-agent-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download platform publication evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-build-${{ needs.release-metadata.outputs.version }}
          path: release-output
      - name: Download verified agent package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-agent-package.outputs.artifact_name }}
          path: release-output/agent-package
      - name: Create digest-pinned image environment
        env:
          CONTROL_API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          CONTROL_WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          HERMES_AGENT_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}:${{ needs.release-metadata.outputs.version }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}:${{ needs.release-metadata.outputs.image_version_tag }}
          CONTROL_API_DIGEST: ${{ needs.publish-images.outputs.api_digest }}
          CONTROL_WORKER_DIGEST: ${{ needs.publish-images.outputs.worker_digest }}
          HERMES_AGENT_DIGEST: ${{ needs.publish-images.outputs.hermes_digest }}
          LITELLM_DIGEST: ${{ needs.publish-images.outputs.litellm_digest }}
        run: |
          scripts/validate-container-release-digests
          printf '%s\n' \
            "CONTROL_API_IMAGE=$CONTROL_API_IMAGE@$CONTROL_API_DIGEST" \
            "CONTROL_WORKER_IMAGE=$CONTROL_WORKER_IMAGE@$CONTROL_WORKER_DIGEST" \
            "HERMES_AGENT_IMAGE=$HERMES_AGENT_IMAGE@$HERMES_AGENT_DIGEST" \
            "LITELLM_IMAGE=$LITELLM_IMAGE@$LITELLM_DIGEST" \
            > vonk-forge-images.env
          sha256sum vonk-forge-images.env > vonk-forge-images.env.sha256
      - name: Revalidate release authority before GitHub Release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_OID: ${{ needs.release-metadata.outputs.tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TAG_NAME" "$TAG_OID" "$SOURCE_SHA"

      - name: Create public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM64_PACKAGE: ${{ needs.build-agent-package.outputs.arm64_package }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-agent-package.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$ARM64_PACKAGE" == "vonk-forge-agent_${VERSION}_arm64.deb" ]]
          release_assets=(
            "release-output/agent-package/$ARM64_PACKAGE"
            "release-output/agent-package/vonk-forge-systemd-security.json"
          )
          for package in "$ARM64_PACKAGE"; do
            architecture=${package%.deb}
            architecture=${architecture##*_}
            release_assets+=(
              "release-output/agent-package/${package}.sha256"
              "release-output/agent-package/${package}.host.sig"
              "release-output/agent-package/vonk-forge-agent_${VERSION}_${architecture}.sbom.cdx.json"
              "release-output/agent-package/vonk-forge-agent_${VERSION}_${architecture}.sbom.spdx.json"
              "release-output/agent-package/vonk-forge-agent_${VERSION}_${architecture}.provenance.json"
              "release-output/agent-package/${package}.sigstore.json"
            )
          done
          mapfile -t expected_names < <(
            printf '%s\n' "${release_assets[@]##*/}" | LC_ALL=C sort
          )
          mapfile -t actual_names < <(
            find release-output/agent-package -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${actual_names[*]}" != "${expected_names[*]}" ]]; then
            echo "refusing unexpected agent package release asset set" >&2
            printf 'expected: %s\nactual: %s\n' \
              "${expected_names[*]}" "${actual_names[*]}" >&2
            exit 1
          fi
          for asset in "${release_assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" ]]
          done
          scripts/reconcile-github-release \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$SOURCE_SHA" \
            "Vonk Forge $VERSION" \
            vonk-forge-images.env vonk-forge-images.env.sha256 \
            release-output/docker-compose.production.yml \
            release-output/docker-compose.pinned.yml \
            "${release_assets[@]}"

  advance-production-aliases:
    name: Advance accepted production channels
    needs: [release-metadata, release-manifest]
    if: needs.release-manifest.result == 'success'
    runs-on: ubuntu-latest
    environment: platform-release
    # Every queued run reconciles the globally newest completed release. A
    # replacement pending run therefore preserves convergence while this
    # shared group prevents concurrent rollback races between release refs.
    concurrency:
      group: vonk-forge-production-alias-reconciliation
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out accepted alias tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Select newest completed signed release
        id: target
        shell: bash
        run: |
          set -euo pipefail
          releases_json="$RUNNER_TEMP/completed-releases.json"
          printf '[]\n' > "$releases_json"
          for page in $(seq 1 10); do
            page_json="$RUNNER_TEMP/completed-releases-$page.json"
            merged_json="$RUNNER_TEMP/completed-releases-merged.json"
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
              > "$page_json"
            jq -e 'type == "array"' "$page_json" >/dev/null
            jq -s '.[0] + .[1]' "$releases_json" "$page_json" \
              > "$merged_json"
            mv "$merged_json" "$releases_json"
            [[ $(jq 'length' "$page_json") -eq 100 ]] || break
          done
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin
          mapfile -t release_tags < <(
            jq -r '.[] | select(
              (.draft | not) and (.prerelease | not) and
              (.immutable == true)
            ) | .tag_name' "$releases_json" \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -Vr
          )
          target_tag=
          for candidate in "${release_tags[@]}"; do
            if git rev-parse --verify "refs/tags/$candidate^{commit}" \
              >/dev/null 2>&1; then
              target_tag=$candidate
              break
            fi
          done
          test -n "$target_tag"
          tag_ref="refs/tags/$target_tag"
          [[ $(git cat-file -t "$tag_ref") == tag ]]
          allowed_signers="$RUNNER_TEMP/release-allowed-signers"
          git show refs/remotes/origin/main:.github/release-allowed-signers \
            > "$allowed_signers"
          test -s "$allowed_signers"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$allowed_signers" \
            verify-tag "$tag_ref"
          target_tag_oid=$(git rev-parse --verify "$tag_ref")
          target_commit=$(git rev-parse --verify "$tag_ref^{commit}")
          [[ "$target_tag_oid" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor \
            "$target_commit" refs/remotes/origin/main
          scripts/verify-release-tag-authority \
            "$target_tag" "$target_tag_oid" "$target_commit"

          evidence_dir="$RUNNER_TEMP/vonk-production-alias-evidence"
          test ! -e "$evidence_dir"
          install -d -m 0700 "$evidence_dir"
          for asset in \
            vonk-forge-images.env \
            vonk-forge-images.env.sha256; do
            mapfile -t asset_urls < <(
              jq -r --arg tag "$target_tag" --arg asset "$asset" '
                [.[] | select(
                  .tag_name == $tag and .immutable == true
                )] as $releases
                | if ($releases | length) == 1 then
                    $releases[0].assets[] | select(.name == $asset)
                    | .browser_download_url
                  else empty end
              ' "$releases_json"
            )
            [[ "${#asset_urls[@]}" -eq 1 ]]
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              "${asset_urls[0]}" --output "$evidence_dir/$asset"
          done
          printf '%s\n' \
            "target_tag=$target_tag" \
            "target_tag_oid=$target_tag_oid" \
            "target_commit=$target_commit" \
            >> "$GITHUB_OUTPUT"

      - name: Revalidate selected authority before evidence credentials
        shell: bash
        env:
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          TARGET_TAG: ${{ steps.target.outputs.target_tag }}
          TARGET_TAG_OID: ${{ steps.target.outputs.target_tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TARGET_TAG" "$TARGET_TAG_OID" "$TARGET_COMMIT"

      - name: Bind release digests to selected source revision and evidence
        id: evidence
        shell: bash
        env:
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          EVIDENCE_DIR: ${{ runner.temp }}/vonk-production-alias-evidence
          GH_TOKEN: ${{ github.token }}
          HERMES_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          TARGET_TAG: ${{ steps.target.outputs.target_tag }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          gh release verify "$TARGET_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null
          for asset in \
            vonk-forge-images.env \
            vonk-forge-images.env.sha256; do
            test -f "$EVIDENCE_DIR/$asset" && test ! -L "$EVIDENCE_DIR/$asset"
            gh release verify-asset "$TARGET_TAG" \
              "$EVIDENCE_DIR/$asset" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done

          mapfile -t checksum_lines \
            < "$EVIDENCE_DIR/vonk-forge-images.env.sha256"
          [[ "${#checksum_lines[@]}" -eq 1 ]]
          read -r expected_hash expected_name <<<"${checksum_lines[0]}"
          [[ "$expected_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_name" == vonk-forge-images.env ]]
          actual_hash=$(sha256sum "$EVIDENCE_DIR/vonk-forge-images.env")
          [[ "${actual_hash%% *}" == "$expected_hash" ]]
          declare -A release_images=()
          while IFS='=' read -r key value; do
            [[ -n "$key" && -n "$value" ]]
            [[ -z "${release_images[$key]+present}" ]]
            case "$key" in
              CONTROL_API_IMAGE|CONTROL_WORKER_IMAGE|HERMES_AGENT_IMAGE|LITELLM_IMAGE)
                release_images["$key"]=$value
                ;;
              *)
                exit 1
                ;;
            esac
          done < "$EVIDENCE_DIR/vonk-forge-images.env"
          [[ "${#release_images[@]}" -eq 4 ]]
          target_version=${TARGET_TAG#v}
          api_reference=${release_images[CONTROL_API_IMAGE]}
          worker_reference=${release_images[CONTROL_WORKER_IMAGE]}
          hermes_reference=${release_images[HERMES_AGENT_IMAGE]}
          litellm_reference=${release_images[LITELLM_IMAGE]}
          [[ "$api_reference" == "$API_IMAGE:$TARGET_TAG@"sha256:* ]]
          [[ "$worker_reference" == "$WORKER_IMAGE:$TARGET_TAG@"sha256:* ]]
          [[ "$hermes_reference" == "$HERMES_IMAGE:$target_version@"sha256:* ]]
          [[ "$litellm_reference" == "$LITELLM_IMAGE:$TARGET_TAG@"sha256:* ]]
          api_digest=${api_reference##*@}
          worker_digest=${worker_reference##*@}
          hermes_digest=${hermes_reference##*@}
          litellm_digest=${litellm_reference##*@}
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$worker_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$hermes_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$litellm_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          for role in api worker hermes litellm; do
            case "$role" in
              api)
                image=$API_IMAGE; digest=$api_digest; tag=$TARGET_TAG
                ;;
              worker)
                image=$WORKER_IMAGE; digest=$worker_digest; tag=$TARGET_TAG
                ;;
              hermes)
                image=$HERMES_IMAGE; digest=$hermes_digest; tag=$target_version
                ;;
              litellm)
                image=$LITELLM_IMAGE; digest=$litellm_digest; tag=$TARGET_TAG
                ;;
            esac
            [[ $(skopeo inspect --format '{{.Digest}}' \
              "docker://$image:$tag") == "$digest" ]]
            skopeo inspect --config "docker://$image@$digest" \
              | jq -e --arg revision "$TARGET_COMMIT" \
                '.config.Labels["org.opencontainers.image.revision"] == $revision' \
                >/dev/null
            docker buildx imagetools inspect "$image@$digest" \
              --format '{{ json .Provenance }}' \
              | jq -e --arg revision "$TARGET_COMMIT" \
                '([.. | strings | select(. == $revision)] | length > 0)' \
                >/dev/null
            if [[ "$role" != hermes ]]; then
              gh attestation verify "oci://$image@$digest" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/dev-images.yml" \
                --signer-digest "$TARGET_COMMIT" \
                --source-digest "$TARGET_COMMIT" \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners >/dev/null
            fi
          done
          printf '%s\n' \
            "target_version=$target_version" \
            "api_digest=$api_digest" \
            "worker_digest=$worker_digest" \
            "hermes_digest=$hermes_digest" \
            "litellm_digest=$litellm_digest" \
            >> "$GITHUB_OUTPUT"

      - name: Revalidate selected authority before registry authentication
        shell: bash
        env:
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          TARGET_TAG: ${{ steps.target.outputs.target_tag }}
          TARGET_TAG_OID: ${{ steps.target.outputs.target_tag_oid }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TARGET_TAG" "$TARGET_TAG_OID" "$TARGET_COMMIT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile the newest completed production release
        shell: bash
        env:
          API_DIGEST: ${{ steps.evidence.outputs.api_digest }}
          API_IMAGE: ${{ needs.release-metadata.outputs.api_image }}
          HERMES_DIGEST: ${{ steps.evidence.outputs.hermes_digest }}
          HERMES_IMAGE: ${{ needs.release-metadata.outputs.hermes_image }}
          LITELLM_DIGEST: ${{ steps.evidence.outputs.litellm_digest }}
          LITELLM_IMAGE: ${{ needs.release-metadata.outputs.litellm_image }}
          LATEST_ALIAS: ${{ needs.release-metadata.outputs.latest_alias }}
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          TARGET_TAG: ${{ steps.target.outputs.target_tag }}
          TARGET_TAG_OID: ${{ steps.target.outputs.target_tag_oid }}
          TARGET_VERSION: ${{ steps.evidence.outputs.target_version }}
          WORKER_DIGEST: ${{ steps.evidence.outputs.worker_digest }}
          WORKER_IMAGE: ${{ needs.release-metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          scripts/verify-release-tag-authority \
            "$TARGET_TAG" "$TARGET_TAG_OID" "$TARGET_COMMIT"
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$TARGET_TAG") == "$API_DIGEST" ]]
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$TARGET_TAG") == "$WORKER_DIGEST" ]]
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$HERMES_IMAGE:$TARGET_VERSION") == "$HERMES_DIGEST" ]]
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$LITELLM_IMAGE:$TARGET_TAG") == "$LITELLM_DIGEST" ]]
          scripts/promote-image-aliases \
            "$API_IMAGE" "$API_DIGEST" \
            "$WORKER_IMAGE" "$WORKER_DIGEST" "$LATEST_ALIAS" \
            "$HERMES_IMAGE" "$HERMES_DIGEST" \
            "$LITELLM_IMAGE" "$LITELLM_DIGEST" \
            --postcondition scripts/verify-production-alias-postconditions \
            "$TARGET_TAG" "$TARGET_TAG_OID" "$TARGET_COMMIT"

  publish-apt:
    name: Publish verified ARM64 Spark agent package to apt
    needs: [release-metadata, build-agent-package, release-manifest]
    if: needs.release-manifest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: apt-release
    concurrency:
      group: vonk-forge-agent-apt-stable
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out apt publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish verified ARM64 Spark agent package
        uses: ./.github/actions/agent-apt-publish
        with:
          channel: stable
          version: ${{ needs.build-agent-package.outputs.version }}
          arm64_package: ${{ needs.build-agent-package.outputs.arm64_package }}
          artifact_name: ${{ needs.build-agent-package.outputs.artifact_name }}
          environment: apt-release
          source_sha: ${{ github.sha }}
          tag_name: ${{ github.ref_name }}
          tag_oid: ${{ needs.release-metadata.outputs.tag_oid }}
          apt_gpg_passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}
          apt_repository_gpg_fingerprint: ${{ vars.APT_REPOSITORY_GPG_FINGERPRINT }}
          apt_repository_gpg_private_key: ${{ secrets.APT_REPOSITORY_GPG_PRIVATE_KEY }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_apt_public_bucket: ${{ vars.R2_APT_PUBLIC_BUCKET }}
          r2_apt_state_bucket: ${{ vars.R2_APT_STATE_BUCKET }}
