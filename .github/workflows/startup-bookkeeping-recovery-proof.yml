name: Startup bookkeeping recovery proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/startup-bookkeeping-recovery-proof.yml
      - scripts/prove-startup-bookkeeping-counterexample
      - control/tests/test_startup_retained_repair_postgres.py
      - control/src/vonk_control/db.py
      - control/src/vonk_control/legacy_states.py
      - control/src/vonk_control/fleet_profile_adapter_conversion.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-bookkeeping-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Actual adoption SQL fault and same-intent recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_STARTUP_REPAIR_PROOF_OUTPUT: ${{ github.workspace }}/startup-bookkeeping-proof-output
      VONK_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact authored source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Provide canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python dependencies
        uses: ./.github/actions/python-env
      - name: Build canonical recipe library index
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Pull pinned disposable PostgreSQL
        run: scripts/pull-test-images postgres
      - name: Prove the old rethrow would fail at the real row-lock boundary
        run: python scripts/prove-startup-bookkeeping-counterexample
      - name: Prove current startup, repair and exact receipt convergence
        run: |
          uv run --project control --frozen pytest -q -n 0 \
            control/tests/test_startup_retained_repair_postgres.py --tb=short \
            --junitxml="$VONK_STARTUP_REPAIR_PROOF_OUTPUT/current-recovery.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          output = Path(os.environ["VONK_STARTUP_REPAIR_PROOF_OUTPUT"])
          cases = ET.parse(output / "current-recovery.xml").getroot().findall(".//testcase")
          assert len(cases) == 1
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "unexpected skip/failure/error"
          assert (output / "current-recovery.json").is_file()
          PY
          git diff --exit-code -- control/src/vonk_control/db.py
      - name: Upload labeled exact-source proof and retained identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-bookkeeping-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ github.workspace }}/startup-bookkeeping-proof-output
          if-no-files-found: error
          retention-days: 7
