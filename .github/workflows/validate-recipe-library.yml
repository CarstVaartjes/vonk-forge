name: Validate recipe library

on:
  workflow_call:
    inputs:
      platform_ref:
        description: "Exact vonk-forge commit, branch, or release tag to validate against"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable recipe snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Check out recipe library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CarstVaartjes/vonk-forge
          ref: ${{ inputs.platform_ref }}
          path: .vonk-forge

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin the interpreter explicitly. Without it the job resolves the
          # runner's system Python instead of the version this repository
          # declares, so the recipe check would validate on a different
          # interpreter than every other lane.
          python-version: "3.14"
          enable-cache: true

      - name: Require candidate contract source
        run: |
          test -f "$GITHUB_WORKSPACE/contracts/src/vonk_forge_contracts/__init__.py"

      - name: Validate recipe library
        run: |
          uv run --project .vonk-forge/control --frozen \
            .vonk-forge/scripts/validate-recipe-library \
            --library-root "$GITHUB_WORKSPACE" \
            --platform-root "$GITHUB_WORKSPACE/.vonk-forge" \
            --json
