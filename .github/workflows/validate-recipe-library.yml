name: Validate recipe library

on:
  workflow_call:
    inputs:
      platform_ref:
        description: "Exact vonk-forge commit, branch, or release tag to validate against"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable recipe snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Check out recipe library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out platform contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CarstVaartjes/vonk-forge
          ref: ${{ inputs.platform_ref }}
          path: .vonk-forge

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .vonk-forge/.tool-versions
          # Pin the interpreter explicitly. Without it the job resolves the
          # runner's system Python instead of the version this repository
          # declares, so the recipe check would validate on a different
          # interpreter than every other lane.
          python-version: "3.14"
          enable-cache: true

      - name: Build and verify the Controller protocol wheel
        uses: ./.vonk-forge/.github/actions/prepare-control-wheel
        with:
          repository-root: .vonk-forge

      - name: Require candidate contract source
        run: |
          test -f "$GITHUB_WORKSPACE/contracts/src/vonk_forge_contracts/__init__.py"

      # The catalog index and packages are build outputs of the candidate's
      # sources; validate what this checkout produces, not committed copies.
      - name: Build recipe library index and packages
        run: .vonk-forge/scripts/build-recipe-library "$GITHUB_WORKSPACE"

      # The candidate is validated with its own contract source, so a contract
      # change in the recipe repository never waits for the Controller's pin.
      # The validator refuses to run if another contract copy shadows it.
      - name: Validate recipe library
        run: |
          uv run --project .vonk-forge/control --frozen \
            --with-editable "$GITHUB_WORKSPACE/contracts" \
            .vonk-forge/scripts/validate-recipe-library \
            --library-root "$GITHUB_WORKSPACE" \
            --platform-root "$GITHUB_WORKSPACE/.vonk-forge" \
            --json
