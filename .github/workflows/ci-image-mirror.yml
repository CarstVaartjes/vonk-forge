name: CI base image mirrors
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  inputs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.inputs.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inputs
        run: echo "images=$(python3 scripts/ci-image-mirror-inputs)" >> "$GITHUB_OUTPUT"

  mirror:
    needs: inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.inputs.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-install
        with:
          packages: skopeo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy all platforms preserving the exact digest
        env:
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          source=${IMAGE#docker.io/}
          source=${source#library/}
          name=${source%@*}
          name=${name%%:*}
          digest=${source##*@}
          owner=${OWNER,,}
          scripts/retry-dependency-fetch skopeo copy --all --preserve-digests \
            "docker://${name}@${digest}" \
            "docker://ghcr.io/${owner}/ci-mirror/${name}:${digest#sha256:}"

  prune-pull-request-build-caches:
    # Candidate builds keep one Controller build cache per pull request
    # (release-acceptance.yml); a closed pull request's cache has no reader.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Delete the build caches of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prune-pr-build-caches --owner "$GITHUB_REPOSITORY_OWNER" --repository "$GITHUB_REPOSITORY"
