name: Installed profile effect recipes consumer proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/profile-effect-consumer-proof.yml
      - control/tests/test_profile_effect_consumer_contract_postgres.py
      - control/tests/test_profile_stop_effect_adoption_postgres.py
      - control/src/vonk_control/fleet_profiles.py
      - control/src/vonk_control/fleet_profile_contract.py
      - src/cluster_profiles/**
      - control/openapi.json
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: profile-effect-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  connected-consumer:
    name: Real SQL Stop through installed CLI and recipes cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact platform producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out immutable recipes consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CarstVaartjes/vonk-forge-recipes
          ref: a3343cac7ec1747c0ed1a4950d96bc13fc1d6a60
          path: .proof-recipes
          persist-credentials: false
      - name: Verify immutable consumer source
        run: test "$(git -C .proof-recipes rev-parse HEAD)" = a3343cac7ec1747c0ed1a4950d96bc13fc1d6a60
      - name: Prepare locked Python and CLI dependencies
        uses: ./.github/actions/python-env
      - name: Authenticate CI image mirror reads
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull pinned disposable PostgreSQL
        run: scripts/pull-test-images postgres
      - name: Exercise connected producer and consumer
        env:
          VONK_RECIPE_EFFECT_CONSUMER_SOURCE: ${{ github.workspace }}/.proof-recipes
          VONK_EFFECT_PLATFORM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --project control --frozen pytest -q -n 0
          control/tests/test_profile_effect_consumer_contract_postgres.py
          --junitxml=${{ runner.temp }}/profile-effect-consumer.xml
      - name: Require the installed CLI and recipes cleanup case
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'profile-effect-consumer.xml').findall('.//testcase')
          assert cases, "no consumer cases executed"
          assert {'test_real_pending_stop_crosses_installed_cli_and_recipes_cleanup'} <= {case.get('name') for case in cases}
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error'))
          PY
      - name: Upload consumer outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-effect-consumer-${{ github.run_id }}
          path: ${{ runner.temp }}/profile-effect-consumer.xml
          if-no-files-found: error
          retention-days: 7
