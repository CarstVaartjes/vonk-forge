name: Selected profile author continuity proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/selected-profile-author-continuity-proof.yml
      - control/tests/test_selected_profile_authority_continuity_postgres.py
      - control/src/vonk_control/fleet_profiles.py
      - control/src/vonk_control/recipe_operations.py
      - control/src/vonk_control/run_switch_operations.py
      - control/src/vonk_control/auth.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selected-profile-author-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    name: Issued Stop survives revocation and same selection resumes cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_AUTHOR_CONTINUITY_PROOF_OUTPUT: ${{ github.workspace }}/author-continuity-proof-output
      VONK_PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact authored source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind proof provenance to actual checkout and owning source bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source == os.environ["VONK_PROOF_SOURCE_SHA"], "proof checkout differs from declared source"
          paths = (
              "control/tests/test_selected_profile_authority_continuity_postgres.py",
              "control/src/vonk_control/fleet_profiles.py",
              "control/src/vonk_control/recipe_operations.py",
              "control/src/vonk_control/run_switch_operations.py",
              "control/src/vonk_control/auth.py",
              ".github/workflows/selected-profile-author-continuity-proof.yml",
          )
          output = Path(os.environ["VONK_AUTHOR_CONTINUITY_PROOF_OUTPUT"])
          output.mkdir(parents=True, exist_ok=True)
          (output / "source-provenance.json").write_text(json.dumps({
              "source_sha": source,
              "sha256": {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths},
          }, indent=2) + "\n")
          PY
      - name: Provide canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python dependencies
        uses: ./.github/actions/python-env
      - name: Build canonical recipe library index
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Pull pinned disposable PostgreSQL
        run: scripts/pull-test-images postgres
      - name: Prove disabled and demoted original-author recovery
        run: |
          mkdir -p "$VONK_AUTHOR_CONTINUITY_PROOF_OUTPUT"
          uv run --project control --frozen pytest -q -n 0 \
            control/tests/test_selected_profile_authority_continuity_postgres.py --tb=short \
            --junitxml="$VONK_AUTHOR_CONTINUITY_PROOF_OUTPUT/results.xml"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          output = Path(os.environ["VONK_AUTHOR_CONTINUITY_PROOF_OUTPUT"])
          cases = ET.parse(output / "results.xml").getroot().findall(".//testcase")
          assert cases, "no proof cases executed"
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "unexpected skip/failure/error"
          for form in ("disabled", "demoted"):
              assert any(form in case.attrib['name'].partition('[')[2].rstrip(']').split('-') for case in cases), f'no cases executed for {form}'
              proof = json.loads((output / f"{form}.json").read_text())
              assert proof["source_sha"] == os.environ["VONK_PROOF_SOURCE_SHA"]
              assert proof["same_intent_succeeded"] and proof["persisted_due_checks"]
          PY
      - name: Upload exact-source identity and retry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selected-author-continuity-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ github.workspace }}/author-continuity-proof-output
          if-no-files-found: error
          retention-days: 7
