name: Profile admission contention proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/profile-admission-contention-proof.yml
      - control/src/vonk_control/agent_jobs.py
      - control/src/vonk_control/admission_locking.py
      - control/src/vonk_control/fleet_profiles.py
      - control/tests/test_profile_load_submission.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-admission-contention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contention:
    name: Locked parent and child park without holding admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
    steps:
      - name: Check out exact current producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Provide canonical recipe library
        uses: ./.github/actions/recipe-library
      - name: Prepare locked Python dependencies
        uses: ./.github/actions/python-env
      - name: Build canonical recipe library index
        run: scripts/build-recipe-library "$VONK_RECIPE_LIBRARY_ROOT"
      - name: Pull pinned disposable PostgreSQL
        run: scripts/pull-test-images postgres
      - name: Prove both exact contention boundaries
        run: >-
          uv run --project control --frozen pytest -q -n 0
          control/tests/test_profile_load_submission.py::test_superseded_child_contention_is_parked_without_holding_admission
          --tb=short
