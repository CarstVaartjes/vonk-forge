name: Development images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-oci-archives:
    name: Build ${{ matrix.role }} OCI archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: vonk-forge-development-image-build-${{ matrix.role }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - role: api
            archive: vonk-forge-api.oci.tar
            context: .
            dockerfile: control/Dockerfile
            target: api
            cache_from: type=gha,scope=vonk-forge-api
            cache_to: type=gha,mode=max,scope=vonk-forge-api
          - role: worker
            archive: vonk-forge-worker.oci.tar
            context: .
            dockerfile: control/Dockerfile
            target: worker
            cache_from: type=gha,scope=vonk-forge-worker
            cache_to: type=gha,mode=max,scope=vonk-forge-worker
          - role: hermes
            archive: vonk-forge-hermes.oci.tar
            context: deploy/compose/hermes-agent
            dockerfile: deploy/compose/hermes-agent/Dockerfile
            target: managed
            cache_from: ""
            cache_to: ""
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate image build matrix
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.role }}:${{ matrix.archive }}:${{ matrix.dockerfile }}:${{ matrix.target }}:${{ matrix.context }}" in
            api:vonk-forge-api.oci.tar:control/Dockerfile:api:.|worker:vonk-forge-worker.oci.tar:control/Dockerfile:worker:.|hermes:vonk-forge-hermes.oci.tar:deploy/compose/hermes-agent/Dockerfile:managed:deploy/compose/hermes-agent) ;;
            *) echo "development image matrix is invalid" >&2; exit 64 ;;
          esac

      - name: Build exact OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.archive }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}

      - name: Upload exact OCI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-image-${{ matrix.role }}-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: ${{ runner.temp }}/${{ matrix.archive }}

  verify-runtime-images:
    name: Verify pinned runtime images are pullable
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: vonk-forge-development-runtime-images
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out exact runtime image lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull every pinned runtime image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_images < <(
            jq -r '.images[]' deploy/compose/images.lock.json \
              | sort -u
          )
          test "${#runtime_images[@]}" = 7
          for runtime_image in "${runtime_images[@]}"; do
            [[ "$runtime_image" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]]
            docker pull "$runtime_image"
          done

  build-and-accept:
    name: Build and accept main images
    needs: [build-oci-archives, verify-runtime-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: vonk-forge-development-image-acceptance
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      immutable_tag: ${{ steps.metadata.outputs.immutable_tag }}
      dev_alias: ${{ steps.metadata.outputs.dev_alias }}
      api_image: ${{ steps.metadata.outputs.api_image }}
      worker_image: ${{ steps.metadata.outputs.worker_image }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main tip
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          scripts/dev-image-metadata \
            "$GITHUB_REF" "$GITHUB_SHA" \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" \
            >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install pinned Node.js with admin web dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control/web/package-lock.json

      - name: Install locked admin web dependencies
        shell: bash
        run: npm ci --prefix control/web

      - parallel:
          - name: Run focused Compose contracts
            shell: bash
            run: |
              set -euo pipefail
              uv run --python 3.12 --frozen --with pytest==9.1.1 pytest -q \
                -p no:cacheprovider \
                deploy/compose/tests/test_production_shaped_development.py \
                scripts/tests/test_render_production_compose.py

          - name: Test and build admin web
            shell: bash
            run: |
              set -euo pipefail
              npm test --prefix control/web -- --run src/auth.test.tsx src/pages/login.test.tsx src/api/client.test.ts
              npm run build --prefix control/web

          - name: Run focused control authentication contracts
            shell: bash
            run: |
              set -euo pipefail
              uv run --project control --frozen pytest -q \
                -p no:cacheprovider \
                control/tests/test_passwords.py \
                control/tests/test_browser_auth.py \
                control/tests/test_auth_api.py \
                control/tests/test_api.py \
                control/tests/test_settings.py

          - name: Scan public image source inputs
            shell: bash
            run: scripts/verify-public-image-inputs

          - name: Download exact OCI archives
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              pattern: development-image-*-${{ github.sha }}-${{ github.run_id }}
              merge-multiple: true
              path: ${{ runner.temp }}/accepted

          - name: Install Skopeo from Ubuntu
            shell: bash
            run: |
              set -euo pipefail
              if command -v skopeo >/dev/null 2>&1; then
                exit 0
              fi
              if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
                exit 0
              fi
              for attempt in 1 2 3; do
                timeout --foreground 120s sudo apt-get update \
                  -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 || true
                if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
                  exit 0
                fi
              done
              echo "unable to install skopeo after bounded retries" >&2
              exit 1

      - name: Confirm parallel source and image prerequisites completed
        shell: bash
        run: |
          set -euo pipefail
          test -d control/web/dist
          test -f "$RUNNER_TEMP/accepted/vonk-forge-api.oci.tar"
          command -v skopeo >/dev/null

      - name: Render and validate disposable development Compose artifacts
        shell: bash
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/accepted"
          api_manifest="$RUNNER_TEMP/vonk-forge-api.manifest.json"
          worker_manifest="$RUNNER_TEMP/vonk-forge-worker.manifest.json"
          hermes_manifest="$RUNNER_TEMP/vonk-forge-hermes.manifest.json"
          skopeo inspect --raw \
            "oci-archive:$publication_root/vonk-forge-api.oci.tar" \
            > "$api_manifest"
          skopeo inspect --raw \
            "oci-archive:$publication_root/vonk-forge-worker.oci.tar" \
            > "$worker_manifest"
          skopeo inspect --raw \
            "oci-archive:$publication_root/vonk-forge-hermes.oci.tar" \
            > "$hermes_manifest"
          api_digest=$(skopeo manifest-digest "$api_manifest")
          worker_digest=$(skopeo manifest-digest "$worker_manifest")
          hermes_digest=$(skopeo manifest-digest "$hermes_manifest")
          hermes_image="ghcr.io/carstvaartjes/vonk-forge-hermes:dev-sha-$GITHUB_SHA@$hermes_digest"
          scripts/render-dev-compose \
            --template deploy/compose/compose.yaml \
            --output "$publication_root/docker-compose.pinned.yml" \
            --api-image "ghcr.io/carstvaartjes/vonk-forge-api:dev-sha-$GITHUB_SHA@$api_digest" \
            --worker-image "ghcr.io/carstvaartjes/vonk-forge-worker:dev-sha-$GITHUB_SHA@$worker_digest" \
            --hermes-image "$hermes_image" \
            --commit "$GITHUB_SHA"
          scripts/render-dev-compose \
            --template deploy/compose/compose.yaml \
            --output "$publication_root/docker-compose.dev.yml" \
            --api-image "ghcr.io/carstvaartjes/vonk-forge-api:dev" \
            --worker-image "ghcr.io/carstvaartjes/vonk-forge-worker:dev" \
            --hermes-image "$hermes_image" \
            --channel dev
          docker compose \
            --env-file deploy/compose/tests/test.env \
            -f "$publication_root/docker-compose.pinned.yml" config -q
          docker compose \
            --env-file deploy/compose/tests/test.env \
            -f "$publication_root/docker-compose.dev.yml" config -q

      - name: Scan complete local publication inputs
        shell: bash
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/accepted"
          scan_root=""
          cleanup() {
            original_status=$?
            trap - EXIT INT TERM
            cleanup_status=0
            if [[ -n "$scan_root" ]]; then
              if [[ "$scan_root" != "$RUNNER_TEMP"/dev-publication-scan.* ]]; then
                echo "refusing unsafe publication scan cleanup" >&2
                cleanup_status=1
              elif ! rm -rf -- "$scan_root"; then
                echo "publication scan cleanup failed" >&2
                cleanup_status=1
              fi
            fi
            if (( original_status != 0 )); then
              exit "$original_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          scan_root=$(mktemp -d "$RUNNER_TEMP/dev-publication-scan.XXXXXX")
          layout_root="$scan_root/layouts"
          evidence_root="$scan_root/evidence"
          canary_root="$scan_root/canaries"
          install -d -m 0700 "$layout_root" "$evidence_root" "$canary_root"
          printf '%s' 'task-6-publication-canary-api' > "$canary_root/api"
          printf '%s' 'task-6-publication-canary-worker' > "$canary_root/worker"
          chmod 0600 "$canary_root/api" "$canary_root/worker"
          for role in api worker hermes; do
            archive="$publication_root/vonk-forge-$role.oci.tar"
            layout="$layout_root/$role"
            install -d -m 0700 "$layout"
            tar --extract --no-same-owner --file "$archive" --directory "$layout"
            cp "$layout/index.json" "$evidence_root/$role.index.json"
            index_queue=("$layout/index.json")
            platform_index=""
            declare -A visited_indexes=()
            while ((${#index_queue[@]} > 0)); do
              index_document=${index_queue[0]}
              index_queue=("${index_queue[@]:1}")
              if [[ -n "${visited_indexes[$index_document]+present}" ]]; then
                continue
              fi
              visited_indexes[$index_document]=1
              if jq -e '[.manifests[]?.platform.architecture]
                | index("amd64") != null or index("arm64") != null' \
                "$index_document" >/dev/null; then
                [[ -z "$platform_index" ]]
                platform_index=$index_document
              fi
              descriptor_lines=$(jq -c '.manifests[]?' "$index_document")
              while IFS= read -r descriptor; do
                [[ -n "$descriptor" ]] || continue
                media_type=$(jq -r '.mediaType // empty' <<< "$descriptor")
                descriptor_digest=$(jq -r '.digest // empty' <<< "$descriptor")
                [[ "$descriptor_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                descriptor_path="$layout/blobs/sha256/${descriptor_digest#sha256:}"
                [[ -f "$descriptor_path" && ! -L "$descriptor_path" ]]
                [[ "$(sha256sum "$descriptor_path" | cut -d ' ' -f 1)" == \
                  "${descriptor_digest#sha256:}" ]]
                case "$media_type" in
                  application/vnd.oci.image.index.v1+json)
                    index_queue+=("$descriptor_path")
                    ;;
                  application/vnd.oci.image.manifest.v1+json)
                    :
                    ;;
                  *)
                    echo "unexpected OCI descriptor media type" >&2
                    exit 1
                    ;;
                esac
              done <<< "$descriptor_lines"
            done
            [[ -n "$platform_index" ]]
            evidence_count=0
            while IFS=$'\t' read -r architecture runnable_digest \
              attestation_digest; do
              runnable_path="$layout/blobs/sha256/${runnable_digest#sha256:}"
              config_digest=$(jq -er '.config.digest' "$runnable_path")
              [[ "$config_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              config_path="$layout/blobs/sha256/${config_digest#sha256:}"
              [[ -f "$config_path" && ! -L "$config_path" ]]
              [[ "$(sha256sum "$config_path" | cut -d ' ' -f 1)" == \
                "${config_digest#sha256:}" ]]
              layer_count=$(jq -er '.layers | length' "$runnable_path")
              jq -e --arg architecture "$architecture" \
                --arg revision "$GITHUB_SHA" \
                --argjson layer_count "$layer_count" \
                '.architecture == $architecture
                and .os == "linux"
                and .rootfs.type == "layers"
                and (.rootfs.diff_ids | type == "array" and length == $layer_count)
                and (.history | type == "array")
                and ([.history[] | select((.empty_layer // false) == false)]
                  | length == $layer_count)
                and .config.Labels["org.opencontainers.image.revision"] == $revision' \
                "$config_path" >/dev/null
              cp "$config_path" \
                "$evidence_root/$role.$architecture.config.json"
              jq -c '.history[]' "$config_path" \
                > "$evidence_root/$role.$architecture.history.jsonl"
              while IFS= read -r layer_descriptor; do
                layer_digest=$(jq -r '.digest // empty' <<< "$layer_descriptor")
                [[ "$layer_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                layer_path="$layout/blobs/sha256/${layer_digest#sha256:}"
                [[ -f "$layer_path" && ! -L "$layer_path" ]]
                [[ "$(sha256sum "$layer_path" | cut -d ' ' -f 1)" == \
                  "${layer_digest#sha256:}" ]]
              done < <(jq -c '.layers[]' "$runnable_path")
              manifest_path="$layout/blobs/sha256/${attestation_digest#sha256:}"
              cp "$manifest_path" \
                "$evidence_root/$role.$architecture.attestation-manifest.json"
              found_sbom=0
              found_provenance=0
              mapfile -t statement_descriptors < <(
                jq -r '.layers[] | select(
                  .mediaType == "application/vnd.in-toto+json"
                ) | [(.annotations["in-toto.io/predicate-type"] // ""), .digest]
                  | @tsv' "$manifest_path"
              )
              for statement_descriptor in "${statement_descriptors[@]}"; do
                IFS=$'\t' read -r declared_predicate statement_digest \
                  <<< "$statement_descriptor"
                [[ "$statement_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                statement_path="$layout/blobs/sha256/${statement_digest#sha256:}"
                [[ -f "$statement_path" && ! -L "$statement_path" ]]
                [[ "$(sha256sum "$statement_path" | cut -d ' ' -f 1)" == \
                  "${statement_digest#sha256:}" ]]
                actual_predicate=$(jq -r '.predicateType // empty' "$statement_path")
                [[ "$actual_predicate" == "$declared_predicate" ]]
                cp "$statement_path" \
                  "$evidence_root/$role.$architecture.attestation-$evidence_count.json"
                case "$actual_predicate" in
                  https://spdx.dev/Document) found_sbom=1 ;;
                  https://slsa.dev/provenance/*)
                    jq -e --arg revision "$GITHUB_SHA" \
                      '[.. | strings | select(. == $revision)] | length > 0' \
                      "$statement_path" >/dev/null
                    found_provenance=1
                    ;;
                esac
                evidence_count=$((evidence_count + 1))
              done
              ((found_sbom == 1))
              ((found_provenance == 1))
            done < <(scripts/verify-multiarch-image-manifest "$platform_index")
          done
      - name: Upload accepted publication inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-development-images-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/accepted/vonk-forge-api.oci.tar
            ${{ runner.temp }}/accepted/vonk-forge-hermes.oci.tar
            ${{ runner.temp }}/accepted/vonk-forge-worker.oci.tar
            ${{ runner.temp }}/accepted/docker-compose.pinned.yml
            ${{ runner.temp }}/accepted/docker-compose.dev.yml

  publish-development-images:
    name: Publish accepted main images
    needs: [build-and-accept]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: vonk-forge-development-image-publication
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          if command -v skopeo >/dev/null 2>&1; then
            exit 0
          fi
          if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
            exit 0
          fi
          for attempt in 1 2 3; do
            timeout --foreground 120s sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 || true
            if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
              exit 0
            fi
          done
          echo "unable to install skopeo after bounded retries" >&2
          exit 1
      - name: Download accepted OCI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-development-images-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted
      - name: Recheck exact main before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - parallel:
          - name: Publish immutable tested API image
            shell: bash
            env:
              IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
              IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
            run: |
              scripts/publish-immutable-image api \
                "$RUNNER_TEMP/accepted/vonk-forge-api.oci.tar" \
                "$IMAGE" "$IMMUTABLE_TAG" "$RUNNER_TEMP/api.accepted-digest"

          - name: Publish immutable tested worker image
            shell: bash
            env:
              IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
              IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
            run: |
              scripts/publish-immutable-image worker \
                "$RUNNER_TEMP/accepted/vonk-forge-worker.oci.tar" \
                "$IMAGE" "$IMMUTABLE_TAG" "$RUNNER_TEMP/worker.accepted-digest"

          - name: Publish immutable tested Hermes image
            shell: bash
            env:
              IMAGE: ghcr.io/carstvaartjes/vonk-forge-hermes
              IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
            run: |
              scripts/publish-immutable-image hermes \
                "$RUNNER_TEMP/accepted/vonk-forge-hermes.oci.tar" \
                "$IMAGE" "$IMMUTABLE_TAG" "$RUNNER_TEMP/hermes.accepted-digest"

      - name: Collect immutable tested image digests
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          for identity in api worker hermes; do
            digest_file="$RUNNER_TEMP/$identity.accepted-digest"
            [[ -f "$digest_file" && ! -L "$digest_file" ]]
            digest=$(tr -d '\r\n' < "$digest_file")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_digest=%s\n' "$identity" "$digest" >> "$GITHUB_OUTPUT"
          done

      - parallel:
          - name: Verify immutable API manifest and attestations
            shell: bash
            env:
              DIGEST: ${{ steps.publish.outputs.api_digest }}
              IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
              IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
            run: scripts/verify-published-image api "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

          - name: Verify immutable worker manifest and attestations
            shell: bash
            env:
              DIGEST: ${{ steps.publish.outputs.worker_digest }}
              IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
              IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
            run: scripts/verify-published-image worker "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

          - name: Verify immutable Hermes manifest and attestations
            shell: bash
            env:
              DIGEST: ${{ steps.publish.outputs.hermes_digest }}
              IMAGE: ghcr.io/carstvaartjes/vonk-forge-hermes
              IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
            run: scripts/verify-published-image hermes "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

      - parallel:
          - name: Sign accepted API image provenance
            uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
            with:
              subject-name: ${{ needs.build-and-accept.outputs.api_image }}
              subject-digest: ${{ steps.publish.outputs.api_digest }}
              push-to-registry: true

          - name: Sign accepted worker image provenance
            uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
            with:
              subject-name: ${{ needs.build-and-accept.outputs.worker_image }}
              subject-digest: ${{ steps.publish.outputs.worker_digest }}
              push-to-registry: true

          - name: Sign accepted Hermes image provenance
            uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
            with:
              subject-name: ghcr.io/carstvaartjes/vonk-forge-hermes
              subject-digest: ${{ steps.publish.outputs.hermes_digest }}
              push-to-registry: true

      - name: Upload Compose artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build-and-accept.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/accepted/docker-compose.pinned.yml
            ${{ runner.temp }}/accepted/docker-compose.dev.yml
            ${{ runner.temp }}/accepted/Caddyfile
            ${{ runner.temp }}/accepted/bin
            ${{ runner.temp }}/accepted/caddy
            ${{ runner.temp }}/accepted/grafana
            ${{ runner.temp }}/accepted/hermes-agent
            ${{ runner.temp }}/accepted/litellm
            ${{ runner.temp }}/accepted/prometheus
            ${{ runner.temp }}/accepted/registry
            ${{ runner.temp }}/accepted/step-ca
            ${{ runner.temp }}/accepted/tailscale
            ${{ runner.temp }}/accepted/trust

      - name: Advance accepted development aliases
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          DEV_ALIAS: ${{ needs.build-and-accept.outputs.dev_alias }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]
          scripts/promote-image-aliases \
            "$API_IMAGE" "$API_DIGEST" \
            "$WORKER_IMAGE" "$WORKER_DIGEST" "$DEV_ALIAS"
