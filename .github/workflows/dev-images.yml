name: Development images

# Called by the release workflow (installer-publication.yml), which owns the
# trigger, concurrency and the decision whether this producer must run.
on:
  workflow_call:
    inputs:
      # The successful pull request CI run that tested this exact source tree
      # (scripts/resolve-tested-ci), or empty. Its candidate images are reused
      # when they verify for this commit's tree.
      reuse_run_id:
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  publish-development-images:
    name: Build once and publish accepted main images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    # Keep runner steps serial: parallel groups race on the shared
    # GITHUB_EVENT_PATH, including readers immediately after group completion.
    # @actions/github parses it during Context construction (attest/upload and
    # transitive action dependencies). Serial execution preserves that context
    # without changing attestation, signature, digest or acceptance checks.
    # tests/test_workflow_event_context.py guards workflows and composite actions.
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the main commit before building
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          scripts/dev-image-metadata "$GITHUB_REF" "$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"
          # Images also name their source tree: acceptance and reuse bind to
          # it, so the same content built for a pull request is the same image.
          printf 'tree=%s\n' "$(git rev-parse --verify "$GITHUB_SHA^{tree}")" \
            >> "$GITHUB_OUTPUT"

      - name: Name the dependency layer day
        id: dependency_day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Install uv and build protocol wheel
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: agent_protocol/pyproject.toml
      - name: Build protocol wheel and verify Controller lock hash
        run: scripts/build-control-wheel

      - name: Scan public image source inputs
        run: scripts/verify-public-image-inputs

      - name: Authenticate CI image mirror reads

        # The mirror is an optional fast path; pulls fall back to upstream.

        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare digest-pinned CI dependency mirrors
        run: scripts/pull-test-images --dockerfile control/Dockerfile --dockerfile deploy/compose/hermes-agent/Dockerfile --dockerfile deploy/compose/litellm/Dockerfile --image docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.CI_IMAGE_400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # This GitHub-hosted VM is disposable. Cleanup still stops and
          # removes its builder; VM teardown discards the local state volume.
          # Cross-run reuse uses external caches, never this volume.
          keep-state: true

      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          if command -v skopeo >/dev/null 2>&1; then
            exit 0
          fi
          scripts/ci-apt-install skopeo

      - name: Prepare isolated image inputs
        id: image_inputs
        shell: bash
        run: |
          set -euo pipefail
          for role in hermes litellm; do
            scripts/dev-image-inputs prepare "$role" "$GITHUB_SHA" \
              "$RUNNER_TEMP/image-contexts/$role" >> "$GITHUB_OUTPUT"
          done

      - name: Download the images the identical pull request built
        if: inputs.reuse_run_id != ''
        # Absent evidence (no candidate lane in that run) means building.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/pr-images
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Reuse the pull request images for this source tree
        id: pr_images
        if: inputs.reuse_run_id != ''
        shell: bash
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          scripts/reuse-pr-candidate-images "$RUNNER_TEMP/pr-images" \
            "$REUSE_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/pr-images.out"
          cat "$RUNNER_TEMP/pr-images.out" >> "$GITHUB_OUTPUT"
          if grep -qx 'reused=true' "$RUNNER_TEMP/pr-images.out"; then
            echo "Images reuse pull request run $REUSE_RUN_ID for the identical Git tree" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Images are built: pull request run $REUSE_RUN_ID has no reusable images for this tree" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore accepted hermes digest and signed evidence
        id: cache_hermes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/accepted-image-cache/hermes
          # A saved entry can never be overwritten, so each accepted digest gets
          # its own key and the newest entry for these inputs wins: the cache
          # follows what main shipped last, including a pull request's image.
          key: accepted-hermes-${{ steps.image_inputs.outputs.hermes_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: accepted-hermes-${{ steps.image_inputs.outputs.hermes_key }}-

      - name: Restore accepted litellm digest and signed evidence
        id: cache_litellm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/accepted-image-cache/litellm
          key: accepted-litellm-${{ steps.image_inputs.outputs.litellm_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: accepted-litellm-${{ steps.image_inputs.outputs.litellm_key }}-

      - name: Revalidate accepted hermes image for reuse
        id: reuse_hermes
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/reuse-development-image hermes "$GITHUB_SHA" \
            "$RUNNER_TEMP/accepted-image-cache/hermes" \
            "$RUNNER_TEMP/hermes.role-receipt.json" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Revalidate accepted litellm image for reuse
        id: reuse_litellm
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/reuse-development-image litellm "$GITHUB_SHA" \
            "$RUNNER_TEMP/accepted-image-cache/litellm" \
            "$RUNNER_TEMP/litellm.role-receipt.json" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Log in for digest-only image staging
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API once to local OCI and exact registry digest
        id: build_api
        if: steps.pr_images.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          outputs: |
            type=oci,dest=${{ runner.temp }}/vonk-forge-api.oci.tar
            type=image,name=${{ steps.metadata.outputs.api_image }},push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ai.vonkforge.source.tree=${{ steps.metadata.outputs.tree }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
            VONK_BUILD_SOURCE_TREE=${{ steps.metadata.outputs.tree }}
          # One persistent cache for the shared Controller build graph, outside
          # the repository's Actions cache quota. BuildKit keys layers by their
          # inputs; the ref stays stable across commits and dependency days.
          cache-from: type=registry,ref=${{ steps.metadata.outputs.api_image }}:buildcache
          cache-to: type=registry,mode=max,ref=${{ steps.metadata.outputs.api_image }}:buildcache

      - name: Build worker once to local OCI and exact registry digest
        id: build_worker
        if: steps.pr_images.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: control/Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          outputs: |
            type=oci,dest=${{ runner.temp }}/vonk-forge-worker.oci.tar
            type=image,name=${{ steps.metadata.outputs.worker_image }},push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ai.vonkforge.source.tree=${{ steps.metadata.outputs.tree }}
          build-args: |
            DEPENDENCY_DAY=${{ steps.dependency_day.outputs.day }}
            VONK_BUILD_SOURCE_SHA=${{ github.sha }}
            VONK_BUILD_SOURCE_TREE=${{ steps.metadata.outputs.tree }}
          # The API already built/exported runtime-root on this same builder.
          # Reuse it without exporting the same intermediate layers twice.
          cache-from: type=registry,ref=${{ steps.metadata.outputs.api_image }}:buildcache

      - name: Build Hermes once to local OCI and exact registry digest
        id: build_hermes
        if: steps.reuse_hermes.outputs.digest == '' && steps.pr_images.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image-contexts/hermes
          file: ${{ runner.temp }}/image-contexts/hermes/Dockerfile
          target: managed
          platforms: linux/amd64,linux/arm64
          outputs: |
            type=oci,dest=${{ runner.temp }}/vonk-forge-hermes.oci.tar
            type=image,name=ghcr.io/carstvaartjes/vonk-forge-hermes,push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ai.vonkforge.source.tree=${{ steps.metadata.outputs.tree }}
          cache-from: type=gha,scope=vonk-forge-hermes
          cache-to: type=gha,mode=max,scope=vonk-forge-hermes

      - name: Build LiteLLM once to local OCI and exact registry digest
        id: build_litellm
        if: steps.reuse_litellm.outputs.digest == '' && steps.pr_images.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image-contexts/litellm
          file: ${{ runner.temp }}/image-contexts/litellm/deploy/compose/litellm/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: |
            type=oci,dest=${{ runner.temp }}/vonk-forge-litellm.oci.tar
            type=image,name=ghcr.io/carstvaartjes/vonk-forge-litellm,push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ai.vonkforge.source.tree=${{ steps.metadata.outputs.tree }}
          cache-from: type=gha,scope=vonk-forge-litellm
          cache-to: type=gha,mode=max,scope=vonk-forge-litellm

      - name: Download digest-keyed PR scan and smoke evidence
        if: steps.pr_images.outputs.reused == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-image-security-*
          merge-multiple: true
          path: ${{ runner.temp }}/pr-security
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Reuse fresh scan and smoke evidence for these exact digests
        id: pr_security
        if: steps.pr_images.outputs.reused == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          API_DIGEST: ${{ steps.pr_images.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.pr_images.outputs.worker_digest }}
          HERMES_DIGEST: ${{ steps.pr_images.outputs.hermes_digest }}
          LITELLM_DIGEST: ${{ steps.pr_images.outputs.litellm_digest }}
        run: scripts/reuse-pr-image-security "$RUNNER_TEMP/pr-security" "$REUSE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Remove registry write credentials before acceptance
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker_config="${DOCKER_CONFIG:-${HOME:?}/.docker}/config.json"
          if [[ -f "$docker_config" ]]; then
            jq -e '
              ((.auths // {}) | has("ghcr.io") | not)
              and ((.credHelpers // {}) | has("ghcr.io") | not)
            ' \
              "$docker_config" >/dev/null
          fi

      - name: Scan the api image and smoke its runtime
        if: steps.pr_security.outputs.reused != 'true'
        uses: ./.github/actions/image-security
        with:
          image: ghcr.io/carstvaartjes/vonk-forge-api@${{ steps.pr_images.outputs.api_digest || steps.build_api.outputs.digest }}
          role: api
      - name: Upload reused api findings under main's category
        if: steps.pr_security.outputs.reused == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results/development-api.sarif
          category: trivy-development-api
      - name: Scan the worker image and smoke its runtime
        if: steps.pr_security.outputs.reused != 'true'
        uses: ./.github/actions/image-security
        with:
          image: ghcr.io/carstvaartjes/vonk-forge-worker@${{ steps.pr_images.outputs.worker_digest || steps.build_worker.outputs.digest }}
          role: worker
      - name: Upload reused worker findings under main's category
        if: steps.pr_security.outputs.reused == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results/development-worker.sarif
          category: trivy-development-worker
      - name: Scan the hermes image and smoke its runtime
        if: steps.pr_security.outputs.reused != 'true' && steps.reuse_hermes.outputs.digest == ''
        uses: ./.github/actions/image-security
        with:
          image: ghcr.io/carstvaartjes/vonk-forge-hermes@${{ steps.pr_images.outputs.hermes_digest || steps.build_hermes.outputs.digest }}
          role: hermes
      - name: Upload reused hermes findings under main's category
        if: steps.pr_security.outputs.reused == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results/development-hermes.sarif
          category: trivy-development-hermes
      - name: Scan the litellm image and smoke its runtime
        if: steps.pr_security.outputs.reused != 'true' && steps.reuse_litellm.outputs.digest == ''
        uses: ./.github/actions/image-security
        with:
          image: ghcr.io/carstvaartjes/vonk-forge-litellm@${{ steps.pr_images.outputs.litellm_digest || steps.build_litellm.outputs.digest }}
          role: litellm
      - name: Upload reused litellm findings under main's category
        if: steps.pr_security.outputs.reused == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results/development-litellm.sarif
          category: trivy-development-litellm

      - name: Accept the pull request images by their verified digests
        id: pr_acceptance
        if: steps.pr_images.outputs.reused == 'true'
        shell: bash
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          API_DIGEST: ${{ steps.pr_images.outputs.api_digest }}
          WORKER_DIGEST: ${{ steps.pr_images.outputs.worker_digest }}
          HERMES_DIGEST: ${{ steps.pr_images.outputs.hermes_digest }}
          LITELLM_DIGEST: ${{ steps.pr_images.outputs.litellm_digest }}
        run: |
          set -euo pipefail
          # The pull request's candidate lane and scripts/reuse-pr-candidate-images
          # verified each digest for this tree. A deep scan binds a local build
          # to its remote digest; these images have no local build to bind.
          for role in api worker hermes litellm; do
            digest_variable="${role^^}_DIGEST"
            scripts/dev-image-acceptance-receipt create-role \
              "$RUNNER_TEMP/$role.role-receipt.json" \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
              "$role" "ghcr.io/carstvaartjes/vonk-forge-$role" "${!digest_variable}"
          done
          echo "Manifest verification and deep scan reused from pull request run $REUSE_RUN_ID: it verified these exact digests" >> "$GITHUB_STEP_SUMMARY"

      - name: Deep-scan exact API build and bind its remote digest
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: |
          scripts/accept-development-image-archive \
            api "$RUNNER_TEMP/vonk-forge-api.oci.tar" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "${{ steps.metadata.outputs.api_image }}" \
            "${{ steps.pr_images.outputs.api_digest || steps.build_api.outputs.digest }}" \
            "$RUNNER_TEMP/api.role-receipt.json"

      - name: Deep-scan exact worker build and bind its remote digest
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: |
          scripts/accept-development-image-archive \
            worker "$RUNNER_TEMP/vonk-forge-worker.oci.tar" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "${{ steps.metadata.outputs.worker_image }}" \
            "${{ steps.pr_images.outputs.worker_digest || steps.build_worker.outputs.digest }}" \
            "$RUNNER_TEMP/worker.role-receipt.json"

      - name: Deep-scan exact Hermes build and bind its remote digest
        if: steps.reuse_hermes.outputs.digest == '' && steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: |
          scripts/accept-development-image-archive \
            hermes "$RUNNER_TEMP/vonk-forge-hermes.oci.tar" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            ghcr.io/carstvaartjes/vonk-forge-hermes \
            "${{ steps.pr_images.outputs.hermes_digest || steps.build_hermes.outputs.digest }}" \
            "$RUNNER_TEMP/hermes.role-receipt.json"

      - name: Deep-scan exact LiteLLM build and bind its remote digest
        if: steps.reuse_litellm.outputs.digest == '' && steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: |
          scripts/accept-development-image-archive \
            litellm "$RUNNER_TEMP/vonk-forge-litellm.oci.tar" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            ghcr.io/carstvaartjes/vonk-forge-litellm \
            "${{ steps.pr_images.outputs.litellm_digest || steps.build_litellm.outputs.digest }}" \
            "$RUNNER_TEMP/litellm.role-receipt.json"

      - name: Upload exact API acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-role-receipt-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/api.role-receipt.json

      - name: Upload exact worker acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-role-receipt-worker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/worker.role-receipt.json

      - name: Upload exact Hermes acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-role-receipt-hermes-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/hermes.role-receipt.json

      - name: Upload exact LiteLLM acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-role-receipt-litellm-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/litellm.role-receipt.json

      - name: Validate accepted image evidence
        id: images
        shell: bash
        run: |
          set -euo pipefail
          scripts/dev-image-acceptance-receipt collect \
            "$RUNNER_TEMP" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Render and validate exact candidate Compose artifacts
        shell: bash
        env:
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          HERMES_DIGEST: ${{ steps.images.outputs.hermes_digest }}
          LITELLM_DIGEST: ${{ steps.images.outputs.litellm_digest }}
          WORKER_DIGEST: ${{ steps.images.outputs.worker_digest }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/accepted"
          scripts/render-dev-compose --template deploy/compose/compose.yaml \
            --output "$RUNNER_TEMP/accepted/docker-compose.pinned.yml" \
            --api-image "ghcr.io/carstvaartjes/vonk-forge-api:dev-sha-$GITHUB_SHA@$API_DIGEST" \
            --worker-image "ghcr.io/carstvaartjes/vonk-forge-worker:dev-sha-$GITHUB_SHA@$WORKER_DIGEST" \
            --hermes-image "ghcr.io/carstvaartjes/vonk-forge-hermes:dev-sha-$GITHUB_SHA@$HERMES_DIGEST" \
            --litellm-image "ghcr.io/carstvaartjes/vonk-forge-litellm:dev-sha-$GITHUB_SHA@$LITELLM_DIGEST" \
            --channel pinned
          scripts/render-dev-compose --template deploy/compose/compose.yaml \
            --output "$RUNNER_TEMP/accepted/docker-compose.dev.yml" \
            --api-image ghcr.io/carstvaartjes/vonk-forge-api:dev \
            --worker-image ghcr.io/carstvaartjes/vonk-forge-worker:dev \
            --hermes-image "ghcr.io/carstvaartjes/vonk-forge-hermes:dev-sha-$GITHUB_SHA@$HERMES_DIGEST" \
            --litellm-image "ghcr.io/carstvaartjes/vonk-forge-litellm:dev-sha-$GITHUB_SHA@$LITELLM_DIGEST" \
            --channel dev
          docker compose --env-file deploy/compose/tests/test.env \
            -f "$RUNNER_TEMP/accepted/docker-compose.pinned.yml" config -q
          docker compose --env-file deploy/compose/tests/test.env \
            -f "$RUNNER_TEMP/accepted/docker-compose.dev.yml" config -q

      - name: Create checksum-bound acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          scripts/dev-image-acceptance-receipt aggregate \
            "$RUNNER_TEMP/accepted/acceptance-receipt.json" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP" "$RUNNER_TEMP/accepted"

      - name: Verify exact digest-only API manifest and attestations
        # scripts/reuse-pr-candidate-images ran this exact check for a reused image.
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: >-
          scripts/verify-published-image api
          "${{ steps.metadata.outputs.api_image }}"
          "${{ steps.pr_images.outputs.api_digest || steps.build_api.outputs.digest }}" - "$GITHUB_SHA"

      - name: Verify exact digest-only worker manifest and attestations
        # scripts/reuse-pr-candidate-images ran this exact check for a reused image.
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: >-
          scripts/verify-published-image worker
          "${{ steps.metadata.outputs.worker_image }}"
          "${{ steps.pr_images.outputs.worker_digest || steps.build_worker.outputs.digest }}" - "$GITHUB_SHA"

      - name: Verify exact digest-only Hermes manifest and attestations
        # scripts/reuse-pr-candidate-images ran this exact check for a reused image.
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: >-
          scripts/verify-published-image hermes
          ghcr.io/carstvaartjes/vonk-forge-hermes
          "${{ steps.images.outputs.hermes_digest }}" - "$GITHUB_SHA"

      - name: Verify exact digest-only LiteLLM manifest and attestations
        # scripts/reuse-pr-candidate-images ran this exact check for a reused image.
        if: steps.pr_images.outputs.reused != 'true'
        shell: bash
        run: >-
          scripts/verify-published-image litellm
          ghcr.io/carstvaartjes/vonk-forge-litellm
          "${{ steps.images.outputs.litellm_digest }}" - "$GITHUB_SHA"

      - name: Confirm accepted inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/accepted/acceptance-receipt.json"
          test -f "$RUNNER_TEMP/accepted/docker-compose.pinned.yml"
          test -f "$RUNNER_TEMP/accepted/docker-compose.dev.yml"
          command -v skopeo >/dev/null

      - name: Verify receipt and recheck main before publication
        id: accepted
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/accepted"
          scripts/dev-image-acceptance-receipt verify \
            "$RUNNER_TEMP/accepted/acceptance-receipt.json" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/accepted"
          for role in api worker hermes litellm; do
            accepted_digest=$(jq -er \
              --arg role "$role" \
              '.roles[$role].manifest_digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$RUNNER_TEMP/accepted/acceptance-receipt.json")
            local_digest=$(jq -er \
              '.manifest_digest | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$RUNNER_TEMP/$role.role-receipt.json")
            [[ "$accepted_digest" == "$local_digest" ]]
            printf '%s_digest=%s\n' "$role" "$accepted_digest" \
              >> "$GITHUB_OUTPUT"
          done
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Log in to publish accepted image tags
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable tested API image
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.api_image }}
          DIGEST: ${{ steps.accepted.outputs.api_digest }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: |
          scripts/publish-immutable-image api \
            "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG" \
            "$RUNNER_TEMP/api.accepted-digest"

      - name: Publish immutable tested worker image
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.worker_image }}
          DIGEST: ${{ steps.accepted.outputs.worker_digest }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: |
          scripts/publish-immutable-image worker \
            "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG" \
            "$RUNNER_TEMP/worker.accepted-digest"

      - name: Publish immutable tested Hermes image
        shell: bash
        env:
          IMAGE: ghcr.io/carstvaartjes/vonk-forge-hermes
          DIGEST: ${{ steps.accepted.outputs.hermes_digest }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: |
          scripts/publish-immutable-image hermes \
            "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG" \
            "$RUNNER_TEMP/hermes.accepted-digest"

      - name: Publish immutable tested LiteLLM image
        shell: bash
        env:
          IMAGE: ghcr.io/carstvaartjes/vonk-forge-litellm
          DIGEST: ${{ steps.accepted.outputs.litellm_digest }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: |
          scripts/publish-immutable-image litellm \
            "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG" \
            "$RUNNER_TEMP/litellm.accepted-digest"

      - name: Collect immutable tested image digests
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          for identity in api worker hermes litellm; do
            digest_file="$RUNNER_TEMP/$identity.accepted-digest"
            [[ -f "$digest_file" && ! -L "$digest_file" ]]
            digest=$(tr -d '\r\n' < "$digest_file")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_digest=%s\n' "$identity" "$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Verify immutable API manifest and attestations
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.api_digest }}
          IMAGE: ${{ steps.metadata.outputs.api_image }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: scripts/verify-published-image api "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

      - name: Verify immutable worker manifest and attestations
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.worker_digest }}
          IMAGE: ${{ steps.metadata.outputs.worker_image }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: scripts/verify-published-image worker "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

      - name: Verify immutable Hermes manifest and attestations
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.hermes_digest }}
          IMAGE: ghcr.io/carstvaartjes/vonk-forge-hermes
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: scripts/verify-published-image hermes "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

      - name: Verify immutable LiteLLM manifest and attestations
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.litellm_digest }}
          IMAGE: ghcr.io/carstvaartjes/vonk-forge-litellm
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
        run: scripts/verify-published-image litellm "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

      - name: Recheck main before signing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Sign accepted API image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.api_image }}
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true

      - name: Sign accepted worker image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.worker_image }}
          subject-digest: ${{ steps.publish.outputs.worker_digest }}
          push-to-registry: true

      - name: Sign accepted Hermes image provenance
        id: sign_hermes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/carstvaartjes/vonk-forge-hermes
          subject-digest: ${{ steps.publish.outputs.hermes_digest }}
          push-to-registry: true

      - name: Sign accepted LiteLLM image provenance
        id: sign_litellm
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/carstvaartjes/vonk-forge-litellm
          subject-digest: ${{ steps.publish.outputs.litellm_digest }}
          push-to-registry: true

      - name: Retain signed hermes acceptance for identical future inputs
        if: steps.reuse_hermes.outputs.digest == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.sign_hermes.outputs.bundle-path }}
          DIGEST: ${{ steps.publish.outputs.hermes_digest }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/accepted-image-cache/hermes"
          jq -n --arg digest "$DIGEST" --arg build_commit "$GITHUB_SHA" \
            '{digest: $digest, build_commit: $build_commit}' \
            > "$RUNNER_TEMP/accepted-image-cache/hermes/image.json"
          cp -- "$BUNDLE" "$RUNNER_TEMP/accepted-image-cache/hermes/provenance.json"
          # Exercise the real signed-cache consumer before saving this entry.
          scripts/reuse-development-image hermes "$GITHUB_SHA" \
            "$RUNNER_TEMP/accepted-image-cache/hermes" \
            "$RUNNER_TEMP/hermes.cache-check.json" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Save signed hermes acceptance for identical future inputs
        if: steps.reuse_hermes.outputs.digest == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/accepted-image-cache/hermes
          key: ${{ steps.cache_hermes.outputs.cache-primary-key }}

      - name: Retain signed litellm acceptance for identical future inputs
        if: steps.reuse_litellm.outputs.digest == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.sign_litellm.outputs.bundle-path }}
          DIGEST: ${{ steps.publish.outputs.litellm_digest }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/accepted-image-cache/litellm"
          jq -n --arg digest "$DIGEST" --arg build_commit "$GITHUB_SHA" \
            '{digest: $digest, build_commit: $build_commit}' \
            > "$RUNNER_TEMP/accepted-image-cache/litellm/image.json"
          cp -- "$BUNDLE" "$RUNNER_TEMP/accepted-image-cache/litellm/provenance.json"
          # Exercise the real signed-cache consumer before saving this entry.
          scripts/reuse-development-image litellm "$GITHUB_SHA" \
            "$RUNNER_TEMP/accepted-image-cache/litellm" \
            "$RUNNER_TEMP/litellm.cache-check.json" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

      - name: Save signed litellm acceptance for identical future inputs
        if: steps.reuse_litellm.outputs.digest == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/accepted-image-cache/litellm
          key: ${{ steps.cache_litellm.outputs.cache-primary-key }}

      - name: Upload Compose artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/accepted/docker-compose.pinned.yml
            ${{ runner.temp }}/accepted/docker-compose.dev.yml
            ${{ runner.temp }}/accepted/Caddyfile
            ${{ runner.temp }}/accepted/bin
            ${{ runner.temp }}/accepted/caddy
            ${{ runner.temp }}/accepted/hermes-agent
            ${{ runner.temp }}/accepted/litellm
            ${{ runner.temp }}/accepted/prometheus
            ${{ runner.temp }}/accepted/registry
            ${{ runner.temp }}/accepted/tailscale
            ${{ runner.temp }}/accepted/trust
