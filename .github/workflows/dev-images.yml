name: Development images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-oci-archives:
    name: Build ${{ matrix.role }} OCI archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: vonk-forge-development-image-build-${{ matrix.role }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - role: api
            archive: vonk-forge-api.oci.tar
            context: .
            dockerfile: control/Dockerfile
            target: api
            cache_from: type=gha,scope=vonk-forge-api
            cache_to: type=gha,mode=max,scope=vonk-forge-api
          - role: worker
            archive: vonk-forge-worker.oci.tar
            context: .
            dockerfile: control/Dockerfile
            target: worker
            cache_from: type=gha,scope=vonk-forge-worker
            cache_to: type=gha,mode=max,scope=vonk-forge-worker
          - role: hermes
            archive: vonk-forge-hermes.oci.tar
            context: deploy/compose/hermes-agent
            dockerfile: deploy/compose/hermes-agent/Dockerfile
            target: managed
            cache_from: ""
            cache_to: ""
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate image build matrix
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.role }}:${{ matrix.archive }}:${{ matrix.dockerfile }}:${{ matrix.target }}:${{ matrix.context }}" in
            api:vonk-forge-api.oci.tar:control/Dockerfile:api:.|worker:vonk-forge-worker.oci.tar:control/Dockerfile:worker:.|hermes:vonk-forge-hermes.oci.tar:deploy/compose/hermes-agent/Dockerfile:managed:deploy/compose/hermes-agent) ;;
            *) echo "development image matrix is invalid" >&2; exit 64 ;;
          esac

      - name: Build exact OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.archive }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}

      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          if command -v skopeo >/dev/null 2>&1; then
            exit 0
          fi
          if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
            exit 0
          fi
          for attempt in 1 2 3; do
            timeout --foreground 120s sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 || true
            if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
              exit 0
            fi
          done
          echo "unable to install skopeo after bounded retries" >&2
          exit 1

      - name: Accept exact local OCI archive
        shell: bash
        run: |
          set -euo pipefail
          scripts/accept-development-image-archive \
            "${{ matrix.role }}" "$RUNNER_TEMP/${{ matrix.archive }}" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$RUNNER_TEMP/${{ matrix.role }}.role-receipt.json"

      - parallel:
          - name: Upload exact OCI archive
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              name: development-image-${{ matrix.role }}-${{ github.sha }}-${{ github.run_id }}
              if-no-files-found: error
              retention-days: 1
              compression-level: 0
              path: ${{ runner.temp }}/${{ matrix.archive }}

          - name: Upload exact OCI acceptance evidence
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              name: development-role-receipt-${{ matrix.role }}-${{ github.sha }}-${{ github.run_id }}
              if-no-files-found: error
              retention-days: 1
              path: ${{ runner.temp }}/${{ matrix.role }}.role-receipt.json

          - name: Upload thin Hermes publication capsule
            if: matrix.role == 'hermes'
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
              name: development-image-hermes-capsule-${{ github.sha }}-${{ github.run_id }}
              if-no-files-found: error
              retention-days: 1
              path: ${{ runner.temp }}/vonk-forge-hermes.publication-capsule.tar

  verify-runtime-images:
    name: Verify pinned runtime images are pullable
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: vonk-forge-development-runtime-images
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out exact runtime image lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull every pinned runtime image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_images < <(
            jq -r '.images[]' deploy/compose/images.lock.json \
              | sort -u
          )
          test "${#runtime_images[@]}" = 7
          for runtime_image in "${runtime_images[@]}"; do
            [[ "$runtime_image" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]]
            docker pull "$runtime_image"
          done

  build-and-accept:
    name: Build and accept main images
    needs: [build-oci-archives, verify-runtime-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: vonk-forge-development-image-acceptance
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      immutable_tag: ${{ steps.metadata.outputs.immutable_tag }}
      dev_alias: ${{ steps.metadata.outputs.dev_alias }}
      api_image: ${{ steps.metadata.outputs.api_image }}
      worker_image: ${{ steps.metadata.outputs.worker_image }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main tip
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          scripts/dev-image-metadata \
            "$GITHUB_REF" "$GITHUB_SHA" \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" \
            >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install pinned Node.js with admin web dependency cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control/web/package-lock.json

      - name: Install locked admin web dependencies
        shell: bash
        run: npm ci --prefix control/web

      - parallel:
          - name: Run focused Compose contracts
            shell: bash
            run: |
              set -euo pipefail
              uv run --python 3.12 --frozen --with pytest==9.1.1 pytest -q \
                -p no:cacheprovider \
                deploy/compose/tests/test_production_shaped_development.py \
                scripts/tests/test_render_production_compose.py

          - name: Test and build admin web
            shell: bash
            run: |
              set -euo pipefail
              npm test --prefix control/web -- --run src/auth.test.tsx src/pages/login.test.tsx src/api/client.test.ts
              npm run build --prefix control/web

          - name: Run focused control authentication contracts
            shell: bash
            run: |
              set -euo pipefail
              uv run --project control --frozen pytest -q \
                -p no:cacheprovider \
                control/tests/test_passwords.py \
                control/tests/test_browser_auth.py \
                control/tests/test_auth_api.py \
                control/tests/test_api.py \
                control/tests/test_settings.py

          - name: Scan public image source inputs
            shell: bash
            run: scripts/verify-public-image-inputs

          - name: Download exact OCI acceptance evidence
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              pattern: development-role-receipt-*-${{ github.sha }}-${{ github.run_id }}
              merge-multiple: true
              path: ${{ runner.temp }}/accepted-evidence

      - name: Confirm parallel source and image prerequisites completed
        shell: bash
        run: |
          set -euo pipefail
          test -d control/web/dist
          for role in api worker hermes; do
            test -f "$RUNNER_TEMP/accepted-evidence/$role.role-receipt.json"
          done

      - name: Validate accepted image evidence
        id: images
        shell: bash
        run: |
          set -euo pipefail
          scripts/dev-image-acceptance-receipt collect \
            "$RUNNER_TEMP/accepted-evidence" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            >> "$GITHUB_OUTPUT"

      - name: Render and validate disposable development Compose artifacts
        shell: bash
        env:
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          HERMES_DIGEST: ${{ steps.images.outputs.hermes_digest }}
          WORKER_DIGEST: ${{ steps.images.outputs.worker_digest }}
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/accepted"
          install -d -m 0700 "$publication_root"
          hermes_image="ghcr.io/carstvaartjes/vonk-forge-hermes:dev-sha-$GITHUB_SHA@$HERMES_DIGEST"
          scripts/render-dev-compose \
            --template deploy/compose/compose.yaml \
            --output "$publication_root/docker-compose.pinned.yml" \
            --api-image "ghcr.io/carstvaartjes/vonk-forge-api:dev-sha-$GITHUB_SHA@$API_DIGEST" \
            --worker-image "ghcr.io/carstvaartjes/vonk-forge-worker:dev-sha-$GITHUB_SHA@$WORKER_DIGEST" \
            --hermes-image "$hermes_image" \
            --commit "$GITHUB_SHA"
          scripts/render-dev-compose \
            --template deploy/compose/compose.yaml \
            --output "$publication_root/docker-compose.dev.yml" \
            --api-image "ghcr.io/carstvaartjes/vonk-forge-api:dev" \
            --worker-image "ghcr.io/carstvaartjes/vonk-forge-worker:dev" \
            --hermes-image "$hermes_image" \
            --channel dev
          docker compose \
            --env-file deploy/compose/tests/test.env \
            -f "$publication_root/docker-compose.pinned.yml" config -q
          docker compose \
            --env-file deploy/compose/tests/test.env \
            -f "$publication_root/docker-compose.dev.yml" config -q

      - name: Create checksum-bound acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          scripts/dev-image-acceptance-receipt aggregate \
            "$RUNNER_TEMP/accepted/acceptance-receipt.json" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            "$RUNNER_TEMP/accepted-evidence" "$RUNNER_TEMP/accepted"

      - name: Upload accepted receipt and Compose inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-development-receipt-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ runner.temp }}/accepted/acceptance-receipt.json
            ${{ runner.temp }}/accepted/docker-compose.pinned.yml
            ${{ runner.temp }}/accepted/docker-compose.dev.yml

  publish-development-images:
    name: Prefetch and publish accepted main images
    needs: [build-oci-archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: vonk-forge-development-image-publication
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main before prefetch
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          scripts/dev-image-metadata \
            "$GITHUB_REF" "$GITHUB_SHA" \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" \
            >> "$GITHUB_OUTPUT"

      - parallel:
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

          - name: Install Skopeo from Ubuntu
            shell: bash
            run: |
              set -euo pipefail
              if command -v skopeo >/dev/null 2>&1; then
                exit 0
              fi
              if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
                exit 0
              fi
              for attempt in 1 2 3; do
                timeout --foreground 120s sudo apt-get update \
                  -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 || true
                if timeout --foreground 120s sudo apt-get install --yes --no-install-recommends skopeo; then
                  exit 0
                fi
              done
              echo "unable to install skopeo after bounded retries" >&2
              exit 1

          - name: Prefetch exact API OCI archive
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: development-image-api-${{ github.sha }}-${{ github.run_id }}
              path: ${{ runner.temp }}/accepted

          - name: Prefetch exact worker OCI archive
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: development-image-worker-${{ github.sha }}-${{ github.run_id }}
              path: ${{ runner.temp }}/accepted

          - name: Prefetch thin Hermes publication capsule
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: development-image-hermes-capsule-${{ github.sha }}-${{ github.run_id }}
              path: ${{ runner.temp }}/accepted

          - name: Wait for checksum-bound acceptance receipt
            shell: bash
            env:
              GH_TOKEN: ${{ github.token }}
            run: |
              set -euo pipefail
              receipt_name="accepted-development-receipt-$GITHUB_SHA-$GITHUB_RUN_ID"
              receipt_root="$RUNNER_TEMP/accepted-receipt"
              install -d -m 0700 "$receipt_root"
              for attempt in $(seq 1 60); do
                if ! response=$(gh api \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"); then
                  sleep 5
                  continue
                fi
                count=$(jq --arg name "$receipt_name" \
                  '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
                  <<< "$response")
                if [[ "$count" == 1 ]]; then
                  if gh run download "$GITHUB_RUN_ID" \
                    --repo "$GITHUB_REPOSITORY" \
                    --name "$receipt_name" --dir "$receipt_root"; then
                    exit 0
                  fi
                  rm -f -- \
                    "$receipt_root/acceptance-receipt.json" \
                    "$receipt_root/docker-compose.pinned.yml" \
                    "$receipt_root/docker-compose.dev.yml"
                  sleep 5
                  continue
                fi
                [[ "$count" == 0 ]]
                sleep 5
              done
              echo "accepted development image receipt was not published in time" >&2
              exit 1

      - name: Confirm prefetched and accepted inputs
        shell: bash
        run: |
          set -euo pipefail
          for role in api worker; do
            test -f "$RUNNER_TEMP/accepted/vonk-forge-$role.oci.tar"
          done
          test -f \
            "$RUNNER_TEMP/accepted/vonk-forge-hermes.publication-capsule.tar"
          test -f "$RUNNER_TEMP/accepted-receipt/acceptance-receipt.json"
          test -f "$RUNNER_TEMP/accepted-receipt/docker-compose.pinned.yml"
          test -f "$RUNNER_TEMP/accepted-receipt/docker-compose.dev.yml"
          command -v skopeo >/dev/null

      - name: Verify receipt and recheck exact main before publication
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/accepted-receipt/docker-compose.pinned.yml" \
            "$RUNNER_TEMP/accepted/docker-compose.pinned.yml"
          cp "$RUNNER_TEMP/accepted-receipt/docker-compose.dev.yml" \
            "$RUNNER_TEMP/accepted/docker-compose.dev.yml"
          scripts/dev-image-acceptance-receipt verify \
            "$RUNNER_TEMP/accepted-receipt/acceptance-receipt.json" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_TEMP/accepted"
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - parallel:
          - name: Publish immutable tested API image
            shell: bash
            env:
              IMAGE: ${{ steps.metadata.outputs.api_image }}
              IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
            run: |
              scripts/publish-immutable-image api \
                "$RUNNER_TEMP/accepted/vonk-forge-api.oci.tar" \
                "$IMAGE" "$IMMUTABLE_TAG" "$RUNNER_TEMP/api.accepted-digest"

          - name: Publish immutable tested worker image
            shell: bash
            env:
              IMAGE: ${{ steps.metadata.outputs.worker_image }}
              IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
            run: |
              scripts/publish-immutable-image worker \
                "$RUNNER_TEMP/accepted/vonk-forge-worker.oci.tar" \
                "$IMAGE" "$IMMUTABLE_TAG" "$RUNNER_TEMP/worker.accepted-digest"

          - name: Publish immutable tested Hermes image
            shell: bash
            env:
              GH_TOKEN: ${{ github.token }}
              IMAGE: ghcr.io/carstvaartjes/vonk-forge-hermes
              IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
            run: |
              set -euo pipefail
              capsule="$RUNNER_TEMP/accepted/vonk-forge-hermes.publication-capsule.tar"
              receipt="$RUNNER_TEMP/accepted-receipt/acceptance-receipt.json"
              expected_digest=$(jq -er \
                '.roles.hermes.manifest_digest | select(test("^sha256:[0-9a-f]{64}$"))' \
                "$receipt")
              expected_capsule_sha256=$(jq -er \
                '.roles.hermes.publication_capsule.sha256 | select(test("^[0-9a-f]{64}$"))' \
                "$receipt")
              set +e
              scripts/dev-image-publication-capsule publish \
                "$capsule" "$IMAGE" "$IMMUTABLE_TAG" \
                "$expected_digest" "$expected_capsule_sha256" \
                "$RUNNER_TEMP/hermes.accepted-digest"
              capsule_status=$?
              set -e
              if ((capsule_status == 0)); then
                exit 0
              fi
              if ((capsule_status != 75)); then
                exit "$capsule_status"
              fi

              echo "Accepted Hermes layers are not reusable; downloading full archive" >&2
              gh run download "$GITHUB_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name "development-image-hermes-$GITHUB_SHA-$GITHUB_RUN_ID" \
                --dir "$RUNNER_TEMP/accepted"
              scripts/dev-image-acceptance-receipt verify \
                "$RUNNER_TEMP/accepted-receipt/acceptance-receipt.json" \
                "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_TEMP/accepted"
              git fetch --force --no-tags origin \
                +refs/heads/main:refs/remotes/origin/main
              [[ "$GITHUB_SHA" == \
                "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]
              scripts/publish-immutable-image hermes \
                "$RUNNER_TEMP/accepted/vonk-forge-hermes.oci.tar" \
                "$IMAGE" "$IMMUTABLE_TAG" "$RUNNER_TEMP/hermes.accepted-digest"

      - name: Collect immutable tested image digests
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          for identity in api worker hermes; do
            digest_file="$RUNNER_TEMP/$identity.accepted-digest"
            [[ -f "$digest_file" && ! -L "$digest_file" ]]
            digest=$(tr -d '\r\n' < "$digest_file")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_digest=%s\n' "$identity" "$digest" >> "$GITHUB_OUTPUT"
          done

      - parallel:
          - name: Verify immutable API manifest and attestations
            shell: bash
            env:
              DIGEST: ${{ steps.publish.outputs.api_digest }}
              IMAGE: ${{ steps.metadata.outputs.api_image }}
              IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
            run: scripts/verify-published-image api "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

          - name: Verify immutable worker manifest and attestations
            shell: bash
            env:
              DIGEST: ${{ steps.publish.outputs.worker_digest }}
              IMAGE: ${{ steps.metadata.outputs.worker_image }}
              IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
            run: scripts/verify-published-image worker "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

          - name: Verify immutable Hermes manifest and attestations
            shell: bash
            env:
              DIGEST: ${{ steps.publish.outputs.hermes_digest }}
              IMAGE: ghcr.io/carstvaartjes/vonk-forge-hermes
              IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
            run: scripts/verify-published-image hermes "$IMAGE" "$DIGEST" "$IMMUTABLE_TAG"

      - parallel:
          - name: Sign accepted API image provenance
            uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
            with:
              subject-name: ${{ steps.metadata.outputs.api_image }}
              subject-digest: ${{ steps.publish.outputs.api_digest }}
              push-to-registry: true

          - name: Sign accepted worker image provenance
            uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
            with:
              subject-name: ${{ steps.metadata.outputs.worker_image }}
              subject-digest: ${{ steps.publish.outputs.worker_digest }}
              push-to-registry: true

          - name: Sign accepted Hermes image provenance
            uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
            with:
              subject-name: ghcr.io/carstvaartjes/vonk-forge-hermes
              subject-digest: ${{ steps.publish.outputs.hermes_digest }}
              push-to-registry: true

      - name: Upload Compose artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/accepted/docker-compose.pinned.yml
            ${{ runner.temp }}/accepted/docker-compose.dev.yml
            ${{ runner.temp }}/accepted/Caddyfile
            ${{ runner.temp }}/accepted/bin
            ${{ runner.temp }}/accepted/caddy
            ${{ runner.temp }}/accepted/grafana
            ${{ runner.temp }}/accepted/hermes-agent
            ${{ runner.temp }}/accepted/litellm
            ${{ runner.temp }}/accepted/prometheus
            ${{ runner.temp }}/accepted/registry
            ${{ runner.temp }}/accepted/step-ca
            ${{ runner.temp }}/accepted/tailscale
            ${{ runner.temp }}/accepted/trust

      - name: Advance accepted development aliases
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          DEV_ALIAS: ${{ steps.metadata.outputs.dev_alias }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ steps.metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]
          scripts/promote-image-aliases \
            "$API_IMAGE" "$API_DIGEST" \
            "$WORKER_IMAGE" "$WORKER_DIGEST" "$DEV_ALIAS"
