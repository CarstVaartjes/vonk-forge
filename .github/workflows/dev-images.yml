name: Development images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vonk-forge-development-images
  cancel-in-progress: false

jobs:
  build-and-accept:
    name: Build and accept main images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      immutable_tag: ${{ steps.metadata.outputs.immutable_tag }}
      dev_alias: ${{ steps.metadata.outputs.dev_alias }}
      api_image: ${{ steps.metadata.outputs.api_image }}
      worker_image: ${{ steps.metadata.outputs.worker_image }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main tip
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          scripts/dev-image-metadata \
            "$GITHUB_REF" "$GITHUB_SHA" \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" \
            >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Run focused source and Compose contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12 --frozen --with pytest==9.1.1 pytest -q \
            deploy/compose/tests/test_dev_compose.py \
            scripts/tests/test_render_dev_compose.py \
            scripts/tests/test_verify_dev_image_secrets.py \
            scripts/tests/test_dev_image_acceptance.py \
            scripts/tests/test_dev_image_workflow.py
          uv run --project control --frozen pytest -q \
            control/tests/test_dev_init.py \
            control/tests/test_generation_readiness.py
          scripts/verify-public-image-inputs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Build exact OCI archives
        shell: bash
        run: |
          set -euo pipefail
          api_archive="$RUNNER_TEMP/vonk-forge-api.oci.tar"
          worker_archive="$RUNNER_TEMP/vonk-forge-worker.oci.tar"
          common_labels=(
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          docker buildx build \
            --file control/Dockerfile \
            --target api \
            --platform linux/amd64 \
            --output "type=oci,dest=$api_archive" \
            --sbom=true \
            --provenance=mode=max \
            --build-arg VONK_DEV_SOURCE_COMMIT="$GITHUB_SHA" \
            "${common_labels[@]}" \
            .
          docker buildx build \
            --file control/Dockerfile \
            --target worker \
            --platform linux/amd64 \
            --output "type=oci,dest=$worker_archive" \
            --sbom=true \
            --provenance=mode=max \
            --build-arg VONK_DEV_SOURCE_COMMIT="$GITHUB_SHA" \
            "${common_labels[@]}" \
            .

      - name: Load tested images without pulling
        shell: bash
        run: |
          set -euo pipefail
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/vonk-forge-api.oci.tar" \
            docker-daemon:vonk-forge-api:dev-local
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/vonk-forge-worker.oci.tar" \
            docker-daemon:vonk-forge-worker:dev-local

      - name: Preload pinned runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t postgres_images < <(
            sed -nE \
              's/^[[:space:]]+image:[[:space:]]+(postgres:[^[:space:]]+)$/\1/p' \
              deploy/compose/compose.dev.images.yaml
          )
          test "${#postgres_images[@]}" = 1
          postgres_image=${postgres_images[0]}
          [[ "$postgres_image" =~ ^postgres:[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
          docker pull "$postgres_image"

      - name: Scan and accept image-only stack
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-dev-image-secrets \
            --expected-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            vonk-forge-api:dev-local vonk-forge-worker:dev-local
          scripts/dev-image-acceptance \
            --api-image vonk-forge-api:dev-local \
            --worker-image vonk-forge-worker:dev-local \
            --commit "$GITHUB_SHA"

      - name: Upload accepted OCI archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-development-images-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/vonk-forge-api.oci.tar
            ${{ runner.temp }}/vonk-forge-worker.oci.tar

  publish-development-images:
    name: Publish accepted main images
    needs: [build-and-accept]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Download accepted OCI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-development-images-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted
      - name: Recheck exact main before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable tested images
        id: publish
        shell: bash
        env:
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          publish_immutable() {
            local role=$1 archive=$2 image=$3
            local manifest="$RUNNER_TEMP/${role}.manifest.json"
            local digest_file="$RUNNER_TEMP/${role}.digest"
            local inspect_error="$RUNNER_TEMP/${role}.inspect-error"
            local expected observed pushed
            skopeo inspect --raw "oci-archive:$archive" > "$manifest"
            expected=$(skopeo manifest-digest "$manifest")
            [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
            if observed=$(skopeo inspect --format '{{.Digest}}' \
              "docker://$image:${IMMUTABLE_TAG}" 2>"$inspect_error"); then
              if [[ "$observed" != "$expected" ]]; then
                echo "refusing to overwrite immutable $role image tag" >&2
                return 1
              fi
            else
              if ! grep -Eiq 'manifest unknown|name unknown|not found' \
                "$inspect_error"; then
                echo "immutable $role image lookup failed" >&2
                return 1
              fi
              skopeo copy --all --preserve-digests \
                --digestfile "$digest_file" \
                "oci-archive:$archive" \
                "docker://$image:${IMMUTABLE_TAG}" >&2
              pushed=$(tr -d '\r\n' < "$digest_file")
              if [[ "$pushed" != "$expected" ]]; then
                echo "immutable $role image digest changed during publication" >&2
                return 1
              fi
            fi
            printf '%s\n' "$expected"
          }
          api_digest=$(publish_immutable api \
            "$RUNNER_TEMP/accepted/vonk-forge-api.oci.tar" "$API_IMAGE")
          worker_digest=$(publish_immutable worker \
            "$RUNNER_TEMP/accepted/vonk-forge-worker.oci.tar" "$WORKER_IMAGE")
          printf 'api_digest=%s\nworker_digest=%s\n' \
            "$api_digest" "$worker_digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable manifests and attestations
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          for identity in api worker; do
            if [[ "$identity" == api ]]; then
              image=$API_IMAGE
              digest=$API_DIGEST
            else
              image=$WORKER_IMAGE
              digest=$WORKER_DIGEST
            fi
            observed=$(skopeo inspect --format '{{.Digest}}' \
              "docker://$image:${IMMUTABLE_TAG}")
            [[ "$observed" == "$digest" ]]
            skopeo inspect --config "docker://$image@$digest" \
              | jq -e --arg revision "$GITHUB_SHA" \
                '.config.Labels["org.opencontainers.image.revision"] == $revision' \
                >/dev/null
            docker buildx imagetools inspect "$image@$digest" \
              --format '{{ json .Provenance }}' \
              | jq -e --arg revision "$GITHUB_SHA" \
                '([.. | objects | select(
                  ((.predicateType? // "") | startswith("https://slsa.dev/provenance/"))
                  or (((.SLSA?.buildType? // "") | length) > 0)
                  or (((.buildDefinition?.buildType? // "") | length) > 0)
                  )] | length > 0)
                 and ([.. | strings | select(. == $revision)] | length > 0)' \
                >/dev/null
            docker buildx imagetools inspect "$image@$digest" \
              --format '{{ json .SBOM }}' \
              | jq -e '[.. | objects | select(
                  .SPDXID? == "SPDXRef-DOCUMENT"
                  and ((.spdxVersion? // "") | startswith("SPDX-"))
                )] | length > 0' >/dev/null
          done

      - name: Sign accepted API image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-and-accept.outputs.api_image }}
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true

      - name: Sign accepted worker image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-and-accept.outputs.worker_image }}
          subject-digest: ${{ steps.publish.outputs.worker_digest }}
          push-to-registry: true

      - name: Render development Compose artifacts
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          install -d -m 0700 dist
          scripts/render-dev-compose \
            --output dist/docker-compose.pinned.yml \
            --api-image "$API_IMAGE:${IMMUTABLE_TAG}@${API_DIGEST}" \
            --worker-image "$WORKER_IMAGE:${IMMUTABLE_TAG}@${WORKER_DIGEST}" \
            --commit "$GITHUB_SHA"
          scripts/render-dev-compose \
            --output dist/docker-compose.dev.yml \
            --api-image "$API_IMAGE:dev" \
            --worker-image "$WORKER_IMAGE:dev" \
            --channel dev
          docker compose -f dist/docker-compose.pinned.yml config -q
          docker compose -f dist/docker-compose.dev.yml config -q

      - name: Upload Compose artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build-and-accept.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/docker-compose.pinned.yml
            dist/docker-compose.dev.yml

      - name: Advance accepted development aliases
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          DEV_ALIAS: ${{ needs.build-and-accept.outputs.dev_alias }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]
          scripts/promote-image-aliases \
            "$API_IMAGE" "$API_DIGEST" \
            "$WORKER_IMAGE" "$WORKER_DIGEST" "$DEV_ALIAS"
