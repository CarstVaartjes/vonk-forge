name: Development images

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vonk-forge-development-images
  cancel-in-progress: false

jobs:
  build-and-accept:
    name: Build and accept main images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      immutable_tag: ${{ steps.metadata.outputs.immutable_tag }}
      dev_alias: ${{ steps.metadata.outputs.dev_alias }}
      api_image: ${{ steps.metadata.outputs.api_image }}
      worker_image: ${{ steps.metadata.outputs.worker_image }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main tip
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          scripts/dev-image-metadata \
            "$GITHUB_REF" "$GITHUB_SHA" \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" \
            >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Run focused source and Compose contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12 --frozen --with pytest==9.1.1 pytest -q \
            deploy/compose/tests/test_dev_compose.py \
            deploy/compose/tests/test_dev_compose_secrets.py \
            deploy/compose/tests/test_dev_tailscale.py \
            scripts/tests/test_render_dev_compose.py \
            scripts/tests/test_dev_runtime_secrets.py \
            scripts/tests/test_dev_runtime_project.py \
            scripts/tests/test_dev_admin_token.py \
            scripts/tests/test_verify_dev_image_secrets.py \
            scripts/tests/test_dev_image_acceptance.py \
            scripts/tests/test_dev_image_workflow.py
          npm ci --prefix control/web
          npm test --prefix control/web -- --run src/auth.test.tsx
          npm run build --prefix control/web
          uv run --project control --frozen pytest -q \
            control/tests/test_dev_cohort.py \
            control/tests/test_dev_auth_init.py \
            control/tests/test_dev_init.py \
            control/tests/test_browser_authentication_migration.py \
            control/tests/test_generation_readiness.py \
            control/tests/test_settings.py
          scripts/verify-public-image-inputs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Build exact OCI archives
        shell: bash
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/accepted"
          install -d -m 0700 "$publication_root"
          api_archive="$publication_root/vonk-forge-api.oci.tar"
          worker_archive="$publication_root/vonk-forge-worker.oci.tar"
          common_labels=(
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          docker buildx build \
            --file control/Dockerfile \
            --target api \
            --platform linux/amd64 \
            --output "type=oci,dest=$api_archive" \
            --sbom=true \
            --provenance=mode=max \
            --build-arg VONK_DEV_SOURCE_COMMIT="$GITHUB_SHA" \
            "${common_labels[@]}" \
            .
          docker buildx build \
            --file control/Dockerfile \
            --target worker \
            --platform linux/amd64 \
            --output "type=oci,dest=$worker_archive" \
            --sbom=true \
            --provenance=mode=max \
            --build-arg VONK_DEV_SOURCE_COMMIT="$GITHUB_SHA" \
            "${common_labels[@]}" \
            .

      - name: Load tested images without pulling
        shell: bash
        run: |
          set -euo pipefail
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/accepted/vonk-forge-api.oci.tar" \
            docker-daemon:vonk-forge-api:dev-local
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/accepted/vonk-forge-worker.oci.tar" \
            docker-daemon:vonk-forge-worker:dev-local

      - name: Preload pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_images < <(
            sed -nE \
              's/^[[:space:]]+image:[[:space:]]+([a-z0-9][a-z0-9.\/:_-]*@sha256:[0-9a-f]{64})$/\1/p' \
              deploy/compose/compose.dev.images.yaml \
              | sort -u
          )
          test "${#runtime_images[@]}" = 4
          for runtime_image in "${runtime_images[@]}"; do
            [[ "$runtime_image" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[0-9a-f]{64}$ ]]
            docker pull "$runtime_image"
          done

      - name: Render and validate disposable development Compose artifacts
        shell: bash
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/accepted"
          api_manifest="$RUNNER_TEMP/vonk-forge-api.manifest.json"
          worker_manifest="$RUNNER_TEMP/vonk-forge-worker.manifest.json"
          skopeo inspect --raw \
            "oci-archive:$publication_root/vonk-forge-api.oci.tar" \
            > "$api_manifest"
          skopeo inspect --raw \
            "oci-archive:$publication_root/vonk-forge-worker.oci.tar" \
            > "$worker_manifest"
          api_digest=$(skopeo manifest-digest "$api_manifest")
          worker_digest=$(skopeo manifest-digest "$worker_manifest")
          scripts/render-dev-compose \
            --output "$publication_root/docker-compose.pinned.yml" \
            --api-image "ghcr.io/carstvaartjes/vonk-forge-api:dev-sha-$GITHUB_SHA@$api_digest" \
            --worker-image "ghcr.io/carstvaartjes/vonk-forge-worker:dev-sha-$GITHUB_SHA@$worker_digest" \
            --commit "$GITHUB_SHA"
          scripts/render-dev-compose \
            --output "$publication_root/docker-compose.dev.yml" \
            --api-image "ghcr.io/carstvaartjes/vonk-forge-api:dev" \
            --worker-image "ghcr.io/carstvaartjes/vonk-forge-worker:dev" \
            --channel dev
          docker compose -f "$publication_root/docker-compose.pinned.yml" config -q
          docker compose -f "$publication_root/docker-compose.dev.yml" config -q

      - name: Render and smoke complete disposable development stack
        shell: bash
        run: |
          set -euo pipefail
          acceptance_test="deploy/compose/tests/test_dev_complete_stack.py::test_complete_development_stack_enforces_tls_identity_and_acks_routes"
          uv run --project control --frozen pytest -q --maxfail=1 \
            "$acceptance_test"

      - name: Scan complete local publication inputs
        shell: bash
        run: |
          set -euo pipefail
          publication_root="$RUNNER_TEMP/accepted"
          scan_root=""
          cleanup() {
            original_status=$?
            trap - EXIT INT TERM
            cleanup_status=0
            if [[ -n "$scan_root" ]]; then
              if [[ "$scan_root" != "$RUNNER_TEMP"/dev-publication-scan.* ]]; then
                echo "refusing unsafe publication scan cleanup" >&2
                cleanup_status=1
              elif ! rm -rf -- "$scan_root"; then
                echo "publication scan cleanup failed" >&2
                cleanup_status=1
              fi
            fi
            if (( original_status != 0 )); then
              exit "$original_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          scan_root=$(mktemp -d "$RUNNER_TEMP/dev-publication-scan.XXXXXX")
          layout_root="$scan_root/layouts"
          evidence_root="$scan_root/evidence"
          canary_root="$scan_root/canaries"
          install -d -m 0700 "$layout_root" "$evidence_root" "$canary_root"
          printf '%s' 'task-6-publication-canary-api' > "$canary_root/api"
          printf '%s' 'task-6-publication-canary-worker' > "$canary_root/worker"
          chmod 0600 "$canary_root/api" "$canary_root/worker"
          for role in api worker; do
            if [[ "$role" == api ]]; then
              image=vonk-forge-api:dev-local
            else
              image=vonk-forge-worker:dev-local
            fi
            archive="$publication_root/vonk-forge-$role.oci.tar"
            layout="$layout_root/$role"
            install -d -m 0700 "$layout"
            tar --extract --no-same-owner --file "$archive" --directory "$layout"
            cp "$layout/index.json" "$evidence_root/$role.index.json"
            docker history --no-trunc --format '{{json .}}' "$image" \
              > "$evidence_root/$role.history.jsonl"
            docker image inspect "$image" \
              > "$evidence_root/$role.config.json"
            index_queue=("$layout/index.json")
            attestation_manifests=()
            declare -A visited_indexes=()
            while ((${#index_queue[@]} > 0)); do
              index_document=${index_queue[0]}
              index_queue=("${index_queue[@]:1}")
              if [[ -n "${visited_indexes[$index_document]+present}" ]]; then
                continue
              fi
              visited_indexes[$index_document]=1
              descriptor_lines=$(jq -c '.manifests[]?' "$index_document")
              while IFS= read -r descriptor; do
                [[ -n "$descriptor" ]] || continue
                media_type=$(jq -r '.mediaType // empty' <<< "$descriptor")
                descriptor_digest=$(jq -r '.digest // empty' <<< "$descriptor")
                reference_type=$(jq -r \
                  '.annotations["vnd.docker.reference.type"] // empty' \
                  <<< "$descriptor")
                [[ "$descriptor_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                descriptor_path="$layout/blobs/sha256/${descriptor_digest#sha256:}"
                [[ -f "$descriptor_path" && ! -L "$descriptor_path" ]]
                case "$media_type" in
                  application/vnd.oci.image.index.v1+json)
                    index_queue+=("$descriptor_path")
                    ;;
                  application/vnd.oci.image.manifest.v1+json)
                    if [[ "$reference_type" == attestation-manifest ]]; then
                      attestation_manifests+=("$descriptor_digest")
                    fi
                    ;;
                  *)
                    echo "unexpected OCI descriptor media type" >&2
                    exit 1
                    ;;
                esac
              done <<< "$descriptor_lines"
            done
            ((${#attestation_manifests[@]} > 0))
            found_sbom=0
            found_provenance=0
            evidence_count=0
            for manifest_digest in "${attestation_manifests[@]}"; do
              [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              manifest_path="$layout/blobs/sha256/${manifest_digest#sha256:}"
              cp "$manifest_path" \
                "$evidence_root/$role.attestation-manifest-$evidence_count.json"
              mapfile -t statement_descriptors < <(
                jq -r '.layers[] | select(
                  .mediaType == "application/vnd.in-toto+json"
                ) | [(.annotations["in-toto.io/predicate-type"] // ""), .digest]
                  | @tsv' "$manifest_path"
              )
              for statement_descriptor in "${statement_descriptors[@]}"; do
                IFS=$'\t' read -r declared_predicate statement_digest \
                  <<< "$statement_descriptor"
                [[ "$statement_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                statement_path="$layout/blobs/sha256/${statement_digest#sha256:}"
                actual_predicate=$(jq -r '.predicateType // empty' "$statement_path")
                [[ "$actual_predicate" == "$declared_predicate" ]]
                cp "$statement_path" \
                  "$evidence_root/$role.attestation-$evidence_count.json"
                case "$actual_predicate" in
                  https://spdx.dev/Document) found_sbom=1 ;;
                  https://slsa.dev/provenance/*) found_provenance=1 ;;
                esac
                evidence_count=$((evidence_count + 1))
              done
            done
            ((found_sbom == 1))
            ((found_provenance == 1))
          done
          scripts/verify-dev-image-secrets \
            --expected-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --forbid-bytes-dir "$canary_root" \
            --scan-path "$publication_root" \
            --scan-path "$evidence_root" \
            vonk-forge-api:dev-local vonk-forge-worker:dev-local
          uv run --project control --frozen --with-editable . \
            scripts/dev-image-acceptance \
            --api-image vonk-forge-api:dev-local \
            --worker-image vonk-forge-worker:dev-local \
            --commit "$GITHUB_SHA"

      - name: Upload accepted publication inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-development-images-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/accepted/vonk-forge-api.oci.tar
            ${{ runner.temp }}/accepted/vonk-forge-worker.oci.tar
            ${{ runner.temp }}/accepted/docker-compose.pinned.yml
            ${{ runner.temp }}/accepted/docker-compose.dev.yml

  publish-development-images:
    name: Publish accepted main images
    needs: [build-and-accept]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Download accepted OCI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: accepted-development-images-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted
      - name: Recheck exact main before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable tested images
        id: publish
        shell: bash
        env:
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          publish_immutable() {
            local role=$1 archive=$2 image=$3
            local manifest="$RUNNER_TEMP/${role}.manifest.json"
            local digest_file="$RUNNER_TEMP/${role}.digest"
            local inspect_error="$RUNNER_TEMP/${role}.inspect-error"
            local expected observed pushed
            skopeo inspect --raw "oci-archive:$archive" > "$manifest"
            expected=$(skopeo manifest-digest "$manifest")
            [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
            if observed=$(skopeo inspect --format '{{.Digest}}' \
              "docker://$image:${IMMUTABLE_TAG}" 2>"$inspect_error"); then
              if [[ "$observed" != "$expected" ]]; then
                echo "refusing to overwrite immutable $role image tag" >&2
                return 1
              fi
            else
              if ! grep -Eiq 'manifest unknown|name unknown|not found' \
                "$inspect_error"; then
                echo "immutable $role image lookup failed" >&2
                return 1
              fi
              skopeo copy --all --preserve-digests \
                --digestfile "$digest_file" \
                "oci-archive:$archive" \
                "docker://$image:${IMMUTABLE_TAG}" >&2
              pushed=$(tr -d '\r\n' < "$digest_file")
              if [[ "$pushed" != "$expected" ]]; then
                echo "immutable $role image digest changed during publication" >&2
                return 1
              fi
            fi
            printf '%s\n' "$expected"
          }
          api_digest=$(publish_immutable api \
            "$RUNNER_TEMP/accepted/vonk-forge-api.oci.tar" "$API_IMAGE")
          worker_digest=$(publish_immutable worker \
            "$RUNNER_TEMP/accepted/vonk-forge-worker.oci.tar" "$WORKER_IMAGE")
          printf 'api_digest=%s\nworker_digest=%s\n' \
            "$api_digest" "$worker_digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable manifests and attestations
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          IMMUTABLE_TAG: ${{ needs.build-and-accept.outputs.immutable_tag }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          for identity in api worker; do
            if [[ "$identity" == api ]]; then
              image=$API_IMAGE
              digest=$API_DIGEST
            else
              image=$WORKER_IMAGE
              digest=$WORKER_DIGEST
            fi
            observed=$(skopeo inspect --format '{{.Digest}}' \
              "docker://$image:${IMMUTABLE_TAG}")
            [[ "$observed" == "$digest" ]]
            skopeo inspect --config "docker://$image@$digest" \
              | jq -e --arg revision "$GITHUB_SHA" \
                '.config.Labels["org.opencontainers.image.revision"] == $revision' \
                >/dev/null
            docker buildx imagetools inspect "$image@$digest" \
              --format '{{ json .Provenance }}' \
              | jq -e --arg revision "$GITHUB_SHA" \
                '([.. | objects | select(
                  ((.predicateType? // "") | startswith("https://slsa.dev/provenance/"))
                  or (((.SLSA?.buildType? // "") | length) > 0)
                  or (((.buildDefinition?.buildType? // "") | length) > 0)
                  )] | length > 0)
                 and ([.. | strings | select(. == $revision)] | length > 0)' \
                >/dev/null
            docker buildx imagetools inspect "$image@$digest" \
              --format '{{ json .SBOM }}' \
              | jq -e '[.. | objects | select(
                  .SPDXID? == "SPDXRef-DOCUMENT"
                  and ((.spdxVersion? // "") | startswith("SPDX-"))
                )] | length > 0' >/dev/null
          done

      - name: Sign accepted API image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-and-accept.outputs.api_image }}
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true

      - name: Sign accepted worker image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build-and-accept.outputs.worker_image }}
          subject-digest: ${{ steps.publish.outputs.worker_digest }}
          push-to-registry: true

      - name: Upload Compose artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build-and-accept.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/accepted/docker-compose.pinned.yml
            ${{ runner.temp }}/accepted/docker-compose.dev.yml

      - name: Advance accepted development aliases
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ needs.build-and-accept.outputs.api_image }}
          DEV_ALIAS: ${{ needs.build-and-accept.outputs.dev_alias }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ needs.build-and-accept.outputs.worker_image }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]
          scripts/promote-image-aliases \
            "$API_IMAGE" "$API_DIGEST" \
            "$WORKER_IMAGE" "$WORKER_DIGEST" "$DEV_ALIAS"
