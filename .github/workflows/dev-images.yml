name: Development images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vonk-forge-development-images
  cancel-in-progress: true

jobs:
  publish-development-images:
    name: Publish accepted main images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact main tip
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          scripts/dev-image-metadata \
            "$GITHUB_REF" "$GITHUB_SHA" \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" \
            >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Run focused source and Compose contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12 --frozen --with pytest==9.1.1 pytest -q \
            deploy/compose/tests/test_dev_compose.py \
            scripts/tests/test_render_dev_compose.py \
            scripts/tests/test_verify_dev_image_secrets.py \
            scripts/tests/test_dev_image_acceptance.py \
            scripts/tests/test_dev_image_workflow.py
          uv run --project control --frozen pytest -q \
            control/tests/test_dev_init.py \
            control/tests/test_generation_readiness.py
          scripts/verify-public-image-inputs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Skopeo from Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Build exact OCI archives
        shell: bash
        run: |
          set -euo pipefail
          api_archive="$RUNNER_TEMP/vonk-forge-api.oci.tar"
          worker_archive="$RUNNER_TEMP/vonk-forge-worker.oci.tar"
          common_labels=(
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
          )
          docker buildx build \
            --file control/Dockerfile \
            --target api \
            --platform linux/amd64 \
            --output "type=oci,dest=$api_archive" \
            --sbom=true \
            --provenance=mode=max \
            "${common_labels[@]}" \
            .
          docker buildx build \
            --file control/Dockerfile \
            --target worker \
            --platform linux/amd64 \
            --output "type=oci,dest=$worker_archive" \
            --sbom=true \
            --provenance=mode=max \
            "${common_labels[@]}" \
            .

      - name: Load tested images without pulling
        shell: bash
        run: |
          set -euo pipefail
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/vonk-forge-api.oci.tar" \
            docker-daemon:vonk-forge-api:dev-local
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/vonk-forge-worker.oci.tar" \
            docker-daemon:vonk-forge-worker:dev-local

      - name: Scan and accept image-only stack
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-dev-image-secrets \
            vonk-forge-api:dev-local vonk-forge-worker:dev-local
          scripts/dev-image-acceptance \
            --api-image vonk-forge-api:dev-local \
            --worker-image vonk-forge-worker:dev-local \
            --commit "$GITHUB_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable tested images
        id: publish
        shell: bash
        env:
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
          WORKER_IMAGE: ${{ steps.metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          api_digest_file="$RUNNER_TEMP/api.digest"
          worker_digest_file="$RUNNER_TEMP/worker.digest"
          skopeo copy --all --preserve-digests \
            --digestfile "$api_digest_file" \
            "oci-archive:$RUNNER_TEMP/vonk-forge-api.oci.tar" \
            "docker://$API_IMAGE:${IMMUTABLE_TAG}"
          skopeo copy --all --preserve-digests \
            --digestfile "$worker_digest_file" \
            "oci-archive:$RUNNER_TEMP/vonk-forge-worker.oci.tar" \
            "docker://$WORKER_IMAGE:${IMMUTABLE_TAG}"
          api_digest=$(tr -d '\r\n' < "$api_digest_file")
          worker_digest=$(tr -d '\r\n' < "$worker_digest_file")
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$worker_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'api_digest=%s\nworker_digest=%s\n' \
            "$api_digest" "$worker_digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable manifests and attestations
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ steps.metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          for identity in api worker; do
            if [[ "$identity" == api ]]; then
              image=$API_IMAGE
              digest=$API_DIGEST
            else
              image=$WORKER_IMAGE
              digest=$WORKER_DIGEST
            fi
            observed=$(skopeo inspect --format '{{.Digest}}' \
              "docker://$image:${IMMUTABLE_TAG}")
            [[ "$observed" == "$digest" ]]
            skopeo inspect --config "docker://$image@$digest" \
              | jq -e --arg revision "$GITHUB_SHA" \
                '.config.Labels["org.opencontainers.image.revision"] == $revision' \
                >/dev/null
            docker buildx imagetools inspect "$image@$digest" \
              --format '{{ json .Provenance }}' \
              | jq -e --arg revision "$GITHUB_SHA" \
                '.. | strings | select(. == $revision)' >/dev/null
            docker buildx imagetools inspect "$image@$digest" \
              --format '{{ json .SBOM }}' \
              | jq -e '. != null' >/dev/null
          done

      - name: Render digest-pinned Compose artifact
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          IMMUTABLE_TAG: ${{ steps.metadata.outputs.immutable_tag }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ steps.metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          install -d -m 0700 dist
          scripts/render-dev-compose \
            --output dist/docker-compose.yml \
            --api-image "$API_IMAGE:${IMMUTABLE_TAG}@${API_DIGEST}" \
            --worker-image "$WORKER_IMAGE:${IMMUTABLE_TAG}@${WORKER_DIGEST}" \
            --commit "$GITHUB_SHA"
          docker compose -f dist/docker-compose.yml config -q

      - name: Upload Compose artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: dist/docker-compose.yml

      - name: Advance accepted development aliases
        shell: bash
        env:
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          API_IMAGE: ${{ steps.metadata.outputs.api_image }}
          DEV_ALIAS: ${{ steps.metadata.outputs.dev_alias }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
          WORKER_IMAGE: ${{ steps.metadata.outputs.worker_image }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == \
            "$(git rev-parse --verify refs/remotes/origin/main^{commit})" ]]
          skopeo copy --all --preserve-digests \
            "docker://$API_IMAGE@$API_DIGEST" \
            "docker://$API_IMAGE:$DEV_ALIAS"
          skopeo copy --all --preserve-digests \
            "docker://$WORKER_IMAGE@$WORKER_DIGEST" \
            "docker://$WORKER_IMAGE:$DEV_ALIAS"
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$API_IMAGE:$DEV_ALIAS") == "$API_DIGEST" ]]
          [[ $(skopeo inspect --format '{{.Digest}}' \
            "docker://$WORKER_IMAGE:$DEV_ALIAS") == "$WORKER_DIGEST" ]]
