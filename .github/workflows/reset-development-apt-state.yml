name: Reset pre-production apt state

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET-vonk-forge-packages-dev-state
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vonk-forge-agent-apt-dev
  cancel-in-progress: false

jobs:
  reset:
    name: Reset exact isolated development state bucket
    if: >-
      github.repository == 'CarstVaartjes/vonk-forge' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'RESET-vonk-forge-packages-dev-state'
    runs-on: ubuntu-24.04
    environment: apt-development
    timeout-minutes: 10
    steps:
      - name: Install R2 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rclone

      - name: Reset only the pre-production apt state bucket
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_APT_STATE_BUCKET: ${{ vars.R2_APT_STATE_BUCKET }}
        run: |
          set -euo pipefail
          test "$R2_APT_STATE_BUCKET" = vonk-forge-packages-dev-state
          object_count=$(rclone lsf \
            "r2:$R2_APT_STATE_BUCKET" \
            --recursive --files-only | wc -l | tr -d '[:space:]')
          rclone delete "r2:$R2_APT_STATE_BUCKET"
          remaining=$(rclone lsf \
            "r2:$R2_APT_STATE_BUCKET" \
            --recursive --files-only | wc -l | tr -d '[:space:]')
          test "$remaining" = 0
          printf 'Reset isolated apt development state (%s objects).\n' \
            "$object_count" >> "$GITHUB_STEP_SUMMARY"
