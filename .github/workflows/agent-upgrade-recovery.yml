name: Agent upgrade recovery acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-upgrade-recovery.yml
      - Cargo.lock
      - Cargo.toml
      - control/src/vonk_control/agent_jobs.py
      - control/src/vonk_control/compat_recovery.py
      - control/src/vonk_control/host_helper_authority.py
      - packaging/**
      - rust/crates/vonk-agent/**
      - rust/crates/vonk-agent-helper/**
      - rust/crates/vonk-agent-protocol/**
      - rust/crates/vonk-build-egress/**
      - scripts/build-agent-deb
      - tests/nodes/test_agent_upgrade_recovery_systemd.sh
      - tests/test_agent_upgrade_recovery_workflow.py
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-upgrade-recovery.yml
      - Cargo.lock
      - Cargo.toml
      - control/src/vonk_control/agent_jobs.py
      - control/src/vonk_control/compat_recovery.py
      - control/src/vonk_control/host_helper_authority.py
      - packaging/**
      - rust/crates/vonk-agent/**
      - rust/crates/vonk-agent-helper/**
      - rust/crates/vonk-agent-protocol/**
      - rust/crates/vonk-build-egress/**
      - scripts/build-agent-deb
      - tests/nodes/test_agent_upgrade_recovery_systemd.sh
      - tests/test_agent_upgrade_recovery_workflow.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vonk-agent-upgrade-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-arm64-recovery:
    name: Exercise pinned recovery on disposable ARM64 systemd
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Restore read-only ARM64 Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-arm64
          add-job-id-key: "false"
          save-if: "false"
      - name: Install native acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            acl adduser build-essential ca-certificates init-system-helpers \
            fuse-overlayfs iproute2 iptables openssl podman shellcheck \
            slirp4netns systemd uidmap util-linux
      - name: Validate historical compatibility and current capsule recovery
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -d /run/systemd/system
          test "$(dpkg --print-architecture)" = arm64
          bash -n tests/nodes/test_agent_upgrade_recovery_systemd.sh
          shellcheck tests/nodes/test_agent_upgrade_recovery_systemd.sh
          RUSTFLAGS='-C target-feature=+crt-static' \
            cargo build --locked --release --package vonk-build-egress
          build_egress=$(realpath target/release/vonk-build-egress)
          build_egress_staged="$build_egress.root-owned"
          sudo install -o root -g root -m 0755 \
            "$build_egress" "$build_egress_staged"
          sudo mv -f "$build_egress_staged" "$build_egress"
          test "$(stat -c %u:%g:%a:%h "$build_egress")" = 0:0:755:1
          compatibility_cargo_dir=$(dirname "$(command -v cargo)")
          compatibility_cargo_home=$(dirname "$compatibility_cargo_dir")
          compatibility_rustup_home=$(rustup show home)
          current_version="0.1.0~dev.$(git show -s --format=%ct HEAD)+g$(git rev-parse --short=12 HEAD)"
          sudo env \
            PATH="$compatibility_cargo_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            CARGO_HOME="$compatibility_cargo_home" \
            RUSTUP_HOME="$compatibility_rustup_home" \
            VERSION=0.1.0~dev.381+ga122909feaa3 \
            HISTORICAL_A122=1 \
            STALE_PENDING_FORMAT=legacy2 \
            CRASH_MODE=full-cgroup \
            CANDIDATE_CUSTODY=legacy \
            BUILD_EGRESS_BINARY="$build_egress" \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
          sudo env \
            PATH="$compatibility_cargo_dir:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            CARGO_HOME="$compatibility_cargo_home" \
            RUSTUP_HOME="$compatibility_rustup_home" \
            VERSION="$current_version" \
            STALE_PENDING_FORMAT=prior3 \
            CRASH_MODE=post-remove \
            CANDIDATE_CUSTODY=root \
            BUILD_EGRESS_BINARY="$build_egress" \
            tests/nodes/test_agent_upgrade_recovery_systemd.sh
