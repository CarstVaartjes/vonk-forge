name: Installer publication

on:
  workflow_run:
    workflows:
      - CI
      - Development images
      - Rust Vonk Forge agent development
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: vonk-forge-installer-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  authority:
    name: Accept one complete source generation
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (((github.event.workflow_run.name == 'Rust Vonk Forge agent development' ||
         github.event.workflow_run.name == 'Development images') &&
       github.event.workflow_run.head_branch == 'main') ||
       github.event.workflow_run.name == 'CI')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.accept.outputs.channel }}
      version: ${{ steps.accept.outputs.version }}
      source_sha: ${{ steps.accept.outputs.source_sha }}
      authority_ref: ${{ steps.accept.outputs.authority_ref }}
      tag_oid: ${{ steps.accept.outputs.tag_oid }}
      package_run_id: ${{ steps.accept.outputs.package_run_id }}
      package_artifact: ${{ steps.accept.outputs.package_artifact }}
      amd64_package: ${{ steps.accept.outputs.amd64_package }}
      arm64_package: ${{ steps.accept.outputs.arm64_package }}
      compose_run_id: ${{ steps.accept.outputs.compose_run_id }}
      compose_artifact: ${{ steps.accept.outputs.compose_artifact }}
    steps:
      - name: Check out the exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Bind accepted workflow evidence to source authority
        id: accept
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin

          case "$TRIGGER_NAME" in
            'Rust Vonk Forge agent development'|'Development images')
              channel=dev
              authority_ref=refs/heads/main
              tag_oid=
              test "$SOURCE_SHA" = \
                "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
              package_runs=$RUNNER_TEMP/development-agent-runs.json
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/agent-release.yml/runs?event=push&status=completed&head_sha=$SOURCE_SHA&per_page=100" \
                --jq '.workflow_runs[]' | jq -s . > "$package_runs"
              mapfile -t accepted_package_runs < <(
                jq -r --arg sha "$SOURCE_SHA" '
                  .[] | select(
                    .head_sha == $sha and .head_branch == "main" and
                    .event == "push" and .status == "completed" and
                    .conclusion == "success"
                  ) | [.id, .run_number] | @tsv
                ' "$package_runs"
              )
              test "${#accepted_package_runs[@]}" -ge 1
              read -r package_run_id package_run_number \
                <<< "${accepted_package_runs[0]}"
              metadata=$(
                scripts/agent-package-metadata \
                  development branch main "$SOURCE_SHA" "$package_run_number"
              )
              compose_runs=$RUNNER_TEMP/development-image-runs.json
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/dev-images.yml/runs?event=push&status=completed&head_sha=$SOURCE_SHA&per_page=100" \
                --jq '.workflow_runs[]' | jq -s . > "$compose_runs"
              mapfile -t compose_run_ids < <(
                jq -r --arg sha "$SOURCE_SHA" '
                  .[] | select(
                    .head_sha == $sha and .head_branch == "main" and
                    .event == "push" and .status == "completed" and
                    .conclusion == "success"
                  ) | .id
                ' "$compose_runs"
              )
              test "${#compose_run_ids[@]}" -ge 1
              compose_run_id=${compose_run_ids[0]}
              compose_artifact="vonk-forge-dev-compose-$SOURCE_SHA"
              ;;
            CI)
              channel=stable
              mapfile -t release_tags < <(
                git tag --points-at "$SOURCE_SHA" \
                  | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
              )
              test "${#release_tags[@]}" = 1
              release_tag=${release_tags[0]}
              authority_ref="refs/tags/$release_tag"
              test "$(git cat-file -t "$authority_ref")" = tag
              tag_oid=$(git rev-parse --verify "$authority_ref")
              scripts/verify-release-tag-authority \
                "$release_tag" "$tag_oid" "$SOURCE_SHA"
              metadata=$(
                scripts/agent-package-metadata \
                  production tag "$release_tag" "$SOURCE_SHA" 0
              )
              package_run_id=$TRIGGER_RUN_ID
              compose_run_id=$TRIGGER_RUN_ID
              compose_artifact="platform-build-${release_tag#v}"
              ;;
            *)
              exit 64
              ;;
          esac

          version=$(sed -n 's/^version=//p' <<< "$metadata")
          package_artifact=$(sed -n 's/^artifact_name=//p' <<< "$metadata")
          amd64_package=$(sed -n 's/^amd64_package=//p' <<< "$metadata")
          arm64_package=$(sed -n 's/^arm64_package=//p' <<< "$metadata")
          test -n "$version" && test -n "$package_artifact"
          [[ "$compose_run_id" =~ ^[1-9][0-9]*$ ]]

          artifacts=$RUNNER_TEMP/accepted-artifacts.json
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$package_run_id/artifacts?per_page=100" \
            --jq '.artifacts[]' | jq -s . > "$artifacts"
          test "$(jq --arg name "$package_artifact" '[.[] | select(.name == $name and (.expired | not))] | length' "$artifacts")" = 1
          if [[ "$compose_run_id" != "$package_run_id" ]]; then
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$compose_run_id/artifacts?per_page=100" \
              --jq '.artifacts[]' | jq -s . > "$artifacts"
          fi
          test "$(jq --arg name "$compose_artifact" '[.[] | select(.name == $name and (.expired | not))] | length' "$artifacts")" = 1

          printf '%s\n' \
            "channel=$channel" \
            "version=$version" \
            "source_sha=$SOURCE_SHA" \
            "authority_ref=$authority_ref" \
            "tag_oid=$tag_oid" \
            "package_run_id=$package_run_id" \
            "package_artifact=$package_artifact" \
            "amd64_package=$amd64_package" \
            "arm64_package=$arm64_package" \
            "compose_run_id=$compose_run_id" \
            "compose_artifact=$compose_artifact" \
            >> "$GITHUB_OUTPUT"

  build-setup:
    name: Build native setup (${{ matrix.platform }})
    needs: [authority]
    if: needs.authority.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            binaries: vonk-nas-setup vonk-spark-setup
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            binaries: vonk-nas-setup vonk-spark-setup
          - platform: darwin-amd64
            runner: macos-15-intel
            binaries: vonk-nas-setup
          - platform: darwin-arm64
            runner: macos-15
            binaries: vonk-nas-setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Build exact native setup programs
        shell: bash
        env:
          BINARIES: ${{ matrix.binaries }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM:$(uname -s):$(uname -m)" in
            linux-amd64:Linux:x86_64|linux-arm64:Linux:aarch64|darwin-amd64:Darwin:x86_64|darwin-arm64:Darwin:arm64) ;;
            *) echo "installer setup runner architecture does not match" >&2; exit 1 ;;
          esac
          output="$RUNNER_TEMP/setup/$PLATFORM"
          install -d -m 0755 "$output"
          for binary in $BINARIES; do
            cargo build --locked --release --package "$binary" --bin "$binary"
            install -m 0555 "target/release/$binary" "$output/$binary"
          done
          find "$output" -maxdepth 1 -type f -exec sha256sum {} + \
            | LC_ALL=C sort > "$output/SHA256SUMS"

      - name: Upload native setup programs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-setup-${{ needs.authority.outputs.source_sha }}-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/setup

  publish:
    name: Publish complete ${{ needs.authority.outputs.channel }} installer generation
    needs: [authority, build-setup]
    if: needs.authority.result == 'success' && needs.build-setup.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: installer-${{ needs.authority.outputs.channel }}
    concurrency:
      group: vonk-forge-installer-r2-${{ needs.authority.outputs.channel }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact accepted publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Download accepted native setup programs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-setup-${{ needs.authority.outputs.source_sha }}-*
          path: ${{ runner.temp }}/setups
          merge-multiple: true

      - name: Download exact accepted agent packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authority.outputs.package_artifact }}
          path: ${{ runner.temp }}/packages
          run-id: ${{ needs.authority.outputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact accepted Compose model
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authority.outputs.compose_artifact }}
          path: ${{ runner.temp }}/compose
          run-id: ${{ needs.authority.outputs.compose_run_id }}
          github-token: ${{ github.token }}

      - name: Assemble accepted installer generation
        id: assemble
        shell: bash
        env:
          CHANNEL: ${{ needs.authority.outputs.channel }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          VERSION: ${{ needs.authority.outputs.version }}
          AMD64_PACKAGE: ${{ needs.authority.outputs.amd64_package }}
          ARM64_PACKAGE: ${{ needs.authority.outputs.arm64_package }}
          INSTALLER_PUBLIC_ORIGIN: ${{ vars.INSTALLER_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          test "$INSTALLER_PUBLIC_ORIGIN" = https://install.vonkforge.ai
          case "$CHANNEL" in
            dev) compose_name=docker-compose.pinned.yml ;;
            stable) compose_name=docker-compose.production.yml ;;
            *) exit 64 ;;
          esac
          mapfile -t compose_paths < <(find "$RUNNER_TEMP/compose" -type f -name "$compose_name")
          test "${#compose_paths[@]}" = 1
          compose=${compose_paths[0]}
          payload=$RUNNER_TEMP/payload.json
          scripts/build-nas-compose-bundle \
            --compose "$compose" \
            --output "$payload"

          image_value() {
            local role=$1
            mapfile -t values < <(
              sed -nE "s|^[[:space:]]+image:[[:space:]]+(ghcr.io/carstvaartjes/vonk-forge-${role}:[^[:space:]]+@sha256:[0-9a-f]{64})$|\\1|p" "$compose" \
                | sort -u
            )
            test "${#values[@]}" = 1
            printf '%s\n' "${values[0]}"
          }
          api_image=$(image_value api)
          worker_image=$(image_value worker)
          hermes_image=$(image_value hermes)
          for image in "$api_image" "$worker_image" "$hermes_image"; do
            [[ "$image" =~ ^[a-z0-9][a-z0-9./_-]*:[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[0-9a-f]{64}$ ]]
            [[ "$image" != *:latest@* && "$image" != *:dev@* && "$image" != *:main@* && "$image" != *:edge@* ]]
          done

          evidence=$RUNNER_TEMP/accepted-installer-evidence.json
          jq -S -c -n \
            --arg channel "$CHANNEL" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            '{channel:$channel,gates:{agent_packages:true,compose:true,nas_payload:true,setup_binaries:true,source_authority:true},schema_version:1,source_sha:$source_sha,status:"accepted",version:$version}' \
            > "$evidence"

          output=$RUNNER_TEMP/installer-publication
          assemble=(
            scripts/install-release-publication assemble
            --channel "$CHANNEL"
            --version "$VERSION"
            --source-sha "$SOURCE_SHA"
            --accepted-evidence "$evidence"
            --origin "$INSTALLER_PUBLIC_ORIGIN"
            --api-image "$api_image"
            --worker-image "$worker_image"
            --hermes-image "$hermes_image"
            --nas-payload "$payload"
            --nas-setup "linux-amd64=$RUNNER_TEMP/setups/linux-amd64/vonk-nas-setup"
            --nas-setup "linux-arm64=$RUNNER_TEMP/setups/linux-arm64/vonk-nas-setup"
            --nas-setup "darwin-amd64=$RUNNER_TEMP/setups/darwin-amd64/vonk-nas-setup"
            --nas-setup "darwin-arm64=$RUNNER_TEMP/setups/darwin-arm64/vonk-nas-setup"
            --spark-setup "linux-amd64=$RUNNER_TEMP/setups/linux-amd64/vonk-spark-setup"
            --spark-setup "linux-arm64=$RUNNER_TEMP/setups/linux-arm64/vonk-spark-setup"
            --agent-package "linux-amd64=$RUNNER_TEMP/packages/$AMD64_PACKAGE"
            --agent-package "linux-arm64=$RUNNER_TEMP/packages/$ARM64_PACKAGE"
            --output "$output"
          )
          "${assemble[@]}" | tee "$RUNNER_TEMP/assembly.out"
          generation=$(sed -n 's/^generation=//p' "$RUNNER_TEMP/assembly.out")
          [[ "$generation" =~ ^[0-9a-f]{64}$ ]]
          printf 'generation=%s\n' "$generation" >> "$GITHUB_OUTPUT"

      - name: Install R2 publication client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rclone

      - name: Revalidate source authority before R2 credentials
        shell: bash
        env:
          AUTHORITY_REF: ${{ needs.authority.outputs.authority_ref }}
          CHANNEL: ${{ needs.authority.outputs.channel }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          TAG_OID: ${{ needs.authority.outputs.tag_oid }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          case "$CHANNEL" in
            dev)
              test "$AUTHORITY_REF" = refs/heads/main
              test "$SOURCE_SHA" = \
                "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
              ;;
            stable)
              git fetch --force --tags origin
              tag=${AUTHORITY_REF#refs/tags/}
              scripts/verify-release-tag-authority \
                "$tag" "$TAG_OID" "$SOURCE_SHA"
              ;;
            *) exit 64 ;;
          esac

      - name: Publish immutable generation and advance pointer last
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          scripts/install-release-publication publish \
            --bundle "$RUNNER_TEMP/installer-publication" \
            --rclone-remote "r2:$R2_INSTALLER_PUBLIC_BUCKET" \
            | tee "$RUNNER_TEMP/publication-receipt.jsonl"
          test "$(tail -n 1 "$RUNNER_TEMP/publication-receipt.jsonl" | jq -r .phase)" = pointer

      - name: Upload publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-publication-${{ needs.authority.outputs.channel }}-${{ steps.assemble.outputs.generation }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-publication/publication-plan.json
            ${{ runner.temp }}/publication-receipt.jsonl
