name: Installer publication

on:
  workflow_run:
    workflows:
      - CI
      - Installer publication source
    types: [completed]
  schedule:
    # Refresh only re-signs the already published immutable generation.
    - cron: '17 3 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    vonk-forge-installer-${{
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha) ||
      github.run_id
    }}
  # One source anchor emits exactly one development fan-in event per main
  # generation. Stable publication remains anchored to the completed CI tag.
  cancel-in-progress: true

jobs:
  authority:
    name: Accept one complete source generation
    if: >-
      github.event.workflow_run.event == 'push' &&
      ((github.event.workflow_run.name == 'Installer publication source' &&
       github.event.workflow_run.head_branch == 'main') ||
       github.event.workflow_run.name == 'CI')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.accept.outputs.ready }}
      channel: ${{ steps.accept.outputs.channel }}
      version: ${{ steps.accept.outputs.version }}
      source_sha: ${{ steps.accept.outputs.source_sha }}
      authority_ref: ${{ steps.accept.outputs.authority_ref }}
      tag_oid: ${{ steps.accept.outputs.tag_oid }}
      package_run_id: ${{ steps.accept.outputs.package_run_id }}
      package_artifact: ${{ steps.accept.outputs.package_artifact }}
      arm64_package: ${{ steps.accept.outputs.arm64_package }}
      baseline_version: ${{ steps.accept.outputs.baseline_version }}
      baseline_artifact: ${{ steps.accept.outputs.baseline_artifact }}
      arm64_baseline_package: ${{ steps.accept.outputs.arm64_baseline_package }}
      compose_run_id: ${{ steps.accept.outputs.compose_run_id }}
      compose_artifact: ${{ steps.accept.outputs.compose_artifact }}
      compose_source_sha: ${{ steps.accept.outputs.compose_source_sha }}
      setup_run_id: ${{ steps.accept.outputs.setup_run_id }}
      setup_source_sha: ${{ steps.accept.outputs.setup_source_sha }}
    steps:
      - name: Check out the exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Bind accepted workflow evidence to source authority
        id: accept
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          not_ready() {
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          development_run() {
            local workflow=$1 exact_runs candidate
            exact_runs=$RUNNER_TEMP/${workflow%.yml}-exact-runs.json
            for attempt in $(seq 1 360); do
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&head_sha=$SOURCE_SHA&per_page=100" \
                --jq '.workflow_runs[]' | jq -s . > "$exact_runs"
              candidate=$(jq -r --arg sha "$SOURCE_SHA" '
                [.[] | select(
                  .head_sha == $sha and .head_branch == "main" and
                  .event == "push"
                )] | sort_by(.created_at) | reverse | .[0] // empty |
                [.id, .run_number, .head_sha, .status, (.conclusion // "")] | @tsv
              ' "$exact_runs")
              if test -z "$candidate"; then
                break
              fi
              IFS=$'\t' read -r run_id run_number run_sha run_status run_conclusion \
                <<< "$candidate"
              if test "$run_status" != completed; then
                sleep 5
                continue
              fi
              test "$run_conclusion" = success
              printf '%s\t%s\t%s\n' "$run_id" "$run_number" "$run_sha"
              return 0
            done
            if test -n "$candidate"; then
              echo "$workflow did not complete for $SOURCE_SHA" >&2
              return 1
            fi

            # A path-filtered producer has no run for an unchanged component.
            # Reuse only the newest successful main run whose source is an
            # ancestor of this exact generation.
            local completed_runs=$RUNNER_TEMP/${workflow%.yml}-completed-runs.json
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&status=completed&branch=main&per_page=100" \
              --jq '.workflow_runs[]' | jq -s . > "$completed_runs"
            while IFS=$'\t' read -r run_id run_number run_sha; do
              if git merge-base --is-ancestor "$run_sha" "$SOURCE_SHA"; then
                printf '%s\t%s\t%s\n' "$run_id" "$run_number" "$run_sha"
                return 0
              fi
            done < <(
              jq -r '
                [.[] | select(
                  .head_branch == "main" and .event == "push" and
                  .status == "completed" and .conclusion == "success"
                )] | sort_by(.created_at) | reverse | .[] |
                [.id, .run_number, .head_sha] | @tsv
              ' "$completed_runs"
            )
            echo "no accepted ancestral run for $workflow at $SOURCE_SHA" >&2
            return 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$TRIGGER_CONCLUSION" = success
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin

          case "$TRIGGER_NAME" in
            'Installer publication source')
              channel=dev
              authority_ref=refs/heads/main
              tag_oid=
              # A successful prerequisite can finish after main has already
              # advanced. That generation is intentionally no longer
              # publishable, but it is an expected stale trigger rather than a
              # broken deployment. End this fan-in run cleanly while the
              # current main generation continues independently.
              if test "$SOURCE_SHA" != \
                "$(git rev-parse --verify refs/remotes/origin/main^{commit})"; then
                not_ready
              fi
              # Producer completion is a workflow dependency. Do not use a
              # wall-clock grace period as a substitute for it: an exact run
              # must already be complete and successful before its artifacts
              # can enter the candidate.
              IFS=$'\t' read -r package_run_id package_run_number package_source_sha \
                < <(development_run agent-release.yml)
              metadata=$(
                scripts/agent-package-metadata \
                  development branch main "$package_source_sha" "$package_run_number"
              )
              IFS=$'\t' read -r compose_run_id _ compose_source_sha \
                < <(development_run dev-images.yml)
              compose_artifact="vonk-forge-dev-compose-$compose_source_sha"
              IFS=$'\t' read -r setup_run_id _ setup_source_sha \
                < <(development_run installer-setups.yml)
              ;;
            CI)
              channel=stable
              mapfile -t release_tags < <(
                git tag --points-at "$SOURCE_SHA" \
                  | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
              )
              test "${#release_tags[@]}" = 1
              release_tag=${release_tags[0]}
              authority_ref="refs/tags/$release_tag"
              test "$(git cat-file -t "$authority_ref")" = tag
              tag_oid=$(git rev-parse --verify "$authority_ref")
              scripts/verify-release-tag-authority \
                "$release_tag" "$tag_oid" "$SOURCE_SHA"
              metadata=$(
                scripts/agent-package-metadata \
                  production tag "$release_tag" "$SOURCE_SHA" 0
              )
              package_run_id=$TRIGGER_RUN_ID
              compose_run_id=$TRIGGER_RUN_ID
              compose_source_sha=$SOURCE_SHA
              compose_artifact="platform-build-${release_tag#v}"
              setup_source_sha=$SOURCE_SHA
              setup_runs=$RUNNER_TEMP/installer-setup-runs.json
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/installer-setups.yml/runs?event=push&status=completed&head_sha=$SOURCE_SHA&per_page=100" \
                --jq '.workflow_runs[]' | jq -s . > "$setup_runs"
              setup_run_id=$(jq -r --arg sha "$SOURCE_SHA" '
                [.[] | select(
                  .head_sha == $sha and .head_branch == "main" and
                  .event == "push" and .status == "completed" and
                  .conclusion == "success"
                )] | sort_by(.created_at) | reverse | .[0].id // empty
              ' "$setup_runs")
              test -n "$setup_run_id"
              ;;
            *)
              exit 64
              ;;
          esac

          version=$(sed -n 's/^version=//p' <<< "$metadata")
          package_artifact=$(sed -n 's/^artifact_name=//p' <<< "$metadata")
          arm64_package=$(sed -n 's/^arm64_package=//p' <<< "$metadata")
          baseline_version=$(sed -n 's/^baseline_version=//p' <<< "$metadata")
          baseline_artifact=$(sed -n 's/^baseline_artifact_name=//p' <<< "$metadata")
          arm64_baseline_package=$(sed -n 's/^arm64_baseline_package=//p' <<< "$metadata")
          test -n "$version" && test -n "$package_artifact"
          [[ "$compose_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$compose_source_sha" =~ ^[0-9a-f]{40}$ ]]

          artifacts=$RUNNER_TEMP/accepted-artifacts.json
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$package_run_id/artifacts?per_page=100" \
            --jq '.artifacts[]' | jq -s . > "$artifacts"
          test "$(jq --arg name "$package_artifact" '[.[] | select(.name == $name and (.expired | not))] | length' "$artifacts")" = 1
          test "$(jq --arg name "$baseline_artifact" '[.[] | select(.name == $name and (.expired | not))] | length' "$artifacts")" = 1
          if [[ "$compose_run_id" != "$package_run_id" ]]; then
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$compose_run_id/artifacts?per_page=100" \
              --jq '.artifacts[]' | jq -s . > "$artifacts"
          fi
          test "$(jq --arg name "$compose_artifact" '[.[] | select(.name == $name and (.expired | not))] | length' "$artifacts")" = 1
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$setup_run_id/artifacts?per_page=100" \
            --jq '.artifacts[]' | jq -s . > "$artifacts"
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            setup_artifact="installer-setup-$setup_source_sha-$platform"
            test "$(jq --arg name "$setup_artifact" '[.[] | select(.name == $name and (.expired | not))] | length' "$artifacts")" = 1
          done

          printf '%s\n' \
            "ready=true" \
            "channel=$channel" \
            "version=$version" \
            "source_sha=$SOURCE_SHA" \
            "authority_ref=$authority_ref" \
            "tag_oid=$tag_oid" \
            "package_run_id=$package_run_id" \
            "package_artifact=$package_artifact" \
            "arm64_package=$arm64_package" \
            "baseline_version=$baseline_version" \
            "baseline_artifact=$baseline_artifact" \
            "arm64_baseline_package=$arm64_baseline_package" \
            "compose_run_id=$compose_run_id" \
            "compose_artifact=$compose_artifact" \
            "compose_source_sha=$compose_source_sha" \
            "setup_run_id=$setup_run_id" \
            "setup_source_sha=$setup_source_sha" \
            >> "$GITHUB_OUTPUT"

  candidate:
    name: Publish immutable ${{ needs.authority.outputs.channel }} installer candidate
    needs: [authority]
    if: >-
      needs.authority.result == 'success' &&
      needs.authority.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: installer-candidate-${{ needs.authority.outputs.channel }}
    outputs:
      generation: ${{ steps.assemble.outputs.generation }}
    concurrency:
      group: vonk-forge-installer-r2-${{ needs.authority.outputs.channel }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact accepted publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Download accepted native setup programs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-setup-${{ needs.authority.outputs.setup_source_sha }}-*
          path: ${{ runner.temp }}/setups
          merge-multiple: true
          run-id: ${{ needs.authority.outputs.setup_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact accepted agent packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authority.outputs.package_artifact }}
          path: ${{ runner.temp }}/packages
          run-id: ${{ needs.authority.outputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact acceptance baseline agent packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authority.outputs.baseline_artifact }}
          path: ${{ runner.temp }}/baseline-packages
          run-id: ${{ needs.authority.outputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact accepted Compose model
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.authority.outputs.compose_artifact }}
          path: ${{ runner.temp }}/compose
          run-id: ${{ needs.authority.outputs.compose_run_id }}
          github-token: ${{ github.token }}

      - name: Assemble accepted installer generation
        id: assemble
        shell: bash
        env:
          CHANNEL: ${{ needs.authority.outputs.channel }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          IMAGES_SOURCE_SHA: ${{ needs.authority.outputs.compose_source_sha }}
          VERSION: ${{ needs.authority.outputs.version }}
          ARM64_PACKAGE: ${{ needs.authority.outputs.arm64_package }}
          ARM64_BASELINE_PACKAGE: ${{ needs.authority.outputs.arm64_baseline_package }}
          INSTALLER_PUBLIC_ORIGIN: ${{ vars.INSTALLER_PUBLIC_ORIGIN }}
          VONK_INSTALLER_RELEASE_KEY_FINGERPRINT: ${{ vars.VONK_INSTALLER_RELEASE_KEY_FINGERPRINT }}
          VONK_INSTALLER_RELEASE_PRIVATE_KEY: ${{ secrets.VONK_INSTALLER_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$INSTALLER_PUBLIC_ORIGIN" = https://install.vonkforge.ai
          [[ "$VONK_INSTALLER_RELEASE_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          signing_key=$RUNNER_TEMP/installer-release-private.pem
          public_key=$RUNNER_TEMP/installer-release-public.pem
          public_der=$RUNNER_TEMP/installer-release-public.der
          trap 'rm -f "$signing_key" "$public_key" "$public_der"' EXIT
          install -m 0600 /dev/null "$signing_key"
          printf '%s' "$VONK_INSTALLER_RELEASE_PRIVATE_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$public_key"
          openssl pkey -in "$signing_key" -pubout -outform DER -out "$public_der"
          test "$(sha256sum "$public_der" | cut -d' ' -f1)" = \
            "$VONK_INSTALLER_RELEASE_KEY_FINGERPRINT"
          openssl pkey -pubin -in "$public_key" -text -noout \
            | grep -Eq '^Public-Key: \((3072|4096) bit\)$'
          expires_at=$(($(date +%s) + 604800))
          case "$CHANNEL" in
            dev) compose_name=docker-compose.pinned.yml ;;
            stable) compose_name=docker-compose.pinned.yml ;;
            *) exit 64 ;;
          esac
          mapfile -t compose_paths < <(find "$RUNNER_TEMP/compose" -type f -name "$compose_name")
          test "${#compose_paths[@]}" = 1
          compose=${compose_paths[0]}
          payload=$RUNNER_TEMP/payload.json
          scripts/build-nas-compose-bundle \
            --compose "$compose" \
            --channel "$CHANNEL" \
            --output "$payload"

          image_value() {
            local role=$1
            mapfile -t values < <(
              sed -nE "s|^[[:space:]]+image:[[:space:]]+(ghcr.io/carstvaartjes/vonk-forge-${role}:[^[:space:]]+@sha256:[0-9a-f]{64})$|\\1|p" "$compose" \
                | sort -u
            )
            test "${#values[@]}" = 1
            printf '%s\n' "${values[0]}"
          }
          api_image=$(image_value api)
          worker_image=$(image_value worker)
          hermes_image=$(image_value hermes)
          litellm_image=$(image_value litellm)
          for image in "$api_image" "$worker_image" "$hermes_image" "$litellm_image"; do
            [[ "$image" =~ ^[a-z0-9][a-z0-9./_-]*:[A-Za-z0-9][A-Za-z0-9._-]*@sha256:[0-9a-f]{64}$ ]]
            [[ "$image" != *:latest@* && "$image" != *:dev@* && "$image" != *:main@* && "$image" != *:edge@* ]]
          done

          output=$RUNNER_TEMP/installer-publication
          assemble=(
            scripts/install-release-publication assemble
            --channel "$CHANNEL"
            --version "$VERSION"
            --source-sha "$SOURCE_SHA"
            --images-source-sha "$IMAGES_SOURCE_SHA"
            --origin "$INSTALLER_PUBLIC_ORIGIN"
            --expires-at "$expires_at"
            --signing-key "$signing_key"
            --signing-public-key "$public_key"
            --api-image "$api_image"
            --worker-image "$worker_image"
            --hermes-image "$hermes_image"
            --litellm-image "$litellm_image"
            --nas-payload "$payload"
            --nas-setup "linux-amd64=$RUNNER_TEMP/setups/linux-amd64/vonk-nas-setup"
            --nas-setup "linux-arm64=$RUNNER_TEMP/setups/linux-arm64/vonk-nas-setup"
            --nas-setup "darwin-amd64=$RUNNER_TEMP/setups/darwin-amd64/vonk-nas-setup"
            --nas-setup "darwin-arm64=$RUNNER_TEMP/setups/darwin-arm64/vonk-nas-setup"
            --spark-setup "linux-arm64=$RUNNER_TEMP/setups/linux-arm64/vonk-spark-setup"
            --agent-package "linux-arm64=$RUNNER_TEMP/packages/$ARM64_PACKAGE"
            --agent-baseline-package "linux-arm64=$RUNNER_TEMP/baseline-packages/$ARM64_BASELINE_PACKAGE"
            --output "$output"
          )
          "${assemble[@]}" | tee "$RUNNER_TEMP/assembly.out"
          generation=$(sed -n 's/^generation=//p' "$RUNNER_TEMP/assembly.out")
          [[ "$generation" =~ ^[0-9a-f]{64}$ ]]
          printf 'generation=%s\n' "$generation" >> "$GITHUB_OUTPUT"
          rm -f "$signing_key" "$public_key" "$public_der"
          trap - EXIT

      - name: Install R2 publication client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rclone

      - name: Revalidate source authority before R2 credentials
        shell: bash
        env:
          AUTHORITY_REF: ${{ needs.authority.outputs.authority_ref }}
          CHANNEL: ${{ needs.authority.outputs.channel }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          TAG_OID: ${{ needs.authority.outputs.tag_oid }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          case "$CHANNEL" in
            dev)
              test "$AUTHORITY_REF" = refs/heads/main
              test "$SOURCE_SHA" = \
                "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
              ;;
            stable)
              git fetch --force --tags origin
              tag=${AUTHORITY_REF#refs/tags/}
              scripts/verify-release-tag-authority \
                "$tag" "$TAG_OID" "$SOURCE_SHA"
              ;;
            *) exit 64 ;;
          esac

      - name: Publish immutable candidate objects only
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          scripts/install-release-publication publish-candidate \
            --bundle "$RUNNER_TEMP/installer-publication" \
            --rclone-remote "r2:$R2_INSTALLER_PUBLIC_BUCKET" \
            | tee "$RUNNER_TEMP/candidate-receipt.jsonl"
          test -s "$RUNNER_TEMP/candidate-receipt.jsonl"
          test "$(jq -r .phase "$RUNNER_TEMP/candidate-receipt.jsonl" | sort -u)" = immutable

      - name: Upload immutable publication bundle and candidate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-candidate-${{ needs.authority.outputs.channel }}-${{ steps.assemble.outputs.generation }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-publication
            ${{ runner.temp }}/candidate-receipt.jsonl

  nas-lane-acceptance:
    name: Exercise clean NAS candidate (${{ matrix.lane }})
    needs: [authority, candidate]
    if: >-
      always() &&
      needs.authority.result == 'success' &&
      needs.candidate.result == 'success'
    strategy:
      # Native is the only Tailscale owner. The Docker lane receives no OAuth
      # credentials and starts an explicit non-Tailscale service allow-list.
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lane: native
            gateway: vonk-forge-ci-${{ github.run_id }}-${{ github.run_attempt }}-native
            tailscale_mode: full
          - lane: docker-29.4.3
            tailscale_mode: disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: installer-canary-${{ needs.authority.outputs.channel }}
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate acceptance suite
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Install uv and Python
        timeout-minutes: 5
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Download verified Compose parser fixtures
        timeout-minutes: 5
        shell: bash
        env:
          COMPOSE_LOWER_SHA256: eca30ae32dc451f9e6d6c8ddce078a76f23b355c3ca0ab391d58f59e87c0d310
          COMPOSE_UGREEN_SHA256: a0298760c9772d2c06888fc8703a487c94c3c3b0134adeef830742a2fc7647b4
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/compose-fixtures"
          mkdir -p "$fixture_dir"
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v5.1.3/docker-compose-linux-x86_64 \
            --output "$fixture_dir/docker-compose-v5.1.3"
          printf '%s  %s\n' "$COMPOSE_UGREEN_SHA256" \
            "$fixture_dir/docker-compose-v5.1.3" | sha256sum --check --status
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64 \
            --output "$fixture_dir/docker-compose-v2.24.6"
          printf '%s  %s\n' "$COMPOSE_LOWER_SHA256" \
            "$fixture_dir/docker-compose-v2.24.6" | sha256sum --check --status
          chmod 0755 "$fixture_dir/docker-compose-v5.1.3" \
            "$fixture_dir/docker-compose-v2.24.6"

      - name: Create isolated disposable Tailscale tailnet
        if: matrix.lane == 'native'
        timeout-minutes: 5
        shell: bash
        env:
          VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_ID: ${{ secrets.VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_ID }}
          VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_SECRET: ${{ secrets.VONK_ACCEPTANCE_TAILNET_FACTORY_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/tailscale-acceptance-tailnet create \
            --display-name "Vonk Forge CI $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" \
            --github-env "$GITHUB_ENV" \
            --state "$RUNNER_TEMP/vonk-acceptance-tailnet.json"

      - name: Run literal clean NAS and Tailscale configuration acceptance
        if: matrix.lane == 'native'
        timeout-minutes: 25
        shell: bash
        env:
          INSTALLER_PUBLIC_ORIGIN: ${{ vars.INSTALLER_PUBLIC_ORIGIN }}
          VONK_ACCEPTANCE_CHANNEL: ${{ needs.authority.outputs.channel }}
          VONK_ACCEPTANCE_COMPOSE_LOWER: ${{ runner.temp }}/compose-fixtures/docker-compose-v2.24.6
          VONK_ACCEPTANCE_COMPOSE_UGREEN: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_REFERENCE_COMPOSE: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_GENERATION: ${{ needs.candidate.outputs.generation }}
          VONK_ACCEPTANCE_GATE_NAMES: '["compose_compatibility_lower","compose_compatibility_ugreen","compose_default","compose_hermes","nas_site_secret_preservation","nas_workstation"]'
          VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY: ${{ secrets.VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY }}
          VONK_ACCEPTANCE_NAS_BIND_IP: 127.0.0.1
          VONK_ACCEPTANCE_NAS_IP: 127.0.0.1
          # A GitHub-hosted client and its containerized Service host share one
          # physical network endpoint, so that job cannot prove an external
          # tailnet path. Validate the complete Service advertisement/config
          # here; physical M2 and NAS acceptance owns external HTTPS.
          VONK_ACCEPTANCE_REQUIRE_TAILNET_CLIENT: "false"
          VONK_ACCEPTANCE_SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          # The namespace boundary is the disposable tailnet itself. Keep the
          # exact production Service identities so this is a parity test and
          # no `-acceptance` names can leak into an operator installation.
          VONK_ACCEPTANCE_TAILSCALE_CONTROL_SERVICE: svc:vonk-forge
          VONK_ACCEPTANCE_TAILSCALE_GATEWAY_HOSTNAME: ${{ matrix.gateway }}
          VONK_ACCEPTANCE_TAILSCALE_HERMES_API_SERVICE: svc:hermes-api
          VONK_ACCEPTANCE_TAILSCALE_HERMES_DASHBOARD_SERVICE: svc:hermes-dashboard
          VONK_ACCEPTANCE_TAILSCALE_MODE: full
          VONK_ACCEPTANCE_WORKSPACE: ${{ github.workspace }}
          VONK_ACCEPTANCE_VERSION: ${{ needs.authority.outputs.version }}
        run: |
          set -euo pipefail
          test "$INSTALLER_PUBLIC_ORIGIN" = https://install.vonkforge.ai
          export VONK_ACCEPTANCE_CANDIDATE_URL="$INSTALLER_PUBLIC_ORIGIN/artifacts/$VONK_ACCEPTANCE_CHANNEL/releases/$VONK_ACCEPTANCE_GENERATION/bootstraps/nas"
          uv run python tests/acceptance/test_fresh_nas_install.py

      - name: Delete isolated disposable Tailscale tailnet
        if: always() && matrix.lane == 'native'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tailscale-acceptance-tailnet delete \
            --state "$RUNNER_TEMP/vonk-acceptance-tailnet.json"

      - name: Start Docker 29.4.3 compatibility daemon
        if: matrix.lane == 'docker-29.4.3'
        shell: bash
        env:
          VONK_ACCEPTANCE_DIND_CONTAINER: vonk-acceptance-dind
        run: |
          set -euo pipefail
          # This daemon shares the host network namespace so its inner stack is
          # reachable on loopback. It owns a separate runner from the native
          # acceptance lane because dockerd rebuilds netfilter rules.
          docker rm --force "$VONK_ACCEPTANCE_DIND_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --privileged \
            --name "$VONK_ACCEPTANCE_DIND_CONTAINER" \
            --network host \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --env DOCKER_TLS_CERTDIR= \
            docker:29.4.3-dind@sha256:685b91dca8eab7de1dce1c303dbb7a763e4082d6a60db10968adf3295fbd2495 \
            dockerd --host=tcp://127.0.0.1:2375
          daemon_ready=false
          for _ in $(seq 1 60); do
            if server_version=$(DOCKER_HOST=tcp://127.0.0.1:2375 docker version --format '{{.Server.Version}}' 2>/dev/null); then
              test "$server_version" = 29.4.3
              daemon_ready=true
              break
            fi
            sleep 1
          done
          if [ "$daemon_ready" != true ]; then
            docker logs "$VONK_ACCEPTANCE_DIND_CONTAINER" >&2 || true
            exit 1
          fi

      - name: Run Docker 29.4.3 NAS compatibility acceptance
        if: matrix.lane == 'docker-29.4.3'
        shell: bash
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          INSTALLER_PUBLIC_ORIGIN: ${{ vars.INSTALLER_PUBLIC_ORIGIN }}
          VONK_ACCEPTANCE_CHANNEL: ${{ needs.authority.outputs.channel }}
          VONK_ACCEPTANCE_COMPOSE_LOWER: ${{ runner.temp }}/compose-fixtures/docker-compose-v2.24.6
          VONK_ACCEPTANCE_COMPOSE_UGREEN: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_REFERENCE_COMPOSE: ${{ runner.temp }}/compose-fixtures/docker-compose-v5.1.3
          VONK_ACCEPTANCE_GENERATION: ${{ needs.candidate.outputs.generation }}
          VONK_ACCEPTANCE_GATE_NAMES: '["compose_compatibility_lower","compose_compatibility_ugreen","compose_default","compose_hermes","nas_site_secret_preservation","nas_workstation"]'
          VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY: ${{ secrets.VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY }}
          VONK_ACCEPTANCE_NAS_BIND_IP: 127.0.0.1
          VONK_ACCEPTANCE_NAS_IP: 127.0.0.1
          VONK_ACCEPTANCE_SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          # The disabled lane still renders deterministic Service hostnames,
          # but it must never receive a real tailnet or client credentials.
          VONK_ACCEPTANCE_TAILNET_DNS_SUFFIX: acceptance.invalid
          VONK_ACCEPTANCE_TAILSCALE_CONTROL_SERVICE: svc:vonk-forge
          VONK_ACCEPTANCE_TAILSCALE_HERMES_API_SERVICE: svc:hermes-api
          VONK_ACCEPTANCE_TAILSCALE_HERMES_DASHBOARD_SERVICE: svc:hermes-dashboard
          VONK_ACCEPTANCE_TAILSCALE_MODE: disabled
          VONK_ACCEPTANCE_WORKSPACE: ${{ github.workspace }}
          VONK_ACCEPTANCE_VERSION: ${{ needs.authority.outputs.version }}
        run: |
          set -euo pipefail
          test "$INSTALLER_PUBLIC_ORIGIN" = https://install.vonkforge.ai
          export VONK_ACCEPTANCE_CANDIDATE_URL="$INSTALLER_PUBLIC_ORIGIN/artifacts/$VONK_ACCEPTANCE_CHANNEL/releases/$VONK_ACCEPTANCE_GENERATION/bootstraps/nas"
          uv run python tests/acceptance/test_fresh_nas_install.py

      - name: Write exact NAS lane evidence
        shell: bash
        env:
          VONK_ACCEPTANCE_CHANNEL: ${{ needs.authority.outputs.channel }}
          VONK_ACCEPTANCE_GENERATION: ${{ needs.candidate.outputs.generation }}
          VONK_ACCEPTANCE_GATE_NAMES: '["compose_compatibility_lower","compose_compatibility_ugreen","compose_default","compose_hermes","nas_site_secret_preservation","nas_workstation"]'
          VONK_ACCEPTANCE_LANE: ${{ matrix.lane }}
          VONK_ACCEPTANCE_SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          VONK_ACCEPTANCE_TAILSCALE_MODE: ${{ matrix.tailscale_mode }}
          VONK_ACCEPTANCE_VERSION: ${{ needs.authority.outputs.version }}
        run: |
          set -euo pipefail
          test "$VONK_ACCEPTANCE_LANE" = native || \
            test "$VONK_ACCEPTANCE_LANE" = docker-29.4.3
          mkdir -p "$RUNNER_TEMP/nas-acceptance"
          jq -S -c -n \
            --arg channel "$VONK_ACCEPTANCE_CHANNEL" \
            --argjson gates "$VONK_ACCEPTANCE_GATE_NAMES" \
            --arg generation "$VONK_ACCEPTANCE_GENERATION" \
            --arg lane "$VONK_ACCEPTANCE_LANE" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$VONK_ACCEPTANCE_SOURCE_SHA" \
            --arg tailscale_mode "$VONK_ACCEPTANCE_TAILSCALE_MODE" \
            --arg version "$VONK_ACCEPTANCE_VERSION" \
          '{channel:$channel,gates:$gates,generation:$generation,lane:$lane,run_id:$run_id,schema_version:2,source_sha:$source_sha,status:"passed",tailscale_mode:$tailscale_mode,version:$version}' \
            > "$RUNNER_TEMP/nas-acceptance/report-$VONK_ACCEPTANCE_LANE.json"

      - name: Remove Docker 29.4.3 compatibility daemon
        if: always() && matrix.lane == 'docker-29.4.3'
        shell: bash
        env:
          VONK_ACCEPTANCE_DIND_CONTAINER: vonk-acceptance-dind
        run: |
          docker rm --force "$VONK_ACCEPTANCE_DIND_CONTAINER" >/dev/null 2>&1 || true

      - name: Upload exact NAS lane evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-nas-lane-${{ needs.candidate.outputs.generation }}-${{ matrix.lane }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/nas-acceptance/report-${{ matrix.lane }}.json

  nas-acceptance:
    name: Bind complete NAS acceptance
    needs: [authority, candidate, nas-lane-acceptance]
    if: >-
      always() &&
      needs.authority.result == 'success' &&
      needs.candidate.result == 'success' &&
      needs['nas-lane-acceptance'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact NAS acceptance authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Download exact native NAS lane evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-nas-lane-${{ needs.candidate.outputs.generation }}-native
          path: ${{ runner.temp }}/nas-lanes/native

      - name: Download exact Docker NAS lane evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-nas-lane-${{ needs.candidate.outputs.generation }}-docker-29.4.3
          path: ${{ runner.temp }}/nas-lanes/docker-29.4.3

      - name: Bind both exact NAS lanes to one behavioral gate report
        shell: bash
        env:
          VONK_ACCEPTANCE_CHANNEL: ${{ needs.authority.outputs.channel }}
          VONK_ACCEPTANCE_GENERATION: ${{ needs.candidate.outputs.generation }}
          VONK_ACCEPTANCE_SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          VONK_ACCEPTANCE_VERSION: ${{ needs.authority.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nas-acceptance"
          scripts/install-release-publication combine-nas-evidence \
            --channel "$VONK_ACCEPTANCE_CHANNEL" \
            --version "$VONK_ACCEPTANCE_VERSION" \
            --source-sha "$VONK_ACCEPTANCE_SOURCE_SHA" \
            --generation "$VONK_ACCEPTANCE_GENERATION" \
            --run-id "$GITHUB_RUN_ID" \
            --lane-report "$RUNNER_TEMP/nas-lanes/native/report-native.json" \
            --lane-report "$RUNNER_TEMP/nas-lanes/docker-29.4.3/report-docker-29.4.3.json" \
            --output "$RUNNER_TEMP/nas-acceptance/report.json"

      - name: Upload NAS behavioral gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-nas-acceptance-${{ needs.candidate.outputs.generation }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/nas-acceptance/report.json

  spark-acceptance:
    name: Exercise clean Spark candidate (linux-arm64)
    # NAS acceptance exclusively owns the fixed Tailscale Services.
    # The Spark lane uses an explicit local Controller service set with no
    # gateway, OAuth, or tailnet inputs, so its full package, pairing,
    # CDI, job, and renewal lifecycles may run beside NAS and one another. The
    # final acceptance signer still requires complete NAS and Spark evidence.
    needs: [authority, candidate]
    if: >-
      needs.authority.result == 'success' &&
      needs.candidate.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: installer-canary-${{ needs.authority.outputs.channel }}
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate acceptance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Download exact Spark publication graph
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-candidate-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          path: ${{ runner.temp }}/spark-publication

      - name: Enable Docker CDI for synthetic Spark device discovery
        shell: bash
        run: |
          set -euo pipefail
          daemon_config=/etc/docker/daemon.json
          updated_config=$(mktemp)
          trap 'rm -f -- "$updated_config"' EXIT
          if sudo test -e "$daemon_config"; then
            sudo jq \
              'if (.features // {}) | type != "object" then error("invalid Docker features") else .features = ((.features // {}) + {"cdi": true}) end' \
              "$daemon_config" > "$updated_config"
          else
            jq -n '{"features":{"cdi":true}}' > "$updated_config"
          fi
          sudo dockerd --validate --config-file "$updated_config"
          sudo install -D -o root -g root -m 0644 \
            "$updated_config" "$daemon_config"
          sudo systemctl restart docker.service
          docker info --format '{{json .CDISpecDirs}}' | \
            jq -e 'index("/etc/cdi") != null and index("/var/run/cdi") != null' \
              >/dev/null

      - name: Run packaged Spark architecture acceptance
        shell: bash
        env:
          INSTALLER_PUBLIC_ORIGIN: ${{ vars.INSTALLER_PUBLIC_ORIGIN }}
          VONK_ACCEPTANCE_CHANNEL: ${{ needs.authority.outputs.channel }}
          VONK_ACCEPTANCE_GENERATION: ${{ needs.candidate.outputs.generation }}
          VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY: ${{ secrets.VONK_ACCEPTANCE_LITELLM_UPSTREAM_KEY }}
          VONK_ACCEPTANCE_PLATFORM: linux-arm64
          VONK_ACCEPTANCE_SPARK_CONTROLLER_BOUNDARY: loopback
          VONK_ACCEPTANCE_SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          VONK_ACCEPTANCE_VERSION: ${{ needs.authority.outputs.version }}
          VONK_ACCEPTANCE_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$INSTALLER_PUBLIC_ORIGIN" = https://install.vonkforge.ai
          test "$VONK_ACCEPTANCE_PLATFORM" = linux-arm64
          mkdir -p "$RUNNER_TEMP/spark-acceptance"
          uv run python tests/acceptance/test_spark_lifecycle.py run \
            --candidate-release "$RUNNER_TEMP/spark-publication/installer-publication/objects/artifacts/$VONK_ACCEPTANCE_CHANNEL/releases/$VONK_ACCEPTANCE_GENERATION/release.json" \
            --baseline-release "$RUNNER_TEMP/spark-publication/installer-publication/objects/artifacts/$VONK_ACCEPTANCE_CHANNEL/releases/$VONK_ACCEPTANCE_GENERATION/acceptance-baseline/release.json" \
            --object-root "$RUNNER_TEMP/spark-publication/installer-publication/objects" \
            --channel "$VONK_ACCEPTANCE_CHANNEL" \
            --version "$VONK_ACCEPTANCE_VERSION" \
            --source-sha "$VONK_ACCEPTANCE_SOURCE_SHA" \
            --generation "$VONK_ACCEPTANCE_GENERATION" \
            --run-id "$GITHUB_RUN_ID" \
            --platform "$VONK_ACCEPTANCE_PLATFORM" \
            --output "$RUNNER_TEMP/spark-acceptance/report-$VONK_ACCEPTANCE_PLATFORM.json"

      - name: Upload Spark behavioral gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-spark-acceptance-${{ needs.candidate.outputs.generation }}-linux-arm64
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/spark-acceptance/report-linux-arm64.json

  acceptance:
    name: Sign complete candidate acceptance
    needs: [authority, candidate, nas-acceptance, spark-acceptance]
    if: >-
      always() &&
      needs.authority.result == 'success' &&
      needs.candidate.result == 'success' &&
      needs['nas-acceptance'].result == 'success' &&
      needs['spark-acceptance'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: installer-acceptance-${{ needs.authority.outputs.channel }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact acceptance authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Download exact candidate publication graph
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-candidate-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          path: ${{ runner.temp }}/candidate-publication

      - name: Download exact behavioral gate reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*-acceptance-${{ needs.candidate.outputs.generation }}*
          path: ${{ runner.temp }}/gate-reports
          merge-multiple: true

      - name: Bind and sign complete acceptance
        shell: bash
        env:
          CHANNEL: ${{ needs.authority.outputs.channel }}
          GENERATION: ${{ needs.candidate.outputs.generation }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          VERSION: ${{ needs.authority.outputs.version }}
          VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT: ${{ vars.VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT }}
          VONK_INSTALLER_ACCEPTANCE_PRIVATE_KEY: ${{ secrets.VONK_INSTALLER_ACCEPTANCE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/acceptance"
          signing_key=$RUNNER_TEMP/installer-acceptance-private.pem
          public_key=$RUNNER_TEMP/acceptance/installer-acceptance-public.pem
          public_der=$RUNNER_TEMP/installer-acceptance-public.der
          trap 'rm -f "$signing_key" "$public_der"' EXIT
          install -m 0600 /dev/null "$signing_key"
          printf '%s' "$VONK_INSTALLER_ACCEPTANCE_PRIVATE_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$public_key"
          openssl pkey -in "$signing_key" -pubout -outform DER -out "$public_der"
          test "$(sha256sum "$public_der" | cut -d' ' -f1)" = \
            "$VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT"
          openssl pkey -pubin -in "$public_key" -text -noout \
            | grep -Eq '^Public-Key: \((3072|4096) bit\)$'
          mapfile -t reports < <(find "$RUNNER_TEMP/gate-reports" -type f -name '*.json' | sort)
          # Spark agents are ARM64-only. Acceptance therefore binds one
          # aggregate NAS report and one linux-arm64 Spark report.
          test "${#reports[@]}" = 2
          command=(
            scripts/install-release-publication accept
            --channel "$CHANNEL"
            --version "$VERSION"
            --source-sha "$SOURCE_SHA"
            --generation "$GENERATION"
            --candidate-release "$RUNNER_TEMP/candidate-publication/installer-publication/objects/artifacts/$CHANNEL/releases/$GENERATION/release.json"
            --baseline-release "$RUNNER_TEMP/candidate-publication/installer-publication/objects/artifacts/$CHANNEL/releases/$GENERATION/acceptance-baseline/release.json"
            --object-root "$RUNNER_TEMP/candidate-publication/installer-publication/objects"
            --run-id "$GITHUB_RUN_ID"
            --signing-key "$signing_key"
            --signing-public-key "$public_key"
            --output "$RUNNER_TEMP/acceptance/receipt.json"
            --signature-output "$RUNNER_TEMP/acceptance/receipt.sig"
          )
          for report in "${reports[@]}"; do
            command+=(--gate-report "$report")
          done
          "${command[@]}"

      - name: Upload signed acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-acceptance-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/acceptance

  promote:
    name: Promote accepted ${{ needs.authority.outputs.channel }} installer generation
    needs: [authority, candidate, acceptance]
    if: >-
      needs.authority.result == 'success' &&
      needs.candidate.result == 'success' &&
      needs.acceptance.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: installer-promotion-${{ needs.authority.outputs.channel }}
    concurrency:
      group: vonk-forge-installer-r2-${{ needs.authority.outputs.channel }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact promotion tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Download immutable candidate publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-candidate-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          path: ${{ runner.temp }}/installer-publication

      - name: Download signed acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-acceptance-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          path: ${{ runner.temp }}/acceptance

      - name: Install R2 publication client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rclone

      - name: Revalidate source authority before promotion
        shell: bash
        env:
          AUTHORITY_REF: ${{ needs.authority.outputs.authority_ref }}
          CHANNEL: ${{ needs.authority.outputs.channel }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          TAG_OID: ${{ needs.authority.outputs.tag_oid }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          case "$CHANNEL" in
            dev)
              test "$AUTHORITY_REF" = refs/heads/main
              test "$SOURCE_SHA" = \
                "$(git rev-parse --verify refs/remotes/origin/main^{commit})"
              ;;
            stable)
              git fetch --force --tags origin
              tag=${AUTHORITY_REF#refs/tags/}
              scripts/verify-release-tag-authority \
                "$tag" "$TAG_OID" "$SOURCE_SHA"
              ;;
            *) exit 64 ;;
          esac

      - name: Publish acceptance evidence and advance pointer last
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
          VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT: ${{ vars.VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          scripts/install-release-publication promote \
            --bundle "$RUNNER_TEMP/installer-publication/installer-publication" \
            --accepted-evidence "$RUNNER_TEMP/acceptance/receipt.json" \
            --accepted-evidence-signature "$RUNNER_TEMP/acceptance/receipt.sig" \
            --acceptance-public-key "$RUNNER_TEMP/acceptance/installer-acceptance-public.pem" \
            --acceptance-public-key-sha256 "$VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT" \
            --rclone-remote "r2:$R2_INSTALLER_PUBLIC_BUCKET" \
            | tee "$RUNNER_TEMP/promotion-receipt.jsonl"
          test "$(tail -n 1 "$RUNNER_TEMP/promotion-receipt.jsonl" | jq -r .phase)" = pointer

      - name: Upload promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-promotion-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-publication/installer-publication/publication-plan.json
            ${{ runner.temp }}/promotion-receipt.jsonl

  refresh:
    name: Refresh signed ${{ matrix.channel }} installer manifest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: dev
          - channel: stable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: installer-promotion-${{ matrix.channel }}
    concurrency:
      group: vonk-forge-installer-r2-${{ matrix.channel }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out current publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install R2 publication client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rclone

      - name: Detect published channel
        id: availability
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          pointer=$(rclone lsf \
            --files-only \
            --include current.manifest \
            --max-depth 1 \
            "r2:$R2_INSTALLER_PUBLIC_BUCKET/artifacts/$CHANNEL")
          case "$pointer" in
            current.manifest)
              printf 'published=true\n' >> "$GITHUB_OUTPUT"
              ;;
            '')
              if [ "$CHANNEL" != stable ]; then
                echo "published $CHANNEL channel manifest is missing" >&2
                exit 1
              fi
              remote_tags=$(git ls-remote --tags origin)
              if printf '%s\n' "$remote_tags" \
                | grep -E '^.+[[:space:]]+refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
              then
                echo "stable channel manifest is missing despite a stable release tag" >&2
                exit 1
              fi
              printf 'published=false\n' >> "$GITHUB_OUTPUT"
              echo "::notice::Stable installer channel is not published yet; skipping refresh"
              ;;
            *)
              echo "channel pointer listing is inconsistent" >&2
              exit 1
              ;;
          esac

      - name: Verify immutable generation and refresh signed pointer
        if: steps.availability.outputs.published == 'true'
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
          VONK_INSTALLER_RELEASE_KEY_FINGERPRINT: ${{ vars.VONK_INSTALLER_RELEASE_KEY_FINGERPRINT }}
          VONK_INSTALLER_RELEASE_PRIVATE_KEY: ${{ secrets.VONK_INSTALLER_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$VONK_INSTALLER_RELEASE_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          signing_key=$RUNNER_TEMP/installer-release-private.pem
          public_key=$RUNNER_TEMP/installer-release-public.pem
          public_der=$RUNNER_TEMP/installer-release-public.der
          trap 'rm -f "$signing_key" "$public_key" "$public_der"' EXIT
          install -m 0600 /dev/null "$signing_key"
          printf '%s' "$VONK_INSTALLER_RELEASE_PRIVATE_KEY" > "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$public_key"
          openssl pkey -in "$signing_key" -pubout -outform DER -out "$public_der"
          test "$(sha256sum "$public_der" | cut -d' ' -f1)" = \
            "$VONK_INSTALLER_RELEASE_KEY_FINGERPRINT"
          openssl pkey -pubin -in "$public_key" -text -noout \
            | grep -Eq '^Public-Key: \((3072|4096) bit\)$'
          scripts/install-release-publication refresh \
            --channel "$CHANNEL" \
            --expires-at "$(($(date +%s) + 604800))" \
            --signing-key "$signing_key" \
            --signing-public-key "$public_key" \
            --rclone-remote "r2:$R2_INSTALLER_PUBLIC_BUCKET"
