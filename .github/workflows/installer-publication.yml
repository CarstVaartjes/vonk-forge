name: Release

# One release run per push: main publishes the dev channel, a signed v* tag
# publishes the stable channel. The run tests the source (CI), builds only the
# development producers whose inputs changed since an ancestor release run
# produced them, and publishes one installer generation once everything it
# needs has succeeded.
#
# The file keeps its historical path so github.run_number keeps counting from
# the retired installer publication runs. Development agent packages are
# versioned X.Y.Z~dev.<run_number>+g<sha> with this workflow's run_number, and
# that number must stay above every version already published to apt dev.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Re-runs the release for the current main tip, for example when GitHub
  # recorded a merge without emitting its push event.
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    name: Select release producers
    # Only a push of a release tag publishes stable; any other ref is ignored.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.select.outputs.channel }}
      agent: ${{ steps.select.outputs.agent }}
      images: ${{ steps.select.outputs.images }}
      setups: ${{ steps.select.outputs.setups }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reuse unchanged development producers from ancestor releases
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main) channel=dev ;;
            refs/tags/v*) channel=stable ;;
            *) exit 64 ;;
          esac
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          # A stable release builds its own evidence from the tag in CI.
          if [[ "$channel" != dev ]]; then exit 0; fi
          # Each output is empty when the producer must run in this release,
          # or the run ID, run number and source of reusable evidence.
          for producer in agent images setups; do
            if evidence=$(scripts/resolve-publication-producer "$producer" "$GITHUB_SHA"); then
              echo "$producer reuses release run evidence: $evidence"
            else
              status=$?
              [[ "$status" == 2 ]] || exit "$status"
              evidence=
              echo "$producer runs in this release"
            fi
            printf '%s=%s\n' "$producer" "$evidence" >> "$GITHUB_OUTPUT"
          done

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    # The union of every job-level grant in ci.yml. Each called job keeps its
    # own narrower block; the rest inherit ci.yml's contents: read.
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      security-events: write
    # A newer main push supersedes this run's tests; tags never cancel.
    concurrency:
      group: vonk-forge-release-ci-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

  agent:
    name: Agent package
    needs: [changes]
    if: >-
      needs.changes.outputs.channel == 'dev' &&
      needs.changes.outputs.agent == ''
    uses: ./.github/workflows/agent-release.yml
    secrets: inherit
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    concurrency:
      group: vonk-forge-release-agent-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

  apt:
    name: Publish accepted ARM64 Spark agent package to apt dev
    needs: [agent]
    if: needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: apt-development
    concurrency:
      group: vonk-forge-agent-apt-dev
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out exact accepted apt publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish exact accepted ARM64 development package
        uses: ./.github/actions/agent-apt-publish
        with:
          channel: dev
          version: ${{ needs.agent.outputs.version }}
          arm64_package: ${{ needs.agent.outputs.arm64_package }}
          artifact_name: ${{ needs.agent.outputs.artifact_name }}
          environment: apt-development
          source_sha: ${{ github.sha }}
          tag_name: ''
          tag_oid: ''
          apt_gpg_passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}
          apt_repository_gpg_fingerprint: ${{ vars.APT_REPOSITORY_GPG_FINGERPRINT }}
          apt_repository_gpg_private_key: ${{ secrets.APT_REPOSITORY_GPG_PRIVATE_KEY }}
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_apt_public_bucket: ${{ vars.R2_APT_PUBLIC_BUCKET }}
          r2_apt_state_bucket: ${{ vars.R2_APT_STATE_BUCKET }}

  images:
    name: Development images
    needs: [changes]
    if: >-
      needs.changes.outputs.channel == 'dev' &&
      needs.changes.outputs.images == ''
    uses: ./.github/workflows/dev-images.yml
    secrets: inherit
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    concurrency:
      group: vonk-forge-release-images-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

  setups:
    name: Installer setup programs
    needs: [changes]
    if: >-
      needs.changes.outputs.channel == 'stable' ||
      (needs.changes.outputs.channel == 'dev' &&
       needs.changes.outputs.setups == '')
    uses: ./.github/workflows/installer-setups.yml
    permissions:
      contents: read
    concurrency:
      group: vonk-forge-release-setups-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

  producers:
    name: Record accepted development producers
    # Later releases reuse what this run produced (scripts/resolve-publication-
    # producer). An agent counts only once apt dev also published it, so a
    # failed apt publication is healed by the next release building again.
    needs: [changes, agent, apt, images, setups]
    if: ${{ !cancelled() && needs.changes.outputs.channel == 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Name the recorded source
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-producer-source"
      - name: Record the accepted agent package
        if: needs.agent.result == 'success' && needs.apt.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-producer-agent
          retention-days: 90
          # A re-run attempt records the same producer again.
          overwrite: true
          if-no-files-found: error
          path: ${{ runner.temp }}/release-producer-source
      - name: Record the accepted development images
        if: needs.images.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-producer-images
          retention-days: 90
          overwrite: true
          if-no-files-found: error
          path: ${{ runner.temp }}/release-producer-source
      - name: Record the accepted installer setup programs
        if: needs.setups.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-producer-setups
          retention-days: 90
          overwrite: true
          if-no-files-found: error
          path: ${{ runner.temp }}/release-producer-source

  authority:
    name: Accept one complete source generation
    # needs: makes every producer settle first; a failed or superseded
    # (cancelled) producer or CI run publishes nothing.
    needs: [changes, ci, agent, apt, images, setups, producers]
    if: >-
      ${{ !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.channel != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.accept.outputs.channel }}
      version: ${{ steps.accept.outputs.version }}
      source_sha: ${{ steps.accept.outputs.source_sha }}
      authority_ref: ${{ steps.accept.outputs.authority_ref }}
      tag_oid: ${{ steps.accept.outputs.tag_oid }}
      package_run_id: ${{ steps.accept.outputs.package_run_id }}
      package_artifact: ${{ steps.accept.outputs.package_artifact }}
      arm64_package: ${{ steps.accept.outputs.arm64_package }}
      baseline_version: ${{ steps.accept.outputs.baseline_version }}
      baseline_artifact: ${{ steps.accept.outputs.baseline_artifact }}
      arm64_baseline_package: ${{ steps.accept.outputs.arm64_baseline_package }}
      compose_run_id: ${{ steps.accept.outputs.compose_run_id }}
      compose_artifact: ${{ steps.accept.outputs.compose_artifact }}
      compose_source_sha: ${{ steps.accept.outputs.compose_source_sha }}
      setup_run_id: ${{ steps.accept.outputs.setup_run_id }}
      setup_source_sha: ${{ steps.accept.outputs.setup_source_sha }}
    steps:
      - name: Check out the exact accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind accepted release evidence to source authority
        id: accept
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.changes.outputs.channel }}
          AGENT_EVIDENCE: ${{ needs.changes.outputs.agent }}
          IMAGES_EVIDENCE: ${{ needs.changes.outputs.images }}
          SETUPS_EVIDENCE: ${{ needs.changes.outputs.setups }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$GITHUB_SHA
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin
          # A producer that ran in this release left its evidence here; a
          # reused producer names the ancestor release run that holds it.
          evidence() {
            if [[ -n "$1" ]]; then
              printf '%s\n' "$1"
            else
              printf '%s\t%s\t%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$SOURCE_SHA"
            fi
          }

          case "$CHANNEL" in
            dev)
              test "$GITHUB_REF" = refs/heads/main
              git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
              authority_ref=refs/heads/main
              tag_oid=
              IFS=$'\t' read -r package_run_id package_run_number package_source_sha \
                < <(evidence "$AGENT_EVIDENCE")
              metadata=$(
                scripts/agent-package-metadata \
                  development branch main "$package_source_sha" "$package_run_number"
              )
              IFS=$'\t' read -r compose_run_id _ compose_source_sha \
                < <(evidence "$IMAGES_EVIDENCE")
              compose_artifact="vonk-forge-dev-compose-$compose_source_sha"
              IFS=$'\t' read -r setup_run_id _ setup_source_sha \
                < <(evidence "$SETUPS_EVIDENCE")
              ;;
            stable)
              release_tag=$GITHUB_REF_NAME
              [[ "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              authority_ref="refs/tags/$release_tag"
              test "$(git cat-file -t "$authority_ref")" = tag
              tag_oid=$(git rev-parse --verify "$authority_ref")
              scripts/verify-release-tag-authority \
                "$release_tag" "$tag_oid" "$SOURCE_SHA"
              metadata=$(
                scripts/agent-package-metadata \
                  production tag "$release_tag" "$SOURCE_SHA" 0
              )
              # CI built the tagged agent package and production Compose, and
              # this release built the setup programs, all in this run.
              package_run_id=$GITHUB_RUN_ID
              compose_run_id=$GITHUB_RUN_ID
              compose_source_sha=$SOURCE_SHA
              compose_artifact="platform-build-${release_tag#v}"
              setup_run_id=$GITHUB_RUN_ID
              setup_source_sha=$SOURCE_SHA
              ;;
            *)
              exit 64
              ;;
          esac

          version=$(sed -n 's/^version=//p' <<< "$metadata")
          package_artifact=$(sed -n 's/^artifact_name=//p' <<< "$metadata")
          arm64_package=$(sed -n 's/^arm64_package=//p' <<< "$metadata")
          baseline_version=$(sed -n 's/^baseline_version=//p' <<< "$metadata")
          baseline_artifact=$(sed -n 's/^baseline_artifact_name=//p' <<< "$metadata")
          arm64_baseline_package=$(sed -n 's/^arm64_baseline_package=//p' <<< "$metadata")
          test -n "$version" && test -n "$package_artifact"
          for run_id in "$package_run_id" "$compose_run_id" "$setup_run_id"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "$compose_source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$setup_source_sha" =~ ^[0-9a-f]{40}$ ]]

          # needs: settled every producer; still verify the exact evidence.
          artifacts() {
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?per_page=100" \
              --jq '.artifacts[]' | jq -s .
          }
          require() {
            test "$(jq --arg name "$2" '[.[] | select(.name == $name and (.expired | not))] | length' <<< "$1")" = 1
          }
          listing=$(artifacts "$package_run_id")
          require "$listing" "$package_artifact"
          require "$listing" "$baseline_artifact"
          listing=$(artifacts "$compose_run_id")
          require "$listing" "$compose_artifact"
          listing=$(artifacts "$setup_run_id")
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            require "$listing" "installer-setup-$setup_source_sha-$platform"
          done

          printf '%s\n' \
            "channel=$CHANNEL" \
            "version=$version" \
            "source_sha=$SOURCE_SHA" \
            "authority_ref=$authority_ref" \
            "tag_oid=$tag_oid" \
            "package_run_id=$package_run_id" \
            "package_artifact=$package_artifact" \
            "arm64_package=$arm64_package" \
            "baseline_version=$baseline_version" \
            "baseline_artifact=$baseline_artifact" \
            "arm64_baseline_package=$arm64_baseline_package" \
            "compose_run_id=$compose_run_id" \
            "compose_artifact=$compose_artifact" \
            "compose_source_sha=$compose_source_sha" \
            "setup_run_id=$setup_run_id" \
            "setup_source_sha=$setup_source_sha" \
            >> "$GITHUB_OUTPUT"

  candidate:
    name: Immutable installer candidate
    needs: [authority]
    if: ${{ !cancelled() && needs.authority.result == 'success' }}
    uses: ./.github/workflows/installer-candidate.yml
    permissions:
      actions: write
      contents: read
    secrets: inherit
    with:
      channel: ${{ needs.authority.outputs.channel }}
      source_sha: ${{ needs.authority.outputs.source_sha }}
      version: ${{ needs.authority.outputs.version }}
      authority_ref: ${{ needs.authority.outputs.authority_ref }}
      tag_oid: ${{ needs.authority.outputs.tag_oid }}
      setup_source_sha: ${{ needs.authority.outputs.setup_source_sha }}
      setup_run_id: ${{ needs.authority.outputs.setup_run_id }}
      package_artifact: ${{ needs.authority.outputs.package_artifact }}
      package_run_id: ${{ needs.authority.outputs.package_run_id }}
      baseline_artifact: ${{ needs.authority.outputs.baseline_artifact }}
      compose_artifact: ${{ needs.authority.outputs.compose_artifact }}
      compose_run_id: ${{ needs.authority.outputs.compose_run_id }}
      compose_source_sha: ${{ needs.authority.outputs.compose_source_sha }}
      arm64_package: ${{ needs.authority.outputs.arm64_package }}
      arm64_baseline_package: ${{ needs.authority.outputs.arm64_baseline_package }}

  release-acceptance:
    name: Release acceptance
    needs: [authority, candidate]
    if: ${{ !cancelled() && needs.authority.result == 'success' && needs.candidate.result == 'success' }}
    uses: ./.github/workflows/release-acceptance-core.yml
    permissions:
      actions: write
      contents: read
      packages: read
    secrets: inherit
    with:
      channel: ${{ needs.authority.outputs.channel }}
      source_sha: ${{ needs.authority.outputs.source_sha }}
      version: ${{ needs.authority.outputs.version }}
      generation: ${{ needs.candidate.outputs.generation }}

  promote:
    name: Promote accepted ${{ needs.authority.outputs.channel }} installer generation
    needs: [authority, candidate, release-acceptance]
    if: >-
      !cancelled() && needs.authority.result == 'success' &&
      needs.candidate.result == 'success' &&
      needs['release-acceptance'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: installer-promotion-${{ needs.authority.outputs.channel }}
    concurrency:
      group: vonk-forge-installer-r2-${{ needs.authority.outputs.channel }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out exact promotion tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authority.outputs.source_sha }}

      - name: Download immutable candidate publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-candidate-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          path: ${{ runner.temp }}/installer-publication

      - name: Download signed acceptance receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-acceptance-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          path: ${{ runner.temp }}/acceptance

      - name: Install publication clients
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-apt-install rclone skopeo

      - name: Log in to GHCR for accepted channel promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote accepted images and advance installer pointer last
        shell: bash
        env:
          CHANNEL: ${{ needs.authority.outputs.channel }}
          AUTHORITY_REF: ${{ needs.authority.outputs.authority_ref }}
          SOURCE_SHA: ${{ needs.authority.outputs.source_sha }}
          TAG_OID: ${{ needs.authority.outputs.tag_oid }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_INSTALLER_PUBLIC_BUCKET: ${{ vars.R2_INSTALLER_PUBLIC_BUCKET }}
          VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT: ${{ vars.VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$R2_INSTALLER_PUBLIC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          scripts/promote-accepted-channel run \
            "$RUNNER_TEMP/installer-publication/installer-publication" \
            "$RUNNER_TEMP/acceptance" \
            "$VONK_INSTALLER_ACCEPTANCE_KEY_FINGERPRINT" \
            "r2:$R2_INSTALLER_PUBLIC_BUCKET" \
            "$CHANNEL" "$AUTHORITY_REF" "$SOURCE_SHA" "$TAG_OID" \
            | tee "$RUNNER_TEMP/promotion-receipt.jsonl"

      - name: Upload promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-promotion-${{ needs.authority.outputs.channel }}-${{ needs.candidate.outputs.generation }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/installer-publication/installer-publication/publication-plan.json
            ${{ runner.temp }}/promotion-receipt.jsonl
