name: Coverage

# On demand only: it is never part of a pull request, a batch or a release.
# Run it before a deletion or refactor wave. It runs the suites the way ci.yml
# does (scripts/test, the same shards) under coverage and publishes one list:
# the code that no test executes, as deletion candidates. It keeps and compares
# no percentage, and nothing here gates anything.
on:
  workflow_dispatch:

concurrency:
  group: coverage
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  UV_HTTP_TIMEOUT: "60"
  UV_HTTP_RETRIES: "5"
  # The one owner of the tools' versions.
  COVERAGE_VERSION: "7.17.4"
  CARGO_LLVM_COV_VERSION: "0.9.2"

jobs:
  python:
    name: Python ${{ matrix.suite }} (${{ matrix.shard }}-of-${{ matrix.total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VONK_RECIPE_LIBRARY_ROOT: ${{ github.workspace }}/.recipe-library
      VONK_SYNTHETIC_CANARY_INDEX: tests/fixtures/canonical-synthetic-canary/index.json
      COVERAGE_RCFILE: ${{ github.workspace }}/.github/coveragerc
      COVERAGE_PROCESS_START: ${{ github.workspace }}/.github/coveragerc
      COVERAGE_FILE: ${{ github.workspace }}/coverage-data/coverage
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: control, shard: 1, total: 6}
          - {suite: control, shard: 2, total: 6}
          - {suite: control, shard: 3, total: 6}
          - {suite: control, shard: 4, total: 6}
          - {suite: control, shard: 5, total: 6}
          - {suite: control, shard: 6, total: 6}
          - {suite: repository, shard: 1, total: 2}
          - {suite: repository, shard: 2, total: 2}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the locked Python environment
        uses: ./.github/actions/python-env
      - name: Provide the built canonical recipe library
        uses: ./.github/actions/recipe-library
        with:
          build: "true"
      - name: Provide the suites' host tools
        uses: ./.github/actions/apt-install
        with:
          packages: skopeo zsh
      - name: Authenticate CI image mirror reads
        # The mirror is an optional fast path; pulls fall back to upstream.
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the pinned test images once
        run: scripts/pull-test-images postgres python
      - name: Measure every Python process the suite starts
        shell: bash
        run: |
          set -euo pipefail
          python=$(uv run --project control --frozen python -c 'import sys; print(sys.executable)')
          uv pip install --python "$python" "coverage==$COVERAGE_VERSION"
          # xdist workers and test subprocesses start coverage through this hook.
          purelib=$("$python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          printf 'import coverage; coverage.process_startup()\n' > "$purelib/vonk_coverage.pth"
          mkdir -p coverage-data
      - name: Run the suite shard (a failing test does not stop the report)
        continue-on-error: true
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ matrix.total }}
          VONK_CI_PREREQUISITES: needs_skopeo
        run: scripts/test "$SUITE" --shard "$SHARD/$SHARD_TOTAL" -- -n 4
      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.suite }}-${{ matrix.shard }}
          path: coverage-data
          retention-days: 7
          if-no-files-found: error

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the protocol environment for Cargo builds
        uses: ./.github/actions/protocol-env
      - name: Install pinned Rust toolchain and coverage tool
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          scripts/retry-dependency-fetch rustup toolchain install 1.98.1 --component rustfmt,llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Fetch locked crates
        run: scripts/retry-dependency-fetch cargo fetch --locked
      - name: Run the Rust tests under coverage
        # The same command as ci.yml's Rust shard, measured.
        continue-on-error: true
        run: cargo llvm-cov --workspace --locked --json --output-path rust-coverage.json
      - name: Upload the Rust coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: rust-coverage.json
          retention-days: 7
          if-no-files-found: ignore

  unexecuted:
    name: Code no test executes
    needs: [python, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COVERAGE_RCFILE: ${{ github.workspace }}/.github/coveragerc
      COVERAGE_FILE: ${{ github.workspace }}/coverage-data/coverage
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-input
      - name: List the code no test executes
        shell: bash
        run: |
          set -euo pipefail
          mkdir coverage-data report
          find coverage-input -path '*/coverage.*' -type f -exec mv -t coverage-data {} +
          pipx run --spec "coverage==$COVERAGE_VERSION" coverage combine --quiet coverage-data
          pipx run --spec "coverage==$COVERAGE_VERSION" coverage json -o report/python-coverage.json
          # Absolute paths keep the three source roots apart; report repository paths.
          sed -i "s|$GITHUB_WORKSPACE/||g" report/python-coverage.json
          pipx run --spec "coverage==$COVERAGE_VERSION" coverage html -d report/html
          args=(--python report/python-coverage.json)
          if [[ -f coverage-input/coverage-rust/rust-coverage.json ]]; then
            args+=(--rust coverage-input/coverage-rust/rust-coverage.json)
          fi
          scripts/coverage-unexecuted "${args[@]}" | tee report/unexecuted.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-no-test-executes
          path: report
          retention-days: 7
