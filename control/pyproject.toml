[project]
name = "vonk-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "cryptography==46.0.7",
  "vonk-agent-protocol==2.1.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "psycopg[binary]==3.2.9",
  "PyJWT==2.13.0",
  "PyYAML==6.0.3",
  "sqlalchemy==2.0.42",
  "vonk-cluster-profiles==0.1.0",
  "tomli-w==1.2.0",
  "uvicorn==0.35.0",
]

[project.scripts]
vonk-control-offline = "vonk_control.offline:main"

[tool.uv.sources]
vonk-agent-protocol = { path = "../inventory/wheels/vonk_agent_protocol-2.1.0-py3-none-any.whl" }
vonk-cluster-profiles = { path = ".." }

[dependency-groups]
dev = ["openapi-python-client==0.26.2", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_control"]
artifacts = ["src/vonk_control/resources/**", "src/vonk_control/web/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
