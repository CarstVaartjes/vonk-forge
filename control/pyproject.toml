[project]
name = "vonk-control"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "cryptography==46.0.7",
  "vonk-agent-protocol==2.2.0",
  "vonk-forge-public-contracts",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "psycopg[binary]==3.2.9",
  "PyJWT==2.13.0",
  "PyYAML==6.0.3",
  "sqlalchemy==2.0.42",
  "vonk-cluster-profiles==0.1.1",
  "tomli-w==1.2.0",
  "uvicorn==0.35.0",
]

[tool.uv.sources]
vonk-agent-protocol = { path = "../agent_protocol" }
vonk-cluster-profiles = { path = ".." }
# Built from the frozen unpublished candidate recorded in packaging/public-contracts.lock;
# the approved source ref remains recorded there until the v1.0.2 release is available.
vonk-forge-public-contracts = { path = "../inventory/wheels/vonk_forge_public_contracts-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = ["openapi-python-client==0.26.2", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_control"]
artifacts = ["src/vonk_control/resources/**", "src/vonk_control/web/**"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "vonk_control/alembic.ini"
"migrations" = "vonk_control/migrations"
"../schemas/global/catalog-entity-v1.schema.json" = "vonk_control/schemas/catalog-entity-v1.schema.json"
"../schemas/global/harness-evidence-v1.schema.json" = "vonk_control/schemas/harness-evidence-v1.schema.json"
"../schemas/global/recipe-v1.schema.json" = "vonk_control/schemas/recipe-v1.schema.json"
"../schemas/global/test-report-v1.schema.json" = "vonk_control/schemas/test-report-v1.schema.json"
"../config/execution-harnesses" = "vonk_control/execution-harnesses"

[tool.pytest.ini_options]
pythonpath = ["src"]
