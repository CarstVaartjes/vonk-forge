[project]
name = "vonk-control"
version = "0.1.1"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "cryptography==46.0.7",
  "vonk-agent-protocol==3.0.0",
  "vonk-forge-public-contracts",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "psycopg[binary]==3.3.5",
  "PyJWT==2.13.0",
  "PyYAML==6.0.3",
  "sqlalchemy==2.0.42",
  "vonk-cluster-profiles==0.1.1",
  "tomli-w==1.2.0",
  "uvicorn==0.35.0",
]

[tool.uv.sources]
vonk-agent-protocol = { path = "../inventory/wheels/vonk_agent_protocol-3.0.0-py3-none-any.whl" }
# Editable, so the repository and Compose suites that run in this environment
# exercise the working tree rather than a snapshot built at sync time.
vonk-cluster-profiles = { path = "..", editable = true }
# Resolve the public contract from the recipe repository's moving main branch.
# control/packaging/public-contracts.lock records the exact commit consumed by
# each lock/build update; the image build uses that same commit explicitly.
vonk-forge-public-contracts = { git = "https://github.com/CarstVaartjes/vonk-forge-recipes.git", branch = "main", subdirectory = "contracts" }

# The one locked tool environment for every suite, lint and type check, local
# and CI alike (docs/testing-and-ci.md). Nothing is added with `uv run --with`
# or `uvx`. Ruff lives in the root project's dev group: openapi-python-client
# pins an older ruff for formatting generated code.
[dependency-groups]
dev = [
    "hatchling==1.31.0",
    "openapi-python-client==0.26.2",
    # The nodejs extra ships Node as a wheel, so pyright never downloads it.
    "pyright[nodejs]==1.1.408",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_control"]
artifacts = ["src/vonk_control/resources/**", "src/vonk_control/web/**"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "vonk_control/alembic.ini"
"migrations" = "vonk_control/migrations"

[tool.pytest.ini_options]
pythonpath = ["src"]
# Hang guard only. The per-test time budget (10 s, or @pytest.mark.slow up to
# 60 s) lives in tools/pytest_budget.py and is checked after each test.
timeout = 120
# Markers: tools/pytest_prereqs.py (prerequisites) and tools/pytest_budget.py (slow).
filterwarnings = [
    # FastAPI 0.116 on Python 3.14; emitted once per route per app build.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
