recipe_version: 1
model: deepseek-ai/DeepSeek-V3
model_revision: abcdef0123456789abcdef0123456789abcdef01
runtime: sglang
container: ghcr.io/example/sglang@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
min_nodes: 2
max_nodes: 2
metadata:
  title: DeepSeek V3
  description: Two-node SGLang example.
  tags: [deepseek, text]
defaults:
  tensor_parallel_size: 2
env:
  NCCL_DEBUG: WARN
command: python -m sglang.launch_server --model-path {model} --tp {tensor_parallel_size} --port 8000
mods:
  - flashinfer
tuning:
  cuda_graph: true
benchmark:
  tokens_per_second: 42
future_field:
  enabled: true
