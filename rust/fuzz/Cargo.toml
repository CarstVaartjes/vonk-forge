# cargo-fuzz targets for the hand-written parsers an untrusted peer can reach.
# Outside the workspace on purpose: batch builds never compile it, and it needs
# the nightly toolchain pinned in .github/workflows/fuzz.yml. See
# docs/testing-and-ci.md ("Fuzzing").
[package]
name = "vonk-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = { version = "1.0.142", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
tempfile = "3.20.0"
uuid = "1.17.0"
vonk-agent = { path = "../crates/vonk-agent" }
vonk-agent-helper = { path = "../crates/vonk-agent-helper" }

[[bin]]
name = "image_store_head"
path = "fuzz_targets/image_store_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_metrics"
path = "fuzz_targets/engine_metrics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_bundle"
path = "fuzz_targets/source_bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false
