[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "vonk-agent-protocol"
version = "2.2.0"
description = "Versioned, fenced contracts for Vonk Forge agents"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.25.1"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/vonk_agent_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"src/vonk_agent_protocol/schemas/agent-job.schema.json" = "vonk_agent_protocol/schemas/agent-job.schema.json"
"src/vonk_agent_protocol/schemas/agent-result.schema.json" = "vonk_agent_protocol/schemas/agent-result.schema.json"
"src/vonk_agent_protocol/schemas/workload-release-lock.schema.json" = "vonk_agent_protocol/schemas/workload-release-lock.schema.json"
"src/vonk_agent_protocol/schemas/agent-directive.schema.json" = "vonk_agent_protocol/schemas/agent-directive.schema.json"
"src/vonk_agent_protocol/schemas/recipe-job-run.schema.json" = "vonk_agent_protocol/schemas/recipe-job-run.schema.json"
"src/vonk_agent_protocol/schemas/telemetry-report.schema.json" = "vonk_agent_protocol/schemas/telemetry-report.schema.json"
"src/vonk_agent_protocol/vectors/recipe-build-claim-v1.json" = "vonk_agent_protocol/vectors/recipe-build-claim-v1.json"
"src/vonk_agent_protocol/vectors/recipe-job-run-claim-v1.json" = "vonk_agent_protocol/vectors/recipe-job-run-claim-v1.json"
"src/vonk_agent_protocol/vectors/recipe-job-run-result-v1.json" = "vonk_agent_protocol/vectors/recipe-job-run-result-v1.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
