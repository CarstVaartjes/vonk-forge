x-tailscale-logging: &tailscale-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  tailscale-gateway:
    profiles: [secure-remote]
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: vonk-forge-gateway
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    # Userspace networking (TS_USERSPACE=true) needs no TUN device and no
    # capability from the default set. runtime-init copies the OAuth secrets
    # into the tailscale-oauth volume owned by root, mode 0400: the
    # container's root reads them without DAC_OVERRIDE, whatever owner and
    # mode the installer's files have on the host.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TS_AUTH_ONCE: "true"
      TS_CLIENT_ID: file:/run/vonk-tailscale-oauth/tailscale-oauth-client-id
      TS_EXTRA_ARGS: --advertise-tags=tag:vonk-gateway
      TS_HOSTNAME: vonk-forge-gateway
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    # Production gateways are durable nodes that survive long offline periods.
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        if grep -q '?' /run/vonk-tailscale-oauth/tailscale-oauth-client-secret; then
          printf '%s\n' 'Tailscale OAuth client secret input is invalid' >&2
          exit 1
        fi
        umask 077
        tr -d '\r\n' < /run/vonk-tailscale-oauth/tailscale-oauth-client-secret \
          > /tmp/tailscale-oauth-client-secret
        test -s /tmp/tailscale-oauth-client-secret
        printf '?ephemeral=false&preauthorized=true' \
          >> /tmp/tailscale-oauth-client-secret
        chmod 0400 /tmp/tailscale-oauth-client-secret
        exec env \
          TS_CLIENT_SECRET=file:/tmp/tailscale-oauth-client-secret \
          /usr/local/bin/containerboot
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - tailscale-oauth:/run/vonk-tailscale-oauth:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - tailnet-control-plane
      - tailnet-web-edge
    # Orders, never gates: before the first staging the secret is absent, the
    # command exits and the restart policy runs it again. containerboot reads
    # the secrets only to log in once (TS_AUTH_ONCE), so a Controller release
    # does not restart the gateway.
    depends_on:
      runtime-init: {condition: service_healthy, required: false}
    healthcheck:
      test: [CMD-SHELL, "tailscale --socket=/var/run/tailscale/tailscaled.sock status --json | tr -d '[:space:]' | grep -Fq '\"BackendState\":\"Running\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  tailscale-configurator:
    profiles: [secure-remote]
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:tailscale-gateway
    entrypoint: [/bin/sh, /run/vonk-runtime-assets/tailscale/configure.sh]
    volumes:
      - tailscale-socket:/var/run/tailscale
      - runtime-assets:/run/vonk-runtime-assets:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      tailscale-gateway:
        condition: service_started
        restart: true
      runtime-init:
        condition: service_healthy
        required: false
        restart: true
      caddy:
        condition: service_started
        restart: true
    healthcheck:
      test: [CMD-SHELL, "TS_HEALTHCHECK_ONLY=1 /bin/sh /run/vonk-runtime-assets/tailscale/configure.sh"]
      interval: 15s
      timeout: 8s
      retries: 12

networks:
  tailnet-control-plane: {}
  tailnet-web-edge:
    internal: true

volumes:
  tailscale-state: {}
  tailscale-socket: {}
