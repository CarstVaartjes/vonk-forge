x-tailscale-logging: &tailscale-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  tailscale-gateway:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680}
    hostname: ${VONK_TAILSCALE_GATEWAY_HOSTNAME:-vonk-forge-gateway}
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    environment:
      TS_AUTH_ONCE: "true"
      TS_CLIENT_ID: file:/run/secrets/tailscale-oauth-client-id
      TS_EXTRA_ARGS: --advertise-tags=tag:vonk-gateway
      TS_HOSTNAME: ${VONK_TAILSCALE_GATEWAY_HOSTNAME:-vonk-forge-gateway}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # Production gateways must survive extended offline periods. Acceptance
      # overrides this to true so disposable CI nodes leave no tailnet state.
      VONK_TAILSCALE_EPHEMERAL: ${VONK_TAILSCALE_EPHEMERAL:-false}
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        if grep -q '?' /run/secrets/tailscale-oauth-client-secret; then
          printf '%s\n' 'Tailscale OAuth client secret input is invalid' >&2
          exit 1
        fi
        case "$${VONK_TAILSCALE_EPHEMERAL}" in
          true|false) ;;
          *)
            printf '%s\n' 'VONK_TAILSCALE_EPHEMERAL must be true or false' >&2
            exit 1
            ;;
        esac
        umask 077
        tr -d '\r\n' < /run/secrets/tailscale-oauth-client-secret \
          > /tmp/tailscale-oauth-client-secret
        test -s /tmp/tailscale-oauth-client-secret
        printf '?ephemeral=%s&preauthorized=true' \
          "$${VONK_TAILSCALE_EPHEMERAL}" \
          >> /tmp/tailscale-oauth-client-secret
        chmod 0400 /tmp/tailscale-oauth-client-secret
        exec env \
          TS_CLIENT_SECRET=file:/tmp/tailscale-oauth-client-secret \
          /usr/local/bin/containerboot
    secrets:
      - tailscale-oauth-client-id
      - tailscale-oauth-client-secret
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - tailnet-control-plane
      - tailnet-web-edge
      - tailnet-hermes-edge
    healthcheck:
      test: [CMD-SHELL, "tailscale --socket=/var/run/tailscale/tailscaled.sock status --json | tr -d '[:space:]' | grep -Fq '\"BackendState\":\"Running\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  tailscale-configurator:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680}
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    network_mode: service:tailscale-gateway
    entrypoint: [/bin/sh, /usr/local/bin/configure-tailscale]
    environment:
      # Compose profiles are a client-side selection and are not inherited by
      # containers. Pass the selection explicitly so the healthcheck cannot
      # report the default topology healthy while a selected Hermes route is
      # still absent.
      VONK_SELECTED_PROFILES: ${COMPOSE_PROFILES:-}
      VONK_TAILSCALE_CONTROL_SERVICE: ${VONK_TAILSCALE_CONTROL_SERVICE:-svc:vonk-forge}
      VONK_TAILSCALE_HERMES_API_SERVICE: ${VONK_TAILSCALE_HERMES_API_SERVICE:-svc:hermes-api}
      VONK_TAILSCALE_HERMES_DASHBOARD_SERVICE: ${VONK_TAILSCALE_HERMES_DASHBOARD_SERVICE:-svc:hermes-dashboard}
    volumes:
      - tailscale-socket:/var/run/tailscale
      - ./configure.sh:/usr/local/bin/configure-tailscale:ro
    secrets:
      - hermes-api-key
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      tailscale-gateway:
        condition: service_healthy
        restart: true
      caddy:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD-SHELL, "TS_HEALTHCHECK_ONLY=1 /bin/sh /usr/local/bin/configure-tailscale"]
      interval: 15s
      # Two sequential Hermes probes are each bounded to 3s.
      timeout: 8s
      retries: 12

secrets:
  tailscale-oauth-client-id:
    file: ${TAILSCALE_OAUTH_CLIENT_ID_FILE:?set Tailscale OAuth client ID secret file}
  tailscale-oauth-client-secret:
    file: ${TAILSCALE_OAUTH_CLIENT_SECRET_FILE:?set Tailscale OAuth client secret file}

networks:
  tailnet-control-plane: {}
  tailnet-web-edge:
    internal: true
  tailnet-hermes-edge:
    internal: true

volumes:
  tailscale-state: {}
  tailscale-socket: {}
