x-tailscale-logging: &tailscale-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  tailscale-gateway:
    profiles: [secure-remote]
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    hostname: vonk-forge-gateway
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    # Userspace networking (TS_USERSPACE=true) needs no TUN device and no
    # capability from the default set. The installer writes the OAuth secrets
    # 0640 with group 64400 (the NAS installer derives that
    # list from group_add); group_add lets
    # the container's root read them without DAC_OVERRIDE. Compose file
    # secrets are bind mounts that keep the host owner, group and mode.
    cap_drop: [ALL]
    group_add: ["64400"]
    security_opt: [no-new-privileges:true]
    environment:
      TS_AUTH_ONCE: "true"
      TS_CLIENT_ID: file:/run/secrets/tailscale-oauth-client-id
      TS_EXTRA_ARGS: --advertise-tags=tag:vonk-gateway
      TS_HOSTNAME: vonk-forge-gateway
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    # Production gateways are durable nodes that survive long offline periods.
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        if grep -q '?' /run/secrets/tailscale-oauth-client-secret; then
          printf '%s\n' 'Tailscale OAuth client secret input is invalid' >&2
          exit 1
        fi
        umask 077
        tr -d '\r\n' < /run/secrets/tailscale-oauth-client-secret \
          > /tmp/tailscale-oauth-client-secret
        test -s /tmp/tailscale-oauth-client-secret
        printf '?ephemeral=false&preauthorized=true' \
          >> /tmp/tailscale-oauth-client-secret
        chmod 0400 /tmp/tailscale-oauth-client-secret
        exec env \
          TS_CLIENT_SECRET=file:/tmp/tailscale-oauth-client-secret \
          /usr/local/bin/containerboot
    secrets:
      - tailscale-oauth-client-id
      - tailscale-oauth-client-secret
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - tailnet-control-plane
      - tailnet-web-edge
      - tailnet-hermes-edge
    healthcheck:
      test: [CMD-SHELL, "tailscale --socket=/var/run/tailscale/tailscaled.sock status --json | tr -d '[:space:]' | grep -Fq '\"BackendState\":\"Running\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  tailscale-configurator:
    profiles: [secure-remote]
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    # hermes-api-key is 0640 group 64400 (see tailscale-gateway); no capability.
    cap_drop: [ALL]
    group_add: ["64400"]
    security_opt: [no-new-privileges:true]
    network_mode: service:tailscale-gateway
    entrypoint:
      - /bin/sh
      - -c
      - 'until [ -f /run/vonk-runtime-assets/tailscale/configure.sh ]; do sleep 1; done; exec /bin/sh /run/vonk-runtime-assets/tailscale/configure.sh'
    environment:
      # Compose profiles are a client-side selection and are not inherited by
      # containers. Pass the selection explicitly so the healthcheck cannot
      # report the default topology healthy while a selected Hermes route is
      # still absent.
      VONK_SELECTED_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - tailscale-socket:/var/run/tailscale
      - runtime-assets:/run/vonk-runtime-assets:ro
    secrets:
      - hermes-api-key
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      tailscale-gateway:
        condition: service_healthy
        restart: true
      control-api:
        condition: service_started
        required: false
        restart: true
      caddy:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD-SHELL, "TS_HEALTHCHECK_ONLY=1 /bin/sh /run/vonk-runtime-assets/tailscale/configure.sh"]
      interval: 15s
      # Two sequential Hermes probes are each bounded to 3s.
      timeout: 8s
      retries: 12

secrets:
  tailscale-oauth-client-id:
    file: ../secrets/tailscale-oauth-client-id
  tailscale-oauth-client-secret:
    file: ../secrets/tailscale-oauth-client-secret

networks:
  tailnet-control-plane: {}
  tailnet-web-edge:
    internal: true
  tailnet-hermes-edge:
    internal: true

volumes:
  tailscale-state: {}
  tailscale-socket: {}
