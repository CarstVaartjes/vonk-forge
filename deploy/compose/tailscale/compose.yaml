x-tailscale-logging: &tailscale-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  tailscale-gateway:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f}
    hostname: vonk-forge-gateway
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    environment:
      TS_AUTH_ONCE: "true"
      TS_CLIENT_ID: file:/run/secrets/tailscale-oauth-client-id
      TS_EXTRA_ARGS: --advertise-tags=tag:vonk-gateway
      TS_HOSTNAME: vonk-forge-gateway
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        if grep -q '?' /run/secrets/tailscale-oauth-client-secret; then
          printf '%s\n' 'Tailscale OAuth client secret input is invalid' >&2
          exit 1
        fi
        umask 077
        tr -d '\r\n' < /run/secrets/tailscale-oauth-client-secret \
          > /tmp/tailscale-oauth-client-secret-non-ephemeral
        test -s /tmp/tailscale-oauth-client-secret-non-ephemeral
        printf '%s' '?ephemeral=false&preauthorized=true' \
          >> /tmp/tailscale-oauth-client-secret-non-ephemeral
        chmod 0400 /tmp/tailscale-oauth-client-secret-non-ephemeral
        exec env \
          TS_CLIENT_SECRET=file:/tmp/tailscale-oauth-client-secret-non-ephemeral \
          /usr/local/bin/containerboot
    secrets:
      - tailscale-oauth-client-id
      - tailscale-oauth-client-secret
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - tailnet-control-plane
      - tailnet-web-edge
      - tailnet-hermes-edge
    healthcheck:
      test: [CMD-SHELL, "tailscale --socket=/var/run/tailscale/tailscaled.sock status --json | tr -d '[:space:]' | grep -Fq '\"BackendState\":\"Running\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  tailscale-configurator:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f}
    restart: unless-stopped
    logging: *tailscale-logging
    read_only: true
    network_mode: service:tailscale-gateway
    entrypoint: [/bin/sh, /usr/local/bin/configure-tailscale]
    volumes:
      - tailscale-socket:/var/run/tailscale
      - ./configure.sh:/usr/local/bin/configure-tailscale:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      tailscale-gateway:
        condition: service_healthy
        restart: true
      caddy:
        condition: service_healthy
        restart: true
      hermes-agent:
        condition: service_healthy
        required: false
        restart: true
    healthcheck:
      test: [CMD-SHELL, "TS_HEALTHCHECK_ONLY=1 /bin/sh /usr/local/bin/configure-tailscale"]
      interval: 15s
      timeout: 5s
      retries: 12

secrets:
  tailscale-oauth-client-id:
    file: ${TAILSCALE_OAUTH_CLIENT_ID_FILE:?set Tailscale OAuth client ID secret file}
  tailscale-oauth-client-secret:
    file: ${TAILSCALE_OAUTH_CLIENT_SECRET_FILE:?set Tailscale OAuth client secret file}

networks:
  tailnet-control-plane: {}
  tailnet-web-edge:
    internal: true
  tailnet-hermes-edge:
    internal: true

volumes:
  tailscale-state: {}
  tailscale-socket: {}
