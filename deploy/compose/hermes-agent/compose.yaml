x-hermes-service: &hermes-service
  # Compose interpolates included anchors even when their service profile is
  # disabled. Keep the base control-plane graph self-contained; enabling the
  # hermes profile requires replacing this inert fallback with a published,
  # digest-pinned Vonk Forge Hermes image in .env.
  image: ${HERMES_AGENT_IMAGE:-ghcr.io/carstvaartjes/vonk-forge-hermes:profile-required}
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"
  read_only: true
  working_dir: /workspace
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  cpus: ${HERMES_CPUS:-4}
  mem_limit: ${HERMES_MEMORY_LIMIT:-8g}
  mem_reservation: ${HERMES_MEMORY_RESERVATION:-4g}
  shm_size: ${HERMES_SHM_SIZE:-2g}
  tmpfs:
    - /run:size=64m,mode=755,exec
    - /tmp:size=2g,mode=1777
    - /var/tmp:size=1g,mode=1777
  environment: &hermes-environment
    API_SERVER_CORS_ORIGINS: ${HERMES_DASHBOARD_ORIGIN:-https://hermes-profile-required.invalid}
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 0.0.0.0
    API_SERVER_MODEL_NAME: hermes-agent
    HERMES_DASHBOARD: "1"
    HERMES_DASHBOARD_BASIC_AUTH_USERNAME: hermes
    HERMES_GID: ${HERMES_GID:-1100}
    HERMES_UID: ${HERMES_UID:-1100}
    MESSAGING_CWD: /workspace
    OPENAI_BASE_URL: http://caddy:8081/v1
  secrets:
    - hermes-api-key
  volumes: &hermes-volumes
    - type: bind
      source: ${HERMES_DATA_ROOT:-/tmp/vonk-forge-hermes-profile-required}/data
      target: /opt/data
    - type: bind
      source: ${HERMES_DATA_ROOT:-/tmp/vonk-forge-hermes-profile-required}/workspaces
      target: /workspace
    - type: bind
      source: ${HERMES_DATA_ROOT:-/tmp/vonk-forge-hermes-profile-required}/cache
      target: /opt/data/home/.cache

services:
  hermes-agent:
    <<: *hermes-service
    profiles: [hermes]
    hostname: hermes-agent
    restart: unless-stopped
    networks:
      - tailnet-hermes-edge
      - hermes-inference
      - hermes-egress
    depends_on:
      caddy:
        condition: service_started
        restart: true
      litellm:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import pathlib,urllib.request;
          key=pathlib.Path('/run/secrets/hermes-api-key').read_text().strip();
          urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8642/health',headers={'Authorization':'Bearer '+key}),timeout=3);
          urllib.request.urlopen('http://127.0.0.1:9119/',timeout=3)"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s

  hermes-setup:
    <<: *hermes-service
    profiles: [setup]
    restart: "no"
    stdin_open: true
    tty: true
    command: [setup]
    networks:
      - hermes-inference
      - hermes-egress
    depends_on:
      caddy:
        condition: service_started
      litellm:
        condition: service_healthy

secrets:
  hermes-api-key:
    file: ${HERMES_API_KEY_FILE:-/dev/null}

networks:
  tailnet-hermes-edge:
    internal: true
  hermes-inference:
    internal: true
  hermes-egress: {}
