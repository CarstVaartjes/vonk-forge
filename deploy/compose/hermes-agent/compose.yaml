x-hermes-service: &hermes-service
  # Compose interpolates profiles during validation, so every release manifest
  # supplies the accepted immutable image even when Hermes remains disabled.
  image: ${HERMES_AGENT_IMAGE:?set a digest-pinned Hermes image}
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"
  read_only: true
  working_dir: /workspace
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  cpus: ${HERMES_CPUS:-4}
  mem_limit: ${HERMES_MEMORY_LIMIT:-8g}
  mem_reservation: ${HERMES_MEMORY_RESERVATION:-4g}
  shm_size: ${HERMES_SHM_SIZE:-2g}
  tmpfs:
    - /run:size=64m,mode=755,exec
    - /tmp:size=2g,mode=1777
    - /var/tmp:size=1g,mode=1777
  environment: &hermes-environment
    API_SERVER_CORS_ORIGINS: ${HERMES_DASHBOARD_ORIGIN:-https://hermes-profile-required.invalid}
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 0.0.0.0
    API_SERVER_MODEL_NAME: hermes-agent
    HERMES_DASHBOARD: "1"
    HERMES_DASHBOARD_BASIC_AUTH_USERNAME: hermes
    HERMES_GID: ${HERMES_GID:-1100}
    HERMES_UID: ${HERMES_UID:-1100}
    MESSAGING_CWD: /workspace
    OPENAI_BASE_URL: http://caddy:8081/v1
  secrets:
    - hermes-api-key
    - hermes-litellm-key
  volumes: &hermes-volumes
    - hermes-data:/opt/data
    - hermes-workspaces:/workspace
    - hermes-cache:/opt/data/home/.cache

services:
  hermes-litellm-key-provisioner:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.83.14-stable.patch.3@sha256:f12d528d4a05add56cb09e54c5126088f2edc6bdf3a2f943bcd3a32b08769da2}
    profiles: [hermes]
    restart: "no"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    read_only: true
    # Local Compose secrets retain the installer file's owner-only mode. Run as
    # UID 0 with every capability dropped so this one-shot can read only its two
    # mounted secret files without gaining host or filesystem authority.
    user: "0:0"
    entrypoint: [python, /usr/local/bin/provision-hermes-litellm-key]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HERMES_LITELLM_KEY_FILE: /run/secrets/hermes-litellm-key
      LITELLM_MASTER_KEY_FILE: /run/secrets/litellm-master-key
    secrets:
      - hermes-litellm-key
      - litellm-master-key
    volumes:
      - ./provision-litellm-key.py:/usr/local/bin/provision-hermes-litellm-key:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - litellm-edge
    depends_on:
      litellm:
        condition: service_healthy
        restart: true

  hermes-agent:
    <<: *hermes-service
    profiles: [hermes]
    hostname: hermes-agent
    restart: unless-stopped
    networks:
      - tailnet-hermes-edge
      - hermes-inference
    depends_on:
      hermes-litellm-key-provisioner:
        condition: service_completed_successfully
      caddy:
        condition: service_healthy
        restart: true
      litellm:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import pathlib,urllib.request;
          key=pathlib.Path('/run/secrets/hermes-api-key').read_text().strip();
          urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8642/health',headers={'Authorization':'Bearer '+key}),timeout=3);
          urllib.request.urlopen('http://127.0.0.1:9119/',timeout=3)"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s

secrets:
  hermes-api-key:
    file: ${HERMES_API_KEY_FILE:-/dev/null}
  hermes-litellm-key:
    file: ${HERMES_LITELLM_KEY_FILE:-/dev/null}

networks:
  tailnet-hermes-edge:
    internal: true
  hermes-inference:
    internal: true

volumes:
  hermes-data: {}
  hermes-workspaces: {}
  hermes-cache: {}
