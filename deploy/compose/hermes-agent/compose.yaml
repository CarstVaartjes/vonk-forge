x-hermes-service: &hermes-service
  # Compose interpolates profiles during validation, so every release manifest
  # supplies the accepted immutable image even when Hermes remains disabled.
  image: ${HERMES_AGENT_IMAGE:?set a version-pinned Hermes image}
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"
  read_only: true
  working_dir: /workspace
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  cpus: 4
  mem_limit: 8g
  mem_reservation: 4g
  shm_size: 2g
  tmpfs:
    - /run:size=64m,mode=755,exec
    - /tmp:size=2g,mode=1777
    - /var/tmp:size=1g,mode=1777
  environment: &hermes-environment
    # The entrypoint derives the dashboard origin (svc:hermes-dashboard) from it.
    VONK_CONTROL_HOSTNAME: ${VONK_CONTROL_HOSTNAME:?set the control hostname}
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 0.0.0.0
    API_SERVER_MODEL_NAME: hermes-agent
    HERMES_DASHBOARD: "1"
    HERMES_DASHBOARD_BASIC_AUTH_USERNAME: hermes
    # The upstream image runs as the fixed 1100:1100 identity.
    HERMES_GID: "1100"
    HERMES_UID: "1100"
    MESSAGING_CWD: /workspace
    OPENAI_BASE_URL: http://caddy:8081/v1
  secrets:
    - hermes-api-key
    - hermes-litellm-key
  volumes: &hermes-volumes
    - hermes-data:/opt/data
    - hermes-workspaces:/workspace
    - hermes-cache:/opt/data/home/.cache

services:
  hermes-litellm-key-provisioner:
    image: ${LITELLM_IMAGE:?set a version-pinned Vonk LiteLLM image}
    profiles: [hermes]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    read_only: true
    # Local Compose secrets retain the installer file's owner-only mode. Run as
    # UID 0 with only DAC_OVERRIDE so this narrow reconciler can read its two
    # owner-only local Compose secret mounts without gaining host authority.
    user: "0:0"
    entrypoint:
      - python
      - /run/vonk-runtime-assets/hermes-agent/provision-litellm-key.py
      - --reconcile-forever
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    environment:
      HERMES_LITELLM_KEY_FILE: /run/secrets/hermes-litellm-key
      LITELLM_MASTER_KEY_FILE: /run/secrets/litellm-master-key
    secrets:
      - hermes-litellm-key
      - litellm-master-key
    volumes:
      - runtime-assets:/run/vonk-runtime-assets:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - litellm-edge
    depends_on:
      control-api:
        condition: service_healthy
        restart: true
      litellm:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - /run/vonk-runtime-assets/hermes-agent/provision-litellm-key.py
        - --check
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 15s

  hermes-agent:
    <<: *hermes-service
    profiles: [hermes]
    hostname: hermes-agent
    restart: unless-stopped
    networks:
      - tailnet-hermes-edge
      - hermes-inference
    depends_on:
      hermes-litellm-key-provisioner:
        condition: service_healthy
        restart: true
      caddy:
        condition: service_healthy
        restart: true
      litellm:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import pathlib,urllib.request;
          key=pathlib.Path('/run/secrets/hermes-api-key').read_text().strip();
          urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8642/health',headers={'Authorization':'Bearer '+key}),timeout=3);
          urllib.request.urlopen('http://127.0.0.1:9119/',timeout=3)"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s

secrets:
  hermes-api-key:
    file: ../secrets/hermes-api-key
  hermes-litellm-key:
    file: ../secrets/hermes-litellm-key

networks:
  tailnet-hermes-edge:
    internal: true
  hermes-inference:
    internal: true

volumes:
  hermes-data: {}
  hermes-workspaces: {}
  hermes-cache: {}
