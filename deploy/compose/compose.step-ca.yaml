x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  control-secret-init:
    secrets:
      - agent-ca-credential
      - agent-ca-provisioner-public-jwk
      - step-ca-root-certificate
      - step-ca-intermediate-key
      - step-ca-password

  control-api:
    environment:
      VONK_AGENT_CA_PROVIDER: step-ca
      VONK_AGENT_RUNTIME: enabled
      VONK_AGENT_CLIENT_CA_FILE: /run/vonk-normalized-secrets/agent-client-ca
      VONK_AGENT_INTERMEDIATE_CERTIFICATE_FILE: /run/vonk-normalized-secrets/agent-intermediate-certificate
      VONK_AGENT_CA_CREDENTIAL_FILE: /run/vonk-normalized-secrets/agent-ca-credential
      VONK_AGENT_CA_PROVISIONER_PUBLIC_JWK_FILE: /run/vonk-normalized-secrets/agent-ca-provisioner-public-jwk
      VONK_AGENT_CA_ROOT_FILE: /run/vonk-normalized-secrets/step-ca-root-certificate
      VONK_AGENT_CA_URL: https://step-ca:9000
      VONK_AGENT_CA_PROVISIONER_NAME: ${AGENT_CA_PROVISIONER_NAME:-vonk-forge-agent}
      VONK_AGENT_CA_PROVISIONER_KID: ${AGENT_CA_PROVISIONER_KID:?set agent CA provisioner key ID}
      VONK_AGENT_CA_TIMEOUT_SECONDS: ${AGENT_CA_TIMEOUT_SECONDS:-3}
      VONK_AGENT_CA_MAX_RESPONSE_BYTES: ${AGENT_CA_MAX_RESPONSE_BYTES:-65536}
      VONK_AGENT_PROXY_AUTH_FILE: /run/vonk-normalized-secrets/agent-proxy-auth
    secrets: []
    volumes:
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    networks: [ca]
    depends_on:
      step-ca: {condition: service_healthy}

  step-ca:
    image: ${STEP_CA_IMAGE:-smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    command: [step-ca, /home/step/config/ca.json, --password-file, /run/vonk-normalized-secrets/step-ca/password]
    user: "1000:1000"
    secrets: []
    volumes:
      - ${STEP_CA_CONFIG_FILE:?set generated step-ca configuration file}:/home/step/config/ca.json:ro
      - step-ca-data:/home/step/db
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    tmpfs: [/tmp]
    networks: [ca]
    healthcheck:
      test: [CMD, step, ca, health, --ca-url, https://127.0.0.1:9000, --root, /run/vonk-normalized-secrets/step-ca/root-certificate]
      interval: 15s
      timeout: 5s
      retries: 10

secrets:
  agent-ca-credential:
    file: "${AGENT_CA_CREDENTIAL_FILE:?set agent CA provider credential secret file}"
  agent-ca-provisioner-public-jwk:
    file: "${AGENT_CA_PROVISIONER_PUBLIC_JWK_FILE:?set agent CA provisioner public JWK file}"
  step-ca-root-certificate:
    file: "${STEP_CA_ROOT_CERTIFICATE_FILE:?set step-ca root certificate secret file}"
  step-ca-intermediate-key:
    file: "${STEP_CA_INTERMEDIATE_KEY_FILE:?set encrypted step-ca intermediate signing key secret file}"
  step-ca-password:
    file: "${STEP_CA_PASSWORD_FILE:?set step-ca password secret file}"

networks:
  ca: {internal: true}

volumes:
  step-ca-data: {}
