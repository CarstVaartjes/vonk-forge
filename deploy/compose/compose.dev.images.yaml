name: vonk-forge-dev

x-dev-generation: &dev-generation
  VONK_DEPLOYMENT_MODE: development
  VONK_CONTROL_STARTUP_MODE: selected
  VONK_CONTROL_IDENTITY_ROOT: /control-identity
  VONK_DATABASE_URL_FILE: /run/secrets/database-url
  VONK_REPOSITORY_PATH: /repository
  VONK_DEPLOYMENT_BRANCH: deploy
  VONK_STATE_PATH: /state
  VONK_GLOBAL_CATALOG_URL: https://vonkforge.ai

x-api-image: &api-image __VONK_API_IMAGE__
x-worker-image: &worker-image __VONK_WORKER_IMAGE__
# Compatibility input for the current pinned renderer. Task 5 must retain this
# token only for pinned output and omit it entirely from mutable output.
x-pinned-expected-commit: "__VONK_EXPECTED_COMMIT__"

services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [dev-postgres-data:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control"]
      interval: 5s
      timeout: 3s
      retries: 20

  dev-cohort-reset:
    image: *api-image
    pull_policy: always
    user: "0:0"
    read_only: true
    command: [python, -m, vonk_control.dev_cohort, reset, /cohort]
    volumes:
      - dev-image-cohort:/cohort
    network_mode: none
    restart: "no"

  dev-api-cohort:
    image: *api-image
    pull_policy: always
    user: "10001:10001"
    read_only: true
    command: [python, -m, vonk_control.dev_cohort, report, /cohort, --role, api]
    volumes:
      - dev-image-cohort:/cohort
    network_mode: none
    depends_on:
      dev-cohort-reset: {condition: service_completed_successfully}
    restart: "no"

  dev-worker-cohort:
    image: *worker-image
    pull_policy: always
    user: "10001:10001"
    read_only: true
    command: [python, -m, vonk_control.dev_cohort, report, /cohort, --role, worker]
    volumes:
      - dev-image-cohort:/cohort
    network_mode: none
    depends_on:
      dev-api-cohort: {condition: service_completed_successfully}
    restart: "no"

  dev-cohort-verify:
    image: *api-image
    pull_policy: always
    user: "10001:10001"
    read_only: true
    command: [python, -m, vonk_control.dev_cohort, verify, /cohort]
    volumes:
      - dev-image-cohort:/cohort
    network_mode: none
    depends_on:
      dev-worker-cohort: {condition: service_completed_successfully}
    restart: "no"

  dev-repository-init:
    image: *api-image
    pull_policy: always
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    # Git is deliberately executed as nobody; SETUID/SETGID are used only for
    # that child identity drop before the repository is reassigned to the API.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    command: [python, -m, vonk_control.dev_init]
    environment:
      VONK_DEV_INIT_PHASE: repository
      VONK_DEV_REPOSITORY_URL: https://github.com/CarstVaartjes/vonk-forge.git
      VONK_DEV_SELECTED_COHORT_FILE: /cohort/selected.json
      VONK_REPOSITORY_PATH: /repository
    volumes:
      - dev-repository:/repository
      - dev-image-cohort:/cohort:ro
    tmpfs: [/tmp]
    networks: [ingress]
    depends_on:
      dev-cohort-verify: {condition: service_completed_successfully}
    restart: "no"

  dev-init:
    image: *api-image
    pull_policy: always
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    network_mode: none
    command: [python, -m, vonk_control.dev_init]
    environment:
      VONK_CONTROL_IDENTITY_ROOT: /control-identity
      VONK_DEV_AUTH_SECRET_ROOT: /auth-secrets
      VONK_DEV_API_SECRET_ROOT: /api-secrets
      VONK_DEV_CADDY_SECRET_ROOT: /caddy-secrets
      VONK_DEV_LITELLM_SECRET_ROOT: /litellm-secrets
      VONK_DEV_MIGRATE_SECRET_ROOT: /migrate-secrets
      VONK_DEV_INIT_PHASE: runtime
      VONK_DEV_RUNTIME_CONFIG_ROOT: /runtime-config
      VONK_DEV_SECRET_SOURCE_ROOT: /host-secrets
      VONK_DEV_TAILSCALE_SECRET_ROOT: /tailscale-secrets
      VONK_DEV_WORKER_SECRET_ROOT: /worker-secrets
      VONK_DEV_SELECTED_COHORT_FILE: /cohort/selected.json
      VONK_ROUTE_ROOT: /routes
      VONK_STATE_PATH: /state
      VONK_SUPERVISOR_ROOT: /supervisor
    volumes:
      - dev-auth-secrets:/auth-secrets
      - dev-api-secrets:/api-secrets
      - dev-caddy-secrets:/caddy-secrets
      - dev-litellm-secrets:/litellm-secrets
      - dev-migrate-secrets:/migrate-secrets
      - dev-runtime-config:/runtime-config
      - dev-tailscale-secrets:/tailscale-secrets
      - dev-worker-secrets:/worker-secrets
      - dev-control-identity:/control-identity
      - dev-control-state:/state
      - dev-route-publications:/routes
      - dev-supervisor-state:/supervisor
      - dev-image-cohort:/cohort:ro
    secrets:
      - source: admin-password-verifier
        target: /host-secrets/admin-password-verifier
      - source: agent-ca-certificate
        target: /host-secrets/agent-ca-certificate
      - source: agent-ca-key
        target: /host-secrets/agent-ca-key
      - source: agent-proxy-auth
        target: /host-secrets/agent-proxy-auth
      - source: controller-ca
        target: /host-secrets/controller-ca
      - source: controller-server-certificate
        target: /host-secrets/controller-server-certificate
      - source: controller-server-key
        target: /host-secrets/controller-server-key
      - source: database-url
        target: /host-secrets/database-url
      - source: git-signing-key
        target: /host-secrets/git-signing-key
      - source: host-runtime-grant-private-key
        target: /host-secrets/host-runtime-grant-private-key
      - source: litellm-master-key
        target: /host-secrets/litellm-master-key
      - source: litellm-upstream-key
        target: /host-secrets/litellm-upstream-key
      - source: management-cidrs
        target: /host-secrets/management-cidrs
      - source: tailscale-oauth-client-id
        target: /host-secrets/tailscale-oauth-client-id
      - source: tailscale-oauth-client-secret
        target: /host-secrets/tailscale-oauth-client-secret
      - source: token-signing-key
        target: /host-secrets/token-signing-key
    depends_on:
      dev-repository-init: {condition: service_completed_successfully}
    restart: "no"

  dev-supervisor-init:
    image: *api-image
    pull_policy: always
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    command:
      - python
      - -c
      - >-
        import os,stat;
        metadata=os.stat('/supervisor',follow_symlinks=False);
        assert stat.S_ISDIR(metadata.st_mode);
        assert (metadata.st_uid,metadata.st_gid,stat.S_IMODE(metadata.st_mode)) in {(10001,10001,0o750),(10002,10001,0o750)};
        os.chown('/supervisor',10002,10001)
    volumes:
      - dev-supervisor-state:/supervisor
    network_mode: none
    depends_on:
      dev-init: {condition: service_completed_successfully}
    restart: "no"

  migrate:
    image: *api-image
    pull_policy: always
    command:
      - python
      - -m
      - vonk_control.dev_cohort
      - run-selected
      - --role
      - api
      - --
      - python
      - -c
      - >-
        from pathlib import Path;
        from alembic import command;
        from alembic.config import Config;
        config=Config('/srv/vonk-control/alembic.ini');
        config.set_main_option('sqlalchemy.url', Path('/run/secrets/database-url').read_text().strip());
        command.upgrade(config, 'head')
    environment:
      VONK_DEPLOYMENT_MODE: development
      VONK_DEV_SELECTED_COHORT_FILE: /cohort/selected.json
    volumes:
      - dev-migrate-secrets:/run/secrets:ro
      - dev-image-cohort:/cohort:ro
    depends_on:
      postgres: {condition: service_healthy}
      dev-init: {condition: service_completed_successfully}
      dev-cohort-verify: {condition: service_completed_successfully}
    networks: [data]
    restart: "no"

  dev-auth-init:
    image: *api-image
    pull_policy: always
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -m, vonk_control.dev_auth_init]
    environment:
      VONK_DEV_AUTH_MODE: reconcile
    volumes:
      - dev-auth-secrets:/auth-secrets:ro
    tmpfs: [/tmp]
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      dev-init: {condition: service_completed_successfully}
    restart: "no"

  control-worker:
    image: *worker-image
    pull_policy: always
    command: [python, -m, vonk_control.worker]
    user: "10001:10001"
    read_only: true
    tmpfs: [/run/vonk-signer, /tmp]
    environment:
      <<: *dev-generation
      VONK_CONTROL_PROCESS_ROLE: worker
      VONK_INTERNAL_API_URL: http://control-api:8000
      VONK_DEV_SELECTED_COHORT_FILE: /cohort/selected.json
      VONK_MANAGEMENT_CIDRS_FILE: /run/secrets/management-cidrs
      VONK_DIRECT_FABRIC_CIDRS: ""
      VONK_WORKER_API_TOKEN_FILE: /run/secrets/worker-api-token
    volumes:
      - dev-repository:/repository:ro
      - dev-control-identity:/control-identity:ro
      - dev-control-state:/state
      - dev-route-publications:/routes
      - dev-supervisor-state:/supervisor:ro
      - dev-worker-secrets:/run/secrets:ro
      - dev-image-cohort:/cohort:ro
    networks: [application, data]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      dev-init: {condition: service_completed_successfully}
      litellm: {condition: service_healthy}

  control-api:
    image: *api-image
    pull_policy: always
    command: [python, -m, vonk_control.api]
    user: "10001:10001"
    read_only: true
    tmpfs: [/run/vonk-workload-signer, /tmp]
    environment:
      <<: *dev-generation
      VONK_CONTROL_PROCESS_ROLE: api
      VONK_DEV_SELECTED_COHORT_FILE: /cohort/selected.json
      VONK_AGENT_RUNTIME: enabled
      VONK_AGENT_CA_PROVIDER: builtin
      VONK_AGENT_BUILTIN_CA_BOOTSTRAP: "1"
      VONK_MANAGEMENT_CIDRS_FILE: /run/secrets/management-cidrs
      VONK_DIRECT_FABRIC_CIDRS: ""
      VONK_AGENT_CLIENT_CA_FILE: /run/secrets/agent-ca-certificate
      VONK_AGENT_INTERMEDIATE_CERTIFICATE_FILE: /run/secrets/agent-ca-certificate
      VONK_AGENT_INTERMEDIATE_KEY_FILE: /run/secrets/agent-ca-key
      VONK_AGENT_PROXY_AUTH_FILE: /run/secrets/agent-proxy-auth
      VONK_WORKER_API_TOKEN_FILE: /run/secrets/worker-api-token
      VONK_GIT_SIGNING_KEY_FILE: /run/secrets/git-signing-key
      VONK_HOST_RUNTIME_GRANT_PRIVATE_KEY_FILE: /run/secrets/host-runtime-grant-private-key
      VONK_ADMIN_GRANT_PRIVATE_KEY_FILE: /run/secrets/admin-grant-private-key
      VONK_TOKEN_SIGNING_KEY_FILE: /run/secrets/token-signing-key
    volumes:
      - dev-repository:/repository
      - dev-control-identity:/control-identity:ro
      - dev-control-state:/state
      - dev-route-publications:/routes
      - dev-supervisor-state:/supervisor:ro
      - dev-api-secrets:/run/secrets:ro
      - dev-image-cohort:/cohort:ro
    networks: [application, data, ingress]
    ports: ["127.0.0.1:${VONK_DEV_PORT:-8080}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      dev-auth-init: {condition: service_completed_successfully}
      dev-init: {condition: service_completed_successfully}
      control-worker: {condition: service_started}
    healthcheck:
      test: [CMD, python, -m, vonk_control.healthcheck]
      interval: 5s
      timeout: 3s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:v1.81.14-stable@sha256:a3ce130137752e6b085de521b773eacbb641c8b6322c6f538453e860e7b9cf43
    pull_policy: always
    entrypoint: [/run/vonk-runtime/litellm-entrypoint.sh]
    user: "10002:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DISABLE_ADMIN_UI: "True"
      HOME: /tmp
      SERVER_ROOT_PATH: /litellm
      STORE_MODEL_IN_DB: "False"
    volumes:
      - dev-runtime-config:/run/vonk-runtime:ro
      - dev-litellm-secrets:/run/secrets:ro
      - dev-route-publications:/routes:ro
      - dev-supervisor-state:/supervisor
    tmpfs: [/tmp]
    ports: ["127.0.0.1:${VONK_DEV_INFERENCE_PORT:-4000}:4000"]
    networks: [application, ingress]
    depends_on:
      dev-init: {condition: service_completed_successfully}
      dev-supervisor-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    pull_policy: always
    user: "10000:10000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["${VONK_AGENT_PORT:-8443}:8443"]
    volumes:
      - dev-runtime-config:/run/vonk-runtime:ro
      - dev-caddy-secrets:/run/secrets:ro
      - dev-tailscale-runtime:/run/vonk-tailnet:ro
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,mode=0700,uid=10000,gid=10000
      - /data:rw,noexec,nosuid,nodev,mode=0700,uid=10000,gid=10000
      - /run/vonk-caddy:rw,exec,mode=0700,uid=10000,gid=10000
      - /tmp
    entrypoint: [/bin/sh, /run/vonk-runtime/caddy-entrypoint.sh]
    environment:
      VONK_AGENT_ENROLL_HOSTNAME: enroll.vonk-forge.lan
      VONK_AGENT_HOSTNAME: agents.vonk-forge.lan
      VONK_BACKEND_PORT: "8443"
      VONK_CONTROL_HOSTNAME_FILE: /run/vonk-tailnet/control-hostname.ready
    networks: [application, ingress, tailnet-web-edge]
    depends_on:
      control-api: {condition: service_healthy}
      dev-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /bin/sh, /run/vonk-runtime/caddy-entrypoint.sh, health]
      interval: 10s
      timeout: 5s
      retries: 12

  tailscale-gateway:
    image: tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f
    pull_policy: always
    hostname: vonk-forge-dev-gateway
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TS_AUTH_ONCE: "true"
      TS_CLIENT_ID: file:/run/secrets/tailscale-oauth-client-id
      TS_CLIENT_SECRET: file:/run/secrets/tailscale-oauth-client-secret
      TS_EXTRA_ARGS: --advertise-tags=tag:vonk-gateway
      TS_HOSTNAME: vonk-forge-dev-gateway
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - dev-tailscale-secrets:/run/secrets:ro
      - dev-tailscale-state:/var/lib/tailscale
      - dev-tailscale-socket:/var/run/tailscale
    tmpfs: [/tmp:size=64m,mode=1777]
    networks: [tailscale-egress, tailnet-web-edge]
    healthcheck:
      test: [CMD, tailscale, --socket=/var/run/tailscale/tailscaled.sock, status, --json]
      interval: 10s
      timeout: 5s
      retries: 12

  tailscale-configurator:
    image: tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f
    pull_policy: always
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:tailscale-gateway
    entrypoint: [/bin/sh, /run/vonk-runtime/tailscale-configure.sh]
    volumes:
      - dev-tailscale-socket:/var/run/tailscale
      - dev-runtime-config:/run/vonk-runtime:ro
      - dev-tailscale-runtime:/run/vonk-tailnet
    tmpfs: [/tmp:size=16m,mode=1777]
    depends_on:
      caddy: {condition: service_started}
      tailscale-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/sh, /run/vonk-runtime/tailscale-configure.sh, health]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  application: {internal: true}
  data: {internal: true}
  ingress: {}
  tailscale-egress: {}
  tailnet-web-edge: {internal: true}

secrets:
  admin-password-verifier:
    file: ./secrets/admin-password-verifier
  postgres-password:
    file: ./secrets/postgres-password
  database-url:
    file: ./secrets/database-url
  git-signing-key:
    file: ./secrets/git-signing-key
  host-runtime-grant-private-key:
    file: ./secrets/host-runtime-grant-private-key
  agent-ca-certificate:
    file: ./secrets/agent-ca-certificate
  agent-ca-key:
    file: ./secrets/agent-ca-key
  agent-proxy-auth:
    file: ./secrets/agent-proxy-auth
  controller-ca:
    file: ./secrets/controller-ca
  controller-server-certificate:
    file: ./secrets/controller-server-certificate
  controller-server-key:
    file: ./secrets/controller-server-key
  litellm-master-key:
    file: ./secrets/litellm-master-key
  litellm-upstream-key:
    file: ./secrets/litellm-upstream-key
  management-cidrs:
    file: ./secrets/management-cidrs
  token-signing-key:
    file: ./secrets/token-signing-key
  tailscale-oauth-client-id:
    file: ./secrets/tailscale-oauth-client-id
  tailscale-oauth-client-secret:
    file: ./secrets/tailscale-oauth-client-secret

volumes:
  dev-auth-secrets: {}
  dev-postgres-data: {}
  dev-image-cohort: {}
  dev-control-identity: {}
  dev-control-state: {}
  dev-route-publications: {}
  dev-supervisor-state: {}
  dev-repository: {}
  dev-api-secrets: {}
  dev-caddy-secrets: {}
  dev-litellm-secrets: {}
  dev-migrate-secrets: {}
  dev-runtime-config: {}
  dev-tailscale-secrets: {}
  dev-tailscale-runtime: {}
  dev-tailscale-socket: {}
  dev-tailscale-state: {}
  dev-worker-secrets: {}
