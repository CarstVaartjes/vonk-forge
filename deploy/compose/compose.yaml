include:
  - tailscale/compose.yaml
  - hermes-agent/compose.yaml

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-api-environment: &api-environment
  VONK_DEPLOYMENT_MODE: production
  VONK_DATABASE_URL_FILE: /run/vonk-normalized-secrets/database-url
  VONK_TOKEN_SIGNING_KEY_FILE: /run/vonk-normalized-secrets/token-signing-key
  VONK_METRICS_TOKEN_FILE: /run/vonk-normalized-secrets/metrics-token
  VONK_STATE_PATH: /state
  VONK_GLOBAL_CATALOG_URL: ${VONK_GLOBAL_CATALOG_URL:-https://vonkforge.ai}
  # The API remains on internal networks. Caddy relays only read-only requests
  # for the single public recipe repository to api.github.com.
  VONK_RECIPE_LIBRARY_API_URL: http://caddy:8083
  VONK_MANAGEMENT_CIDRS: ${VONK_MANAGEMENT_CIDRS:?set trusted GPU node management CIDRs}
  VONK_DIRECT_FABRIC_CIDRS: ${VONK_DIRECT_FABRIC_CIDRS:-}
  VONK_AGENT_ARTIFACT_ROOT: /state/agent-artifacts
  VONK_AGENT_CONTROLLER_ORIGIN: https://${VONK_AGENT_HOSTNAME:?set Caddy agent hostname}:8443
  VONK_AGENT_ENROLLMENT_ORIGIN: https://${VONK_AGENT_ENROLL_HOSTNAME:?set Caddy enrollment hostname}:8443
  VONK_AGENT_CONTROLLER_ADDRESS: ${NAS_LAN_IP:?set reserved NAS LAN IP}
  VONK_INSTALL_CHANNEL: ${VONK_INSTALL_CHANNEL:-stable}
  VONK_AGENT_SERVICE_HOSTNAMES: ${VONK_CONTROL_HOSTNAME:?set Caddy control hostname},${VONK_AGENT_ENROLL_HOSTNAME:?set Caddy enrollment hostname},${VONK_AGENT_HOSTNAME:?set Caddy agent hostname},${VONK_REGISTRY_HOSTNAME:?set Caddy registry hostname}
  VONK_CONTROLLER_CA_FILE: /run/vonk-normalized-secrets/controller-ca
  VONK_WORKLOAD_TUF_METADATA_ROOT: /workload-tuf/metadata
  VONK_WORKLOAD_TUF_TARGET_ROOT: /workload-tuf/targets
  VONK_WORKER_API_TOKEN_FILE: /run/vonk-normalized-secrets/worker-api-token
  VONK_PACKAGE_HELPER_GRANT_PRIVATE_KEY_FILE: /run/vonk-normalized-secrets/package-helper-grant-private-key
  VONK_PACKAGE_HELPER_RECEIPT_PRIVATE_KEY_FILE: /run/vonk-normalized-secrets/package-helper-receipt-private-key
  VONK_HOST_RUNTIME_GRANT_PRIVATE_KEY_FILE: /run/vonk-normalized-secrets/host-runtime-grant-private-key

x-worker-environment: &worker-environment
  VONK_DEPLOYMENT_MODE: production
  VONK_DATABASE_URL_FILE: /run/vonk-normalized-secrets/database-url
  VONK_WORKER_API_TOKEN_FILE: /run/vonk-normalized-secrets/worker-api-token
  VONK_INTERNAL_API_URL: http://control-api:8000
  VONK_MANAGEMENT_CIDRS: ${VONK_MANAGEMENT_CIDRS:?set trusted GPU node management CIDRs}
  VONK_DIRECT_FABRIC_CIDRS: ${VONK_DIRECT_FABRIC_CIDRS:-}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941}
    entrypoint: [/usr/local/bin/vonk-postgres-entrypoint]
    command: [postgres]
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, litellm-database-password]
    # PostgreSQL 18 stores the cluster in a major-version-specific subdirectory.
    # Mount the parent so future pg_upgrade operations can work across versions.
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/entrypoint.sh:/usr/local/bin/vonk-postgres-entrypoint:ro
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-vonk-forge-databases.sh:ro
    networks: [data, litellm-data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control && psql -U control -d control -tAc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: ${CONTROL_API_IMAGE:?set a digest-pinned control-api image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, vonk_control.api]
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *api-environment
      VONK_AGENT_RUNTIME: enabled
      VONK_AGENT_CLIENT_CA_FILE: /run/vonk-normalized-secrets/agent-client-ca
      VONK_AGENT_INTERMEDIATE_CERTIFICATE_FILE: /run/vonk-normalized-secrets/agent-intermediate-certificate
      VONK_AGENT_CA_CREDENTIAL_FILE: /run/vonk-normalized-secrets/agent-ca-credential
      VONK_AGENT_CA_PROVISIONER_PUBLIC_JWK_FILE: /run/vonk-normalized-secrets/agent-ca-provisioner-public-jwk
      VONK_AGENT_CA_ROOT_FILE: /run/vonk-normalized-secrets/step-ca-root-certificate
      VONK_AGENT_CA_URL: https://step-ca:9000
      VONK_AGENT_CA_PROVISIONER_NAME: ${AGENT_CA_PROVISIONER_NAME:-vonk-forge-agent}
      VONK_AGENT_CA_PROVISIONER_KID: ${AGENT_CA_PROVISIONER_KID:?set agent CA provisioner key ID}
      VONK_AGENT_CA_TIMEOUT_SECONDS: ${AGENT_CA_TIMEOUT_SECONDS:-3}
      VONK_AGENT_CA_MAX_RESPONSE_BYTES: ${AGENT_CA_MAX_RESPONSE_BYTES:-65536}
      VONK_AGENT_PROXY_AUTH_FILE: /run/vonk-normalized-secrets/agent-proxy-auth
    secrets: [admin-password, package-helper-grant-private-key, package-helper-receipt-private-key, host-runtime-grant-private-key, database-url, token-signing-key, metrics-token, agent-client-ca, agent-intermediate-certificate, controller-ca, agent-proxy-auth, worker-api-token, litellm-master-key, litellm-upstream-key, litellm-database-url, grafana-admin-password, agent-ca-credential, agent-ca-provisioner-public-jwk, step-ca-root-certificate, step-ca-intermediate-key, step-ca-password, step-ca-config]
    volumes:
      - control-state:/state
      - workload-tuf-publication:/workload-tuf
      - route-publications:/routes
      - litellm-supervisor-state:/supervisor
      - normalized-private-keys:/normalized
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - ./litellm/bootstrap-config.json:/run/vonk-source-assets/litellm/bootstrap-config.json:ro
      - ./litellm/entrypoint.sh:/run/vonk-source-assets/litellm/entrypoint.sh:ro
      - ./litellm/config_supervisor.py:/run/vonk-source-assets/litellm/config_supervisor.py:ro
      - ./prometheus/prometheus.yml:/run/vonk-source-assets/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/run/vonk-source-assets/prometheus/alerts.yaml:ro
      - ./grafana/provisioning:/run/vonk-source-assets/grafana/provisioning:ro
      - ./grafana/dashboards:/run/vonk-source-assets/grafana/dashboards:ro
    # OCI archives are transfer staging only; PostgreSQL owns the build
    # authority and the enrolled node owns the imported runtime image. Never
    # make the controller's temporary upload bytes part of persistent state.
    tmpfs:
      - /tmp
      - /state/agent-artifacts
    networks: [application, data, agent-proxy, worker-authority, ca]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, vonk_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10

  control-worker:
    image: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, vonk_control.worker]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *worker-environment
    secrets: []
    volumes:
      - route-publications:/routes
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - litellm-supervisor-state:/supervisor:ro
      - control-state:/state
    tmpfs: [/tmp]
    networks: [data, worker-authority]
    depends_on:
      postgres: {condition: service_healthy}
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, vonk_control.worker_healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12

  step-ca:
    image: ${STEP_CA_IMAGE:-smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    entrypoint: [step-ca]
    command: [/run/vonk-normalized-secrets/step-ca/ca.json, --password-file, /run/vonk-normalized-secrets/step-ca/password]
    user: "1000:1000"
    secrets: []
    volumes:
      - step-ca-data:/home/step
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    tmpfs: [/tmp]
    depends_on:
      control-api: {condition: service_healthy}
    networks: [ca]
    healthcheck:
      test: [CMD, step, ca, health, --ca-url, https://step-ca:9000, --root, /run/vonk-normalized-secrets/step-ca/root-certificate]
      interval: 15s
      timeout: 5s
      retries: 10

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.83.14-stable.patch.3@sha256:f12d528d4a05add56cb09e54c5126088f2edc6bdf3a2f943bcd3a32b08769da2}
    restart: unless-stopped
    logging: *bounded-logging
    entrypoint: [/bin/sh, /run/vonk-normalized-secrets/runtime-assets/litellm/entrypoint.sh]
    read_only: true
    user: "10002:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /root
      XDG_CACHE_HOME: /root/.cache
      PRISMA_QUERY_ENGINE_BINARY: /root/.cache/prisma-python/binaries/5.4.2/ac9d7041ed77bcc8a8dbd2ab6616b39013829574/node_modules/@prisma/engines/query-engine-debian-openssl-3.0.x
      DISABLE_ADMIN_UI: "False"
      LITELLM_UI_PATH: /tmp/litellm-ui
      LITELLM_MASTER_KEY_FILE: /run/vonk-normalized-secrets/litellm-master-key
      LITELLM_UPSTREAM_KEY_FILE: /run/vonk-normalized-secrets/litellm-upstream-key
      LITELLM_DATABASE_URL_FILE: /run/vonk-normalized-secrets/litellm-database-url
      SERVER_ROOT_PATH: /litellm
      STORE_MODEL_IN_DB: "False"
    secrets: []
    volumes:
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - route-publications:/routes:ro
      - litellm-supervisor-state:/supervisor:rw
    tmpfs:
      - /tmp
      - /root:exec,mode=0700,uid=10002,gid=10001
    networks: [litellm-data, cluster-egress, litellm-edge]
    depends_on:
      postgres: {condition: service_healthy}
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0}
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - --config.file=/run/vonk-normalized-secrets/runtime-assets/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
    read_only: true
    user: "65534:65534"
    secrets: []
    volumes:
      - prometheus-data:/prometheus
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    tmpfs: [/tmp]
    networks: [application]
    depends_on:
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "472:472"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/vonk-normalized-secrets/grafana-admin-password
      GF_PATHS_PROVISIONING: /run/vonk-normalized-secrets/runtime-assets/grafana/provisioning
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: []
    volumes:
      - grafana-data:/var/lib/grafana
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    tmpfs: [/tmp]
    networks: [application, ingress]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    ports:
      - target: 8443
        published: 8443
        host_ip: ${NAS_LAN_IP:?set reserved NAS LAN IP}
        protocol: tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/usr/local/bin/vonk-caddy-entrypoint:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    entrypoint: [/bin/sh, /usr/local/bin/vonk-caddy-entrypoint]
    environment:
      VONK_CONTROL_HOSTNAME: ${VONK_CONTROL_HOSTNAME:?set Caddy control hostname}
      VONK_AGENT_ENROLL_HOSTNAME: ${VONK_AGENT_ENROLL_HOSTNAME:?set Caddy enrollment hostname}
      VONK_AGENT_HOSTNAME: ${VONK_AGENT_HOSTNAME:?set Caddy agent hostname}
      VONK_REGISTRY_HOSTNAME: ${VONK_REGISTRY_HOSTNAME:?set Caddy registry hostname}
      VONK_BACKEND_PORT: "8443"
    secrets: [agent-client-ca, agent-proxy-auth, controller-server-certificate, controller-server-key]
    networks: [ingress, agent-proxy, registry-edge, tailnet-web-edge, hermes-inference, litellm-edge]
    depends_on:
      control-api: {condition: service_healthy}
      registry: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  registry:
    image: ${REGISTRY_IMAGE:-registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
    tmpfs: [/tmp]
    networks: [registry-edge, registry-publisher]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  admin-password:
    file: "${ADMIN_PASSWORD_FILE:?set Vonk administrator password secret file}"
  database-url:
    file: "${DATABASE_URL_FILE:?set database URL secret file}"
  postgres-password:
    file: "${POSTGRES_PASSWORD_FILE:?set PostgreSQL password secret file}"
  litellm-database-password:
    file: "${LITELLM_DATABASE_PASSWORD_FILE:?set LiteLLM database password secret file}"
  token-signing-key:
    file: "${TOKEN_SIGNING_KEY_FILE:?set token signing key secret file}"
  metrics-token:
    file: "${METRICS_TOKEN_FILE:?set metrics scrape token secret file}"
  litellm-master-key:
    file: "${LITELLM_MASTER_KEY_FILE:?set LiteLLM master key secret file}"
  litellm-upstream-key:
    file: "${LITELLM_UPSTREAM_KEY_FILE:?set LiteLLM upstream key secret file}"
  litellm-database-url:
    file: "${LITELLM_DATABASE_URL_FILE:?set LiteLLM database URL secret file}"
  grafana-admin-password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:?set Grafana admin password secret file}"
  agent-client-ca:
    file: "${AGENT_CLIENT_CA_FILE:?set agent client CA certificate secret file}"
  agent-intermediate-certificate:
    file: "${AGENT_INTERMEDIATE_CERTIFICATE_FILE:?set agent intermediate certificate secret file}"
  controller-ca:
    file: "${CONTROLLER_CA_FILE:?set public controller CA certificate secret file}"
  controller-server-certificate:
    file: "${CONTROLLER_SERVER_CERTIFICATE_FILE:?set controller server certificate secret file}"
  controller-server-key:
    file: "${CONTROLLER_SERVER_KEY_FILE:?set controller server private key secret file}"
  agent-proxy-auth:
    file: "${AGENT_PROXY_AUTH_FILE:?set agent proxy authentication secret file}"
  worker-api-token:
    file: "${WORKER_API_TOKEN_FILE:?set worker API token secret file}"
  package-helper-grant-private-key:
    file: "${PACKAGE_HELPER_GRANT_PRIVATE_KEY_FILE:?set workload package helper grant private key file}"
  package-helper-receipt-private-key:
    file: "${PACKAGE_HELPER_RECEIPT_PRIVATE_KEY_FILE:?set workload package helper receipt private key file}"
  host-runtime-grant-private-key:
    file: "${HOST_RUNTIME_GRANT_PRIVATE_KEY_FILE:?set host runtime grant private key file}"
  agent-ca-credential:
    file: "${AGENT_CA_CREDENTIAL_FILE:?set agent CA provider credential secret file}"
  agent-ca-provisioner-public-jwk:
    file: "${AGENT_CA_PROVISIONER_PUBLIC_JWK_FILE:?set agent CA provisioner public JWK file}"
  step-ca-root-certificate:
    file: "${STEP_CA_ROOT_CERTIFICATE_FILE:?set step-ca root certificate secret file}"
  step-ca-intermediate-key:
    file: "${STEP_CA_INTERMEDIATE_KEY_FILE:?set encrypted step-ca intermediate signing key secret file}"
  step-ca-password:
    file: "${STEP_CA_PASSWORD_FILE:?set step-ca password secret file}"
  step-ca-config:
    file: "${STEP_CA_CONFIG_FILE:?set generated step-ca configuration file}"

networks:
  ingress: {}
  agent-proxy: {internal: true}
  application: {internal: true}
  worker-authority: {internal: true}
  data: {internal: true}
  litellm-data: {internal: true}
  cluster-egress: {}
  litellm-edge: {internal: true}
  registry-edge: {internal: true}
  # No standing service joins this network. A Docker-daemon administrator may
  # attach a digest-pinned one-shot ORAS publisher as documented in registry/README.md.
  registry-publisher: {internal: true}
  ca: {internal: true}

volumes:
  postgres-data: {}
  control-state: {}
  caddy-data: {}
  caddy-config: {}
  litellm-supervisor-state: {}
  prometheus-data: {}
  grafana-data: {}
  registry-data: {}
  route-publications: {}
  workload-tuf-publication: {}
  normalized-private-keys: {}
  step-ca-data: {}
