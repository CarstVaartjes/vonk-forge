include:
  - tailscale/compose.yaml
  - hermes-agent/compose.yaml

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

# The Controller's whole site configuration. Everything else (secret paths,
# internal relays, tuning) is fixed in code. Only the NAS address and the
# control hostname are required; the rest heals to a sensible default.
x-control-environment: &control-environment
  VONK_CONTROL_HOSTNAME: ${VONK_CONTROL_HOSTNAME:?set the control hostname}
  VONK_NAS_LAN_IP: ${NAS_LAN_IP:?set the reserved NAS LAN IP}
  VONK_MANAGEMENT_CIDRS: ${VONK_MANAGEMENT_CIDRS:-}
  VONK_DIRECT_FABRIC_CIDRS: ${VONK_DIRECT_FABRIC_CIDRS:-}
  VONK_INSTALL_CHANNEL: ${VONK_INSTALL_CHANNEL:-stable}
  # "latest" follows the newest signed recipe release; vX.Y.Z holds one.
  VONK_RECIPE_LIBRARY_RELEASE: ${VONK_RECIPE_LIBRARY_RELEASE:-latest}

services:
  postgres:
    image: postgres:18.6
    entrypoint: [/usr/local/bin/vonk-postgres-entrypoint]
    command: [postgres]
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      VONK_BACKUP_OFFHOST_PATH: ${VONK_BACKUP_OFFHOST_PATH:-}
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, litellm-database-password]
    # PostgreSQL 18 stores the cluster in a major-version-specific subdirectory.
    # Mount the parent so future pg_upgrade operations can work across versions.
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./backups
        target: /backups
      - control-state:/state
      - step-ca-data:/step-ca-data:ro
      - type: bind
        source: ${VONK_BACKUP_OFFHOST_PATH:-./backups-offhost}
        target: /offhost
      - ./postgres/entrypoint.sh:/usr/local/bin/vonk-postgres-entrypoint:ro
      - ./postgres/init-databases.sh:/run/vonk-source-assets/postgres/init-databases.sh:ro
    networks: [data, litellm-data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control && psql -U control -d control -tAc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: ${CONTROL_API_IMAGE:?set a version-pinned control-api image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, vonk_control.api]
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment: *control-environment
    secrets: [admin-password, host-runtime-grant-private-key, database-url, token-signing-key, metrics-token, agent-client-ca, agent-intermediate-certificate, controller-ca, agent-proxy-auth, hf-token, litellm-master-key, litellm-upstream-key, litellm-database-url, grafana-admin-password, agent-ca-credential, agent-ca-provisioner-public-jwk, step-ca-root-certificate, step-ca-intermediate-key, step-ca-password, step-ca-config]
    volumes:
      - control-state:/state
      - agent-artifacts:/state/agent-artifacts
      - route-publications:/routes
      - litellm-supervisor-state:/supervisor
      - normalized-private-keys:/normalized
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - ./litellm/bootstrap-config.json:/run/vonk-source-assets/litellm/bootstrap-config.json:ro
      - ./litellm/entrypoint.sh:/run/vonk-source-assets/litellm/entrypoint.sh:ro
      - ./litellm/config_supervisor.py:/run/vonk-source-assets/litellm/config_supervisor.py:ro
      - ./prometheus/prometheus.yml:/run/vonk-source-assets/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/run/vonk-source-assets/prometheus/alerts.yaml:ro
      - ./grafana/provisioning:/run/vonk-source-assets/grafana/provisioning:ro
      - ./grafana/dashboards:/run/vonk-source-assets/grafana/dashboards:ro
      # The Controller keeps the default gateway client key here (mode 600).
      - type: bind
        source: ./secrets/gateway
        target: /gateway-secrets
        bind: {create_host_path: true}
    # Built OCI archives can be tens of GiB and must remain available while
    # they are distributed to every mapped Spark. Keep them off tmpfs and in a
    # dedicated volume so Controller restarts do not invalidate accepted
    # builds. PostgreSQL remains the authority for their lifecycle.
    tmpfs: [/tmp]
    networks: [application, data, agent-proxy, ca]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, vonk_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10

  control-worker:
    image: ${CONTROL_WORKER_IMAGE:?set a version-pinned control-worker image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, vonk_control.worker]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: *control-environment
    secrets: []
    volumes:
      - route-publications:/routes
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - litellm-supervisor-state:/supervisor:ro
      - control-state:/state
      - agent-artifacts:/state/agent-artifacts
    tmpfs: [/tmp]
    # The cache worker fetches pinned models and OCI images from public
    # providers. Keep its outbound network separate from ingress and do not
    # publish worker ports; the API and database retain internal networks.
    networks: [data, artifact-egress]
    depends_on:
      postgres: {condition: service_healthy}
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, vonk_control.worker_healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12

  step-ca:
    image: smallstep/step-ca:0.30.2
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    entrypoint: [step-ca]
    command: [/run/vonk-normalized-secrets/step-ca/ca.json, --password-file, /run/vonk-normalized-secrets/step-ca/password]
    user: "1000:1000"
    secrets: []
    volumes:
      - step-ca-data:/home/step
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    tmpfs: [/tmp]
    depends_on:
      control-api: {condition: service_healthy}
    networks: [ca]
    healthcheck:
      test: [CMD, step, ca, health, --ca-url, https://step-ca:9000, --root, /run/vonk-normalized-secrets/step-ca/root-certificate]
      interval: 15s
      timeout: 5s
      retries: 10

  litellm:
    image: ${LITELLM_IMAGE:?set a version-pinned Vonk LiteLLM image}
    restart: unless-stopped
    logging: *bounded-logging
    entrypoint: [/bin/sh, /run/vonk-normalized-secrets/runtime-assets/litellm/entrypoint.sh]
    read_only: true
    user: "10002:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /root
      XDG_CACHE_HOME: /root/.cache
      PRISMA_QUERY_ENGINE_BINARY: /opt/vonk-litellm/prisma/query-engine
      DISABLE_ADMIN_UI: "False"
      LITELLM_UI_PATH: /tmp/litellm-ui
      LITELLM_MASTER_KEY_FILE: /run/vonk-normalized-secrets/litellm-master-key
      LITELLM_UPSTREAM_KEY_FILE: /run/vonk-normalized-secrets/litellm-upstream-key
      LITELLM_DATABASE_URL_FILE: /run/vonk-normalized-secrets/litellm-database-url
      SERVER_ROOT_PATH: /litellm
      STORE_MODEL_IN_DB: "False"
    secrets: []
    volumes:
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - route-publications:/routes:ro
      - litellm-supervisor-state:/supervisor:rw
    tmpfs:
      - /tmp
      - /root:exec,mode=0700,uid=10002,gid=10001
    networks: [litellm-data, cluster-egress, litellm-edge]
    depends_on:
      postgres: {condition: service_healthy}
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - --config.file=/run/vonk-normalized-secrets/runtime-assets/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
    read_only: true
    user: "65534:65534"
    secrets: []
    volumes:
      - prometheus-data:/prometheus
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    tmpfs: [/tmp]
    networks: [application]
    depends_on:
      control-api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "472:472"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/vonk-normalized-secrets/grafana-admin-password
      GF_PATHS_PROVISIONING: /run/vonk-normalized-secrets/runtime-assets/grafana/provisioning
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: []
    volumes:
      - grafana-data:/var/lib/grafana
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
    tmpfs: [/tmp]
    networks: [application, ingress]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    ports:
      - target: 8443
        published: 8443
        host_ip: ${NAS_LAN_IP:?set reserved NAS LAN IP}
        protocol: tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/usr/local/bin/vonk-caddy-entrypoint:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    entrypoint: [/bin/sh, /usr/local/bin/vonk-caddy-entrypoint]
    environment:
      VONK_CONTROL_HOSTNAME: ${VONK_CONTROL_HOSTNAME:?set the control hostname}
    secrets: [agent-client-ca, agent-proxy-auth, controller-server-certificate, controller-server-key]
    networks: [ingress, agent-proxy, registry-edge, tailnet-web-edge, hermes-inference, litellm-edge]
    depends_on:
      control-api: {condition: service_healthy}
      registry: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  registry:
    image: registry:3.1.2
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
    tmpfs: [/tmp]
    networks: [registry-edge, registry-publisher]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

# Every secret is a file the installer generates under ./secrets.
secrets:
  hf-token:
    file: ./secrets/hf-token
  admin-password:
    file: ./secrets/admin-password
  database-url:
    file: ./secrets/database-url
  postgres-password:
    file: ./secrets/postgres-password
  litellm-database-password:
    file: ./secrets/litellm-database-password
  token-signing-key:
    file: ./secrets/token-signing-key
  metrics-token:
    file: ./secrets/metrics-token
  litellm-master-key:
    file: ./secrets/litellm-master-key
  litellm-upstream-key:
    file: ./secrets/litellm-upstream-key
  litellm-database-url:
    file: ./secrets/litellm-database-url
  grafana-admin-password:
    file: ./secrets/grafana-admin-password
  agent-client-ca:
    file: ./secrets/step-ca/root-certificate
  agent-intermediate-certificate:
    file: ./secrets/step-ca/intermediate-certificate
  controller-ca:
    file: ./secrets/step-ca/root-certificate
  controller-server-certificate:
    file: ./secrets/controller-server-certificate
  controller-server-key:
    file: ./secrets/controller-server-key
  agent-proxy-auth:
    file: ./secrets/agent-proxy-auth
  host-runtime-grant-private-key:
    file: ./secrets/host-runtime-grant-private-key.pem
  agent-ca-credential:
    file: ./secrets/agent-ca-credential
  agent-ca-provisioner-public-jwk:
    file: ./secrets/agent-ca-provisioner-public-jwk
  step-ca-root-certificate:
    file: ./secrets/step-ca/root-certificate
  step-ca-intermediate-key:
    file: ./secrets/step-ca/intermediate-key
  step-ca-password:
    file: ./secrets/step-ca-password
  step-ca-config:
    file: ./secrets/step-ca/ca.json

networks:
  ingress: {}
  agent-proxy: {internal: true}
  application: {internal: true}
  artifact-egress: {}
  data: {internal: true}
  litellm-data: {internal: true}
  cluster-egress: {}
  litellm-edge: {internal: true}
  registry-edge: {internal: true}
  # No standing service joins this network. A Docker-daemon administrator may
  # attach a version-pinned one-shot ORAS publisher as documented in registry/README.md.
  registry-publisher: {internal: true}
  ca: {internal: true}

volumes:
  postgres-data: {}
  control-state: {}
  agent-artifacts: {}
  caddy-data: {}
  caddy-config: {}
  litellm-supervisor-state: {}
  prometheus-data: {}
  grafana-data: {}
  registry-data: {}
  route-publications: {}
  normalized-private-keys: {}
  step-ca-data: {}
