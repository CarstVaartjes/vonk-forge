include:
  - tailscale/compose.yaml

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

# The Controller's whole site configuration. Everything else (secret paths,
# internal relays, tuning) is fixed in code. Only the NAS address and the
# control hostname are required; the rest heals to a sensible default.
x-control-environment: &control-environment
  VONK_PROMETHEUS_URL: http://prometheus:9090
  VONK_CONTROL_HOSTNAME: ${VONK_CONTROL_HOSTNAME:?set the control hostname}
  VONK_NAS_LAN_IP: ${NAS_LAN_IP:?set the reserved NAS LAN IP}
  VONK_MANAGEMENT_CIDRS: ${VONK_MANAGEMENT_CIDRS:-}
  VONK_DIRECT_FABRIC_CIDRS: ${VONK_DIRECT_FABRIC_CIDRS:-}
  VONK_INSTALL_CHANNEL: ${VONK_INSTALL_CHANNEL:-stable}
  # "latest" follows the newest signed recipe release; vX.Y.Z holds one.
  VONK_RECIPE_LIBRARY_RELEASE: ${VONK_RECIPE_LIBRARY_RELEASE:-latest}

services:
  image-janitor:
    # Standalone stdlib-only janitor, sharing the reviewed Python build pin.
    image: python:3.14-slim-trixie@sha256:0514bc76712d64f8bb48adcb95b1ab0d88c69fee95d62fe4c18ee948bee9b1e1
    command: [python, -u, -B, /janitor.py]
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    configs:
      - source: image-janitor-script
        target: /janitor.py
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - image-janitor-state:/state
    healthcheck:
      # The hourly sweep and the 30-second repair loop must both be alive.
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/state/unused.json').st_mtime < 7200 and time.time()-os.stat('/state/network-tick-ok').st_mtime < 900"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 1m

  # Root, no network: on each start stages each consumer's private secrets,
  # this release's runtime kit (configs and entrypoints from the Controller
  # image) and the ownership of the shared volume roots, then marks itself
  # healthy and idles (NAS Docker UIs show an exited container as a failed
  # project). Dependants start once it is healthy; required: false orders,
  # never gates: after a failed run they start on the previous staging kept in
  # the volumes while the restart policy runs it again.
  runtime-init:
    # The Controller API image: it ships the kit and the staging code.
    image: &control-api-image ${CONTROL_API_IMAGE:?set a version-pinned control-api image}
    entrypoint: [python, -m, vonk_control.runtime_init]
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "0:0"
    # Reads installer-owned secrets and chowns/chmods each staged file and
    # volume root to its consumer. It never changes identity.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    network_mode: none
    # The health marker lives here: empty on every container start.
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, cat, /tmp/runtime-staged]
      interval: 5s
      timeout: 5s
      retries: 3
    secrets: [host-runtime-grant-private-key, database-url, token-signing-key, metrics-token, agent-client-ca, agent-intermediate-certificate, controller-ca, agent-proxy-auth, hf-token, litellm-master-key, litellm-upstream-key, litellm-database-url, agent-ca-provisioner-public-jwk, step-ca-root-certificate, step-ca-intermediate-key, step-ca-password]
    volumes:
      - control-state:/state
      - agent-artifacts:/state/agent-artifacts
      - model-cache:/state/model-cache
      - route-publications:/routes
      - litellm-supervisor-state:/supervisor
      - normalized-private-keys:/normalized
      - runtime-assets:/runtime-assets
      - type: bind
        source: ./secrets/gateway
        target: /gateway-secrets
        bind: {create_host_path: true}

  postgres:
    # PostgreSQL 17+ is required: the Controller sets the transaction_timeout
    # connection GUC (added in 17) on every connection. The pinned image
    # satisfies that.
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    # The Controller image ships this entrypoint; runtime-init stages it, so a
    # pulled release updates it.
    entrypoint: [/bin/sh, /run/vonk-runtime-assets/postgres/entrypoint.sh]
    command: [postgres]
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *bounded-logging
    # The entrypoint stages the initdb secret as postgres, drops privileges via
    # gosu, and chowns completed dumps to the bundle owner. It also probes and
    # signals the server, which runs as postgres: without KILL, `kill -0` fails,
    # the entrypoint waits forever and never starts the backup loop. It keeps
    # exactly these six capabilities.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    environment:
      VONK_BACKUP_OFFHOST_PATH: ${VONK_BACKUP_OFFHOST_PATH:-}
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, litellm-database-password]
    # PostgreSQL 18 stores the cluster in a major-version-specific subdirectory.
    # Mount the parent so future pg_upgrade operations can work across versions.
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./backups
        target: /backups
      - control-state:/state
      - type: bind
        source: ${VONK_BACKUP_OFFHOST_PATH:-./backups-offhost}
        target: /offhost
      - runtime-assets:/run/vonk-runtime-assets:ro
    networks: [data, litellm-data]
    # No restart edge: the database must not bounce with every release; a new
    # entrypoint applies from its next start.
    depends_on:
      runtime-init: {condition: service_healthy, required: false}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control && psql -U control -d control -tAc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: *control-api-image
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, vonk_control.api]
    read_only: true
    # The pre-exec reads the installer-owned administrator password as root,
    # then drops to 10001 for good before the API starts.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    environment: *control-environment
    secrets: [admin-password]
    volumes:
      - control-state:/state
      - agent-artifacts:/state/agent-artifacts
      - model-cache:/state/model-cache
      - route-publications:/routes
      - litellm-supervisor-state:/supervisor
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      # The Controller keeps the default gateway client key here (mode 600).
      - type: bind
        source: ./secrets/gateway
        target: /gateway-secrets
        bind: {create_host_path: true}
    # Built OCI archives can be tens of GiB and must remain available while
    # they are distributed to every mapped Spark. Keep them off tmpfs and in a
    # dedicated volume so Controller restarts do not invalidate accepted
    # builds. PostgreSQL remains the authority for their lifecycle.
    tmpfs: [/tmp]
    networks: [application, data, agent-proxy]
    # No dependency on PostgreSQL: startup retries the database connection
    # until it is ready.
    depends_on:
      runtime-init: {condition: service_healthy, required: false}
    healthcheck:
      test: [CMD, python, -m, vonk_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2m

  control-worker:
    image: ${CONTROL_WORKER_IMAGE:?set a version-pinned control-worker image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, vonk_control.worker]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: *control-environment
    secrets: []
    volumes:
      - route-publications:/routes
      # runtime-init stages the same encrypted intermediate/password as private
      # UID 10001 files; enrollment and worker recovery share this authority.
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - litellm-supervisor-state:/supervisor:ro
      - control-state:/state
      - agent-artifacts:/state/agent-artifacts
      - model-cache:/state/model-cache
    tmpfs: [/tmp]
    # The cache worker fetches pinned models and OCI images from public
    # providers. Keep its outbound network separate from ingress and do not
    # publish worker ports; the API and database retain internal networks.
    networks: [data, artifact-egress]
    # Start order only: a down dependency must never leave this service Created.
    # The worker itself waits for the API-owned schema (wait_for_database).
    depends_on:
      runtime-init: {condition: service_healthy, required: false}
      postgres: {condition: service_started}
      control-api: {condition: service_started}
    healthcheck:
      test: [CMD, python, -m, vonk_control.worker_healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12
      # Covers the schema wait (120s, one owner in vonk_control.db.constants)
      # plus one probe's lock wait and a first loop.
      start_period: 5m

  litellm:
    image: ${LITELLM_IMAGE:?set a version-pinned Vonk LiteLLM image}
    restart: unless-stopped
    logging: *bounded-logging
    entrypoint: [/bin/sh, /run/vonk-runtime-assets/litellm/entrypoint.sh]
    read_only: true
    user: "10002:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /root
      XDG_CACHE_HOME: /root/.cache
      PRISMA_QUERY_ENGINE_BINARY: /opt/vonk-litellm/prisma/query-engine
      DISABLE_ADMIN_UI: "False"
      LITELLM_UI_PATH: /tmp/litellm-ui
      LITELLM_MASTER_KEY_FILE: /run/vonk-normalized-secrets/litellm-master-key
      LITELLM_UPSTREAM_KEY_FILE: /run/vonk-normalized-secrets/litellm-upstream-key
      LITELLM_DATABASE_URL_FILE: /run/vonk-normalized-secrets/litellm-database-url
      SERVER_ROOT_PATH: /litellm
      STORE_MODEL_IN_DB: "False"
    secrets: []
    volumes:
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - runtime-assets:/run/vonk-runtime-assets:ro
      - route-publications:/routes:ro
      - litellm-supervisor-state:/supervisor:rw
    tmpfs:
      - /tmp
      - /root:exec,mode=0700,uid=10002,gid=10001
    networks: [litellm-data, cluster-egress, litellm-edge, litellm-metrics]
    depends_on:
      runtime-init: {condition: service_healthy, required: false, restart: true}
      postgres: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - --config.file=/run/vonk-runtime-assets/prometheus/prometheus.yml
      # Reloading on change applies a restage without a restart.
      - --config.auto-reload
      - --config.auto-reload-interval=10s
      - --storage.tsdb.path=/prometheus
      # One year of history for inference statistics. The size cap is a
      # backstop (oldest blocks go first), sized for roughly 100 series per
      # active model/key pair at a 30s scrape plus the Controller's metrics.
      - --storage.tsdb.retention.time=365d
      - --storage.tsdb.retention.size=40GB
    read_only: true
    user: "65534:65534"
    # Binds the internal high port 9090 as nobody; no capabilities needed.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: []
    volumes:
      - prometheus-data:/prometheus
      - normalized-private-keys:/run/vonk-normalized-secrets:ro
      - runtime-assets:/run/vonk-runtime-assets:ro
    tmpfs: [/tmp]
    networks: [application, litellm-metrics]
    depends_on:
      runtime-init: {condition: service_healthy, required: false, restart: true}
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Services that read the staged runtime assets restart once runtime-init has
  # staged a new release (restart: true). They never wait for the Controller:
  # the volume keeps the last release, so the gateway keeps serving while the
  # Controller is down.
  caddy:
    image: caddy:2.11.8@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    # DAC_OVERRIDE reads installer-owned secrets. The pinned Caddy executable
    # carries NET_BIND_SERVICE, which must remain in its bounding set for exec.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - target: 8443
        published: 8443
        host_ip: ${NAS_LAN_IP:?set reserved NAS LAN IP}
        protocol: tcp
    volumes:
      - runtime-assets:/run/vonk-runtime-assets:ro
      - caddy-data:/data
      - caddy-config:/config
      # Caddy serves model and image bytes itself, but only after the
      # Controller authorizes the request and names the file. Same layout as
      # the Controller's /state, read-only, and only the two object stores.
      - agent-artifacts:/srv/state/agent-artifacts:ro
      - model-cache:/srv/state/model-cache:ro
    tmpfs: [/tmp]
    entrypoint: [/bin/sh, /run/vonk-runtime-assets/caddy/entrypoint.sh]
    environment:
      VONK_CONTROL_HOSTNAME: ${VONK_CONTROL_HOSTNAME:?set the control hostname}
    secrets: [agent-client-ca, agent-proxy-auth, controller-server-certificate, controller-server-key]
    networks: [ingress, agent-proxy, tailnet-web-edge, litellm-edge]
    depends_on:
      runtime-init: {condition: service_healthy, required: false, restart: true}
    healthcheck:
      # The loopback listener is independent of every network; the default
      # route exists only while `ingress` (the one non-internal network) is
      # attached, so a half-attached Caddy shows unhealthy.
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8082/healthz && ip route | grep -q '^default'"]
      interval: 10s
      timeout: 5s
      retries: 12

# Source-checkout mount; the renderer embeds the script in the bundle command.
# No Controller or worker code or socket access is involved.
configs:
  image-janitor-script:
    file: ./image-janitor/janitor.py

# Every secret is a file the installer generates under ./secrets.
secrets:
  hf-token:
    file: ./secrets/hf-token
  admin-password:
    file: ./secrets/admin-password
  database-url:
    file: ./secrets/database-url
  postgres-password:
    file: ./secrets/postgres-password
  litellm-database-password:
    file: ./secrets/litellm-database-password
  token-signing-key:
    file: ./secrets/token-signing-key
  metrics-token:
    file: ./secrets/metrics-token
  litellm-master-key:
    file: ./secrets/litellm-master-key
  litellm-upstream-key:
    file: ./secrets/litellm-upstream-key
  litellm-database-url:
    file: ./secrets/litellm-database-url
  agent-client-ca:
    file: ./secrets/step-ca/root-certificate
  agent-intermediate-certificate:
    file: ./secrets/step-ca/intermediate-certificate
  controller-ca:
    file: ./secrets/step-ca/root-certificate
  controller-server-certificate:
    file: ./secrets/controller-server-certificate
  controller-server-key:
    file: ./secrets/controller-server-key
  agent-proxy-auth:
    file: ./secrets/agent-proxy-auth
  host-runtime-grant-private-key:
    file: ./secrets/host-runtime-grant-private-key.pem
  agent-ca-provisioner-public-jwk:
    file: ./secrets/agent-ca-provisioner-public-jwk
  step-ca-root-certificate:
    file: ./secrets/step-ca/root-certificate
  step-ca-intermediate-key:
    file: ./secrets/step-ca/intermediate-key
  step-ca-password:
    file: ./secrets/step-ca-password

networks:
  ingress: {}
  agent-proxy: {internal: true}
  application: {internal: true}
  artifact-egress: {}
  data: {internal: true}
  litellm-data: {internal: true}
  cluster-egress: {}
  litellm-edge: {internal: true}
  # Only LiteLLM and Prometheus: the unauthenticated /metrics scrape path.
  litellm-metrics: {internal: true}

volumes:
  image-janitor-state: {}
  postgres-data: {}
  control-state: {}
  agent-artifacts: {}
  model-cache: {}
  caddy-data: {}
  caddy-config: {}
  litellm-supervisor-state: {}
  prometheus-data: {}
  route-publications: {}
  normalized-private-keys: {}
  runtime-assets: {}
