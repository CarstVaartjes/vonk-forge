global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /run/vonk-normalized-secrets/runtime-assets/prometheus/alerts.yaml

scrape_configs:
  - job_name: vonk-control
    scheme: http
    metrics_path: /metrics
    bearer_token_file: /run/vonk-normalized-secrets/prometheus-metrics-token
    static_configs:
      - targets: [control-api:8000]
