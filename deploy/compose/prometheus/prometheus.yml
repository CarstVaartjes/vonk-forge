global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /run/vonk-runtime-assets/prometheus/alerts.yaml

scrape_configs:
  - job_name: vonk-control
    scheme: http
    metrics_path: /metrics
    bearer_token_file: /run/vonk-normalized-secrets/prometheus-metrics-token
    static_configs:
      - targets: [control-api:8000]

  # LiteLLM inference metrics. The scrape path is the internal litellm-metrics
  # network shared only with LiteLLM; Caddy never routes /metrics. A slower
  # interval bounds a year of retention.
  - job_name: litellm
    scheme: http
    metrics_path: /metrics/
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: [litellm:4000]
