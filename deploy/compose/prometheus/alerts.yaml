{
  "groups": [{
    "name": "vonk-forge-platform",
    "rules": [
      {"alert":"InferenceRoutesStuckInMaintenance","expr":"max_over_time(vonk_route_state{state=\"maintenance\"}[10m]) == 1","for":"10m","labels":{"severity":"critical"},"annotations":{"summary":"Inference routes have remained in maintenance for ten minutes","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#routes-stuck-in-maintenance"}},
      {"alert":"NodeInventoryStale","expr":"vonk_node_inventory_freshness{state=\"stale\"} == 1","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"A Vonk Forge node admission inventory is stale","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#stale-fleet-evidence"}},
      {"alert":"NodeInventoryMissing","expr":"vonk_node_inventory_freshness{state=\"missing\"} == 1","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"A Vonk Forge node has no admission inventory","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#stale-fleet-evidence"}},
      {"alert":"NodeTelemetryStale","expr":"vonk_node_telemetry_freshness{state=\"stale\"} == 1","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"A Vonk Forge node telemetry sample is stale","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#stale-fleet-evidence"}},
      {"alert":"NodeCertificateInvalid","expr":"vonk_node_certificate_state{state!=\"valid\"} == 1","for":"5m","labels":{"severity":"critical"},"annotations":{"summary":"A Vonk Forge node certificate is not valid","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#invalid-node-certificate"}},
      {"alert":"RepeatedControlJobFailure","expr":"sum(vonk_jobs{state=\"failed\"}) >= 3","for":"5m","labels":{"severity":"critical"},"annotations":{"summary":"Three or more current control jobs are failed","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#control-job-failures"}},
      {"alert":"ControlBackupStale","expr":"vonk_control_backup_age_seconds > 86400","for":"1h","labels":{"severity":"warning"},"annotations":{"summary":"No verified control-plane backup has completed in 24 hours","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#stale-backup"}},
      {"alert":"ControlDatabaseUnavailable","expr":"up{job=\"vonk-control\"} == 0","for":"2m","labels":{"severity":"critical"},"annotations":{"summary":"The control API or its database dependency is unavailable","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#database-unavailable"}},
      {"alert":"WorkerLeaseStarvation","expr":"vonk_jobs{state=\"queued\"} > 0 and vonk_jobs{state=\"running\"} == 0","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"Control jobs are queued but no worker lease is active","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#worker-lease-starvation"}},
      {"alert":"NodeAgentStale","expr":"vonk_node_connection_state{state=\"offline\"} == 1 and on(node_id) vonk_agent_state{state=\"active\"} == 1","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"An active Vonk Forge node is offline under current connection rules","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#stale-fleet-evidence"}},
      {"alert":"NodeAgentCertificateExpiring","expr":"vonk_agent_certificate_expiry_seconds < 21600","for":"5m","labels":{"severity":"warning"},"annotations":{"summary":"A Vonk Forge GPU node agent certificate expires within six hours","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/agent-pki.md#expiry-and-identity-loss-recovery"}},
      {"alert":"RepeatedAgentOperationFailures","expr":"sum(vonk_agent_operations{state=\"failed\"}) >= 3","for":"5m","labels":{"severity":"critical"},"annotations":{"summary":"Three or more durable agent operations are failed","runbook_url":"https://github.com/vonk-forge/vonk-forge/blob/main/docs/runbooks/observability.md#control-job-failures"}}
    ]
  }]
}
