services:
  control-api:
    environment:
      VONK_AGENT_CA_PROVIDER: builtin
      VONK_AGENT_RUNTIME: enabled
      VONK_AGENT_BUILTIN_CA_BOOTSTRAP: "1"
      VONK_AGENT_CLIENT_CA_FILE: /run/secrets/agent-client-ca
      VONK_AGENT_INTERMEDIATE_CERTIFICATE_FILE: /run/secrets/agent-intermediate-certificate
      VONK_AGENT_INTERMEDIATE_KEY_FILE: /run/secrets/agent-intermediate-key
      VONK_CONTROLLER_CA_FILE: /run/secrets/controller-ca
      VONK_AGENT_PROXY_AUTH_FILE: /run/secrets/agent-proxy-auth
    secrets: [agent-intermediate-key]

secrets:
  agent-intermediate-key:
    file: "${AGENT_INTERMEDIATE_KEY_FILE:?set development built-in agent intermediate signing key secret file}"
