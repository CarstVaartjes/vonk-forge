-text)}#vonk-reference .vf-workrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:18px;align-items:center;padding:19px 0;border-bottom:1px solid var(--vf-line)}#vonk-reference .vf-workrow small{display:block;margin-top:4px}#vonk-reference .vf-chip{display:inline-flex;font-size:12px;align-items:center;gap:7px;background:#242c23;border-radius:4px;padding:4px 8px;color:#d5dccf}#vonk-reference .vf-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#vonk-reference .vf-hardware{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}#vonk-reference .vf-machine{border:1px solid var(--vf-line);border-radius:8px;padding:18px;background:var(--vf-surface)}#vonk-reference .vf-machine-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}#vonk-reference .vf-machine-head small{display:block;margin-top:3px}#vonk-reference .vf-meter-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:12px;color:var(--vf-muted);font-variant-numeric:tabular-nums}#vonk-reference .vf-meter{height:5px;background:#384035;margin-top:7px;border-radius:2px;overflow:hidden}#vonk-reference .vf-meter i{display:block;height:100%;background:#a3b38c}#vonk-reference .vf-machine-foot{margin-top:18px;padding-top:13px;border-top:1px solid var(--vf-line);display:flex;justify-content:space-between;gap:10px;font-size:12px}#vonk-reference .vf-textbtn{padding:0;border:0!important;min-height:24px!important;color:var(--vf-green)!important;font-size:12px!important}#vonk-reference .vf-search{display:flex;align-items:center;gap:10px;margin-bottom:16px}#vonk-reference input{min-height:44px;width:100%;min-width:0;background:#181e17;color:var(--vf-text);border:1px solid var(--vf-line);border-radius:6px;padding:9px 12px}#vonk-reference input::placeholder{color:var(--vf-muted)}#vonk-reference .vf-modelrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(130px,.9fr) auto;align-items:center;gap:20px;padding:21px 0;border-top:1px solid var(--vf-line)}#vonk-reference .vf-modelrow small{display:block;margin-top:5px}#vonk-reference .vf-modelrow .vf-modelcaps{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}#vonk-reference .vf-modelrow .vf-status{margin-bottom:4px}#vonk-reference .vf-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}#vonk-reference .vf-filters button{min-height:32px;font-size:12px;padding:5px 9px}#vonk-reference .vf-filters button[aria-pressed=true]{background:#283722;color:#d7e8c7;border-color:#647b4e}#vonk-reference .vf-notice{background:#25291e;border:1px solid #51523c;border-radius:6px;padding:13px 16px;display:flex;gap:15px;justify-content:space-between;align-items:center;font-size:13px;margin:20px 0;color:#e4dfc9}#vonk-reference .vf-cache-summary{display:flex;gap:16px;justify-content:space-between;align-items:end;margin-bottom:24px}#vonk-reference .vf-cache-summary p{font-size:23px;letter-spacing:-.03em;margin-top:5px;font-variant-numeric:tabular-nums}#vonk-reference .vf-cache-summary p small{font-size:14px}#vonk-reference .vf-cacherow{padding:19px 0;border-top:1px solid var(--vf-line);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) auto;gap:18px;align-items:center}#vonk-reference .vf-cacherow small{display:block;margin-top:4px}#vonk-reference .vf-progress{height:5px;background:#394132;border-radius:2px;margin-top:10px}#vonk-reference .vf-progress i{display:block;width:62%;height:100%;background:var(--vf-green)}#vonk-reference .vf-profile{padding:21px 0;border-top:1px solid var(--vf-line)}#vonk-reference .vf-profile-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}#vonk-reference .vf-profile-head small{display:block;margin-top:4px}#vonk-reference .vf-assignments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--vf-line);padding-top:12px}#vonk-reference .vf-assignments>div{padding:0 16px 0 0}#vonk-reference .vf-assignments>div+div <div id="vonk-reference">
<!-- THESIS: Library chooses the desired setup; Fleet exposes current workloads and Spark state. OWN-WORLD: established graphite, quiet green actions, warm comparison sheet, aligned rows. STORY: understand, cache, assign, run. FIRST VIEWPORT: compact rail, title/action, real workloads and two Spark summaries together. FORM: refinement of established operator workspace, code reference. FINISH: review at 1280, 1024 and 360 pixels; illustrative fixtures only. -->
<div class="vf-shell"><aside class="vf-sidebar"><div class="vf-brand"><svg viewBox="0 0 24 30" aria-hidden="true"><path d="m3 3 9 23L21 3M7 3l5 13 5-13"/></svg>Vonk Forge</div><nav class="vf-nav" aria-label="Primary"><button data-page="fleet" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="18" rx="2"/><path d="M6 7h1m10 0h1M6 17h1m10 0h1"/></svg>Fleet</button><button data-page="models"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><path d="M11 4h4v16h-4zM18 4l3 15"/></svg>Library</button></nav><div class="vf-sidebar-footer"><span class="vf-local"><i class="vf-dot"></i>Local Controller</span><span>Operator workspace</span></div></aside><main class="vf-main"><div class="vf-topline"><span id="vf-location">Workspace / Fleet</span><span class="vf-demo">Illustrative design fixture</span></div><div id="vf-content" aria-live="polite"></div></main></div>
</div>
<script>
(function(){
const root=document.getElementById('vonk-reference'),out=root.querySelector('#vf-content');
const st={page:'fleet',detail:'',filter:'all',query:'',review:false,scenario:'normal'};
const dot=(text,warning=false)=>`<span class="vf-status${warning?' warning':''}"><i class="vf-dot"></i>${text}</span>`;
const action=(text,doit,primary=false)=>`<button data-action="${doit}" class="${primary?'vf-primary':''}">${text}</button>`;
const tabs=()=>`<nav class="vf-tabs" aria-label="Library"><button data-page="models" ${st.page==='models'?'aria-current="page"':''}>Models</button><button data-page="cache" ${st.page==='cache'?'aria-current="page"':''}>NAS cache</button><button data-page="profiles" ${st.page==='profiles'?'aria-current="page"':''}>Profiles</button></nav>`;
const head=(title,copy,button)=>`<header class="vf-pagehead"><div><h1>${title}</h1><p>${copy}</p></div>${button||''}</header>`;
const footer=()=>`<div class="vf-bottom"><span>Demo data · no live infrastructure connected</span><button class="vf-textbtn" data-action="scenario">${st.scenario==='normal'?'Show recovery state':'Show healthy state'}</button></div>`;
function hardware(name,available,used){const offline=name==='Borealis'&&st.scenario!=='normal';return `<article class="vf-machine"><div class="vf-machine-head"><div><h3>${name}</h3><small>DGX Spark · GB10</small></div>${dot(offline?'Offline':'Healthy',offline)}</div>${offline?'<p class="vf-muted">Last observation 2 minutes ago.<br>Current memory and storage are unknown.</p>':`<div class="vf-meter-label"><span>Memory</span><span>${available} GiB available</span></div><div class="vf-meter"><i style="width:${used}%"></i></div><div class="vf-meter-label"><span>Local storage</span><span>320 GiB free</span></div><div class="vf-meter"><i style="width:36%"></i></div>`}<div class="vf-machine-foot"><span>Qwen 3 · ${st.scenario==='normal'?'Running':'Needs attention'}</span><button class="vf-textbtn" data-action="spark-${name}">Inspect Spark</button></div></article>`}
function fleet(){return head('Fleet','Your models and the Sparks running them.',action('Switch profile','profiles'))+`<div class="vf-summary"><span>${dot(st.scenario==='normal'?'Live':'Needs attention',st.scenario!=='normal')}</span><span><strong>1 model</strong> across 2 Sparks</span><span>Profile <strong>Studio</strong> · ${st.scenario==='normal'?'Matched':'Not matched'}</span></div>`+(st.scenario!=='normal'?`<div class="vf-error"><strong>Borealis is unavailable</strong><p>Qwen 3 needs both Sparks. Its last confirmed running state is 2 minutes old.</p>${action('Inspect recovery','recovery')}</div>`:'')+`<section class="vf-section"><div class="vf-sectionhead"><h2>Running now</h2><small>${st.scenario==='normal'?'Updated just now':'Last complete observation 2 minutes ago'}</small></div><div class="vf-workrow"><div><h3>Qwen 3</h3><small>BF16 · vLLM · recipe revision 3</small></div><div class="vf-group"><span class="vf-chip">Aurora</span><span class="vf-chip">Borealis</span><small>One distributed workload</small></div><div>${dot(st.scenario==='normal'?'Running':'Needs attention',st.scenario!=='normal')}</div></div></section><section class="vf-section"><div class="vf-sectionhead"><h2>Sparks</h2><small>2 enrolled</small></div><div class="vf-hardware">${hardware('Aurora',84,34)}${hardware('Borealis',82,36)}</div></section>`+(st.detail.startsWith('spark-')?`<section class="vf-inline-detail vf-section"><div class="vf-sectionhead"><h2>${st.detail.slice(6)}</h2>${action('Close','close')}</div><div class="vf-detailgrid"><div><strong>Current work</strong><p>Qwen 3 · rank ${st.detail.includes('Aurora')?'0':'1'} of 2<br>Recipe revision 3 · Studio profile</p></div><div><strong>Observation</strong><p>Authenticated agent connected.<br>Memory and storage observed just now.</p></div></div>${action('View models for this Spark','models')}</section>`:'')+(st.detail==='recovery'?`<section class="vf-inline-detail"><h3>Recover the distributed workload</h3><p>Restore Borealis, then review a fresh start plan for the complete Spark group. Cached model artifacts remain available.</p>${action('View operation evidence','operation')}</section>`:'')+footer()}
const models=[{name:'Qwen 3',version:'BF16 · model version 3',caps:['Text','Reasoning'],recipes:'2 recipes',fit:'1 or 2 Sparks',cached:true},{name:'GLM 5.3',version:'NVFP4 · model version 5.3',caps:['Text','Recipe-dependent vision'],recipes:'3 recipes',fit:'2 Sparks',cached:false},{name:'DeepSeek V4 Flash',version:'Vision EXP · exact variant',caps:['Text','Recipe-dependent vision'],recipes:'2 recipes',fit:'2 Sparks',cached:false}];
function library(){let rows=models.filter(m=>(!st.query||m.name.toLowerCase().includes(st.query.toLowerCase()))&&(st.filter!=='cached'||m.cached));return head('Models','Understand the model. Choose how it runs.',action('Custom recipe','custom'))+tabs()+`<div class="vf-search"><input type="search" aria-label="Find models" placeholder="Find a model or family…" value="${st.query.replaceAll('"','&quot;')}">${action('Filters','filters')}</div><div class="vf-filters"><button data-action="filter-all" aria-pressed="${st.filter==='all'}">All models</button><button data-action="filter-cached" aria-pressed="${st.filter==='cached'}">Cached on NAS</button><button data-page="cache">Manage downloads</button></div>`+(st.detail==='filters'?`<section class="vf-inline-detail"><strong>Model filters</strong><p>Family, capability, exact version, format and Spark requirement remain available here. Selected filters appear beside search.</p>${action('Close filters','close')}</section>`:'')+(rows.length?rows.map((m,i)=>`<article class="vf-modelrow"><div><h3>${m.name}</h3><small>${m.version}</small><div class="vf-modelcaps">${m.caps.map(c=>`<span class="vf-chip">${c}</span>`).join('')}</div></div><div>${m.cached?dot('Cached on NAS'):'<span class="vf-muted">Not downloaded</span>'}<small>${m.recipes} · ${m.fit}</small></div>${action('Compare recipes','model-'+m.name)}</article>`).join(''):`<div class="vf-empty"><h2>No matching models</h2><p>Change the search or clear the cache filter.</p>${action('Clear search and filters','clear')}</div>`)+(st.detail.startsWith('model-')?`<section class="vf-inline-detail"><div class="vf-sectionhead"><h2>${st.detail.slice(6)} recipes</h2>${action('Close','close')}</div><p>Capabilities belong to the selected recipe. A model's advertised features may not be exposed by every runtime.</p><div class="vf-workrow"><div><strong>vLLM · distributed</strong><small>Exact revision · 2 Sparks</small></div><div>${dot('Fits Aurora + Borealis')}<small>Text serving · model files cached</small></div>${action('Review run','run',true)}</div><div class="vf-workrow"><div><strong>Custom runtime</strong><small>Exact revision · 1 Spark</small></div><div><span class="vf-muted">Compatibility needs review</span><small>Capability evidence unavailable</small></div>${action('Inspect recipe','recipe')}</div></section>`:'')+(st.detail==='custom'?`<section class="vf-inline-detail"><h2>Create a custom recipe</h2><p>Define the exact model artifacts, runtime, capabilities and Spark topology. A draft does not change running models.</p>${action('Close','close')}</section>`:'')+footer()}
function cache(){return head('NAS cache','Download once. Reuse across recipes and Sparks.',action('Choose a model','models'))+tabs()+`<div class="vf-cache-summary"><div><span class="vf-muted">Verified model artifacts</span><p>80 GiB <small>cached</small></p></div><div><span class="vf-muted">Storage available after reserve</span><p>1.4 TiB</p></div></div><div class="vf-notice"><span><strong>One model update available</strong><br>The running Studio profile stays on its pinned version.</span>${action('Review update','update')}</div><div class="vf-cacherow"><div><h3>Qwen 3 · BF16</h3><small>Exact model revision · shared by 2 recipes</small></div><div>${dot('Verified')}<small>80 GiB · Used by Studio</small></div>${action('Inspect','cached')}</div><div class="vf-cacherow"><div><h3>DeepSeek V4 Flash</h3><small>Upstream → NAS · pinned artifact set</small></div><div>${dot(st.scenario==='normal'?'Downloading':'Transfer interrupted',st.scenario!=='normal')}<small>104 / 168 GiB · ${st.scenario==='normal'?'ETA unavailable':'Verified files retained'}</small><div class="vf-progress"><i></i></div></div>${action('View progress','operation')}</div>`+(st.detail==='cached'?`<section class="vf-inline-detail"><h3>Qwen 3 cache entry</h3><p>Verified model files are referenced by Studio. Removing a Spark installation does not remove this NAS copy.</p>${action('Review repair','repair')} ${action('Close','close')}</section>`:'')+(st.detail==='update'?`<section class="vf-review"><h2>Download the new revision</h2><p>Keep the current verified copy and running profile unchanged.</p><div class="vf-reviewrow"><strong>Qwen 3</strong><div>Current pin<small>Used by Studio</small></div><div>New immutable pin<small>Available to download</small></div></div><div class="vf-review-footer"><small>Switching a profile is a separate reviewed action.</small>${action('Preview download','operation',true)}</div></section>`:'')+footer()}
function profiles(){return head('Profiles','A complete running setup for your Sparks.',action('Create profile','create'))+tabs()+`<article class="vf-profile"><div class="vf-profile-head"><div><h3>Studio</h3><small>2 Sparks · one distributed model</small></div>${dot('Matches current fleet')}</div><div class="vf-assignments"><div><strong>Aurora + Borealis</strong><small>Qwen 3 · BF16 · vLLM revision 3</small></div><div><strong>Retain cached artifacts</strong><small>Ready to switch back without redownloading</small></div></div></article><article class="vf-profile"><div class="vf-profile-head"><div><h3>Focused work</h3><small>2 Sparks · one running, one idle</small></div>${action('Review switch','switch',true)}</div><div class="vf-assignments"><div><strong>Aurora</strong><small>GLM 5.3 · NVFP4 · recipe revision 2</small></div><div><strong>Borealis</strong><small>Idle · keep local artifacts</small></div></div></article>`+(st.detail==='create'?`<section class="vf-inline-detail"><div class="vf-sectionhead"><h2>New profile</h2>${action('Close','close')}</div><label>Profile name<input aria-label="Profile name" placeholder="Name this setup"></label><p style="margin-top:12px">Choose a model and exact recipe for every Spark, or explicitly leave it idle. Saving a draft does not stop current work.</p><div class="vf-assignments"><div><strong>Aurora</strong><small>Not assigned</small></div><div><strong>Borealis</strong><small>Not assigned</small></div></div></section>`:'')+(st.review?review():'')+footer()}
function review(){return `<section class="vf-review"><h2>Switch to Focused work</h2><p>Both Sparks are included. The current distributed model will stop.</p><div class="vf-reviewrow vf-labels"><span>Spark</span><span>Running now</span><span>After switch</span></div><div class="vf-reviewrow"><strong>Aurora</strong><div>Qwen 3<small>Part of 2-Spark workload</small></div><div><strong>GLM 5.3</strong><small>NVFP4 · recipe revision 2</small></div></div><div class="vf-reviewrow"><strong>Borealis</strong><div>Qwen 3<small>Part of 2-Spark workload</small></div><div><strong>Idle</strong><small>Keep local artifacts</small></div></div><div class="vf-reviewrow"><strong>Files</strong><div>Verified on NAS<small>No upstream download</small></div><div>Copy missing files only<small>No NAS cache removal</small></div></div><div class="vf-review-footer"><small>Service is interrupted while models switch.<br>All changes shown above are part of one operation.</small>${action('Preview operation','operation',true)}</div></section>`}
function operation(){return head('Switch operation','Focused work · illustrative progress',action('Back to profiles','profiles'))+`<div class="vf-summary"><strong>${st.scenario==='normal'?'Copying model artifacts':'Copy interrupted'}</strong><span>Aurora · NAS → Spark</span></div><section class="vf-section"><div class="vf-stage"><span>Verify cached artifacts</span>${dot('Complete')}</div><div class="vf-stage"><span>Copy missing files to Aurora</span><span class="vf-muted">${st.scenario==='normal'?'62% · Local network':'Retry available'}</span></div><div class="vf-stage"><span>Stop Qwen 3 on both Sparks</span><span class="vf-muted">Waiting</span></div><div class="vf-stage"><span>Start GLM 5.3 and verify idle Borealis</span><span class="vf-muted">Waiting</span></div></section><div class="vf-notice"><span>Current models keep running while files are copied.<br>Closing this view does not stop the operation.</span></div>`+(st.scenario!=='normal'?`<div class="vf-error"><strong>Aurora stopped responding during transfer</strong><p>Completed files are retained. Review connectivity before resuming the incomplete step.</p>${action('Inspect recovery','recovery')}</div>`:'')+footer()}
function render(){root.querySelectorAll('.vf-nav button').forEach(b=>{const active=b.dataset.page==='fleet'?st.page==='fleet':st.page!=='fleet';if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});root.querySelector('#vf-location').textContent=st.page==='fleet'?'Workspace / Fleet':`Library / ${st.page==='cache'?'NAS cache':st.page.charAt(0).toUpperCase()+st.page.slice(1)}`;out.innerHTML=`<div class="vf-view">${st.page==='fleet'?fleet():st.page==='models'?library():st.page==='cache'?cache():st.page==='profiles'?profiles():st.page==='review'?head('Switch profile','Review every Spark before changing what runs.',action('Back to profiles','profiles'))+review()+footer():operation()}</div>`}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){st.page=b.dataset.page;st.detail='';st.review=false}else if(b.dataset.action){const a=b.dataset.action;if(['fleet','models','cache','profiles','operation'].includes(a)){st.page=a;st.detail='';st.review=false}else if(a==='close'){st.detail='';st.review=false}else if(a==='switch'){st.page='review';st.review=true}else if(a==='run'){st.page='profiles';st.review=true;st.detail=''}else if(a==='scenario'){st.scenario=st.scenario==='normal'?'recovery':'normal'}else if(a==='filter-all'||a==='filter-cached'){st.filter=a.slice(7)}else if(a==='clear'){st.query='';st.filter='all'}else st.detail=a}render()});
root.addEventListener('input',e=>{if(e.target.matches('input[type=search]')){const pos=e.target.selectionStart;st.query=e.target.value;render();const next=out.querySelector('input[type=search]');next.focus();if(pos!==null)try{next.setSelectionRange(pos,pos)}catch{}}});render();
})();
</script>
